<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>no-way-up ／ 一天要怎麼過</title>
<style>
  :root{
    --bg:#0e1014; --card:#181b21; --line:#252931; --edge:#323740;
    --ink:#e6e8ec; --dim:#8d949e; --faint:#5a616b;
    --money:#f2d888; --full:#c9bb44; --calm:#6fc3b4; --cool:#d05fa0;
    --good:#5fb87a; --bad:#e0483a; --gold:#d8b24a; --book:#8fb4dc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.85 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       min-height:100vh;padding:20px 16px 60px}
  .wrap{max-width:600px;margin:0 auto}
  h1{font-size:16px;margin:0 0 3px}
  .lede{color:var(--faint);font-size:12.5px;margin-bottom:14px}

  .hud{display:flex;gap:5px;margin-bottom:9px}
  .pod{background:var(--card);border:1px solid var(--line);border-radius:4px;
       padding:5px 8px 6px;flex:1;min-width:0}
  .pod .lb{color:#7c8593;font-size:9.5px;letter-spacing:.12em}
  .pod .nm{font-size:14.5px;margin-top:2px;font-variant-numeric:tabular-nums}
  .pod.money .nm{color:var(--money)} .pod.full .nm{color:var(--full)}
  .pod.calm .nm{color:var(--calm)}   .pod.cool .nm{color:var(--cool)}
  .pod.hit{animation:hit .55s}
  @keyframes hit{30%{border-color:var(--gold);transform:translateY(-3px)}}

  .bar{display:flex;justify-content:space-between;align-items:baseline;
       font-size:11.5px;color:var(--faint);letter-spacing:.1em;margin:12px 0 8px}
  .bar b{color:var(--ink);font-size:14px;font-weight:400;letter-spacing:.05em}
  .slots{display:flex;gap:5px;margin-bottom:14px}
  .slot{flex:1;height:24px;border:1px solid var(--line);border-radius:4px;
        display:flex;align-items:center;justify-content:center;
        font-size:11px;color:var(--faint);letter-spacing:.1em;background:#131720}
  .slot.now{border-color:var(--gold);color:var(--gold)}
  .slot.done{background:#1b2028;color:#6d7684}
  .slot.dead{background:#1a1416;color:#7a5a5a;border-color:#3a2a2c}

  .stage{background:var(--card);border:1px solid var(--line);border-radius:10px;
         padding:19px 21px;min-height:280px;position:relative;overflow:hidden}
  .when{font-size:11px;letter-spacing:.24em;color:var(--faint)}
  .title{font-size:18px;margin:7px 0 11px}
  .amb{color:var(--faint);font-size:13px;white-space:pre-line;
       border-left:2px solid var(--edge);padding-left:11px;margin-bottom:15px}
  .body{white-space:pre-line;color:#c5cbd4;font-size:14.5px}
  .quiet{color:var(--faint);font-size:13px;border-left:2px solid var(--edge);
         padding-left:11px;margin-top:12px;white-space:pre-line;line-height:1.8}

  .cap{font-size:11px;letter-spacing:.24em;color:var(--faint);margin:16px 0 8px}
  .acts{display:flex;flex-direction:column;gap:6px}
  button.act{text-align:left;background:rgba(12,16,23,.9);color:#dfe4ea;
    border:1px solid #333c48;border-left:3px solid #4a5563;padding:10px 14px;
    font:inherit;font-size:14.5px;cursor:pointer;border-radius:4px;transition:.13s}
  button.act:hover:not(:disabled){background:rgba(34,42,55,.98);
    border-left-color:var(--gold);transform:translateX(3px)}
  button.act:disabled{opacity:.32;cursor:default}
  button.act .c{float:right;font-size:11.5px;color:var(--faint)}
  button.act .d{font-size:12.5px;color:#7f8794;margin-top:3px;line-height:1.7}
  .c .m{color:var(--money)} .c .f{color:var(--full)} .c .k{color:var(--calm)}
  .c .o{color:var(--cool)} .c .r{color:var(--bad)} .c .g{color:var(--good)}
  button.act.steal{border-left-color:#7a4a4a}
  button.act.seen{border-left-color:#8a7a3a}
  button.act.book{border-left-color:var(--book)}
  button.act.back{border-left-color:#4a5563;color:#98a1ac;font-size:13.5px}

  .clerk{font-size:12.5px;color:var(--gold);border:1px solid #4a4030;
         background:#1e1a12;border-radius:5px;padding:8px 12px;margin-bottom:11px}
  .risk{float:right;color:var(--faint)}

  .qsubj{display:inline-block;font-size:10.5px;letter-spacing:.16em;color:var(--book);
         border:1px solid #33445c;border-radius:3px;padding:1px 8px;margin-bottom:8px}
  .qtext{font-size:16px;line-height:1.9}
  .ansOK{border-left-color:var(--good)!important;background:rgba(50,90,66,.35)!important}
  .ansNO{border-left-color:var(--bad)!important;background:rgba(90,44,40,.3)!important}

  .flash{position:absolute;inset:0;background:#07080b;display:flex;
         align-items:center;justify-content:center;flex-direction:column;gap:9px;
         opacity:0;pointer-events:none;transition:opacity .4s}
  .flash.on{opacity:1}
  .flash .big{font-size:25px;letter-spacing:.16em;color:#cfd6df}
  .flash .sm{font-size:12px;color:var(--faint);letter-spacing:.12em;text-align:center;padding:0 24px}

  .foot{margin-top:17px;background:#151920;border:1px solid var(--line);
        border-radius:9px;padding:14px 17px;font-size:12.5px;color:var(--dim);line-height:1.85}
  .foot b{color:var(--ink)}
  .reset{margin-top:11px;background:none;border:0;color:var(--faint);
         font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1>一天要怎麼過</h1>
  <div class="lede">先決定去哪裡，到了那裡再面對具體的東西。</div>

  <div class="hud" id="hud"></div>
  <div class="bar"><b id="dTitle"></b><span id="dSub"></span></div>
  <div class="slots" id="slots"></div>

  <div class="stage">
    <div id="scene"></div>
    <div class="flash" id="flash"><div class="sm" id="fSm"></div><div class="big" id="fBig"></div></div>
  </div>

  <button class="reset" id="reset">重來</button>

  <div class="foot">
    <b>鮮食櫃是整個遊戲的縮影。</b>同一個櫃子前面三個選項，三種代價：
    正價 89 花<b>錢</b>、黃標 58 花<b>歸屬感</b>（會被看見）、
    塞進外套花<b>風評</b>（而且會被抓）。<br><br>
    <b>偷之前先看店員朝哪邊。</b>那是空間感，不是骰子——
    畫面先告訴你他在幹嘛，你才有得算。<br><br>
    <b>晚班會吃掉隔天早上。</b>回到家十一點半，第一節你就是睡著的，那一格直接沒了。
  </div>
</div>

<script src="lib/quiz.js"></script>
<script src="lib/places.js"></script>
<script>
const P = Places, $ = id => document.getElementById(id);
const WD = ['日','一','二','三','四','五','六'];
const SLOT_NAME = { am:'上午', noon:'午休', night:'晚上' };
const ORDER = ['am','noon','night'];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

let ST, day, slot, tiredAM, attend, right, wrong, qi, log, hasJob, caught, clerk;

function reset(){
  ST = { money:63, full:42, calm:55, cool:8, rep:0 };
  day = 1; slot = 0; tiredAM = false; attend = 0;
  right = 0; wrong = 0; qi = 0; log = []; hasJob = false; caught = 0;
  pickClerk(); go();
}
function pickClerk(){ clerk = P.CLERK[Math.floor(Math.random()*P.CLERK.length)]; }

function hud(hit){
  const rp = ST.rep;
  $('hud').innerHTML = `
    <div class="pod money ${hit&&hit.money?'hit':''}"><div class="lb">金錢</div><div class="nm">$${ST.money}</div></div>
    <div class="pod full ${hit&&hit.full?'hit':''}"><div class="lb">飽足</div><div class="nm">${ST.full}</div></div>
    <div class="pod calm ${hit&&hit.calm?'hit':''}"><div class="lb">歸屬感</div><div class="nm">${ST.calm}</div></div>
    <div class="pod cool ${hit&&hit.cool?'hit':''}"><div class="lb">帥潮</div><div class="nm">${ST.cool}</div></div>
    <div class="pod rep ${hit&&hit.rep?'hit':''}"><div class="lb">風評</div>
      <div class="nm" style="color:${rp>0?'var(--good)':rp<0?'var(--bad)':'var(--ink)'}">${rp>0?'+':''}${rp}</div></div>`;
  $('dTitle').textContent = `第 ${day} 天　星期${WD[day%7]}`;
  $('dSub').textContent = `答對 ${right}／${right+wrong}${hasJob?'　・有排班':''}`;
  $('slots').innerHTML = ORDER.map((s,i) => {
    const dead = (s==='am' && tiredAM);
    return `<div class="slot ${dead?'dead':i<slot?'done':i===slot?'now':''}">${
      dead?'睡著了':SLOT_NAME[s]}</div>`;
  }).join('');
}

function apply(c){
  const hit = {};
  for(const k in (c||{})){
    ST[k] = k==='money' ? ST[k]+c[k] : clamp(ST[k]+c[k], k==='rep'?-100:0, 100);
    hit[k] = 1;
  }
  hud(hit); return hit;
}
function costHTML(c){
  const t = [];
  for(const k in (c||{})){
    const v = c[k], s = v>0?'+':'−', a = Math.abs(v);
    if(k==='money') t.push(`<span class="m">${s}$${a}</span>`);
    if(k==='full')  t.push(`<span class="f">飽足 ${v>0?'+':''}${v}</span>`);
    if(k==='calm')  t.push(`<span class="k">歸屬 ${v>0?'+':''}${v}</span>`);
    if(k==='cool')  t.push(`<span class="o">帥潮 +${v}</span>`);
    if(k==='rep')   t.push(`<span class="${v>0?'g':'r'}">風評 ${v>0?'+':''}${v}</span>`);
  }
  return t.join('　');
}

/* ── 1. 去哪裡 ── */
function go(){
  hud();
  const s = ORDER[slot];
  if(s === 'am' && tiredAM) return slept();

  $('scene').innerHTML = `
    <div class="when">${SLOT_NAME[s]}</div>
    <div class="title">去哪裡？</div>
    <div class="amb">一格只能去一個地方。</div>
    <div class="acts">${P.BY_SLOT[s].map(k =>
      `<button class="act" data-k="${k}">${P.PLACES[k].name}
        <div class="d">${P.PLACES[k].amb.split('\n')[0]}</div></button>`).join('')}</div>`;
  $('scene').querySelectorAll('button').forEach(b => b.onclick = () => enter(b.dataset.k));
}

function slept(){
  $('scene').innerHTML = `
    <div class="when">上午</div><div class="title">你睡著了</div>
    <div class="body">第一節下課的時候有人推你。\n第二節你又睡著了。</div>
    <div class="quiet">老師從你旁邊走過去，看了一眼，沒有叫你。</div>
    <div class="acts"><button class="act back" id="sk">這一格沒了
      <span class="c">昨天的晚班吃掉的</span></button></div>`;
  $('sk').onclick = () => { attend--; slot++; tiredAM = false; go(); };
}

/* ── 2. 在那裡面對什麼 ── */
function enter(k){
  const pl = P.PLACES[k];
  if(k === 'store') pickClerk();
  hud();
  $('scene').innerHTML = `
    <div class="when">${SLOT_NAME[ORDER[slot]]}　・　${pl.name}</div>
    <div class="amb">${pl.amb}</div>
    ${k==='store' ? `<div class="clerk">店員${clerk.face}
      <span class="risk">被抓機率 ${Math.round(clerk.risk*100)}%</span></div>` : ''}
    <div class="cap">你走到</div>
    <div class="acts">
      ${pl.spots.map((sp,i) => `<button class="act" data-i="${i}">${sp.name}
        <div class="d">${sp.desc}</div></button>`).join('')}
      <button class="act back" id="leave">離開　<span class="c">這一格用掉了</span></button>
    </div>`;
  $('scene').querySelectorAll('button[data-i]').forEach(b =>
    b.onclick = () => spot(k, pl.spots[+b.dataset.i]));
  $('leave').onclick = nextSlot;
}

function spot(k, sp){
  $('scene').innerHTML = `
    <div class="when">${P.PLACES[k].name}　・　${sp.name}</div>
    <div class="body">${sp.desc}</div>
    ${k==='store' ? `<div class="clerk" style="margin-top:13px">店員${clerk.face}
      <span class="risk">被抓機率 ${Math.round(clerk.risk*100)}%</span></div>` : ''}
    <div class="cap">你</div>
    <div class="acts">
      ${sp.acts.map((a,i) => `<button class="act ${a.steal?'steal':a.seen?'seen':a.quiz?'book':''}"
        data-i="${i}" ${a.work && !hasJob ? 'disabled':''}>
        ${a.label}<span class="c">${a.work&&!hasJob ? '你還沒排班'
          : a.steal ? `<span class="r">風險 ${Math.round(clerk.risk*100)}%</span>`
          : a.quiz ? '<span style="color:var(--book)">解題</span>'
          : costHTML(a.cost)}</span></button>`).join('')}
      <button class="act back" id="back">看看別的</button>
    </div>`;
  $('scene').querySelectorAll('button[data-i]').forEach(b =>
    b.onclick = () => act(k, sp, sp.acts[+b.dataset.i]));
  $('back').onclick = () => enter(k);
}

/* ── 3. 做那件事 ── */
function act(k, sp, a){
  if(a.quiz) return quiz(a);
  if(a.sleep) return nextSlot(true);
  if(a.job){ hasJob = true; }
  if(a.steal) return steal(k, sp, a);

  apply(a.cost);
  if(a.dead) tiredAM = true;
  if(a.att) attend += a.att;
  if(a.seen) seenPenalty();
  log.push(sp.name + '：' + a.label);

  result(k, a.label, a.say, a.quiet);
}

/* 買 i珍食 = 會被看見 */
function seenPenalty(){
  if(Math.random() < 0.45){
    ST.calm = clamp(ST.calm - 7, 0, 100);
    hud({calm:1});
  }
}

function steal(k, sp, a){
  const bust = Math.random() < clerk.risk;
  if(bust){
    caught++;
    const d = caught >= 2 ? -30 : -18;
    apply({ rep:d });
    result(k, a.label,
      '你走到自動門，他叫住你。\n\n「弟弟。」',
      caught >= 2
        ? '第二次了。這次他報警。\n你在派出所坐到十一點，你媽沒有來。'
        : '他沒有報警，叫你把東西放回去。\n他記得你的臉。');
    return;
  }
  apply(a.cost);
  log.push(sp.name + '：' + a.label);
  result(k, a.label, a.say, a.quiet);
}

function result(k, title, say, quiet){
  $('scene').innerHTML = `
    <div class="when">${P.PLACES[k].name}</div>
    <div class="title">${title}</div>
    <div class="body">${say||''}</div>
    ${quiet ? `<div class="quiet">${quiet}</div>` : ''}
    <div class="acts">
      <button class="act" id="stay">還在店裡　<span class="c">再看一個地方</span></button>
      <button class="act back" id="out">離開　<span class="c">這一格用掉了</span></button>
    </div>`;
  $('stay').onclick = () => enter(k);
  $('out').onclick = nextSlot;
}

/* ── 解題 ── */
function quiz(a){
  const q = Quiz.BANK[qi % Quiz.BANK.length]; qi++;
  $('scene').innerHTML = `
    <div class="when">教室</div>
    <div class="qsubj">${q.subj}</div>
    <div class="qtext">${q.q}</div>
    <div class="cap">　</div>
    <div class="acts">${q.opts.map((o,i) =>
      `<button class="act" data-i="${i}">${'ABCD'[i]}　${o}</button>`).join('')}</div>`;
  $('scene').querySelectorAll('button').forEach(b => b.onclick = () => {
    const pick = +b.dataset.i, ok = pick === q.a;
    $('scene').querySelectorAll('button').forEach((x,i) => {
      x.disabled = true;
      if(i === q.a) x.classList.add('ansOK'); else if(i === pick) x.classList.add('ansNO');
    });
    if(ok){ right++; apply({ rep:+3 }); } else wrong++;
    if(a.att) attend += a.att;
    const line = ok ? Quiz.RIGHT[right % Quiz.RIGHT.length] : Quiz.WRONG[wrong % Quiz.WRONG.length];
    $('scene').insertAdjacentHTML('beforeend', `
      <div class="quiet">${line}<br><br>${q.note}</div>
      <div class="acts"><button class="act back" id="nx">離開教室
        <span class="c">這一格用掉了</span></button></div>`);
    $('nx').onclick = nextSlot;
  });
}

/* ── 換時段／換天 ── */
function nextSlot(isSleep){
  slot++;
  if(slot > 2 || isSleep) return endDay();
  go();
}

function endDay(){
  ST.full = Math.max(0, ST.full - 16);
  $('fSm').textContent = log.slice(-3).join('　→　') || '什麼都沒做';
  $('fBig').textContent = `第 ${day+1} 天`;
  $('flash').classList.add('on');
  setTimeout(() => {
    $('flash').classList.remove('on');
    day++; slot = 0; log = [];
    if(day % 7 === 0) return bill();
    go();
  }, 1400);
}

function bill(){
  const amt = 3200 + (Math.floor(day/7)-1)*900;
  ST.money -= amt; hud({money:1});
  $('scene').innerHTML = `
    <div class="when">早上・信箱</div><div class="title">又一張</div>
    <div class="body">${amt} 元。\n上面是他的名字，地址是你家。</div>
    <div class="quiet">${ST.money < 0
      ? '你付不出來。你把它跟前面幾張放在一起。'
      : '你付了。剩下的錢你數了兩次。'}</div>
    <div class="acts"><button class="act back" id="ok">去上學
      <span class="c">這一格用掉了</span></button></div>`;
  $('ok').onclick = () => { slot = 1; go(); };
}

$('reset').onclick = reset;
reset();
</script>
</body>
</html>
