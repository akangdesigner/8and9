<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>no-way-up ／ 場景測試 01</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 48px;
    background: #101218;
    color: #b9bfc9;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .12em; color: #6e7684; margin: 0 0 4px; }
  h2 { font-size: 20px; font-weight: 600; color: #e2e6ec; margin: 0 0 22px; letter-spacing: .04em; }
  .stage { position: relative; width: 100%; max-width: 1280px; }
  canvas {
    display: block; width: 100%; height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000;
    border: 1px solid #2a2f3a;
    box-shadow: 0 24px 60px rgba(0,0,0,.7);
  }
  #caption {
    position: absolute; left: 0; right: 0; bottom: 7%;
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .9s ease;
  }
  #caption span {
    display: inline-block;
    background: rgba(6,8,12,.82);
    border-left: 2px solid #d8b24a;
    padding: 9px 20px;
    font-size: 17px; letter-spacing: .06em; color: #eef1f5;
  }
  #caption.on { opacity: 1; }
  .bar { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
  button {
    background: #1c2029; color: #c8cfda; border: 1px solid #333a47;
    padding: 8px 18px; font-size: 13px; font-family: inherit; letter-spacing: .08em;
    cursor: pointer; border-radius: 3px;
  }
  button:hover { background: #252b36; color: #fff; }
  .note {
    max-width: 700px; margin-top: 26px; font-size: 13.5px; line-height: 1.95; color: #767e8b;
  }
  .note b { color: #b6bdc8; font-weight: 600; }
  .note hr { border: 0; border-top: 1px solid #232833; margin: 16px 0; }
</style>
</head>
<body>

<h1>NO-WAY-UP ／ SCENE TEST 01</h1>
<h2>超商・週三 20:14</h2>

<div class="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="caption"><span>要把它放回去嗎？</span></div>
</div>

<div class="bar">
  <button id="replay">重播</button>
  <button id="pause">暫停</button>
</div>

<div class="note">
  <b>這一幕在測三件事：</b><br>
  1. 側視能不能演出「視線」——俯視看到的只有頭頂，這裡你看得到那顆頭轉過來。<br>
  2. 溫差——星露谷的像素解析度、暖色調的日光燈，裝的是催繳單和夜班。<br>
  3. 不用一句對白講「歧視」。看右上角的錢，看架上兩個價格，看兩個人身上穿的。
  <hr>
  內部解析度 320×180，放大 4 倍。所有東西都是程式畫的，沒有素材檔，改起來很快。
</div>

<script>
const W = 320, H = 180, S = 4;
const view = document.getElementById('c');
const vg = view.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d');
vg.imageSmoothingEnabled = false;

/* ---------- palette ---------- */
const P = {
  night:'#0b1018', nightGlow:'#182740', lampGlow:'#3b4a2e', street:'#e8d9a0',
  frame:'#39414d', frameLit:'#4d5765', glass:'#132133', glassLit:'#1b2e44',
  ceil:'#2f353f', ceilEdge:'#232830',
  tube:'#f4fff0', tubeDim:'#cfe0c8', tubeHousing:'#79847c',
  wallHi:'#c8ccbf', wallLo:'#b5b9ac', kick:'#8f9488',
  floorA:'#adb1a6', floorB:'#a5a99e', floorGlow:'#c2c6ba', floorLine:'#989c92',
  fridgeBody:'#5f6a74', fridgeDark:'#3f4852', fridgeGlass:'#1d3f4e',
  fridgeLit:'#5fb8cf', bottleA:'#c86a3a', bottleB:'#3f8a5c', bottleC:'#c8b83a',
  shelfBody:'#c06a2c', shelfDark:'#8c4c1e', shelfPlate:'#8e9288', shelfShadow:'#7d8177',
  bento:'#ded2b8', bentoLid:'#c3b596', bentoDark:'#a89a7c',
  tagWhite:'#eceadf', tagYellow:'#f0c23c', tagInk:'#33302a',
  counter:'#7b6d58', counterTop:'#93856d',
  pcSkin:'#d6a077', pcHair:'#241d19', pcHood:'#39434f', pcHoodDark:'#2b333d',
  pcPants:'#2e333b', pcShoe:'#1d2027',
  npcSkin:'#e0b48d', npcHair:'#1e1a17', npcShirt:'#e9ecea', npcShirtSh:'#cdd2cf',
  npcPants:'#333c52', npcBag:'#5b4a37', npcShoe:'#22262e',
  clerkShirt:'#e6e2d4', clerkVest:'#2f6b47', clerkHair:'#211c18',
  ink:'#1a1d22', shadow:'rgba(20,24,30,.28)'
};
P.counterTop = '#93856d';

function px(x,y,w,h,c){ if(c) g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

/* ---------- 3x5 pixel font ---------- */
const GLYPH = {
 '0':['111','101','101','101','111'], '1':['010','110','010','010','111'],
 '2':['111','001','111','100','111'], '3':['111','001','111','001','111'],
 '4':['101','101','111','001','001'], '5':['111','100','111','001','111'],
 '6':['111','100','111','101','111'], '7':['111','001','001','001','001'],
 '8':['111','101','111','101','111'], '9':['111','101','111','001','111'],
 ':':['0','1','0','1','0'],           '$':['010','111','110','011','111'],
 '/':['001','001','010','100','100'], '-':['000','000','111','000','000'],
 ' ':['0','0','0','0','0']
};
function text(str,x,y,c){
  let cx = x;
  for(const ch of str){
    const gl = GLYPH[ch]; if(!gl){ cx += 4; continue; }
    for(let r=0;r<5;r++) for(let q=0;q<gl[r].length;q++)
      if(gl[r][q]==='1') px(cx+q, y+r, 1,1, c);
    cx += gl[0].length + 1;
  }
  return cx;
}
function textW(str){ let w=0; for(const ch of str){ const gl=GLYPH[ch]; w += (gl?gl[0].length:3)+1; } return w-1; }

/* ---------- geometry ---------- */
const FLOOR = 150;          // 地板線
const LAMPS = [[26,74],[112,166],[204,258],[282,314]];

/* ---------- scene pieces ---------- */
function drawCeiling(flick){
  px(0,0,W,15,P.ceil);
  px(0,15,W,1,P.ceilEdge);
  for(const [a,b] of LAMPS){
    px(a-1, 8, (b-a)+2, 6, P.tubeHousing);
    px(a, 9, b-a, 4, flick ? P.tubeDim : P.tube);
  }
}

function drawWall(){
  px(0,16,W,70,P.wallHi);
  px(0,86,W,FLOOR-86,P.wallLo);
  // 燈下的牆面暈
  g.globalAlpha = .16;
  for(const [a,b] of LAMPS) px(a-6,16,(b-a)+12,54,'#ffffff');
  g.globalAlpha = 1;
  // 踢腳板
  px(0,FLOOR-5,W,5,P.kick);
  px(0,FLOOR-5,W,1,'#7d8277');
}

function drawFloor(){
  for(let x=0;x<W;x+=16){
    px(x,FLOOR,16,H-FLOOR, ((x/16)|0)%2 ? P.floorA : P.floorB);
    px(x,FLOOR,1,H-FLOOR,P.floorLine);
  }
  px(0,FLOOR,W,1,'#8f9389');
  // 燈管在地上的反光
  g.globalAlpha=.22;
  for(const [a,b] of LAMPS){
    px(a+3,FLOOR+2,(b-a)-6,10,P.floorGlow);
    px(a+8,FLOOR+12,(b-a)-16,8,P.floorGlow);
  }
  g.globalAlpha=1;
  // 前景地板陰影（暗角）
  g.globalAlpha=.18; px(0,H-8,W,8,'#20242b'); g.globalAlpha=1;
}

function drawOutside(){
  // 左側整片玻璃（門＋窗）
  px(4,20,72,FLOOR-20,P.night);
  // 夜色層次
  px(4,20,72,26,'#0e1522');
  // 路燈
  px(60,26,2,34,'#3a4250');
  px(56,22,10,5,'#5b6472');
  g.globalAlpha=.5;  px(50,26,22,26,P.lampGlow);
  g.globalAlpha=.28; px(44,24,34,40,P.lampGlow);
  g.globalAlpha=1;
  px(57,25,8,3,P.street);
  // 對街暗掉的招牌
  px(10,34,20,9,'#161d29'); px(11,35,18,7,'#1b2431');
  // 停在外面的機車剪影
  px(14,FLOOR-26,26,10,'#0c111b');
  px(12,FLOOR-16,7,7,'#080d15'); px(34,FLOOR-16,7,7,'#080d15');
  px(30,FLOOR-34,3,10,'#0c111b'); px(26,FLOOR-35,11,2,'#0c111b');
  // 地面雨後反光
  g.globalAlpha=.25; px(6,FLOOR-8,68,7,'#2a3348'); g.globalAlpha=1;
}

function drawDoor(open){
  const o = Math.round(open * 17);
  // 門框
  px(4,20,72,3,P.frame);
  px(4,20,3,FLOOR-20,P.frame);
  px(73,20,3,FLOOR-20,P.frame);
  px(38,20,2,FLOOR-20,P.frame);   // 中柱（門關上時的接縫）
  // 兩扇門
  drawLeaf(8 - o);
  drawLeaf(40 + o);
  function drawLeaf(x){
    px(x,23,30,FLOOR-24,P.glass);
    g.globalAlpha=.35; px(x,23,30,20,P.glassLit); g.globalAlpha=1;
    px(x,23,30,2,P.frameLit);
    px(x,FLOOR-6,30,5,P.frameLit);
    px(x,23,1,FLOOR-24,P.frameLit);
    px(x+29,23,1,FLOOR-24,P.frameLit);
    // 玻璃上的反光斜線
    g.globalAlpha=.14;
    for(let i=0;i<12;i++) px(x+4+i, 30+i*2, 3, 2, '#ffffff');
    g.globalAlpha=1;
  }
}

function chime(t){          // 叮咚的視覺化：門上方的波紋
  if(t<0 || t>900) return;
  const k = t/900;
  g.globalAlpha = (1-k)*.85;
  for(let i=0;i<3;i++){
    const r = 4 + i*4 + k*10;
    px(40 - r, 17 - i, 2, 2, '#f6f2dc');
    px(40 + r, 17 - i, 2, 2, '#f6f2dc');
    px(40 - r + 3, 15 - i, 2, 2, '#f6f2dc');
    px(40 + r - 4, 15 - i, 2, 2, '#f6f2dc');
  }
  g.globalAlpha = 1;
}

function drawDrinkFridge(){
  const x=86, y=44, w=46, h=FLOOR-44-2;
  px(x-2,y-3,w+4,h+4,P.fridgeDark);
  px(x,y,w,h,P.fridgeBody);
  px(x+2,y+2,w-4,h-8,P.fridgeGlass);
  // 內部層架＋飲料
  for(let r=0;r<4;r++){
    const sy = y+6+r*17;
    px(x+3,sy+11,w-6,2,'#2a5766');
    for(let i=0;i<7;i++){
      const bx = x+4+i*6;
      const col = [P.bottleA,P.bottleB,P.bottleC,P.bottleB][(i+r)%4];
      px(bx,sy+2,4,9,col);
      px(bx+1,sy,2,2,'#cfd6da');
      px(bx,sy+2,1,9,'rgba(255,255,255,.18)');
    }
  }
  // 冷光
  g.globalAlpha=.20; px(x+2,y+2,w-4,h-8,P.fridgeLit); g.globalAlpha=1;
  // 玻璃反光
  g.globalAlpha=.12;
  for(let i=0;i<16;i++) px(x+6+i, y+8+i*3, 4, 3, '#ffffff');
  g.globalAlpha=1;
  px(x,y,w,2,'#8b959e');
}

/* 鮮食開放櫃：這一幕的重點 */
function drawFoodShelf(taken){
  const x=176, y=64, w=76, h=FLOOR-64-2;
  px(x-2,y-2,w+4,h+2,P.shelfDark);
  px(x,y,w,h,P.shelfBody);
  px(x+2,y+2,w-4,h-4,'#a9ada2');       // 內壁
  px(x,y,w,3,'#d8823c');               // 上緣打光
  // 三層
  const rows = [
    { sy:y+8,  price:'89', tag:P.tagWhite,  slots:[1,1,0,1] },
    { sy:y+29, price:'89', tag:P.tagWhite,  slots:[0,1,0,0] },
    { sy:y+50, price:'58', tag:P.tagYellow, slots:[1,1,1,1] }
  ];
  rows.forEach((row, ri) => {
    px(x+3,row.sy+15,w-6,2,P.shelfPlate);
    px(x+3,row.sy+17,w-6,1,P.shelfShadow);
    row.slots.forEach((has,i) => {
      if(!has) return;
      if(ri===2 && i===3 && taken) return;      // 被拿走的那一個
      const bx = x+5+i*18;
      px(bx,row.sy+4,15,11,P.bento);
      px(bx,row.sy+4,15,4,P.bentoLid);
      px(bx,row.sy+13,15,2,P.bentoDark);
      px(bx+2,row.sy+9,11,3,'#b8a888');
      g.globalAlpha=.25; px(bx,row.sy+4,15,2,'#ffffff'); g.globalAlpha=1;
    });
    // 價格牌
    const pw = textW(row.price)+6;
    px(x+3,row.sy+17,pw,9,row.tag);
    px(x+3,row.sy+17,pw,1,'#ffffff');
    text(row.price, x+6, row.sy+19, P.tagInk);
  });
  // 空掉的位置：晚上八點了
  g.globalAlpha=.30; px(x+2,y+2,w-4,h-4,'#5a5f55'); g.globalAlpha=.0;
  g.globalAlpha=1;
}

function drawCounter(){
  const x=262, y=FLOOR-30, w=W-262-2, h=30;
  // 後方牆架
  px(x-4,40,w+6,44,'#9aa094');
  for(let r=0;r<3;r++){
    px(x-4,52+r*14,w+6,2,'#7f8479');
    for(let i=0;i<5;i++) px(x+i*10, 44+r*14, 7, 8, ['#b8734a','#5f7f9a','#9a8f5f','#7a5f8a','#5f8a6a'][(i+r)%5]);
  }
  // 櫃台
  px(x,y,w,h,P.counter);
  px(x,y,w,3,P.counterTop);
  px(x,y+3,w,1,'#6a5d4a');
  // 收銀機
  px(x+10,y-14,18,14,'#454c56');
  px(x+12,y-12,14,7,'#7fd0c0');
  px(x+12,y-4,14,3,'#333a44');
  // 集點卡立牌
  px(x+40,y-10,12,10,'#e0d9c4'); px(x+41,y-9,10,3,'#c0563a');
}

/* ---------- people ---------- */
/* 40px 高，站在 FLOOR 上 */
function drawPerson(x, opt){
  const { face=1, hood=false, bag=false, walk=0, bob=0, arm=0, holding=false,
          skin, hair, top, topSh, pants, shoe, headTurn=0 } = opt;
  const b = FLOOR + bob;                    // 腳底
  const f = face;                           // 1=朝右, -1=朝左
  const cx = Math.round(x);

  // 影子
  g.globalAlpha=.22; px(cx-2, b-1, 15, 2, '#3a3f47'); g.globalAlpha=1;

  // 腿
  const step = walk;
  px(cx+2, b-12, 4, 11 - Math.abs(step), pants);
  px(cx+7, b-12, 4, 11 - Math.abs(step===0?0:step), pants);
  if(step!==0){
    px(cx+2 - step, b-4, 4, 3, pants);
    px(cx+7 + step, b-4, 4, 3, pants);
    px(cx+1 - step, b-2, 6, 2, shoe);
    px(cx+7 + step, b-2, 6, 2, shoe);
  } else {
    px(cx+1, b-2, 5, 2, shoe);
    px(cx+7, b-2, 5, 2, shoe);
  }

  // 身體
  px(cx+1, b-27, 11, 16, top);
  px(cx+1, b-27, 11, 3, topSh);
  px(f>0 ? cx+10 : cx+1, b-26, 2, 14, topSh);      // 背光側

  // 書包（斜背）
  if(bag){
    px(cx+ (f>0?0:8), b-24, 4, 10, P.npcBag);
    px(cx+2, b-26, 9, 2, '#4a3c2c');
  }

  // 手臂
  const ax = f>0 ? cx+9 : cx+1;
  if(arm > 0){
    // 伸手：往 face 方向平伸
    const ex = f>0 ? cx+12 : cx-4;
    px(ex, b-22, Math.round(arm*6), 3, top);
    px(f>0 ? ex+Math.round(arm*6) : ex-2, b-22, 3, 3, skin);
  } else {
    px(ax, b-25, 3, 11, top);
    px(ax, b-15, 3, 3, skin);
  }

  // 手上的便當
  if(holding){
    const hx = f>0 ? cx+11 : cx-4;
    px(hx, b-16, 9, 6, P.bento);
    px(hx, b-16, 9, 2, P.bentoLid);
    px(hx, b-18, 4, 3, P.tagYellow);
  }

  // 頭
  const hy = b-40;
  px(cx+2, hy, 9, 11, skin);
  // 頭髮
  px(cx+1, hy-1, 11, 4, hair);
  px(f>0 ? cx+1 : cx+9, hy, 2, 5, hair);
  // 帽 T 的帽子
  if(hood){
    px(cx, hy-2, 13, 6, P.pcHoodDark);
    px(cx, hy+2, 2, 6, P.pcHoodDark);
    px(cx+11, hy+2, 2, 6, P.pcHoodDark);
    px(cx+1, hy-3, 11, 2, P.pcHood);
  }
  // 臉朝向：headTurn 0=側面朝 f, 1=正臉, 2=側面朝 -f
  let ef = f;
  if(headTurn===1){
    px(cx+3, hy+5, 2, 2, P.ink);
    px(cx+8, hy+5, 2, 2, P.ink);
    px(cx+2, hy, 9, 3, hair);
    return;
  } else if(headTurn===2){ ef = -f; }
  const eyeX = ef>0 ? cx+7 : cx+4;
  px(eyeX, hy+5, 2, 2, P.ink);
  px(ef>0 ? cx+11 : cx+1, hy+6, 1, 2, skin);       // 鼻尖
  // 瀏海方向
  px(ef>0 ? cx+1 : cx+8, hy, 4, 4, hair);
}

function drawClerk(){
  const x=288, b=FLOOR-2;
  px(x+2,b-24,10,13,P.clerkShirt);
  px(x+2,b-20,10,9,P.clerkVest);
  px(x+3,b-34,8,10,'#dda87f');
  px(x+2,b-35,10,4,P.clerkHair);
  px(x+4,b-30,2,2,P.ink);
  px(x+1,b-23,2,9,P.clerkShirt);
  px(x+11,b-23,2,9,P.clerkShirt);
}

/* ---------- UI ---------- */
function drawUI(){
  // 左上：時間
  px(6,6,44,13,'rgba(12,16,22,.72)');
  px(6,6,1,13,'#d8b24a');
  text('20:14', 12, 10, '#eef1f5');
  // 右上：錢包
  const s = '$63';
  const w = textW(s)+16;
  px(W-6-w,6,w,13,'rgba(12,16,22,.72)');
  px(W-7,6,1,13,'#d8b24a');
  text(s, W-6-w+7, 10, '#f0c23c');
  // 右上第二行：本月要還的
  px(W-6-w,21,w,11,'rgba(12,16,22,.55)');
  text('-4800', W-6-w+4, 24, '#c96a5a');
}

function vignette(){
  g.globalAlpha=.22;
  px(0,0,W,10,'#0a0d13'); px(0,H-10,W,10,'#0a0d13');
  px(0,0,8,H,'#0a0d13');  px(W-8,0,8,H,'#0a0d13');
  g.globalAlpha=.12;
  px(0,0,W,20,'#0a0d13'); px(0,H-20,W,20,'#0a0d13');
  g.globalAlpha=1;
}

/* ---------- timeline ---------- */
const T = {
  reachStart: 1800, reachEnd: 2500, taken: 2500,
  chime: 3200, doorOpen: 3200, doorFull: 4000,
  npcIn: 3600, npcStop: 5500,
  turnA: 6300, turnB: 6550,
  freeze: 7200, caption: 7900, end: 9400
};
const ease = t => t<0?0 : t>1?1 : t*t*(3-2*t);

let t0 = performance.now(), paused = false, pausedAt = 0;
const capEl = document.getElementById('caption');

function frame(now){
  const t = paused ? pausedAt : (now - t0);

  // 日光燈偶發閃爍
  const flick = (t % 3700 > 3640 && t % 3700 < 3672) || (t % 5300 > 5280 && t % 5300 < 5292);

  g.clearRect(0,0,W,H);
  drawCeiling(flick);
  drawWall();
  drawOutside();

  const open = ease((t - T.doorOpen) / (T.doorFull - T.doorOpen));
  const closing = t > T.npcStop + 400 ? ease((t - T.npcStop - 400) / 700) : 0;
  drawDoor(Math.max(0, open - closing));

  drawFloor();
  drawDrinkFridge();
  drawFoodShelf(t >= T.taken);
  drawCounter();
  drawClerk();

  // NPC（同學）
  if(t >= T.npcIn){
    const k = ease((t - T.npcIn) / (T.npcStop - T.npcIn));
    const nx = 24 + k * 74;
    const moving = k < 1;
    const walk = moving ? (Math.floor(t/140)%2 ? 2 : -2) : 0;
    const bob  = moving ? (Math.floor(t/140)%2 ? -1 : 0) : 0;
    let headTurn = 0;
    if(t >= T.turnA && t < T.turnB) headTurn = 1;
    else if(t >= T.turnB) headTurn = 2;
    drawPerson(nx, {
      face: 1, bag: true, walk, bob, headTurn,
      skin:P.npcSkin, hair:P.npcHair, top:P.npcShirt, topSh:P.npcShirtSh,
      pants:P.npcPants, shoe:P.npcShoe
    });
  }

  // 主角（背對門，朝右看著鮮食櫃）
  const breathe = t < T.freeze ? (Math.floor(t/620)%2 ? 0 : -1) : 0;
  let arm = 0;
  if(t >= T.reachStart && t < T.reachEnd) arm = ease((t - T.reachStart)/(T.reachEnd - T.reachStart));
  else if(t >= T.reachEnd && t < T.reachEnd + 300) arm = 1 - ease((t - T.reachEnd)/300);
  drawPerson(152, {
    face: 1, hood: true, bob: breathe, arm, holding: t >= T.taken,
    skin:P.pcSkin, hair:P.pcHair, top:P.pcHood, topSh:P.pcHoodDark,
    pants:P.pcPants, shoe:P.pcShoe
  });

  chime(t - T.chime);
  drawUI();
  vignette();

  // 停格瞬間：畫面極輕微壓暗
  if(t >= T.freeze){
    const k = Math.min(1, (t - T.freeze)/1200);
    g.globalAlpha = k*.20; px(0,0,W,H,'#0a0e16'); g.globalAlpha = 1;
  }

  vg.clearRect(0,0,view.width,view.height);
  vg.drawImage(buf, 0, 0, W, H, 0, 0, view.width, view.height);

  capEl.classList.toggle('on', t >= T.caption);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.getElementById('replay').onclick = () => {
  t0 = performance.now(); paused = false;
  document.getElementById('pause').textContent = '暫停';
};
document.getElementById('pause').onclick = (e) => {
  if(paused){ t0 = performance.now() - pausedAt; paused = false; e.target.textContent = '暫停'; }
  else { pausedAt = performance.now() - t0; paused = true; e.target.textContent = '繼續'; }
};
</script>
