<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>no-way-up ／ 家裡的六條線</title>
<style>
  :root{
    --bg:#14161a; --card:#1c1f25; --line:#282c33; --edge:#343943;
    --ink:#e4e6ea; --dim:#8d949e; --faint:#5c636d;
    --mom:#e0c98a; --dad:#8fb4dc; --bf:#c99a8a; --pc:#a8b0ba;
    --money:#f2d888; --calm:#6fc3b4; --debt:#e0685f; --truth:#c9a3e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.85 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       padding:30px 18px 80px}
  .wrap{max-width:880px;margin:0 auto}

  h1{font-size:20px;margin:0 0 4px;letter-spacing:.03em}
  .lede{color:var(--faint);font-size:13px;margin-bottom:22px}

  .fams{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:8px}
  .fam{flex:1;min-width:220px}
  .fam-l{font-size:11px;color:var(--faint);letter-spacing:.16em;margin-bottom:7px}
  .fam.live .fam-l{color:var(--calm)}
  .fam.cold{opacity:.5}
  .fam.cold:hover{opacity:1}
  .tabs{display:flex;gap:7px;flex-wrap:wrap}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--dim);
       padding:8px 13px;border-radius:7px;cursor:pointer;font:inherit;font-size:13.5px;
       transition:.15s;white-space:nowrap}
  .tab:hover{border-color:#3d434e;color:var(--ink)}
  .tab.on{background:#2a2f38;border-color:#4a5260;color:var(--ink)}

  .core{background:#191c21;border:1px solid var(--line);border-radius:9px;
        padding:15px 18px;margin:24px 0 26px;font-size:14px;color:var(--dim)}
  .core b{color:var(--ink)}
  .core .warn{display:block;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
              color:var(--faint);font-size:12.5px;line-height:1.75}

  .node{margin-bottom:32px}
  .day{display:flex;align-items:baseline;gap:12px;margin-bottom:11px}
  .day-n{font-size:12px;color:var(--faint);letter-spacing:.18em;
         border:1px solid var(--edge);border-radius:4px;padding:2px 9px}
  .day-t{font-size:16px}

  .scene{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:19px 21px}
  .beat{margin:0 0 11px}
  .beat:last-child{margin-bottom:0}
  .who{font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:2px}
  .mom .txt{color:var(--mom)} .dad .txt{color:var(--dad)}
  .bf  .txt{color:var(--bf)}  .pc  .txt{color:var(--pc)}
  .txt{white-space:pre-line;font-size:15px;line-height:1.85}
  .toast{color:var(--faint);font-size:13.5px;border-left:2px solid var(--edge);
         padding-left:11px;margin-top:4px}

  .forks{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px}
  @media(max-width:720px){.forks{grid-template-columns:1fr}.fams{display:block}.fam{margin-bottom:16px}}
  .fork{border:1px solid var(--line);border-radius:9px;padding:14px 15px;background:#191c21}
  .fork.a{border-color:#3a4340}
  .fork.b{border-color:#3f3230}
  .pick{font-size:14.5px;margin-bottom:4px}
  .cost{font-size:11.5px;color:var(--faint);margin-bottom:11px}
  .cost .m{color:var(--money)} .cost .c{color:var(--calm)} .cost .d{color:var(--debt)}

  .truth{margin-top:11px;padding:9px 12px;background:#221d29;
         border-left:2px solid var(--truth);border-radius:0 6px 6px 0}
  .truth-l{font-size:10.5px;letter-spacing:.16em;color:#8a7a99;margin-bottom:3px}
  .truth-t{color:var(--truth);font-size:14px}

  .chain{margin-top:44px;background:#1a1720;border:1px solid #2e2838;
         border-radius:10px;padding:20px 24px}
  .chain h2{font-size:12px;color:var(--faint);letter-spacing:.16em;margin:0 0 13px;font-weight:600}
  .chain li{color:var(--truth);margin-bottom:6px}
  .chain ol{margin:0;padding-left:22px}
</style>
</head>
<body>
<div class="wrap">
  <h1>劇情線</h1>
  <div class="lede">
    <b style="color:#8d949e">外面那條是主軸</b>（「別人怎麼看你」）；家裡的是你背在身上的重量。<br>
    家裡一輪只會遇到一組（爸 ＋ 媽），現在只做「爸：喝 ＋ 母：賭」，其餘四條先冰著。
  </div>

  <div class="fams" id="fams"></div>
  <div class="core" id="core"></div>
  <div id="out"></div>
  <div id="chain"></div>
</div>

<script src="lib/story-school.js"></script>
<script src="lib/story-bet.js"></script>
<script src="lib/story-drink.js"></script>
<script src="lib/story-work.js"></script>
<script src="lib/story-hit.js"></script>
<script src="lib/story-gone.js"></script>
<script src="lib/story-bf.js"></script>
<script>
const LINES = {
  drink:{ label:'父親・酗酒', data:StoryDrink,
    core:'他不跟你要錢，錢自己會不見。而他<b>不是在騙你——他是真的不記得</b>。',
    warn:'所以你失去的不是那幾百塊，是相信自己記得的能力。最後你變成一個回家第一件事是數錢的人，那才是他真正拿走的東西。' },
  work:{ label:'母親・兩份工', data:StoryWork,
    core:'<b>這一條沒有加害者。</b>她不拿你的錢，她給你錢；她不罵你，她只是不在。你沒有敵人，你只是沒有人。',
    warn:'⚠ 這條線非做不可：如果每個父母都是加害者，遊戲就變成「底層的家庭都很糟」的展示，那正好違反基準線。有這一條在，玩家才知道遊戲講的是處境，不是人品。' },
  hit:{ label:'父親・脾氣', data:StoryHit,
    core:'他不要錢，他要你聽話。<b>你在自己家裡要算路線。</b>',
    warn:'⚠ 全程沒有一拳打下去。畫出來的暴力是獵奇；痛的是你的身體比你先站起來、你已經知道哪條路不會遇到他。' },
  bet:{ label:'母親・賭', data:StoryBet,
    core:'<b>她就是嗜賭，理由全部都是藉口</b>——中間剛好有一兩次是真的，但那不改變什麼。',
    warn:'給錢買到的不是真相，是你自己還願意相信的時間。她不會變，變的是你什麼時候不再相信。（第一版寫成「她想把害你背債的錢賺回來」，是幫她圓場，已被 kc 否掉。）' },
  gone:{ label:'父親・走了', data:StoryGone,
    core:'<b>人走了，債留下來。</b>而且他在別的地方過得比你好。',
    warn:'這條線沒有人在你家裡。痛的是你在還一個不在場的人的債——你連要恨誰都找不到對象。' },
  school:{ label:'學校・同儕', data:StorySchool,
    core:'這間學校是<b>學店</b>。三十八分沒有人看你一眼，大家都買黃標便當。在這裡能換到位置的是<b>刺青、改管、抽菸、賭</b>。',
    warn:'⚠ 所以 —— <b>讓你在學校被接納的東西，正好是讓你在外面爬不上去的東西。</b>這句是整個遊戲的支點，不只是這條線的。<br><br>第一版寫成「窮學生在班上很尷尬」（明星高中的邏輯），被 kc 一句話翻掉：「你待著的地方本來就是學店啊，你是爛學校欸，所以反而你在學校裡面刺青改管抽菸賭博才能獲得歸屬感。」<br><br>不要把這些事寫成「墮落」——那是居高臨下。這些是他在那個環境裡唯一拿得到的東西。' },
  bf:{ label:'母親・男朋友', data:StoryBf,
    core:'<b>你在自己家裡是客人。</b>他甚至對你不錯，那才是最難處理的地方。',
    warn:'⚠ 不要把他寫成壞人。他不打你、不偷錢、還給你錢。痛的是位置：毛巾被移到最下面那一格、吵架時你才是打擾的人、你媽問你意見但她已經決定了。' }
};

/* 2026-08-04 kc：「先做父親酗酒母親賭博的故事線就好，不然太累。」
   → 只有第一組是現行。其他四條寫好了先冰著，不刪，要用的時候直接接。 */
const FAMILIES = [
  { label:'外面　（同儕 ＝ 這款的主軸）', keys:['school'], live:true },
  { label:'家裡　現行　爸：喝　母：賭', keys:['drink','bet'], live:true },
  { label:'家裡　暫緩　（寫好了，先不接進遊戲）', keys:['work','hit','gone','bf'] }
];

const NAME = { mom:'母親', dad:'父親', bf:'他', pc:'' };
let cur = 'school';

const $ = id => document.getElementById(id);

const costHTML = f => {
  const b = [];
  if (f.money)    b.push(`<span class="m">${f.money>0?'＋':'−'}$${Math.abs(f.money)}</span>`);
  if (f.moneyAll) b.push(`<span class="m">身上全部</span>`);
  if (f.calm)     b.push(`<span class="c">歸屬感 ${f.calm>0?'+':''}${f.calm}</span>`);
  if (f.full)     b.push(`<span class="c">飽足 ${f.full>0?'+':''}${f.full}</span>`);
  if (f.debt)     b.push(`<span class="d">債 +${f.debt}</span>`);
  if (f.theft)    b.push(`<span class="d">隔天出門發現少 $${f.theft}（玩家看不到,揭曉前是暗的）</span>`);
  return b.join('　') || '—';
};

const beatsHTML = bs => (bs || []).map(b => b.toast
  ? `<div class="toast">${b.text || b.toast}</div>`
  : `<div class="beat ${b.who}">${NAME[b.who] ? `<div class="who">${NAME[b.who]}</div>` : ''}<div class="txt">${b.text}</div></div>`
).join('');

function renderTabs(){
  $('fams').innerHTML = FAMILIES.map(f => `
    <div class="fam ${f.live ? 'live' : 'cold'}">
      <div class="fam-l">${f.label}</div>
      <div class="tabs">
        ${f.keys.map(k => `<button class="tab ${k===cur?'on':''}" data-k="${k}">${LINES[k].label}</button>`).join('')}
      </div>
    </div>`).join('');
  $('fams').querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.k; render(); });
}

function render(){
  renderTabs();
  const L = LINES[cur];
  $('core').innerHTML = L.core + `<span class="warn">${L.warn}</span>`;

  $('out').innerHTML = L.data.NODES.map(n => `
    <div class="node">
      <div class="day">
        <span class="day-n">第 ${n.day} 天</span>
        <span class="day-t">${n.title}</span>
      </div>
      <div class="scene">
        ${beatsHTML(n.beats)}
        <div class="forks">
          ${n.menu.map((f,i) => `
            <div class="fork ${i===0?'a':'b'}">
              <div class="pick">${f.label}</div>
              <div class="cost">${costHTML(f)}</div>
              ${beatsHTML(f.beats)}
              ${f.truth && L.data.TRUTHS ? `<div class="truth">
                  <div class="truth-l">解鎖 ${f.truth}</div>
                  <div class="truth-t">${L.data.TRUTHS[f.truth]}</div>
                </div>` : ''}
            </div>`).join('')}
        </div>
      </div>
    </div>`).join('');

  $('chain').innerHTML = L.data.TRUTHS ? `
    <div class="chain">
      <h2>給錢才知道的五件事</h2>
      <ol>${Object.keys(L.data.TRUTHS).map(k => `<li>${L.data.TRUTHS[k]}</li>`).join('')}</ol>
    </div>` : '';
}

render();
</script>
</body>
</html>
