<style>
:root{--paper:#eee7d7;--ink:#312f27;--muted:#9b9d90;--red:#93463b;--green:#91aa91}*{box-sizing:border-box}body{margin:0;background:#171e20;color:var(--paper);font-family:system-ui,"Microsoft JhengHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d8b675;outline-offset:4px}.mast{height:72px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18;background:#151c1e}.brand{display:flex;align-items:center;gap:18px}.seal{font-family:serif;font-size:19px;line-height:1.1;border:1px solid #b66d59;color:#d7a18c;padding:6px}.brand strong{font-family:serif;font-weight:500;font-size:21px;letter-spacing:.16em}.brand small{display:block;color:#8e9b97;font-size:10px;letter-spacing:.2em;margin-top:5px}.switch{display:flex;gap:4px;background:#0a111444;padding:4px;border:1px solid #ffffff12;border-radius:5px}.switch button{border:0;background:none;color:#9caaa4;font-size:12px;padding:8px 16px;border-radius:2px}.switch button.active{background:#e8e1d1;color:#34382f}.stage{position:relative;height:calc(100vh - 134px);min-height:500px;isolation:isolate;overflow:hidden}#world{position:absolute;inset:0;z-index:-2}#world canvas{width:100%;height:100%;display:block}.shade{position:absolute;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(180deg,#111b22bb,transparent 24%,transparent 60%,#0b151b99)}.hud{position:absolute;left:28px;top:24px;display:flex;align-items:stretch;gap:20px;background:#182120ed;border:1px solid #bcb89532;padding:15px 20px;box-shadow:0 8px 25px #0002;border-radius:2px}.cash{border-right:1px solid #bcb89530;padding-right:20px;min-width:102px}.label{font-size:10px;color:#b5bcae;letter-spacing:.17em}.cash strong{display:block;font:25px Georgia,serif;margin-top:6px;color:#efdfb5}.stats{display:grid;grid-template-columns:repeat(3,56px);gap:12px 16px}.stat{font-size:11px;color:#bec5b9}.stat b{float:right;color:#e4e6d8;font:12px Georgia,serif}.gauge{height:2px;background:#ffffff17;margin-top:7px}.gauge i{display:block;height:100%;background:#a4b598;width:var(--v)}.social .gauge i{background:#b9a57c}.location{position:absolute;right:30px;top:24px;text-align:right}.road{display:inline-block;border:1px solid #c2ccba;background:#355544;padding:8px 18px;box-shadow:0 0 0 3px #355544;color:#e3ece0;font-family:serif;letter-spacing:.25em;font-size:17px}.date{margin-top:16px;font-size:11px;letter-spacing:.12em;color:#d0d7cb}.time{font:32px Georgia,serif;margin-top:4px}.nav{position:absolute;left:30px;top:144px;display:flex;gap:8px}.nav button{background:#182120df;color:#d3d9c9;border:1px solid #c6c8ad30;padding:7px 16px;font-size:12px;letter-spacing:.13em}.nav button:hover{border-color:#d8bb8b}.quest{position:absolute;left:30px;top:202px;border-left:2px solid #b47a5d;padding:2px 0 2px 15px;text-shadow:0 1px 8px #000}.quest small{color:#d8b495;letter-spacing:.16em;font-size:10px}.quest p{font-family:serif;font-size:16px;margin:9px 0}.quest span{color:#b5bcaf;font-size:11px}.interaction{color:var(--paper);position:absolute;bottom:95px;left:50%;transform:translateX(-50%);background:#182120ee;border:1px solid #c6c8ad50;padding:10px 22px;font-size:13px;letter-spacing:.1em;white-space:nowrap}.interaction kbd{padding:3px 7px;border:1px solid #c6c8ad60;margin-right:14px;color:#e3ceb0}.dialog{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 64px));min-height:152px;background:linear-gradient(115deg,#f2eddf,#e6dbc6);color:var(--ink);padding:26px 32px 22px 153px;box-shadow:0 12px 50px #0005;border:1px solid #cfbea1;display:none}.dialog:after{content:'';position:absolute;inset:5px;border:1px solid #88745424;pointer-events:none}.dialog .portrait{position:absolute;width:96px;height:116px;left:28px;top:-14px;object-fit:cover;object-position:top;border:4px solid #f6f0e3;box-shadow:2px 5px 12px #0003;transform:rotate(-3deg);background:#333}.speaker{display:inline-block;color:#f9edda;background:#884035;padding:5px 19px;font-family:serif;font-size:14px;letter-spacing:.2em;clip-path:polygon(2% 4%,98% 0,100% 92%,0 100%)}.dialog p{font-family:"Songti TC","Noto Serif TC",serif;font-size:21px;line-height:1.65;margin:13px 0 12px;letter-spacing:.035em}.next{display:block;text-align:right;font-size:10px;color:#81735f;letter-spacing:.1em}.dialog-mode .dialog{display:block}.dialog-mode .interaction{display:none}.keys{position:absolute;bottom:16px;left:28px;display:flex;gap:16px;font-size:10px;color:#c6cec0}.keys kbd{border:1px solid #b8c3ae55;padding:2px 5px;margin-right:4px}.dialog-mode .keys{display:none}.footer{height:62px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;background:#151c1e;color:#a9b4a9;border-top:1px solid #ffffff15;font-size:11px;gap:20px}.footer b{font-weight:400;color:#d9d9c5}.footer .detail{color:#778a82}.note{position:absolute;inset:auto 24px 24px auto;max-width:310px;padding:20px;background:#eee7d7;color:#34382f;font-size:14px;line-height:1.8;border:1px solid #c7ba9e;display:none;box-shadow:0 10px 40px #0005}.note.show{display:block}.note button{float:right;border:0;background:none;color:#84382f}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#d6d7c8;background:#182120;z-index:5;font-size:14px;letter-spacing:.1em}.loading.done{display:none}
@media(max-width:760px){.mast{height:100px;padding:14px 18px;align-items:flex-start;gap:10px;flex-direction:column}.brand .seal{display:none}.brand strong{font-size:17px}.brand small{display:none}.switch button{padding:6px 12px}.stage{height:calc(100svh - 180px);min-height:570px}.hud{top:20px;left:16px;padding:12px;gap:12px}.cash{padding-right:10px;min-width:72px}.cash strong{font-size:21px}.stats{grid-template-columns:repeat(3,47px);gap:9px}.location{top:120px;right:18px}.date{font-size:9px}.time{font-size:23px}.road{font-size:14px;padding:6px 10px}.nav{left:16px;top:130px;gap:5px}.nav button{font-size:11px;padding:6px 10px}.quest{left:17px;top:192px}.quest p{font-size:14px}.dialog{width:calc(100% - 32px);bottom:20px;padding:20px;min-height:170px}.dialog .portrait{width:64px;height:77px;left:19px;top:-16px}.speaker{margin-left:82px}.dialog p{font-size:18px;margin-top:25px}.footer{height:80px;padding:12px 18px;align-items:flex-start;flex-direction:column;gap:6px}.footer .detail{display:none}.keys{left:16px;gap:10px;font-size:9px}.interaction{bottom:70px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

<body>
<header class="mast"><div class="brand"><span class="seal">街角<br>日常</span><div><strong>街角日常</strong><small>ART DIRECTION STUDY · 01</small></div></div><div class="switch" aria-label="示範畫面"><button class="active" data-mode="explore">傍晚探索</button><button data-mode="dialog">人物對話</button><button data-mode="night">夜間氛圍</button></div></header>
<main class="stage" id="stage"><div id="world"></div><div class="shade"></div><div class="loading" id="loading">正在載入街角場景…</div>
<div class="hud"><div class="cash"><div class="label">身上現金</div><strong>$ 2,000</strong></div><div class="stats"><div class="stat">飽足 <b>82</b><div class="gauge"><i style="--v:82%"></i></div></div><div class="stat">體力 <b>76</b><div class="gauge"><i style="--v:76%"></i></div></div><div class="stat">情緒 <b>60</b><div class="gauge"><i style="--v:60%"></i></div></div><div class="stat social">歸屬 <b>55</b><div class="gauge"><i style="--v:55%"></i></div></div><div class="stat social">帥潮 <b>11</b><div class="gauge"><i style="--v:11%"></i></div></div><div class="stat social">風評 <b>−30</b><div class="gauge"><i style="--v:30%"></i></div></div></div></div>
<div class="location"><div class="road">中華路</div><div class="date">9月1日　星期一</div><div class="time" id="time">18:20</div></div>
<nav class="nav"><button data-note="角色">角色</button><button data-note="地圖">地圖</button><button id="quests">任務</button></nav>
<aside class="quest" id="quest"><small>主線 · 開學</small><p>明早去學校報到</p><span>永安高中　08:00</span></aside>
<button class="interaction" id="talk"><kbd>空白鍵</kbd>跟店員說話</button>
<section class="dialog" aria-label="示範對話"><img class="portrait" src="../assets/bg/clerk-portrait.png" alt="店員"><span class="speaker">店員</span><p>「便當剩這幾個，微波要等一下喔。」</p><span class="next">空白鍵　繼續 ▸</span></section>
<div class="keys"><span><kbd>Q E</kbd>看街角</span><span><kbd>空白鍵</kbd>對話</span></div>
<aside class="note" id="note"><button id="closeNote" aria-label="關閉">×</button><div id="noteText"></div></aside>
</main><footer class="footer"><b>提案 01 ／ 場景留白 × 深綠狀態列 × 紙感對話</b><span class="detail">現有 3D 素材重新打光；可切換畫面與視角</span><span>獨立示範 · 數值與對話為示意</span></footer>
<script src="lib/character.js"></script>
<script type="module">
import * as THREE from 'three';
import {buildCity,buildPlayer} from './lib/scene-city3d.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const stage=document.getElementById('stage'),host=document.getElementById('world');
const scene=new THREE.Scene();scene.background=new THREE.Color('#646b68');scene.fog=new THREE.FogExp2('#646b68',.007);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(44,1,.1,300);
const ambient=new THREE.HemisphereLight(0xb1c2ca,0x514a3e,2.1);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xffd5a3,2.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:100});sun.shadow.normalBias=.05;scene.add(sun,sun.target);
const city=buildCity(THREE,scene),hero=buildPlayer(THREE,scene);const door=city.doors.find(d=>d.id==='store');hero.group.position.set(door.x-1.4,.3,door.z+2.8);hero.group.rotation.y=Math.PI;
// Demonstration-only paving: replace stretched texture with quiet tiled surfaces.
function paving(tiled){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle=tiled?'#77796f':'#383f40';x.fillRect(0,0,512,512);let seed=73;const random=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(let i=0;i<13000;i++){x.fillStyle=`rgba(${random()>.5?'255,255,255':'0,0,0'},${random()*.055})`;x.fillRect(random()*512,random()*512,1+random()*3,1+random()*3);}if(tiled){x.strokeStyle='#4a50494d';x.lineWidth=2;for(let i=0;i<=512;i+=128){x.beginPath();x.moveTo(i,0);x.lineTo(i,512);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(512,i);x.stroke();}}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,2);t.anisotropy=8;return t;}
const walkTexture=paving(true),roadTexture=paving(false);scene.traverse(o=>{if(!o.isMesh)return;const tiled=o.material===city.materials.walk;if(!tiled&&o.material!==city.materials.road)return;const m=o.material.clone();m.map=(tiled?walkTexture:roadTexture).clone();const d=o.geometry.parameters;m.map.repeat.set((d.width||8)/8,(d.depth||8)/8);m.map.needsUpdate=true;m.color.set(0xffffff);m.roughness=.9;o.material=m;});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x444c46,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
sun.position.set(door.x-16,24,door.z+20);sun.target.position.set(door.x,0,door.z);city.updateLights(door.x,door.z);
// Only this isolated scene's material instances are affected.
scene.traverse(o=>{if(o.isMesh){for(const m of (Array.isArray(o.material)?o.material:[o.material])){if(m?.emissiveIntensity>0.6)m.emissiveIntensity=.6;}}});
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),.14,.45,1.1);composer.addPass(bloom);composer.addPass(new OutputPass());
let yaw=.16,mode='explore';const keys=new Set();
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(stage);resize();
function setMode(next){mode=next;stage.classList.toggle('dialog-mode',mode==='dialog');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const night=mode==='night';ambient.intensity=night?.9:2.1;sun.intensity=night?.45:2.4;sun.color.set(night?0xaec4df:0xffd5a3);scene.background.set(night?'#192c3a':'#646b68');scene.fog.color.copy(scene.background);renderer.toneMappingExposure=night?1.1:1.05;bloom.strength=night?.24:.14;document.getElementById('time').textContent=night?'21:40':'18:20';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.getElementById('talk').onclick=()=>setMode('dialog');document.getElementById('quests').onclick=()=>{document.getElementById('quest').hidden=!document.getElementById('quest').hidden;};document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{document.getElementById('noteText').textContent=b.dataset.note==='角色'?'角色頁提案：以學生資料卡呈現人物，物品用收據與小照片整理。此頁先展示入口位置。':'地圖頁提案：使用台灣街區導覽圖的配色，可進入的店面用實心符號標示。此頁先展示入口位置。';document.getElementById('note').classList.add('show');});document.getElementById('closeNote').onclick=()=>document.getElementById('note').classList.remove('show');
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();if(!e.repeat)setMode(mode==='dialog'?'explore':'dialog');}keys.add(e.key.toLowerCase());});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(now-last,50);last=now;if(keys.has('q'))yaw=Math.max(-.4,yaw-dt*.0003);if(keys.has('e'))yaw=Math.min(.4,yaw+dt*.0003);const distance=camera.aspect<1?30:23;camera.position.set(door.x+Math.sin(yaw)*distance,10,door.z+Math.cos(yaw)*distance);camera.lookAt(door.x,3,door.z);hero.animate(dt,false,false);city.updateBushBillboards(camera.position.x,camera.position.z);composer.render();document.getElementById('loading').classList.add('done');});
</script></body></html>
