<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>no-way-up ／ 街上 ⇄ 室內</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0c10; }
  body { font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }

  #city, #indoor { position:fixed; inset:0; }
  #city canvas { display:block; }
  #indoor { display:none; align-items:center; justify-content:center; background:#0a0c10; }
  #indoor.on { display:flex; }
  #indoorStage { position:relative; width:100%; max-width:1280px; aspect-ratio:1280/720; }
  #c2dbg, #c3d, #c2df { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---- HUD(兩層共用) ---- */
  .hud { position:fixed; left:16px; top:14px; z-index:6; display:flex; gap:7px; font-size:12px; }
  .pod { background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28);
         border-radius:4px; padding:5px 10px 6px; min-width:74px; backdrop-filter:blur(4px); }
  .pod .lb { color:#7c8593; font-size:10px; letter-spacing:.14em; }
  .pod .nm { color:#eef1f5; font-size:15px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .pod.money .nm { color:#f2d888; }
  .pod .track { height:4px; margin-top:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
  .pod .track i { display:block; height:100%; width:0; transition:width .45s cubic-bezier(.3,.9,.3,1); }
  .pod.full i { background:linear-gradient(90deg,#8a9a4a,#c9bb44); }
  .pod.full.low { border-color:rgba(224,72,58,.8); animation:lowpulse 1.15s infinite; }
  .pod.full.low i { background:linear-gradient(90deg,#e0552f,#e0483a); }
  @keyframes lowpulse { 50% { border-color:rgba(224,72,58,.2); } }
  .pod.calm i { background:linear-gradient(90deg,#3f8f86,#6fc3b4); }
  .pod.cool i { background:linear-gradient(90deg,#8a4fa8,#d05fa0); }
  .pod.mood i { background:linear-gradient(90deg,#c98a3f,#f2b25c); }
  .pod.stamina i { background:linear-gradient(90deg,#4a8a5c,#6fc98a); }
  /* 風評(舊「通緝」)2026-08-14 從 0~5 星改成雙向 -100~+100,見
     docs/DESIGN_NOTES.md「通緝改名風評」——track 中間畫一條分界線,填色從
     中線往左(壞事,紅)或往右(好事,綠)長,不是從左邊固定長到右邊。 */
  .pod.star .track { position:relative; overflow:visible; }
  .pod.star .track::before { content:''; position:absolute; left:50%; top:-2px; bottom:-2px;
    width:1px; background:rgba(255,255,255,.25); }
  .pod.star .track i { position:absolute; top:0; height:100%; width:0;
    transition:width .45s cubic-bezier(.3,.9,.3,1), left .45s cubic-bezier(.3,.9,.3,1); }
  .pod.star .track i.good { background:linear-gradient(90deg,#4a8a5c,#6fc98a); }
  .pod.star .track i.bad  { background:linear-gradient(90deg,#e0552f,#e0483a); }
  .pod.bump { animation:bump .5s; }
  @keyframes bump { 30% { border-color:rgba(216,178,74,.8); transform:translateY(-3px); } }

  /* ---- 標籤列:src/tags.js 的資料,身上帶著的東西 ---- */
  #tags { position:fixed; left:16px; top:74px; z-index:6; display:flex; gap:6px; flex-wrap:wrap; max-width:44vw; }
  .tag { background:#e8e3d6; color:#23262c; font-size:12px; letter-spacing:.04em;
         padding:3px 9px 4px; border-radius:2px; box-shadow:1px 2px 0 rgba(0,0,0,.45);
         animation:slap .35s cubic-bezier(.2,1.5,.5,1) both; }
  @keyframes slap { from { transform:scale(1.5); opacity:0; } to { transform:scale(1); opacity:1; } }

  /* 角色卡按鈕(2026-08-18):簡易背包介面的入口,見 openInventory()。放在
     tags 下面同一條左側縱軸,跟 pods/tags 同一套視覺語言(深底淺字),
     不用另外設計一顆花俏的圖示。 */

  #invPanel { background:#141922; border:1px solid #3d4757; border-radius:8px;

  #invPanel h3:first-child { margin-top:0; }
  #invPanel .invTag { background:#e8e3d6; color:#23262c; font-size:12px; padding:3px 9px 4px;

  #invPanel .questRow { background:rgba(216,178,74,.08); border:1px solid rgba(216,178,74,.3);

  #invClose { margin-top:18px; width:100%; background:rgba(12,16,23,.95); color:#97a0ad;

  #hint { position:fixed; left:50%; bottom:16%; transform:translateX(-50%); z-index:6;

  #dialog { position:fixed; left:5%; right:5%; bottom:5%; display:none; padding-top:44px; z-index:8; }

  #float { position:fixed; inset:0; pointer-events:none; z-index:7; }

                    100%{opacity:0;transform:translateY(-34px);} }

  #toast { position:fixed; left:50%; top:16%; transform:translateX(-50%);
           background:rgba(8,10,14,.9); border-left:3px solid #d8b24a; padding:9px 18px;

  #toast.on { opacity:1; }

  #fade { position:fixed; inset:0; background:#05060a; z-index:9; opacity:0;

  #fade.on { opacity:1; pointer-events:auto; }

  #bar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:6;
         display:flex; gap:7px; }
  button.tool { background:rgba(20,24,32,.9); color:#c8cfda; border:1px solid #313846;

                cursor:pointer; border-radius:3px; }
  button.tool:hover { background:#242b36; color:#fff; }
  #keys { position:fixed; left:16px; bottom:12px; z-index:6; font-size:11.5px; color:#6a727f; letter-spacing:.08em; }
  #keys b { color:#9aa3b0; }
  #fps { position:fixed; right:14px; bottom:12px; z-index:6; font-size:11px; color:#5c6470; }

  /* 騎機車姿勢即時調整面板——暫時重新加回來給 kc 自己錄一段調整過程,
     錄完會拔掉,不是要留著當正式功能。 */
  #tune { position:fixed; right:14px; top:100px; z-index:6; width:220px;
          background:rgba(9,12,17,.88); border:1px solid rgba(120,134,158,.3);
          border-radius:5px; padding:10px 12px; backdrop-filter:blur(4px);
          opacity:0; pointer-events:none; transition:opacity .2s; }
  #tune.on { opacity:1; pointer-events:auto; }
  #tune .cap { font-size:11px; letter-spacing:.14em; color:#8b94a3; margin-bottom:6px; }
  #tune .row { margin-bottom:7px; }
  #tune .row label { display:flex; justify-content:space-between; font-size:11.5px;
                      color:#c8cfda; margin-bottom:2px; }
  #tune .row label span.v { color:#f2d888; font-variant-numeric:tabular-nums; }
  #tune .row input[type=range] { width:100%; }
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { CITY, CAM, PLAYER, buildCity, buildPlayer, buildNPC, RIDE_POSE } from './lib/scene-city3d.js';

/* ===================================================================
   共用狀態 —— 兩層都吃同一份。走進超商買東西，出來街上錢就少了。
   =================================================================== */
/* mood(情緒):2026-08-13 kc 決定開的第六條,見 DESIGN_NOTES「五條指標各自
   管什麼」節尾的補記——原本「五條是上限」的規則被 kc 自己推翻,不是我看漏。
   只由路上的小互動改變(摸貓狗、撿垃圾這種環境小事),不要拿去承接家庭劇情
   的情緒衝擊——那些依然是「感受用文字承接,不要用數值」,只用 toast 講,
   這條規則沒被推翻,只是多開了一條專門給「街上的小確幸/小噁心」用。 */
/* stamina(體力):2026-08-13 kc 要的第七條——DESIGN_NOTES 原本明講「體力」
   這個名字踩過雷,決定不要另開、掛歸屬感/飽足就好,這次 kc 自己又推翻一次,
   跟 mood 那次一樣不是後面的 Claude 看漏。範圍先只接街上的小互動(摸貓狗、
   撿垃圾、玩遊樂器材)跟回家睡覺回滿,沒有去動整個遊戲其他系統(上課、
   打工、劇情選項那些)——「每做一件事都會消耗」這句要真的做到全遊戲每個
   動作都扣,是動到很多既有系統的大重構,今天先只接這三種新街上互動 +
   睡覺回滿,其餘之後再擴。 */
const ST = { money:63, full:42, calm:55, cool:8, mood:60, stamina:100, star:0 };
let minute = 20*60 + 14, day = 3;
const DAYS = ['日','一','二','三','四','五','六'];

/* 標籤:直接用 src/tags.js 的核心，不自己發明一套 */
const CH = createCharacter(['single'], 10);      // 開局:單親。其餘在遊戲裡長出來
function addTag(id){
  if(CH.tags.includes(id)) return;
  CH.tags.push(id);
  drawTags();
  const t = getTag(id);
  toast('你身上多了一格：' + (t ? t.name : id) + '。拿不掉。', 4200);
}
function drawTags(){
  const host = document.getElementById('tags');
  host.innerHTML = '';
  CH.tags.forEach(id => {
    const t = getTag(id); if(!t) return;
    const el = document.createElement('div');
    el.className = 'tag'; el.textContent = t.name;
    el.title = t.detail + (t.cover ? `（可以${t.cover.cover?.label || t.cover.label}）` : '（遮不了）');
    host.appendChild(el);
  });
}

/* 簡易背包介面(2026-08-18,kc 要求「先做一個簡易背包介面」,接上一輪
 * TUITION_QUEST 那個「先記狀態沒有 UI」的缺口)。**簡易**是重點——這個
 * 遊戲目前沒有真的道具/裝備系統,「背包」實質上就是標籤(CH.tags,已經有
 * 的核心機制)+ 進行中的待辦(目前只有 TUITION_QUEST 一種)兩塊拼起來,
 * 不是憑空做一套物品欄。點左側「角色」按鈕開,ESC 或按「關閉」收合,
 * 開著的時候用 `busy` 擋掉移動(跟 openMenu() 同一招),不用另外寫一套
 * 輸入鎖定邏輯。以後真的要加背包道具,再往 invPanel 加一個 `<h3>物品</h3>`
 * 區塊,這裡的結構已經是一節一節分開的,加新分類不用重寫。 */
const invOverlay = document.getElementById('invOverlay');
function openInventory(){
  busy = true;
  const tagHost = document.getElementById('invTags');
  tagHost.innerHTML = '';
  if(CH.tags.length === 0) tagHost.innerHTML = '<div class="invEmpty">還沒有任何標籤。</div>';
  CH.tags.forEach(id => {
    const t = getTag(id); if(!t) return;
    const el = document.createElement('div');
    el.className = 'invTag'; el.textContent = t.name;
    el.title = t.detail;
    tagHost.appendChild(el);
  });
  const qHost = document.getElementById('invQuests');
  qHost.innerHTML = '';
  if(TUITION_QUEST && !TUITION_QUEST.paid){
    const left = TUITION_QUEST.dueDay - day;
    const row = document.createElement('div');
    row.className = 'questRow';
    row.innerHTML = `註冊費 <span class="amt">$${TUITION_QUEST.amount}</span> 還沒繳<br>` +
      (left > 0 ? `還剩 ${left} 天` : `已經過期 ${-left} 天`);
    qHost.appendChild(row);
  } else {
    qHost.innerHTML = '<div class="invEmpty">沒有進行中的待辦。</div>';
  }
  invOverlay.classList.add('on');
}

function chg(k, d){
  if(!d) return;

  /* 風評(star)2026-08-14 從 0~5(通緝星星)改成雙向 -100~+100,見
     docs/DESIGN_NOTES.md「通緝改名風評」——中間 0,左邊壞事、右邊好事,
     不再只往一個方向長。其餘指標維持原本 0~100。 */
  if(k === 'star') ST[k] = Math.max(-100, Math.min(100, ST[k]));
  else if(k !== 'money') ST[k] = Math.max(0, Math.min(100, ST[k]));

/* 街頭藝人的歌聲(見上面 BUSKER_POS 那段註解)。AudioContext 一定要在使用者
   互動(keydown)裡才准建立/resume,不能頁面一載入就開——瀏覽器的 autoplay
   政策會直接擋掉,靜音也不報錯,踩了會覺得「明明寫了怎麼沒聲音」,先在這裡
   說清楚。startBuskerAudio() 只會真的跑一次(靠 buskerGain 判斷有沒有建過),
   之後每次 keydown 呼叫都是白工但無害。 */
let audioCtx = null, buskerGain = null;
function startBuskerAudio(){
  if(buskerGain) { if(audioCtx.state === 'suspended') audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  buskerGain = audioCtx.createGain();
  buskerGain.gain.value = 0;
  buskerGain.connect(audioCtx.destination);
  /* 五聲音階(C D E G A)迴圈當佔位唱腔,不是真的歌——單音 sine 波,ADSR
     只做簡單的淡入淡出,避免每個音之間喀一聲(click)。600ms 一個音,
     8 個音一輪,跟 mood/stamina 那些數值改動無關,純氣氛。 */
  const notes = [261.6, 293.7, 329.6, 392.0, 440.0, 392.0, 329.6, 293.7];
  let i = 0;
  (function playNote(){
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = notes[i % notes.length];
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.5, t + .06);
    g.gain.linearRampToValueAtTime(0, t + .55);
    osc.connect(g); g.connect(buskerGain);
    osc.start(t); osc.stop(t + .6);
    i++;
    setTimeout(playNote, 600);
  })();
}
/* 靠近淡入、走遠淡出——20 單位外完全聽不到,站在他面前(距離 0)音量封頂
   在 .55,不是開到最大聲,街頭藝人不該蓋過其他環境音。updateCity() 每幀
   呼叫,數字沒特別校過,kc 覺得聽起來範圍不對再調。 */
function updateBuskerAudio(px, pz){
  if(!buskerGain) return;
  const d = Math.hypot(px-BUSKER_POS.x, pz-BUSKER_POS.z);
  const vol = Math.max(0, 1 - d/20) * .55;
  buskerGain.gain.setTargetAtTime(vol, audioCtx.currentTime, .3);
}

   **獨立的一張圖**(`store-hot-cabinet.png`,本來就在 assets/bg/,拿掉
   3D 箱體那輪就留著沒刪)疊上去——背景照片(`store-wall.png`)只剩門/
   飲料櫃/貨架/櫃台/地板,不含鮮食櫃,鮮食櫃在 `paintStoreBackdrop()`
   裡另外貼一次。這樣鮮食櫃以後要換菜色、換季節限定,只要換那張獨立圖,
   不用重生整間店的照片。**鮮食櫃仍然是 Y-sort 裁切**(`renderIndoorForeground()`
   裡按 `IN.py` 跟 `STORE.hot.y` 比大小決定要不要把它蓋在玩家上面)——
   跟上一版差別只在來源圖從「裁一塊整合照片」變成「直接畫整張獨立圖」,
   遮擋邏輯本身沒變。`c3d`(WebGL)只剩畫玩家,`c2dbg` 是底圖,`c2df`
   疊最上層畫鮮食櫃遮擋跟顆粒雜訊。 */
const c3d = document.getElementById('c3d');
const indoorScene = new THREE.Scene();
/* 參考照片是日光燈打得很均勻的亮空間,原本 groundColor 太暗(0x2a2a30)
   會把牆面/地板全部拖暗,尤其朝下或側面的面——調亮、加強度。 */
indoorScene.add(new THREE.HemisphereLight(0xfff6e0, 0x7a7a72, 2.0));
const indoorKey = new THREE.DirectionalLight(0xfff2d8, 1.1);
indoorKey.position.set(-2, 5, 6);
indoorScene.add(indoorKey);

/* 2026-08-14 kc 截圖抓到:角色站到鮮食櫃前緣時,腳浮在鮮食櫃中段,不是
   貼在照片畫的地板上。根因是這台鏡頭原本是為了「真的長方體房間」(已被
   推翻,見上面「整體改回 2D 背景」)校準的透視鏡頭(PerspectiveCamera)——
   房間退回單張平面照片之後,已經沒有真的 3D 幾何可以拿來校準這台鏡頭的
   透視,角色的深度模型(nzForPy/heroScaleFor)跟照片本身的透視完全脫鉤,
   只是巧合對得上或對不上。跟 kc 討論後決定:**角色定位退回舊的 2D 系統
   那套簡單直接公式**(這正是 kc 記得「以前 2D 像素人不會有這個穿模問題」
   的原因)——改用 OrthographicCamera,世界 XY 座標跟畫面 px 1:1 對應,
   IN.px/IN.py 直接乘 SC 就是世界座標,不用再繞 nzForPy()/screenY() 反推。
   角色 model 還是真的 3D 骨架(視覺不退步),只是不再套一台會跟平面背景
   兜不攏的透視鏡頭。frustum 用 ±640/±360(對半張 1280×720 畫面),camera
   放在 (640,360,50) 看向 (640,360,0),world Y 越大要對到螢幕越上面
   (跟 3D 慣例一致),下面 renderIndoor3D() 用 `720 - IN.py*SC` 換算。 */
const indoorCamera = new THREE.OrthographicCamera(-640, 640, 360, -360, -100, 100);
indoorCamera.position.set(640, 360, 50);
indoorCamera.lookAt(640, 360, 0);
indoorCamera.updateMatrixWorld(true);

/* alpha:true——c3d 現在疊在 c2dbg(平面背景)上面,只畫玩家跟鮮食櫃,
   其餘畫面要透出底下那張圖,不能被 WebGL 的預設黑底蓋掉。 */
const renderer3d = new THREE.WebGLRenderer({ canvas:c3d, antialias:true, alpha:true });
renderer3d.setSize(1280, 720, false);
renderer3d.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer3d.outputColorSpace = THREE.SRGBColorSpace;
renderer3d.setClearColor(0x000000, 0);

/* 平面背景:牆面照片(store-wall.png,門/飲料櫃/貨架/櫃台/地板,不含
   鮮食櫃)貼滿,再把鮮食櫃獨立圖(store-hot-cabinet.png,原本是給 3D 箱體
   當正面貼圖用的那張,拿掉箱體那輪留著沒刪)縮放貼到 STORE.hot 那個矩形
   ——兩張圖畫進同一張 `c2dbg`,疊在 c3d 底下。鮮食櫃圖是近距離特寫拍的,
   跟牆面照片的鏡頭距離不同,貼上去比例會跟原生寬高比有點落差,肉眼測過
   可以接受(跟這專案一貫「看起來對就好」的標準一樣),不用另外校正。 */
const c2dbg = document.getElementById('c2dbg'), gbg = c2dbg.getContext('2d');
/* 店員:2026-08-14 kc 提的——店員站定不動只會前後轉身,不用即時 3D 渲染
   (上一輪拿掉 3D 骨架就是因為跟照片級背景質感差太多),改成拍他本人
   (`__dbg.spawnClerk()` 那套,跟玩家/廟口 NPC 共用同一顆骨架換膚,rig
   'm2',顏色沿用 scene-store-front.js 的 P2 既有色票)正面、背面各一張
   透明底截圖,當成靜態貼圖疊進背景合成,跟鮮食櫃同一招。位置卡在櫃台
   後面(肉眼在 store-wall.png 上量的,櫃台前緣約 y=270,他站在收銀機
   旁邊,腰部藏在櫃台後面)。*/
/* 2026-08-14 kc 一開始以為店員頭頂太靠近貨架/天花板那條線是比例問題,縮小
   了一輪(276→230)——後來查出來真正原因是截圖本身上緣切太緊,頭頂像素
   從源頭就沒拍到,跟比例無關。**比例調回原本的 276**,不要沿用縮小版。
   `CLERK_CLIP_Y`(≈274,肉眼在 store-wall.png 上量的櫃台桌面前緣)是新加
   的——kc 截圖抓到店員下半身(毛衣下擺、手)會穿到櫃台桌面前緣外面,因為
   店員貼圖是整張畫上去,沒有跟著櫃台的前緣裁掉。改成畫的時候用 clip()
   卡住,矩形範圍以下(櫃台桌面延伸出去的地方)不畫,店員才會有「站在櫃台
   裡面」的感覺,不是疊在櫃台桌面上面。 */
const CLERK_W = 94, CLERK_H = 276, CLERK_X = 1073, CLERK_Y = 140, CLERK_CLIP_Y = 274;
function paintStoreBackdrop(){
  gbg.clearRect(0,0,1280,720);
  gbg.imageSmoothingEnabled = true;
  if(wallImg.complete) gbg.drawImage(wallImg, 0,0,1280,720);
  const clerkImg = IN.clerkFace === 'B' ? clerkBackImg : clerkFrontImg;
  if(clerkImg.complete){
    gbg.save();
    gbg.beginPath(); gbg.rect(0,0,1280,CLERK_CLIP_Y); gbg.clip();
    gbg.drawImage(clerkImg, 0,0,clerkImg.width,clerkImg.height,
      CLERK_X, CLERK_Y, CLERK_W, CLERK_H);
    gbg.restore();
  }
  if(hotImg.complete) gbg.drawImage(hotImg, 0,0,hotImg.width,hotImg.height,
    STORE.hot.x*SC, (STORE.hot.y-STORE.hot.h)*SC, STORE.hot.w*SC, STORE.hot.h*SC);
}
/* 鮮食櫃遮擋用的裁切圖:用一塊小的重用畫布(hotCutBuf),每次真的需要遮擋
   (見 renderIndoorForeground())才當場從 c2dbg 裁一次,不是載入時預先做好
   快取一次就不動。試過「載入時預先做好」的寫法,結果偶爾會拿到空的遮擋
   (兩張圖的 onload 誰先誰後、瀏覽器快取讓 onload 什麼時候真的觸發,都會
   讓「載入當下」這個時間點跟「c2dbg 真的畫完兩張圖」的時間點對不齊,而且
   很難每次重現)——**改成每次要用才當場裁,徹底不用管載入時序**,反正只有
   玩家站在鮮食櫃附近才會呼叫,不是每幀都跑,效能上沒有差別。
   裁切來源是 c2dbg(已經畫好的背景+鮮食櫃合成結果),不是 hotImg 本身——
   新鮮食櫃圖的玻璃窗格是真的半透明(透出背後貨架),直接拿 hotImg 當遮擋
   貼圖的話,玩家站在後面時身體會從玻璃窗格的透空處「穿幫」冒出來。從
   c2dbg 裁,裁到的永遠是實心一塊,不會穿幫。
   **不做頂部漸層淡出**(2026-08-14 kc 直接說不用)——中間試過用漸層軟化
   上緣硬邊,結果連續踩了兩個坑(destination-in 誤用導致整片全透明、寬度
   40px 讓整隻手掌落進淡出帶變成鬼手),縮窄到 15px 修完鬼手之後,kc
   截圖抓到金屬檯面上還是有一條肉眼看得出的柔化痕跡,判斷不值得為了軟化
   一條邊界再繼續調——直接拿掉,退回硬邊裁切,乾淨、可預期,不再有這條
   線本身的問題要修。 */
const hotCutBuf = document.createElement('canvas');
hotCutBuf.width = STORE.hot.w*SC; hotCutBuf.height = STORE.hot.h*SC;
const hotCutCtx = hotCutBuf.getContext('2d');
function buildHotCutMask(){
  hotCutCtx.clearRect(0,0,hotCutBuf.width,hotCutBuf.height);
  hotCutCtx.imageSmoothingEnabled = true;
  hotCutCtx.drawImage(c2dbg, STORE.hot.x*SC, (STORE.hot.y-STORE.hot.h)*SC, STORE.hot.w*SC, STORE.hot.h*SC,
    0,0,hotCutBuf.width,hotCutBuf.height);
}
const wallImg = new Image(); wallImg.onload = paintStoreBackdrop; wallImg.src = STORE.bgSrc;
const hotImg = new Image(); hotImg.onload = paintStoreBackdrop;
hotImg.src = '../assets/bg/store-hot-cabinet.png';
/* ?v=N 是手動的快取破壞:這兩張圖這輪反覆重截,kc 那邊瀏覽器一直吃到舊快取
   看不到修好的版本(這個 session 已經在鮮食櫃圖上踩過同一個坑)——之後這兩張
   圖只要換內容,記得把 N 往上加一,不要以為存檔就會自動生效。 */
const clerkFrontImg = new Image(); clerkFrontImg.onload = paintStoreBackdrop;
clerkFrontImg.src = '../assets/bg/clerk-front.png?v=7';
const clerkBackImg = new Image(); clerkBackImg.onload = paintStoreBackdrop;
clerkBackImg.src = '../assets/bg/clerk-back.png?v=4';

/* 牆面家具(飲料櫃/貨架/櫃台)都已經畫進 `store-front.png` 這張整合背景圖
   裡,不再是 3D 物件、不需要幾何/材質。碰撞邊界直接用既有的 px 座標算,
   不用繞去世界座標换算一圈:
   - 鮮食櫃是店中央的獨立家具,x 範圍、前緣(pyFront)都用 STORE.hot 這個
     既有的畫面矩形——跟 renderIndoorForeground() 裡拿來遮擋玩家的是同一組
     數字,兩者不會脫鉤。**碰撞深度不能直接拿 `STORE.hot.h`**(2026-08-14
     kc 抓到「鮮食櫃跟貨架中間走道被卡住」才發現:`h` 是它畫面上的高度,
     拿來當它往店內延伸的深度用,深到幾乎貼到後牆,把該有的走道吃光了。
     深度另外給一個淺很多的 `HOT_FOOTPRINT_DEPTH`,只夠擋住「不能直接穿過
     鮮食櫃本體」,後面留出走道可以繞到貨架前。
   - 2026-08-14 kc 截圖抓到:飲料櫃跟貨架原本完全沒有碰撞(只有櫃台有),
     玩家可以一路走進貨架、腳陷進商品裡。照片裡這一整排(飲料櫃/貨架/
     櫃台)其實是同一面牆,中間沒有真的走道——改成一個貫穿整面牆的碰撞
     (只在門口那段留空隙),不用再每個家具各自兜一個框。 */
const BACK_WALL_STAND_PY = 230;
const HOT_FOOTPRINT_DEPTH = 46;
const doorSpot = STORE.spots.find(s => s.id === 'door');
const counterSpot = STORE.spots.find(s => s.id === 'counter');
const FIXTURE_COLLIDERS = [
  { x0: STORE.hot.x, x1: STORE.hot.x + STORE.hot.w,
    pyBack: STORE.hot.y - HOT_FOOTPRINT_DEPTH, pyFront: STORE.hot.y },
  { x0: doorSpot.x + doorSpot.w, x1: counterSpot.x + counterSpot.w,
    pyBack: STORE.walkN, pyFront: BACK_WALL_STAND_PY }
];
const COLLIDE_PAD = 6;

/* 家(客廳)＋房間:2026-08-17 接「家裡的拉扯」。跟超商共用同一套室內
 * 引擎(IN、heroIndoor、indoorScene、renderIndoor3D、openMenu、say),差別
 * 只在「現在人在哪個室內場景」——新增 `PLACE`('store'/'home'/'bedroom')
 * 取代原本寫死 STORE 的地方(`updateIndoor`/`openIndoorSpot`/`inBlocked`/
 * `renderIndoorForeground` 都要照 PLACE 分流,見下面各自的改法)。
 * 客廳/房間背景是 `scene-home.js`/`scene-bedroom.js` 的純程序畫法(640×360,
 * 跟 STORE 的照片背景不同來源但同一套座標系統——LW/LH 剛好也是 640×360,
 * 不用另外換算),畫一次進 `c2dbg` 就好,不像超商店員要每次轉身重畫。
 * 客廳的沙發/餐桌/曬衣架這次先不做「玩家可以走到後面」的深度遮擋(超商
 * 鮮食櫃那套),直接用碰撞框擋住不能站上去——省掉一層遮擋合成,肉眼看
 * 不出差別(這幾件家具本來就不是互動點,見下面「劇情自動觸發」)。 */
let PLACE = 'store';
/* 2026-08-17(第二輪):kc 玩過一輪後要求客廳/房間跟超商統一成照片級風格
 * ——照抄超商繞了四版才收斂的做法(單張整合照片 + OrthographicCamera +
 * px 矩形碰撞,不做 Y-sort,見 DESIGN_NOTES「家裡的拉扯」「實作接進
 * game.html」節)。圖(`home-living.png`/`home-bedroom.png`)還沒生出來，
 * 所以這裡是「FALLBACK 常數(舊的,從 SceneHome/SceneBedroom 程序座標推的)
 * + PHOTO 常數(新的,量測完真的照片才會填入正確數字,現在先跟 FALLBACK
 * 一樣佔位)+ 可重新指派的 let 綁定」——圖真的載入成功那一刻把 HOME/
 * HOME_COLLIDERS 綁定換掉,`inBlocked()`/`updateIndoor()`/`enterIndoor()`/
 * `enterBedroom()`/`leaveBedroom()` 這些既有讀取端完全不用跟著改。 */
const HOME_FALLBACK = {
  walkN: SceneHome.WALK_N, walkS: SceneHome.WALK_S,
  spots: [
    { id:'door',    name:'門口', x:0,   w:96, y0:SceneHome.WALK_N, y1:SceneHome.WALK_S },
    { id:'bedroom', name:'房間', x:600, w:40, y0:SceneHome.WALK_N, y1:SceneHome.WALK_S }
  ]
};
/* 曬衣架(RACK)故意不放進碰撞——它畫在 WALK_S(338)以南(RACK.y=352),
   本來就在玩家走得到的範圍外,擋框反而會把它上面那段(door 附近)整條
   走道堵死(2026-08-17 測試時真的卡住,人卡在門口動不了才抓到)。 */
const HOME_COLLIDERS_FALLBACK = [
  { x0: SceneHome.SOFA.x-10,   x1: SceneHome.SOFA.x+SceneHome.SOFA.w+10,
    pyBack: SceneHome.SOFA.y-70, pyFront: SceneHome.SOFA.y+4 },
  { x0: SceneHome.DINING.x-6,  x1: SceneHome.DINING.x+SceneHome.DINING.w+6,
    pyBack: SceneHome.DINING.y-46, pyFront: SceneHome.DINING.y+4 }
];
const BEDROOM_FALLBACK = {
  walkN: SceneBedroom.WALK_N, walkS: SceneBedroom.WALK_S,
  spots: [
    { id:'door', name:'房間門', x:0, w:80, y0:SceneBedroom.WALK_N, y1:SceneBedroom.WALK_S },
    { id:'bed',  name:'床',     x:SceneBedroom.BED.x-16, w:SceneBedroom.BED.w+32,
      y0:SceneBedroom.WALK_N, y1:SceneBedroom.BED.y }
  ]
};
const BEDROOM_COLLIDERS_FALLBACK = [
  { x0: SceneBedroom.DESK.x-6, x1: SceneBedroom.DESK.x+SceneBedroom.DESK.w+6,
    pyBack: SceneBedroom.DESK.y-50, pyFront: SceneBedroom.DESK.y+4 }
];
/* PHOTO 版本:圖生出來、量測完之後才會把下面這幾組數字換成真的照片座標
 * (肉眼在照片上量,換算成 640×360 邏輯座標,見 DESIGN_NOTES)。現在先跟
 * FALLBACK 一樣,只是佔位——圖片不存在時 naturalWidth 是 0,根本不會被
 * 指派進 HOME/BEDROOM 綁定,不會出錯。
 *
 * 2026-08-17:kc 生完 `home-living.png`/`home-bedroom.png`(1672×941)之後,
 * 下面這幾組數字已經換成真的照片座標——肉眼在圖上拉網格線量的(跟超商
 * 當初同一招,不是精算),換算公式 `logical = native * (1280/1672) / SC`
 * (兩張圖的長寬比幾乎跟 1280×720 一樣,x/y 換算比例幾乎相同,直接乘
 * 0.383 即可)。
 *
 * 客廳第二版(同一天,kc 玩過一輪覺得「房間擺設太複雜、太容易穿模」,
 * 要求改成「水平走到房間」——玩家在客廳裡只能左右移動,不能前後,固定
 * 站在同一條深度線上。連帶要求重生一張新的 `home-living.png`:所有家具
 * 貼牆,中間留一條乾淨走道(舊版沙發/餐桌站在房間中央,會擋住唯一的
 * 水平走道,新版全部靠牆排開)。`HOME_COLLIDERS_PHOTO` 那時清空,因為
 * 沒有深度可以走,家具不會擋到那條唯一的路。
 *
 * **第三版(2026-08-18,水平鎖定撤回)**:kc 要接神明桌互動(桌子貼牆,
 * 要面對它得往上走+轉身背對鏡頭),純水平走不到——把 `updateIndoor()`
 * 裡 `PLACE==='home'` 時 dy 歸零那段拿掉,`walkN`/`walkS` 從「同一個值
 * 鎖死一條線」改回一段真的有寬度的範圍。`HOME_COLLIDERS_PHOTO` 目前還是
 * 空的沒補碰撞框——家具貼牆排開的佈局還在,理論上走道夠寬不會穿模,
 * 真的踩到問題(比如走進沙發裡)再回頭補。 */
const HOME_WALK_Y = 268;   // 舊版水平線,現在只用來當 spots 互動區的中心
const HOME_PHOTO = {
  walkN: 200, walkS: 310,
  spots: [
    { id:'door',    name:'門口', x:85,  w:72, y0:HOME_WALK_Y-20, y1:HOME_WALK_Y+20 },
    { id:'bedroom', name:'房間', x:575, w:57, y0:HOME_WALK_Y-20, y1:HOME_WALK_Y+20 }
  ]
};
const HOME_COLLIDERS_PHOTO = [];
const BEDROOM_PHOTO = {
  walkN: 185, walkS: 330,
  spots: [
    { id:'door', name:'房間門', x:0,  w:85,  y0:185, y1:330 },
    { id:'bed',  name:'床',     x:55, w:315, y0:185, y1:315 }
  ]

function drawFloorShadow(x, bottom, w){
  const ew = w*(SHADOW_TWEAK.wScale/100), eh = ew*(SHADOW_TWEAK.hScale/100);
  const cx = x + w/2;
  gbg.save();
  gbg.translate(cx, bottom);
  gbg.scale(1, eh/ew);
  const grad = gbg.createRadialGradient(0,0,0, 0,0,ew/2);
  grad.addColorStop(0, `rgba(0,0,0,${SHADOW_TWEAK.opacity/100})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  gbg.fillStyle = grad;
  gbg.beginPath();
  gbg.arc(0, 0, ew/2, 0, Math.PI*2);
  gbg.fill();
  gbg.restore();
}

const grain = (() => {
  const c = document.createElement('canvas'); c.width = LW; c.height = LH;
  const x = c.getContext('2d'), img = x.createImageData(LW, LH);
  let s = 20260804;
  const rnd = () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
  for(let i=0;i<img.data.length;i+=4){
    const v = rnd() < .5 ? 0 : 255;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3] = rnd() < .05 ? 10 : 0;
  }
  x.putImageData(img,0,0); return c;
})();

    { label:'買運動飲料', cost:'$30　飽足 +6　情緒 +5', run:() => buy(30,6,5,'') },
    { label:'買奶茶', cost:'$35　飽足 +8　情緒 +7', run:() => buy(35,8,7,'') },
    { label:'塞進口袋', cost:'看店員', cls:'risk', run:() => steal(8) },
    { label:'離開', cls:'back', run(){} }
  ]);
  else if(id === 'counter'){
    const items = [];
    if(!IN.askedJob) items.push({ label:'問有沒有缺人', cost:'打工', run:() => {
      IN.askedJob = true;
      say('clerk','「你幾歲？」', () =>
      say('pc','「十六。」', () =>
      say('clerk','「大夜要滿十八。」\n\n他頓了一下。\n\n「白天早班可以，一小時一百八十三。\n　你要留個電話嗎？」',
          () => { chg('calm',-4); toast('早班的時間，是你上課的時間。', 3400); })));
    }});
    items.push({ label:'看店員在幹嘛', cost:'', run:() =>
      toast(IN.clerkFace === 'B' ? '他背對著你在補菸。' : '他站在收銀機前面，眼睛掃過店裡。', 2400) });
    items.push({ label:'離開', cls:'back', run(){} });

function updateIndoor(dt){
  /* 自動走位(2026-08-18,媽媽借錢那段「先說欸→你自動走到她面前→才開口
     借錢」用):`IN.walkTarget` 有值就整段搶走玩家輸入,自己把 IN.px 往
     target.px 推,跟按鍵移動共用同一個每幀步進量(1.35,沒有乘 dt——
     這個檔案裡按鍵移動本來就是這樣算的,固定幀距步進不是真的 delta-time
     移動,這裡跟著同一個假設走,不要自己另外做一套更精確但手感不一致的
     版本)。到達(差距 < 步進量)才 snap 到 target.px、把臉轉成
     `target.face`、清掉 walkTarget、呼叫 `target.cb()`——呼叫時機故意
     放在清空 walkTarget 之後,cb 裡如果又設了新的 walkTarget(這輪沒用到,
     但這樣寫比較不會被未來的呼叫方踩到「呼叫時前一個 walkTarget 還沒清」
     的坑)。 */
  if(IN.walkTarget){
    const t = IN.walkTarget;
    const dpx = t.px - IN.px;
    if(Math.abs(dpx) <= 1.35){
      IN.px = t.px; IN.face = t.face; IN.moving = false;
      IN.walkTarget = null;
      t.cb && t.cb();
    } else {
      IN.px += Math.sign(dpx)*1.35;
      IN.face = dpx < 0 ? 'L' : 'R';
      IN.moving = true; IN.walkT += dt;
    }
    IN.near = null; hintEl.classList.remove('on');
    return;
  }
  /* 店員轉身/事後抓包只在超商發生,家裡/房間沒有店員,整段跳過。 */
  if(PLACE === 'store'){
    /* 2026-08-14 kc:「店員背面跟隨機轉身」——不用固定週期(舊的 2D 像素人
       時代是 `clerkT % 6600 < 2400` 那種固定循環,現在改成每次轉身後隨機
       抽下一次轉身要等多久,3~8 秒之間,比固定節奏更像真人站著不耐煩偶爾
       轉一下,不是機械化的來回擺頭。轉身當下才呼叫 paintStoreBackdrop()
       重繪背景貼對應那張圖,不是每幀都重畫。 */
    IN.clerkT += dt;
    if(IN.clerkT >= IN.clerkNextTurn){
      IN.clerkFace = IN.clerkFace === 'F' ? 'B' : 'F';
      IN.clerkNextTurn = IN.clerkT + 3000 + Math.random()*5000;
      paintStoreBackdrop();
      /* 2026-08-14 kc:轉回正面那一刻,如果玩家手上還有沒安全脫身的贓款
         (pendingTheft>0)——人還在店裡,算事後被抓一次總帳:扣風評、東西
         退回去(chg('full',-pendingTheft) 把之前偷到的飽足感扣回來)、
         今天不能再偷(stealCaughtDay=day,steal() 開頭會擋)。玩家已經走出
         超商的話 MODE 不會是 'indoor',updateIndoor() 根本不會被呼叫到,
         等於「走出去之前都算在店內」,跟 steal() 那句 toast 的說法一致。 */
      if(IN.clerkFace === 'F' && pendingTheft > 0){
        const amt = pendingTheft; pendingTheft = 0; stealCaughtDay = day;
        chg('full', -amt); chg('star', -2); chg('calm', -20);
        say('clerk', '「等一下。」\n\n他轉過身,先看你的外套,再看架上少的那格。\n沒有人說話。你把東西放回去。',
            () => toast('這家店你今天別再想了。', 3200));
      }
    }
  }

  const bounds = PLACE === 'store' ? STORE : PLACE === 'home' ? HOME : BEDROOM;

  let dx=0, dy=0;
  if(keys['a']||keys['arrowleft'])  dx -= 1;
  if(keys['d']||keys['arrowright']) dx += 1;
  if(keys['w']||keys['arrowup'])    dy -= 1;
  if(keys['s']||keys['arrowdown'])  dy += 1;
  /* 客廳的水平鎖定(2026-08-17 第二輪定案、2026-08-18 撤回):原本這裡
     `PLACE==='home'` 時把 dy 歸零,只能左右走——kc 這輪要求拿掉,因為
     之後要做神明桌互動(桌子貼牆,面對它得往上走+轉身背對鏡頭),純水平
     沒辦法接。HOME_PHOTO.walkN/walkS 也跟著從「同一個值鎖死一條線」改成
     真的有寬度的範圍,見下面 HOME_PHOTO 定義。 */

  if(!busy && !dlg.on && (dx||dy)){
    const sp = 1.35 * (dx&&dy ? .71 : 1);
    const nx = Math.max(20, Math.min(LW-20, IN.px + dx*sp));
    const ny = Math.max(bounds.walkN, Math.min(bounds.walkS, IN.py + dy*sp*.62));
    if(!inBlocked(nx, IN.py)) IN.px = nx;
    if(!inBlocked(IN.px, ny)) IN.py = ny;
    IN.moving = true; IN.walkT += dt;
    if(dx<0) IN.face='L'; else if(dx>0) IN.face='R';
    else if(dy<0) IN.face='B'; else if(dy>0) IN.face='F';
  } else IN.moving = false;

  IN.near = null;
  for(const sp of bounds.spots)
    if(IN.px > sp.x-12 && IN.px < sp.x+sp.w+12 && IN.py >= sp.y0 && IN.py <= sp.y1){ IN.near = sp.id; break; }
  const show = IN.near && !busy && !dlg.on;
  if(show){
    hintEl.innerHTML = bounds.spots.find(s=>s.id===IN.near).name + '　按 <b>空白鍵</b>';
    hintEl.classList.add('on');
  } else hintEl.classList.remove('on');
}

/* c2df 疊最上層:玩家站到鮮食櫃「後面」(IN.py < STORE.hot.y,離鏡頭比較
   遠)**而且**左右也在鮮食櫃範圍內時,把 `hotCutBuf`(上緣漸層淡出過的
   鮮食櫃裁切圖,見上面 `buildHotCutMask()`)蓋在玩家身上,做出前後遮擋
   ——玩家畫在 c3d,比 c2df 低一層,蓋上去就會被擋住。顆粒雜訊疊在最上面。
   2026-08-14 kc 抓到「鮮食櫃分身」:原本只判斷 IN.py,沒判斷 IN.px,玩家
   站在飲料櫃、貨架這些跟鮮食櫃完全無關的地方也會觸發疊繪,跟背景裡已經
   畫好的鮮食櫃疊成雙重影像——這裡沿用同一個 x/y 判斷,換成獨立圖之後
   這個坑不會重踩(畫的是同一張圖、同一個矩形,跟 paintStoreBackdrop()
   貼的位置不會脫鉤)。 */
function renderIndoorForeground(){
  g2f.clearRect(0,0,c2df.width,c2df.height);
  if(PLACE === 'store' && IN.py < STORE.hot.y && IN.px > STORE.hot.x && IN.px < STORE.hot.x + STORE.hot.w){
    buildHotCutMask();
    g2f.imageSmoothingEnabled = true;
    g2f.drawImage(hotCutBuf, STORE.hot.x*SC, (STORE.hot.y-STORE.hot.h)*SC);
  }
  g2f.imageSmoothingEnabled = false;
  g2f.globalAlpha = .5;
  g2f.drawImage(grain, 0,0,LW,LH, 0,0,c2df.width,c2df.height);
  g2f.globalAlpha = 1;
}

let MODE = 'city';
const returnTo = { x:0, z:0 };

function fade(label, mid){

/* 2026-08-12 kc:「3D 人物要走進去 2D 場景啊」——原本按空白鍵是站在門口原地
 * 淡出,像瞬間傳送。現在先讓角色真的用走路動畫走到門口座標(walkIn 那段,
 * 在 updateCity() 裡跑),走到才觸發 fade,銜接感才對得上。 */
/* 睡覺:2026-08-17 起是「站在房間床邊按空白鍵」才會觸發(見 BEDROOM 的
 * `bed` spot),不再是按 home 門瞬間睡著那個輕量版——那版本被整套「客廳→
 * 房間是另一個場景」換掉了(kc 明確要求「主角房間是另一個場景」,不是
 * 客廳同一張背景裡的一扇門)。呼叫這個函式當下人已經在室內(PLACE==
 * 'bedroom'),不用再走路過去,直接淡出、回城市那層 DOM/MODE,邏輯上等於
 * 「離開室內」＋「跳一天」兩件事一起做。 */

function enterIndoor(door){

    return;
  }

           假設它「只要在頁面載入時畫過一次就永遠是超商」(wallImg.onload
           那次),接了家/房間之後這個假設不成立——玩家進過家裡或房間,
           c2dbg 會被換成別的背景,回超商卻沒人叫它重畫,變成頂著超商的
           `where` 標籤卻顯示上一個場景的背景。這裡補回來,每次真的走進
           超商都重畫一次,不能只靠頁面載入那一次。 */

/* ===================================================================
   家裡的拉扯:母·賭 + 父·喝(唯一接進遊戲的一組,見 DESIGN_NOTES
   「範圍:先只做一組父母」)。story-bet.js/story-drink.js 是純資料
   (NODES 陣列,按第幾天觸發),這裡是唯一的「消費端」——直接餵給既有的
   say()/openMenu()/chg()/toast(),不另外做一套對話系統。
   =================================================================== */
const seenStoryDays = new Set();      // 'bet-6'、'drink-15' 這種 key,防止同一天重複觸發
const knownTruths = new Set();        // story-bet.js 的 TRUTHS 編號,目前沒有獨立 UI 顯示,先記著
/* 註冊單債務(2026-08-18,媽媽把兩千拿去「投資」、另外塞一張一千塊註冊單
 * 給主角那段):跟 knownTruths 同一個等級——**先記狀態,沒有獨立 UI**,
 * kc 說之後要做「點角色卡跳出角色/背包介面」才會有地方顯示,這輪不做那個
 * 面板。story-bet.js 的節點資料只給 `tuitionQuest:{amount,days}`(純資料,
 * 不碰 DOM),真的建立這個物件、算到期日、跳 toast 提醒都在這裡做——跟
 * item.money/calm 那些欄位由 `applyStoryChoice()` 消費是同一個分工方式。
 * **逾期沒繳的後果目前沒有定義**,到期日到了不會扣任何東西,只是資料上
 * 記得住「逾期了」——這是刻意留白,不是漏做,後果是什麼要 kc 再定。 */
let TUITION_QUEST = null;
/* beats 是 [{who,text}] 或 [{toast,ms}] 的混合陣列,照順序一句一句播完再
 * 呼叫 done——跟既有 say() 手動巢狀 callback 是同一招,只是資料量大了
 * (最多到 6 句)用遞迴展開,不用每加一句就多縮排一層。 */
/* IN_TARGETS(2026-08-18):家庭 NPC 在客廳的固定站位,给 beats 裡的
   `{ walkTo: 'mom' }` 這種寫法用——px 是拿 MOM_TWEAK.x 換算回 IN 座標
   (screen px / SC,SC=2),不是另外量的數字,MOM_TWEAK 那組滑桿以後再調
   這裡也要跟著改,兩邊沒有自動同步(疊圖位置管畫面上疊哪、IN_TARGETS
   管玩家走位站哪,概念上是兩件事,只是這輪剛好都對著同一個媽媽算)。
   face:'B' 是「背對鏡頭、面向沙發」,媽媽坐沙發面對鏡頭,玩家要面對她
   本來就該背對鏡頭。 */
const IN_TARGETS = { mom: { px: Math.round((MOM_TWEAK.x + MOM_TWEAK.w/2)/SC), face:'B' } };
function playBeats(beats, i, done){
  if(!beats || i >= beats.length){ done && done(); return; }
  const b = beats[i];
  if('toast' in b){ toast(b.toast, b.ms); playBeats(beats, i+1, done); }
  else if('walkTo' in b){
    const t = IN_TARGETS[b.walkTo];
    if(!t){ playBeats(beats, i+1, done); return; }   // 沒設站位就直接跳過,不會卡住
    IN.walkTarget = { px:t.px, face:t.face, cb: () => playBeats(beats, i+1, done) };
  }
  else say(b.who, b.text, () => playBeats(beats, i+1, done));
}
/* debt(欠更多錢)這次沒有另開一條指標——kc 原話「債務就是扣金錢啊」,
 * 直接當 money 的負向變動處理。money 沒有下限(見 chg() 的 clamp 規則),
 * 負數就是「在欠錢」的意思,不用另外畫一條進度條。 */
function applyStoryChoice(item){
  if(item.calm) chg('calm', item.calm);
  if(item.money) chg('money', item.money);
  if(item.moneyAll) chg('money', -ST.money);
  if(item.debt) chg('money', -item.debt);
  if(item.truth) knownTruths.add(item.truth);
}
/* 規則 1(DESIGN_NOTES「家裡的拉扯」):「他主動來找你,你躲不掉」——不是
 * 走到沙發按空白鍵那種互動點,是一進客廳當天撞到節點就直接播,擋住(say/
 * openMenu 本身就會靠 dlg.on/busy 擋住移動,不用額外加鎖)。兩條線目前
 * 觸發天數沒有重疊(bet: 3/6/10/14/18/22,drink: 4/9/15/20/26),一天最多
 * 只會撞到一個,所以先不處理「同一天兩條都要播」的排隊邏輯。 */
function maybeTriggerStoryNode(){
  const sources = [['bet', StoryBet], ['drink', StoryDrink]];
  for(const [key, src] of sources){
    const node = src.NODES.find(n => n.day === day);
    if(node && !seenStoryDays.has(key+'-'+node.day)){
      seenStoryDays.add(key+'-'+node.day);
      playBeats(node.beats, 0, () => {
        if(node.tuitionQuest && !TUITION_QUEST){
          TUITION_QUEST = { amount: node.tuitionQuest.amount, dueDay: day + node.tuitionQuest.days, paid: false };
          toast(`註冊單:三個月內要湊出 $${node.tuitionQuest.amount}`, 3600);
        }
        openMenu(node.title, node.menu.map(item => ({
          label: item.label, cost: item.cost,
          run: () => { applyStoryChoice(item); playBeats(item.beats, 0, () => {}); }
        })));
      });
      return;
    }
  }
}

   輸入 / 主迴圈

const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  startBuskerAudio();          // 第一次按鍵才建立 AudioContext,見上面那段註解
  if(k === ' ' || k === 'enter'){
    e.preventDefault();
    if(advanceDialog()) return;
    if(menuEl.classList.contains('on')) return;
    if(MODE === 'indoor'){ if(IN.near) openIndoorSpot(IN.near); }
    else if(ridingMoto) dismountMoto();
    else if(nearDoor && !busy) enterIndoor(nearDoor);
    else if(nearProp && !busy) interactProp(nearProp);
  }
  if(k === 'escape' && menuEl.classList.contains('on')) closeMenu();
  if(k === 'escape' && invOverlay.classList.contains('on')) closeInventory();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let camYaw = 0, nearDoor = null, nearProp = null, walkIn = null;
const tmp = new THREE.Vector3();

/* 騎機車(2026-08-14,kc 要的——原本地圖太大,走路逛一圈太久)。ridingMoto
   是 city.motos 裡正在騎的那個 entry,null 就是走路。角色本體不藏起來
   (第一版藏起來,kc 玩起來說像鬼在騎車,當場改掉,見 mountMoto() 那段
   註解)——那台車的 group 每幀跟著玩家座標/朝向跑(見 updateCity 移動那段),
   下車時把車的 x/z 更新成當下位置——同一顆 THREE.Group,不是複製一份。
   MOTO_MULT 比 Shift 跑步(run=2)還快,不然騎車不如用跑的沒有意義;騎乘中
   Shift 不再疊加,見 updateCity 那行 speed 算式,先簡化成固定倍率,kc 覺得
   不夠快再調。 */
let ridingMoto = null;
const MOTO_MULT = 3.2;
let MOTO_SEAT_OFFSET = 0.75;    // 2026-08-17 定案值(正值 = 往後輪方向)。暫時改回 let
                                 // 給 #tune 面板拖,錄完會改回 const。
let MOTO_SEAT_Y = 0.95;         // 同上,座墊高度。

/* 騎乘姿勢調整面板 wiring——暫時的,見上面 #tune 那段 CSS 註解。 */
let tunePanelSynced = false;
const tuneInputs = {
  Offset: document.getElementById('tOffset'), SeatY: document.getElementById('tSeatY'),
  Splay:  document.getElementById('tSplay'),  ArmX:  document.getElementById('tArmX'),
  ArmZ:   document.getElementById('tArmZ'),   ArmY:  document.getElementById('tArmY')
};
function syncTunePanel(){
  tuneInputs.Offset.value = MOTO_SEAT_OFFSET;
  tuneInputs.SeatY.value  = MOTO_SEAT_Y;
  tuneInputs.Splay.value  = RIDE_POSE.thighSplay;
  tuneInputs.ArmX.value   = RIDE_POSE.armX;
  tuneInputs.ArmZ.value   = RIDE_POSE.armZ;
  tuneInputs.ArmY.value   = RIDE_POSE.armY;
  Object.keys(tuneInputs).forEach(k => tuneInputs[k].dispatchEvent(new Event('input')));
}
tuneInputs.Offset.addEventListener('input', e => { MOTO_SEAT_OFFSET = +e.target.value; document.getElementById('tvOffset').textContent = MOTO_SEAT_OFFSET.toFixed(2); });
tuneInputs.SeatY .addEventListener('input', e => { MOTO_SEAT_Y      = +e.target.value; document.getElementById('tvSeatY').textContent  = MOTO_SEAT_Y.toFixed(2); });
tuneInputs.Splay .addEventListener('input', e => { RIDE_POSE.thighSplay = +e.target.value; document.getElementById('tvSplay').textContent = RIDE_POSE.thighSplay.toFixed(2); });
tuneInputs.ArmX  .addEventListener('input', e => { RIDE_POSE.armX   = +e.target.value; document.getElementById('tvArmX').textContent   = RIDE_POSE.armX.toFixed(2); });
tuneInputs.ArmZ  .addEventListener('input', e => { RIDE_POSE.armZ   = +e.target.value; document.getElementById('tvArmZ').textContent   = RIDE_POSE.armZ.toFixed(2); });
tuneInputs.ArmY  .addEventListener('input', e => { RIDE_POSE.armY   = +e.target.value; document.getElementById('tvArmY').textContent   = RIDE_POSE.armY.toFixed(2); });
/* 買機車(2026-08-17,kc 要求「只有機車行能買,騎別人的扣風評」)——
   MOTO_PRICE 是我先湊的數字,沒跟 kc 對過,價位刻意訂得比現在身上的錢
   ($63)高一大截,呼應這遊戲「想翻身但每條路都關著」的基準線(見
   docs/DESIGN_NOTES.md),不是隨口喊個數字湊功能而已——kc 不喜歡的話說
   一聲就改。騎沒買的車扣風評的量比照 steal() 被當場抓到那組(-1),不是
   偷完脫身被抓的重罰組(-2),見 mountMoto() 那段。 */
const MOTO_PRICE = 1800;

/* 相機防穿牆(kc 之前就遇過):建築/招牌都是 add() 直接掛在 scene 底下的
   Mesh,角色跟 NPC 是 Group,只抓 scene.children 裡 isMesh 的那層、不遞迴,
   天然排除人物,場景建好就不會再變,先快取一次。跟 street3d.html 同一招,
   細節見那邊的註解。 */
const occluders = scene.children.filter(o => o.isMesh);
const camRay = new THREE.Raycaster();
const eyePos = new THREE.Vector3(), camDir = new THREE.Vector3();
const whereEl = document.getElementById('where');

function updateCity(dt){
  if(keys['q']) camYaw -= dt*.0018;
  if(keys['e']) camYaw += dt*.0018;

  const run = keys['shift'] ? 2 : 1;
  const pos = hero.group.position;
  let moving = false;

  if(walkIn){
    /* 進門的最後幾步不是玩家按出來的,是腳本算出來的方向直接走到門的座標——
       跟下面手動輸入共用同一顆 hero.animate(),角色不會在切換的瞬間卡一下。 */
    const dx = walkIn.x - pos.x, dz = walkIn.z - pos.z, dist = Math.hypot(dx, dz);
    if(dist < .12){
      const done = walkIn.done; walkIn = null; done();
    } else {
      const speed = 0.0055 * dt;
      pos.x += (dx/dist) * speed; pos.z += (dz/dist) * speed;
      hero.group.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
  } else if(!busy && !dlg.on){
    let ix=0, iz=0;
    if(keys['a']||keys['arrowleft'])  ix -= 1;
    if(keys['d']||keys['arrowright']) ix += 1;
    if(keys['w']||keys['arrowup'])    iz -= 1;
    if(keys['s']||keys['arrowdown'])  iz += 1;
    if(ix||iz){
      const speed = 0.005 * dt * (ridingMoto ? MOTO_MULT : run);
      const len = Math.hypot(ix,iz);
      /* 移動要跟著鏡頭轉(kc 抓到的問題),細節見 street3d.html 同一段註解。 */
      const dx = (ix*Math.cos(camYaw) + iz*Math.sin(camYaw))/len;
      const dz = (-ix*Math.sin(camYaw) + iz*Math.cos(camYaw))/len;
      const nx = pos.x + dx*speed, nz = pos.z + dz*speed;
      if(!city.blocked(nx, pos.z)) pos.x = Math.max(CITY.bounds.x[0], Math.min(CITY.bounds.x[1], nx));
      if(!city.blocked(pos.x, nz)) pos.z = Math.max(CITY.bounds.z[0], Math.min(CITY.bounds.z[1], nz));
      hero.group.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
  }
  hero.animate(dt, moving, run, !!ridingMoto);      // 第 4 參數:騎乘中蓋掉 idle/walk/run,撐坐姿(見 scene-city3d.js)
  NPCS.forEach(n => n.animate(dt, pos));            // pos 給小步待機拿去算轉頭朝向,見 buildNPC 註解

  /* 騎乘中:那台車的 group 每幀跟著玩家座標/朝向跑(見 mountMoto()/
     dismountMoto()——角色本體不藏,坐姿疊在車上)。碰撞/邊界檢查都還是
     用 pos(hero.group.position),車只是換皮,不是另一套移動邏輯。
     MOTO_SEAT_OFFSET:propModel() 把整台車的 bounding box 幾何中心對齊
     local (0,0,0),但座墊實際位置不是正中心,車的 group 往騎士反方向
     推出去 MOTO_SEAT_OFFSET,等於把座墊那端拉回騎士(pos)所在的位置。
     只動車的視覺位置,不動 pos 本身,碰撞/下車停車座標(m.x/m.z,見
     dismountMoto())不受影響。數字來源見上面 MOTO_SEAT_OFFSET 那行註解。 */
  if(ridingMoto && ridingMoto.group){
    const fx = Math.sin(hero.group.rotation.y), fz = Math.cos(hero.group.rotation.y);
    ridingMoto.group.position.set(pos.x + fx*MOTO_SEAT_OFFSET, 0, pos.z + fz*MOTO_SEAT_OFFSET);
    ridingMoto.group.rotation.y = hero.group.rotation.y;
  }

  if(ridingMoto){
    /* 座墊高度,數字來源見上面 MOTO_SEAT_Y 那行註解。 */
    pos.y += (MOTO_SEAT_Y - pos.y) * .3;
  } else {
    let onRoad = false;
    for(const r of CITY.H_ROADS) if(Math.abs(pos.z-r.z) < CITY.ROAD_HW) onRoad = true;
    for(const r of CITY.V_ROADS) if(Math.abs(pos.x-r.x) < CITY.ROAD_HW) onRoad = true;
    pos.y += ((onRoad ? .1 : .3) - pos.y)*.3;
  }

  tmp.set(Math.sin(camYaw)*CAM.dist, CAM.high, Math.cos(camYaw)*CAM.dist);
  tmp.add(pos);
  /* 相機防穿牆,細節見 street3d.html 同一段註解——理想機位跟角色中間隔了
     牆的話,把鏡頭拉到撞點前面一點。 */
  eyePos.set(pos.x, pos.y + hero.eyeY*CAM.lookY, pos.z);
  camDir.subVectors(tmp, eyePos);
  const wantDist = camDir.length();
  let camTarget = tmp;
  if(wantDist > .01){
    camDir.divideScalar(wantDist);
    camRay.set(eyePos, camDir);
    camRay.far = wantDist;
    const hit = camRay.intersectObjects(occluders, false)[0];
    if(hit) camTarget = eyePos.clone().addScaledVector(camDir, Math.max(3, hit.distance - 1.2));
  }
  camera.position.lerp(camTarget, 1 - Math.pow(.0015, dt/1000));
  camera.lookAt(pos.x, pos.y + hero.eyeY*CAM.lookY, pos.z);

  keyLight.position.set(pos.x-24, 34, pos.z+20);
  keyLight.target.position.copy(pos);
  city.updateLights(pos.x, pos.z);
  updateBuskerAudio(pos.x, pos.z);
  city.updateBushBillboards(camera.position.x, camera.position.z);
  whereEl.textContent = city.whereAmI(pos.x, pos.z);

  nearDoor = null;
  for(const d of city.doors)
    if(Math.hypot(pos.x-d.x, pos.z-d.z) < 3.6){ nearDoor = d; break; }

  /* 街上的小互動(摸狗、撿垃圾),2026-08-13 加的——跟門用同一套「距離內才
     顯示提示、按空白鍵觸發」,但門優先(nearDoor 先判斷),同一格站著不會
     兩個提示打架。litter 撿過會被移出 city.litter(見 interactProp),
     不用另外記一份「已撿」清單。 */
  nearProp = null;
  /* 騎乘中不能再摸狗/撿垃圾/上另一台車(騎在車上手不空),也不進門——
     ridingMoto 擋掉整段偵測,下面 hint 區塊另外處理「按空白鍵下車」。 */
  if(!nearDoor && !ridingMoto){
    for(const p of city.pets)
      if(Math.hypot(pos.x-p.x, pos.z-p.z) < 3.2){ nearProp = { type:'pet', ref:p }; break; }
    if(!nearProp) for(const l of city.litter)
      if(Math.hypot(pos.x-l.x, pos.z-l.z) < 3.2){ nearProp = { type:'litter', ref:l }; break; }
    if(!nearProp) for(const p of city.play)
      if(Math.hypot(pos.x-p.x, pos.z-p.z) < 3.2){ nearProp = { type:'play', ref:p }; break; }
    if(!nearProp) for(const m of city.motos)
      if(!m.ridden && Math.hypot(pos.x-m.x, pos.z-m.z) < 3.2){ nearProp = { type:'moto', ref:m }; break; }
    if(!nearProp && Math.hypot(pos.x-ALLEY_WORKER.x, pos.z-ALLEY_WORKER.z) < 3.2)
      nearProp = { type:'worker', ref:ALLEY_WORKER };
  }
  /* 巷口先聽到聲音再看到人(kc:「會聽到聲音」)——距離比互動範圍(3.2)
     寬一截,只飄一次(ALLEY_WORKER.heard 擋掉),不然每幀都跳字很吵。走過
     一次之後這句就不會再出現,跟 doors/nearProp 那套「範圍內才顯示」不同,
     這個是「路過聽到」的單次環境音,不是持續提示。 */
  if(!ALLEY_WORKER.heard && Math.hypot(pos.x-ALLEY_WORKER.x, pos.z-ALLEY_WORKER.z) < 9){
    ALLEY_WORKER.heard = true;
    toast('「小帥哥,要不要休息一下?」', 2600);
  }

  if(nearDoor && !busy && !dlg.on){
    hintEl.innerHTML = nearDoor.name + '　按 <b>空白鍵</b> 進去';
    hintEl.classList.add('on');
  } else if(nearProp && !busy && !dlg.on){
    hintEl.innerHTML = nearProp.type === 'pet' ? nearProp.ref.label + '　按 <b>空白鍵</b> 摸摸看'
                      : nearProp.type === 'play' ? nearProp.ref.label + '　按 <b>空白鍵</b> 玩一下'
                      : nearProp.type === 'moto' ? (nearProp.ref.forSale && !nearProp.ref.owned
                          ? '按 <b>空白鍵</b> 跟老闆談車'
                          : '按 <b>空白鍵</b> 騎上去')
                      : nearProp.type === 'worker' ? '按 <b>空白鍵</b> 搭話'
                      : '按 <b>空白鍵</b> 撿起來';
    hintEl.classList.add('on');
  } else if(ridingMoto && !dlg.on){
    hintEl.innerHTML = '按 <b>空白鍵</b> 下車';
    hintEl.classList.add('on');
  } else if(MODE === 'city') hintEl.classList.remove('on');

  if(ridingMoto && !tunePanelSynced){ syncTunePanel(); tunePanelSynced = true; }
  else if(!ridingMoto) tunePanelSynced = false;
  tuneEl.classList.toggle('on', !!ridingMoto);
}

/* 2026-08-14 街上補了一隻貓(scene-city3d.js 的 placePet())——原本三句台詞
   是照狗寫的(「尾巴搖得很兇」對貓來說是不爽,不是開心),照 pet.label 分開
   兩組,不要共用同一份文案硬套在不同動物身上。 */
const PET_LINES = {
  '小狗': [
    '牠讓你摸了好一會,尾巴搖得很兇。',
    '牠靠著你的腳,好像沒有很想理你以外的人。',
    '摸起來有點髒,但牠好像很開心。'
  ],
  '貓': [
    '牠瞇著眼讓你摸了幾下,然後就走開了。',
    '牠用頭蹭了蹭你的手,但只有一下。',
    '摸到一半牠忽然翻過身,不知道是要你摸肚子還是想咬你。'
  ]
};
/* 五種垃圾的模型 2026-08-14 陸續換過(見 scene-city3d.js 的 LITTER_MODELS
   那段註解——判準是「一眼看得出是被丟掉的東西」,不是乾淨的產品模型),
   這裡的顯示文字要跟著模型長相走,不然撿起來的 toast 文案會跟畫面對不上:
   bottle 現在是黑色垃圾袋、lunchbox 是散落紙屑、flyer 是攤開的碎紙片、
   cup 是混雜垃圾堆(已經不是杯子形狀)。 */
/* 每種各自帶量詞,不是套固定的「一個」——cup 是混雜垃圾堆,套「一個垃圾堆」
   讀起來很怪(kc,2026-08-14),改用「一包垃圾」;其他四種維持「一個」。 */
const LITTER_KIND_NAME = { bottle:'一個垃圾袋', lunchbox:'一個紙屑', cig:'一個菸蒂', flyer:'一張傳單', cup:'一包垃圾' };
const PLAY_LINES = [
  '玩了一下,喘得比想像中快。',
  '好像有點久沒這樣玩了。',
  '玩到有點累,但心情好一點。'
];
/* 2026-08-13 kc 加的體力值:摸狗、撿垃圾、玩遊樂器材都要扣一點,見 DESIGN_NOTES
   「stamina」那節——範圍先只接這三種街上互動,沒有動到打工/上課/劇情那些
   既有系統。 */
/* 摸貓狗／撿垃圾 2026-08-14 補了彎腰動作(hero.playOnce(),見 scene-city3d.js
   的 rig.once)——玩家在動畫播完前不能再動、不能重複觸發,所以用 busy 卡住,
   跟開選單/走進門那些既有的 busy 用法一致。獎勵(改指標、丟 toast、移除
   垃圾)延到動畫播完的 callback 才做,不是按下空白鍵那一刻就做——這樣「蹲下
   去」跟「東西消失/指標變動」在時間上才對得上。playOnce() 找不到動畫檔案
   時會直接同步呼叫 callback(見那邊的註解),所以這裡不用另外判斷動畫載了
   沒,即使還沒有動畫可放,行為也跟改動前一樣。 */
/* 上車不用 hero.playOnce() 那套彎腰動畫——沒有騎乘姿勢的模型,先試「角色
   站在車上跟著走」(不是藏起來,kc 玩起來說角色整個消失像鬼在騎車,2026-08-14
   當場改掉)。角色本體位置本來就是 pos == hero.group.position,跟騎乘移動
   共用同一個座標,不用另外同步——只是站相,不是坐姿,kc 覺得站姿穿模/太怪
   再回頭調高度或找騎乘動畫。上車瞬間不 busy=true(跟摸貓狗/撿垃圾不一樣),
   因為不需要等動畫播完才能動,按下去立刻就能騎走。 */
/* 騎別人的車扣風評(2026-08-17,kc 要求)——只在「上車那一刻」扣一次,
   不是騎乘中持續扣(kc 明確選過,跟 fullness 那種持續消耗不一樣)。量比照
   steal() 當場被抓到那組(-1,不是脫身後被抓的重罰 -2),見上面 MOTO_PRICE
   的說明。m.owned 的車(跟機車行買下的那台)騎不扣分。 */
function mountMoto(m){
  ridingMoto = m; m.ridden = true;
  hintEl.classList.remove('on');
  if(m.owned){
    toast('騎上自己的車。', 1600);
  } else {
    chg('star', -1);
    toast('騎上別人的車——不是你的,先別想太多。', 2000);
  }
}
function dismountMoto(){
  const m = ridingMoto; if(!m) return;
  const pos = hero.group.position;
  m.x = pos.x; m.z = pos.z;                     // 車停在下車當下的位置,不是彈回原地
  m.ridden = false; ridingMoto = null;
  toast('把車停好,下車走路。', 1600);
}
/* 跟機車行買車(2026-08-17)——m.forSale 那台才會走這條,其餘車(包括這台
   買下之前)按空白鍵直接是 mountMoto(),見下面 interactProp() 那段判斷。
   付完錢當場 owned=true,之後騎這台不再扣風評(見 mountMoto())。 */
function buyMoto(m){
  openMenu('機車行', [
    { label:'付錢買下這台', cost:'$'+MOTO_PRICE, cls: ST.money<MOTO_PRICE?'bad':'',
      run(){
        if(ST.money < MOTO_PRICE){ toast('錢不夠,老闆看了你一眼。', 2000); return; }
        chg('money', -MOTO_PRICE); m.owned = true;
        toast('這台現在是你的了。', 2000);
        mountMoto(m);
      } },
    { label:'先騎騎看(不買)', cls:'risk', run: () => mountMoto(m) },
    { label:'算了', cls:'back', run(){} }
  ]);
}
/* 巷子那段互動(2026-08-17)——價位($500)先湊的數字,沒跟 kc 對過,比照
   MOTO_PRICE 那個做法先訂再說。三個選項刻意不寫成「選了壞結局/好結局」
   二分——「跟她走」不扣風評(這是私下的事,不是被抓到偷東西那種公開失格),
   純粹金錢/時間的交換;「聊兩句」給的是她這個人的一句處境,不是搞笑台詞,
   對照 CLAUDE.md 那條基準線。畫面上不演「跟她走」實際發生什麼,直接跳
   toast 帶過,跟這遊戲寫「偷東西」的做法(steal() 也是不演犯案過程)是
   同一個分寸。 */
const WORKER_PRICE = 500;
function talkToWorker(w){
  say('worker', '「怎樣,要不要陪你走一段?」\n\n她看你一眼,沒有堆笑臉,就是在問。', () => {
    openMenu('巷子裡', [
      { label:'付錢,跟她走', cost:'$'+WORKER_PRICE, cls: ST.money<WORKER_PRICE?'bad':'',
        run(){
          if(ST.money < WORKER_PRICE){ toast('錢不夠。她聳聳肩,轉向別人。', 2000); return; }
          chg('money', -WORKER_PRICE); chg('mood', 6); chg('stamina', -10);
          advanceTime(25);
          w.talked = true;
          toast('半小時後,你一個人走回巷口。', 2600);
        } },
      { label:'就聊兩句,不談這個', cls:'',
        run(){
          w.talked = true;
          say('worker', '「不是每個人站在這都是要幹嘛。」\n\n她說,眼睛沒離開巷口那頭的路燈。\n\n「有時候就是,這裡比家裡安靜。」');
        } },
      { label:'不說話,轉身走掉', cls:'back', run(){} }
    ]);
  });
}
function interactProp(prop){
  if(prop.type === 'worker'){ talkToWorker(prop.ref); return; }
  if(prop.type === 'moto'){
    if(prop.ref.forSale && !prop.ref.owned) buyMoto(prop.ref);
    else mountMoto(prop.ref);
    return;
  }
  if(prop.type === 'pet'){
    busy = true;
    /* 貓/狗共用摸的動作會摸空——貓矮,狗那份「Petting Animal」動畫伸手的
       高度對不到貓身上(kc:「貓還是完全沒摸到,貓要摸得更低」)。貓走
       pet_low(蹲到底那份,見 scene-city3d.js 的 rig.once 註解),其餘(狗)
       維持原本的 pet。 */
    const anim = prop.ref.label === '貓' ? 'pet_low' : 'pet';
    hero.playOnce(anim, () => {
      busy = false;
      chg('mood', 4);
      chg('stamina', -3);
      const lines = PET_LINES[prop.ref.label] || PET_LINES['小狗'];
      toast(lines[Math.random()*lines.length|0], 2400);
    });
  } else if(prop.type === 'play'){
    chg('mood', 3);
    chg('stamina', -5);
    toast(prop.ref.label + '。' + PLAY_LINES[Math.random()*PLAY_LINES.length|0], 2400);
  } else {
    const l = prop.ref;
    busy = true;
    hero.playOnce('pickup', () => {
      busy = false;
      chg('mood', -3);
      chg('stamina', -2);
      chg('star', 1);                                   // 好事,見 DESIGN_NOTES「風評」,2026-08-14 雙向化後好事要往正的走
      if(l.kind === 'bottle') chg('money', 2);
      toast('你撿起了' + (LITTER_KIND_NAME[l.kind] || '一個垃圾') + '。'
            + (l.kind === 'bottle' ? '（$2）' : ''), 2200);
      scene.remove(l.mesh);
      if(l.glow) scene.remove(l.glow);
      /* indexOf 可能是 -1(這個 litter 物件已經被移除過一次)——splice(-1,1)
         會誤刪陣列最後一個元素,測動畫版撿垃圾時手動連續呼叫兩次踩過這個
         (2026-08-14)。正常操作(空白鍵,keydown 那邊有 !busy 擋)不會重複
         觸發,但陣列操作本來就該防這一步,不要假設呼叫端一定乾淨。 */
      const li = city.litter.indexOf(l);
      if(li !== -1) city.litter.splice(li, 1);
      nearProp = null;
      hintEl.classList.remove('on');
    });
  }
}

let lastW=0, lastH=0;
function fit(){
  if(innerWidth===lastW && innerHeight===lastH) return;
  lastW=innerWidth; lastH=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}

const fpsEl = document.getElementById('fps');
let last = performance.now(), acc = 0, frames = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(50, now-last); last = now;
  fit(); tickDialog(dt);
  if(MODE === 'city'){ updateCity(dt); composer.render(); }
  else { updateIndoor(dt); renderIndoor3D(dt); renderIndoorForeground(); }
  acc += dt; frames++;
  if(acc > 500){ fpsEl.textContent = Math.round(frames*1000/acc)+' fps'; acc=0; frames=0; }
});

syncHUD(); drawTags();

/* 除錯用:主控台可以直接把角色傳到某個門口，省得走一分鐘 */
window.__dbg = {
  /* scene/city(2026-08-18):之前 __dbg 沒有直接暴露 3D 場景本身,要查某顆
     mesh 的材質/貼圖有沒有真的套上去,只能用 near() 那組間接資訊(位置/
     尺寸),沒法驗證材質——巷子冷氣機箱體那次(kc 說「根本沒有方塊啊」)
     就是靠暴露 scene 才能直接把材質暫時換成高強度發光色現場驗證,查出
     幾何/材質/貼圖其實都是對的,是巷子環境光真的太暗才讀不出來,不是
     哪裡漏接。留著這兩個當永久除錯工具,以後同類問題不用再繞。 */
  scene, city,
  goto(id){
    const d = city.doors.find(x => x.id === id);
    if(!d) return '沒有這個門：' + city.doors.map(x=>x.id).join(', ');
    hero.group.position.set(d.x, .3, d.z);
    return `已移到 ${d.name} (${d.x.toFixed(1)}, ${d.z.toFixed(1)})`;
  },
  enter(id){ const d = city.doors.find(x => x.id === id); if(d) enterIndoor(d); return MODE; },
  at(x, z){ hero.group.position.set(x, .3, z); return `已移到 (${x}, ${z})`; },
  near(x, z, r){ return scene.children.filter(o => o.isMesh && Math.hypot(o.position.x-x, o.position.z-z) < (r||3))
    .map(o => ({ pos:[+o.position.x.toFixed(2),+o.position.y.toFixed(2),+o.position.z.toFixed(2)],
                 rot:[+o.rotation.x.toFixed(3),+o.rotation.y.toFixed(3),+o.rotation.z.toFixed(3)],
                 scale:[+o.scale.x.toFixed(2),+o.scale.y.toFixed(2),+o.scale.z.toFixed(2)],
                 size: o.geometry?.parameters,
                 mat: (Array.isArray(o.material) ? o.material : [o.material]).map(m => ({
                   color: m.color?.getHexString(), map: !!m.map, mapSrc: m.map?.image?.src,
                   metalness: m.metalness, roughness: m.roughness
                 })) })); },
  leave(){ leaveIndoor(); },
  setIndoor(px, py, face){ IN.px=px; IN.py=py; if(face) IN.face=face; },
  tick(dt){ renderIndoor3D(dt||16); renderIndoorForeground(); },   // 手動推進一幀,不用等 rAF,方便測室內位置
  heroIndoor, indoorScene, renderer3d, IN, paintStoreBackdrop, paintHomeBackdrop,
  DAD_TWEAK, MOM_TWEAK, SHADOW_TWEAK, tweakDad: tweakDadPanel,
  tuitionQuest: () => TUITION_QUEST, maybeTriggerStoryNode,
  indoorCalib(){
    const s = heroIndoor.group.scale.x;
    return { FIXTURE_COLLIDERS, heroPos: heroIndoor.group.position.toArray(), heroScale: s,
      footScreenY: heroIndoor.group.position.y, headScreenY: heroIndoor.group.position.y - s*PLAYER.height };
  },
  mode: () => MODE,
  cam: indoorCamera,
  chg, steal, updateIndoor,
  pendingTheft: () => pendingTheft,
  /* 暫時性:只是要把店員的 3D 骨架轉成正面/背面兩張透明底 PNG 貼圖用,
     截完圖就會把這段刪掉,不是要留店員在場景裡即時渲染(那正是上一輪
     「跟照片級背景質感差太多」被拿掉的原因,見 DESIGN_NOTES)。 */
  spawnClerk(rotY, rig){
    if(this._clerk) indoorScene.remove(this._clerk.group);
    this._clerk = buildNPC(THREE, indoorScene, {
      rig: rig||'m2', rotationY: rotY||0,
      skin:'#cfa279', hair:'#201b17', hood:'#4a09b6', pants:'#2c3340', shoe:'#1a1a1a',
      tex:{ hood:'clerk-uniform.png' }   // 2026-08-14 kc 生的制服布料,跟 char-yuan-shirt.png 同一套 UV 鏡射貼法
    });
    this._clerk.group.position.set(640, 200, 0);
    this._clerk.group.scale.setScalar(INDOOR_HERO_SCALE);   // 跟 heroIndoor 同一招,見上面「畫面固定身高」
    return 'spawned';
  },
  clerkTick(dt){ if(this._clerk) this._clerk.animate(dt||16); renderer3d.render(indoorScene, indoorCamera); },
  captureClerk(){ return c3d.toDataURL('image/png'); },
  /* 2026-08-17:爸爸醉倒那張截圖用,跟 spawnClerk 同一招。2026-08-18 第二輪
     試過換成 pose:'lie'(Mixamo「Lying Down」,見 assets/models/README 跟
     scene-city3d.js MODELS.m.lie)拍側面全身躺平,kc 看了實際效果後打回票——
     **要的其實是坐姿、背對鏡頭**(口語的「醉倒」不是真的整個人躺平,是
     「癱坐著喝到不省人事」那種),跟 v2/v3 同一個方向,retire pose:'lie'
     這條路(程式碼留著、MODELS 裡的 lie 也留著,只是這裡不用了,以後真的
     要人整個躺平再撿回來用)。 */
  spawnDad(rotY){
    if(this._dad) indoorScene.remove(this._dad.group);
    this._dad = buildNPC(THREE, indoorScene, {
      /* 2026-08-18:kc 說「爸爸不夠老」——rig 'm'(Remy)本身是年輕成人的
         臉/體型,幾何換不了(見 DESIGN_NOTES「一顆骨架、多套皮膚」,髮型
         都換不了造型只能換色了,更別說臉),能動的只有髮色——原本
         HP.dadHair 是深棕黑(#26201c),這裡改成灰白撐老態,這是這條管線
         能做到的極限,不是精準的老人建模。 */
      rig:'m', rotationY: rotY||0, pose:'sit',
      skin: HP.dadSkin, hair:'#8a8a82', hood: HP.dadTop, pants: HP.dadPants, shoe:'#1a1a1a'
    });
    this._dad.group.position.set(640, 200, 0);
    this._dad.group.scale.setScalar(INDOOR_HERO_SCALE);
    return 'spawned';
  },
  dadTick(dt){ if(this._dad) this._dad.animate(dt||16); renderer3d.render(indoorScene, indoorCamera); },
  /* 2026-08-18:媽媽坐沙發那張截圖用,跟 spawnDad 同一招,rig 換 'f'
     (Sophie),借同一顆 sit.glb(見 scene-city3d.js MODELS.f.sit 那段
     註解)。截完就可以刪。 */
  spawnMom(rotY){
    if(this._mom) indoorScene.remove(this._mom.group);
    this._mom = buildNPC(THREE, indoorScene, {
      rig:'f', rotationY: rotY||0, pose:'sit',
      skin: HP.momSkin, hair:HP.momHair, hood: HP.momTop, pants: HP.momPants, shoe:'#1a1a1a'
    });
    this._mom.group.position.set(640, 200, 0);
    this._mom.group.scale.setScalar(INDOOR_HERO_SCALE);
    return 'spawned';
  },
  momTick(dt){ if(this._mom) this._mom.animate(dt||16); renderer3d.render(indoorScene, indoorCamera); },
  state: () => ({ ...ST, tags:CH.tags.slice(), time:fmtTime(minute),
                  pos:[+hero.group.position.x.toFixed(1), +hero.group.position.z.toFixed(1)] }),
  ridePose(patch){ if(patch) Object.assign(RIDE_POSE, patch); return { ...RIDE_POSE }; },
  isRiding: () => !!ridingMoto,
  boneWorldPos(){
    const bones = hero.debugBones();
    const out = {};
    Object.entries(bones).forEach(([name, b]) => {
      if(!b) { out[name] = null; return; }
      b.updateWorldMatrix(true, false);
      const e = b.matrixWorld.elements;
      out[name] = [+e[12].toFixed(3), +e[13].toFixed(3), +e[14].toFixed(3)];
    });
    return out;
  }
};
