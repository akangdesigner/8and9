<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>no-way-up ／ 街上 ⇄ 室內</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0c10; }
  body { font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }

  #city, #indoor { position:fixed; inset:0; }
  #city canvas { display:block; }
  #indoor { display:none; align-items:center; justify-content:center; background:#0a0c10; }
  #indoor.on { display:flex; }
  #indoorStage { position:relative; width:100%; max-width:1280px; aspect-ratio:1280/720; }
  #c2dbg, #c3d, #c2df { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---- HUD(兩層共用) ---- */
  .hud { position:fixed; left:16px; top:14px; z-index:6; display:flex; gap:7px; font-size:12px; }
  .pod { background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28);
         border-radius:4px; padding:5px 10px 6px; min-width:74px; backdrop-filter:blur(4px); }
  .pod .lb { color:#7c8593; font-size:10px; letter-spacing:.14em; }
  .pod .nm { color:#eef1f5; font-size:15px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .pod.money .nm { color:#f2d888; }
  .pod .track { height:4px; margin-top:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
  .pod .track i { display:block; height:100%; width:0; transition:width .45s cubic-bezier(.3,.9,.3,1); }
  .pod.full i { background:linear-gradient(90deg,#8a9a4a,#c9bb44); }
  /* 過低警示(2026-08-28):原本只有飽足有,改成通用 .pod.low,五條指標
     共用同一組紅框閃爍樣式,見 syncHUD()/syncPanelStats() 那則同名筆記。 */
  .pod.low { border-color:rgba(224,72,58,.8); animation:lowpulse 1.15s infinite; }
  .pod.low i { background:linear-gradient(90deg,#e0552f,#e0483a); }
  @keyframes lowpulse { 50% { border-color:rgba(224,72,58,.2); } }
  .pod.calm i { background:linear-gradient(90deg,#3f8f86,#6fc3b4); }
  .pod.cool i { background:linear-gradient(90deg,#8a4fa8,#d05fa0); }
  .pod.mood i { background:linear-gradient(90deg,#c98a3f,#f2b25c); }
  .pod.stamina i { background:linear-gradient(90deg,#4a8a5c,#6fc98a); }
  /* 風評(舊「通緝」)2026-08-14 從 0~5 星改成雙向 -100~+100,見
     docs/DESIGN_NOTES.md「通緝改名風評」——track 中間畫一條分界線,填色從
     中線往左(壞事,紅)或往右(好事,綠)長,不是從左邊固定長到右邊。 */
  .pod.star .track { position:relative; overflow:visible; }
  .pod.star .track::before { content:''; position:absolute; left:50%; top:-2px; bottom:-2px;
    width:1px; background:rgba(255,255,255,.25); }
  .pod.star .track i { position:absolute; top:0; height:100%; width:0;
    transition:width .45s cubic-bezier(.3,.9,.3,1), left .45s cubic-bezier(.3,.9,.3,1); }
  .pod.star .track i.good { background:linear-gradient(90deg,#4a8a5c,#6fc98a); }
  .pod.star .track i.bad  { background:linear-gradient(90deg,#e0552f,#e0483a); }
  .pod.bump { animation:bump .5s; }
  @keyframes bump { 30% { border-color:rgba(216,178,74,.8); transform:translateY(-3px); } }

  /* 角色卡按鈕(2026-08-18):簡易背包介面的入口,見 openInventory()。放在
     HUD 血條下面同一條左側縱軸,跟 pods 同一套視覺語言(深底淺字),
     不用另外設計一顆花俏的圖示。 */
  #charCardBtn { position:fixed; left:16px; top:106px; z-index:6; background:rgba(12,16,23,.85);
    color:#dfe4ea; border:1px solid #3d4757; border-radius:4px; padding:5px 11px;
    font:12px/1.4 inherit; letter-spacing:.06em; cursor:pointer; }
  #charCardBtn:hover { background:rgba(32,40,53,.95); border-color:#d8b24a; color:#fff; }
  /* 任務小面板(2026-08-27,kc:「如果有接到任務的話能不能有個小面板顯示,
     因為會有很多任務」)——跟 pods/charCardBtn 同一條左側縱軸疊下去,
     同一套深底淺字視覺語言。沒有任務時整個不顯示(display:none 靠 .on
     切換),不占位置。ACTIVE_QUESTS 是通用清單,不是只給算命攤這條任務
     用——之後其他系統要顯示追蹤中的任務,往那個陣列 push/移除元素、
     呼叫 renderQuestPanel() 就會自動顯示,不用改這裡的 DOM/CSS。 */
  #questPanel { position:fixed; left:16px; top:150px; z-index:6; display:none; flex-direction:column; gap:7px;
    background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28); border-radius:6px;
    padding:8px 11px; max-width:220px; }
  #questPanel.on { display:flex; }
  #questPanel .qpCap { color:#7c8593; font-size:10px; letter-spacing:.14em; }
  #questPanel .qpItem { border-top:1px solid rgba(120,134,158,.18); padding-top:6px; }
  #questPanel .qpItem:first-of-type { border-top:none; padding-top:0; }
  #questPanel .qpTitle { color:#eef1f5; font-size:12px; }
  #questPanel .qpHint { color:#d8b24a; font-size:11px; margin-top:2px; line-height:1.4; }
  #invOverlay { position:fixed; inset:0; background:rgba(6,8,12,.72); z-index:60;
    display:none; align-items:center; justify-content:center; }
  #invOverlay.on { display:flex; }
  #invPanel { background:#141922; border:1px solid #3d4757; border-radius:8px;
    width:min(1120px,96vw); max-height:88vh; overflow:auto; padding:22px 26px;
    color:#dfe4ea; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #invPanel h3 { font-size:12px; letter-spacing:.22em; color:#8b94a3; margin:16px 0 8px; }
  #invPanel h3:first-child { margin-top:0; }
  #invPanel .invEmpty { color:#5c6675; font-size:13px; }
  #invClose { margin-top:20px; width:100%; background:rgba(12,16,23,.95); color:#97a0ad;
    border:1px solid #3d4757; border-radius:4px; padding:8px; font:14px inherit; cursor:pointer; }
  #invClose:hover { color:#fff; border-color:#d8b24a; }

  /* 角色面板三欄(2026-08-19):左物品/穿搭分頁、中人物、右狀態,
     見 docs/DESIGN_NOTES.md「角色面板改三欄」。同一天第二輪照 kc 丟的
     參考截圖把物品/穿搭改成圖示格子(itemGrid/itemCard 共用元件,取代
     原本各自一套的 invTag/questRow/wearItem),圖示先用 emoji 佔位——
     這遊戲沒做過物品圖示素材,理由跟決定記在 DESIGN_NOTES 同一節底下
     的補記,不要看到這行就以為要再重新設計一次。 */
  .invHead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .invHead h2 { margin:0; font-size:16px; letter-spacing:.16em; color:#e6eaf0; }
  .invHead .invMoney { color:#f2d888; font-size:16px; font-variant-numeric:tabular-nums; }
  .invGrid { display:grid; grid-template-columns:1fr 400px 220px; gap:24px; }
  .invTabs { display:flex; gap:6px; margin-bottom:12px; }
  .invTabBtn { background:rgba(12,16,23,.85); color:#8b94a3; border:1px solid #3d4757;
    border-radius:999px; padding:5px 14px; font:12px inherit; letter-spacing:.05em; cursor:pointer; }
  .invTabBtn.on { color:#141922; background:#d8b24a; border-color:#d8b24a; font-weight:bold; }
  .invTabPane { display:none; }
  .invTabPane.on { display:block; }

  /* 圖示格子共用元件:標籤/文件(物品分頁)、穿搭都套這個,不要再各自
     寫一份——三個地方視覺上本來就該長一樣,參考截圖也是同一種格子。 */
  .itemGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .itemCard { position:relative; background:rgba(255,255,255,.04); border:1px solid #3d4757;
    border-radius:8px; padding:16px 6px 12px; display:flex; flex-direction:column; align-items:center;
    gap:5px; cursor:pointer; aspect-ratio:1; justify-content:center; }
  .itemCard:hover { border-color:#8b94a3; }
  .itemCard.on { border-color:#d8b24a; background:rgba(216,178,74,.12); }
  .itemCard .ic { font-size:36px; line-height:1; }
  .itemCard .lb { font-size:12px; color:#97a0ad; text-align:center; line-height:1.3; }
  .itemCard.on .lb { color:#fff; }
  .itemCard .badge { position:absolute; top:5px; right:6px; font-size:10px; color:#d8b24a;
    background:rgba(0,0,0,.5); padding:2px 5px; border-radius:3px; }
  #itemDetail { margin-top:10px; min-height:1.6em; font-size:12.5px; line-height:1.6; color:#c7cdd6; }
  #itemDetail .amt { color:#d8b24a; font-weight:bold; }

  .invMid { display:flex; align-items:center; justify-content:center; gap:14px; }
  .equipBadges { display:flex; flex-direction:column; gap:10px; }
  .equipBadge { width:64px; height:64px; border:1px solid #3d4757; border-radius:7px;
    display:flex; align-items:center; justify-content:center; font-size:30px;
    background:rgba(255,255,255,.03); opacity:.35; }
  .equipBadge.filled { opacity:1; border-color:#d8b24a; background:rgba(216,178,74,.1); }
  /* 全身像(2026-08-19 第四輪):pc-fullbody.png 到位後量過,實際畫布是
     1024×1536(寬高比 .667),角色本人在畫布裡已經站得很滿(量過 alpha,
     上下幾乎頂到邊)——第三輪的容器比例(170×380=.447)比圖片本身瘦太多,
     object-fit:contain 用寬度卡死,上下留一大截空白,人物看起來超小,
     kc 一眼就抓到「三小」。改成 220×330,寬高比對齊圖片原始比例
     (220/330=.667,跟圖片一致),contain 才不會留空,人物才會撐滿框。
     還沒有全身圖時(`onerror` 退回頭像)會顯示在這個框的上緣,是過渡
     樣子,不是壞掉。 */
  #invPortrait { width:220px; height:330px; border-radius:6px; object-fit:contain; object-position:top;
    border:1px solid #3d4757; background:#1b202b; }
  .statList .pod { margin-bottom:8px; }

  /* 收銀小遊戲(2026-08-19,kc 要求「早班不是死門,是翹課換錢」,見
     docs/DESIGN_NOTES.md「早班不是死門」節)。第三輪(同一天):kc 說
     「不要黑畫面計算機」,拿掉整個置中彈窗+九宮格鍵盤,改走遊戲既有的
     對話框(`#dialog`/`say()`)——客人排隊/對話那套邏輯見下面 JS 區塊,
     這裡只留一條給倒數計時用的細長進度條,貼在對話框正上方。 */
  #coTimerTrack { position:fixed; left:5%; right:5%; bottom:calc(5% + 196px); z-index:8;
    height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden;
    display:none; max-width:1180px; margin:0 auto; }
  #coTimerTrack.on { display:block; }
  #coTimerTrack i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#6fc98a,#d8b24a);
    transition:width .15s linear, background-color .3s; }
  #coTimerTrack.low i { background:linear-gradient(90deg,#e0552f,#e0483a); }

  #where { position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:6;
           background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28); border-radius:4px;
           padding:6px 18px; font-size:14px; color:#e6eaf0; letter-spacing:.18em; backdrop-filter:blur(4px); }
  #clock { position:fixed; right:14px; top:14px; z-index:6; text-align:right;
           background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28);
           border-radius:4px; padding:6px 13px; backdrop-filter:blur(4px); }
  #clock .d { font-size:10px; letter-spacing:.16em; color:#7c8593; }
  #clock .t { font-size:17px; color:#e6eaf0; letter-spacing:.1em; font-variant-numeric:tabular-nums; }

  #hint { position:fixed; left:50%; bottom:16%; transform:translateX(-50%); z-index:6;
          background:rgba(8,10,14,.88); border:1px solid #3b4452; padding:7px 17px;
          font-size:15px; color:#e8ecf1; border-radius:3px; letter-spacing:.05em;
          opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  #hint.on { opacity:1; }
  #hint b { color:#f2d888; }

  #dialog { position:fixed; left:5%; right:5%; bottom:5%; display:none; padding-top:44px; z-index:8; }
  #dialog.on { display:block; }
  #portrait { position:absolute; left:20px; top:0; width:100px; height:100px; z-index:3;
              background:#1b202b; border:2px solid #55617a; border-radius:4px;
              box-shadow:0 6px 18px rgba(0,0,0,.55); image-rendering:pixelated; }
  #dialog .frame { padding:15px 22px 17px 144px; min-height:108px; max-width:1180px; margin:0 auto;
    background:linear-gradient(180deg,rgba(14,18,26,.96),rgba(9,12,18,.98));
    border:2px solid #55617a; border-radius:5px;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07); }
  .dname { font-size:14px; letter-spacing:.12em; color:#d8b24a; margin-bottom:7px; }
  .dbody { font-size:18px; line-height:1.8; color:#eef1f5; letter-spacing:.05em; white-space:pre-line; }
  /* 旁白(2026-08-31,kc:「有些情境敘述的東西不要用我的頭像來呈現 因為
     那不是我說話」)——who:'pc' 這個 channel 同時混著「玩家真的講的話」
     (開頭一定是「」引號)跟「單純描述場景/動作的旁白」(不是引號開頭,
     全遊戲 372 句 pc 台詞裡有 339 句是這種),原本兩者都套用玩家真人
     照片+「你」名牌,旁白也長得像玩家在講話。判斷邏輯留在 say()(見那邊
     的長筆記),這裡只負責旁白模式的樣式:藏頭像跟名牌,文字改用滿版
     padding(跟頭像那 144px 對齊用的縮排一起拿掉),不用另外做置中/斜體
     那類更大的視覺改版。 */
  #dialog.narration #portrait, #dialog.narration .dname { display:none; }
  #dialog.narration .frame { padding-left:22px; }
  .caret { display:inline-block; margin-left:6px; color:#d8b24a; opacity:0; animation:bob 1s infinite; }
  .caret.on { opacity:1; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(3px);} }

  /* 收銀小遊戲的選項(2026-08-19 第八輪,kc 說「對話框高度要大一點,上面
     題目下面選項」)——原本借用既有的 openMenu()/#menu,結果是題目跟選項
     兩個各自浮動的獨立元件,疊在畫面下方看起來是分開的兩塊。改成選項
     直接長在 `#dialog .frame` 裡面(`#coOpts`,緊接在 `.dbody` 題目下面),
     同一個灰底金框的盒子,自然會因為多了選項內容被撐高,不用另外設一個
     固定的「大一點」高度。空的時候(平常劇情對話,沒有選項)`#coOpts`
     沒有子元素,margin-top 也不會生效(:empty 選到就不留白),看起來
     跟原本的對話框一樣,不會影響劇情那邊的既有樣子。 */
  #coOpts { display:flex; flex-direction:column; gap:7px; margin-top:16px; }
  #coOpts:empty { margin-top:0; }
  #coOpts button { text-align:left; background:rgba(12,16,23,.95); color:#dfe4ea;
    border:1px solid #3d4757; border-left:3px solid #55617a; padding:9px 15px;
    font-size:15.5px; font-family:inherit; letter-spacing:.04em; cursor:pointer; border-radius:3px;
    transition:all .13s; }
  #coOpts button:hover { background:rgba(32,40,53,.98); border-left-color:#d8b24a; color:#fff; transform:translateX(3px); }

  #menu { position:fixed; left:50%; transform:translateX(-50%); bottom:6%;
          display:none; flex-direction:column; gap:5px; width:min(560px,82%); z-index:8; }
  #menu.on { display:flex; }
  #menu .cap { font-size:11.5px; letter-spacing:.28em; color:#8b94a3; padding-left:4px; margin-bottom:3px; }
  #menu button { text-align:left; background:rgba(12,16,23,.95); color:#dfe4ea;
    border:1px solid #3d4757; border-left:3px solid #55617a; padding:9px 15px;
    font-size:15.5px; font-family:inherit; letter-spacing:.04em; cursor:pointer; border-radius:3px;
    transition:all .13s; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  #menu button:hover { background:rgba(32,40,53,.98); border-left-color:#d8b24a; color:#fff; transform:translateX(3px); }
  #menu button .cost { font-size:12.5px; color:#8d96a4; white-space:nowrap; }
  #menu button.bad { color:#8c7a72; } #menu button.bad .cost { color:#a2564c; }
  /* 2026-09-01,kc:「知識不夠會無法選該選項」——cls:'bad' 原本只是變色,
     按鈕還是能點(其他地方靠 run() 裡的 if(blocked) return 擋,體力不夠
     那種會順便跳 toast 講原因)。這裡加真的 disabled 支援,給「這個選項
     這次真的按不下去」的情況用(見 openMenu() it.disabled 那段),不是
     全部 bad 選項都要跟著改成 disabled——體力不夠那種原本點了會跳 toast
     講原因的行為不動它。 */
  #menu button:disabled { cursor:not-allowed; opacity:.55; pointer-events:none; }
  #menu button.risk { border-left-color:#a2564c; }
  #menu button.back { border-left-color:#39424f; color:#97a0ad; font-size:14px; }

  /* 遊藝場機台的「大框框」(2026-08-26,kc:「互動是應該要彈出一個大框框,
     要寫實的感覺」)——原本三台機台跟其他一般互動點共用 #menu 那個小小
     一條清單,kc 覺得不夠份量,改成獨立的全螢幕暗底+置中大面板,中間是
     機台特寫畫布(agCanvas,真的照片生出來前先用 SceneArcade.renderCloseup()
     的放大版色塊頂著),下面才是下注/結果的文字跟按鈕——跟 #dialog 的
     深色卡片同一套視覺語言(邊框/陰影/字距都抄同一份數值),不是另外發明
     一套風格。 */
  #arcadeGame { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
                background:rgba(4,5,8,.86); z-index:9; }
  #arcadeGame.on { display:flex; }
  #arcadeGame .agPanel { width:min(720px,90%); background:linear-gradient(180deg,rgba(14,18,26,.97),rgba(9,12,18,.98));
    border:2px solid #55617a; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.6); padding:20px 26px 24px; }
  /* 陣頭音遊金紅 LED 邊框(2026-08-31 第六輪,kc 貼參考圖要「宮廟招牌風格」
     的邊框)——只有 startTroupeGame() 開的時候加 .troupe 這個 class,跟
     推幣機/扛磚共用的預設灰藍邊框拉開,animation 做輕微脈動呼應霓虹燈
     牌的閃爍感,不要做到刺眼閃爍。 */
  #arcadeGame.troupe .agPanel { border-color:#e0483a;
    box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 18px rgba(216,178,74,.55), inset 0 0 14px rgba(224,72,58,.25);
    animation: troupeGlow 2.2s ease-in-out infinite; }
  @keyframes troupeGlow {
    0%,100% { box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 18px rgba(216,178,74,.55), inset 0 0 14px rgba(224,72,58,.25); }
    50% { box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 30px rgba(216,178,74,.85), inset 0 0 20px rgba(224,72,58,.4); }
  }
  #arcadeGame .agCap { font-size:13px; letter-spacing:.24em; color:#d8b24a; margin-bottom:12px; text-align:center; }
  #arcadeGame canvas { display:block; width:100%; height:auto; border-radius:4px; box-shadow:0 4px 20px rgba(0,0,0,.5); }
  /* 推幣機的時機條(2026-08-26)——只有 pusher 那台會顯示(game.html
     openArcadeGame() 依 kind 切換 display),track 本身是一條窄長橫條,
     sweet 那塊是視覺上標出「準」的範圍,跟 resolvePusherLockIn() 的
     dist 判定對齊(算式見那個函式旁邊的註解)。
     **2026-08-26 第二輪,kc 兩個回饋**:「硬幣要真的硬幣而且要對準,
     然後難度太簡單」——
     1. `agBarPin` 原本是一條 5px 窄條,用純色塊表示指針,跟「代幣」
        兩個字對不上,改成真的畫成一枚硬幣(圓形+內圈的金色漸層+外緣
        描邊)。原本用 `left:X%` 定位,硬幣的左邊緣會卡在目標位置上
        (不是硬幣中心對準),改成 `transform:translate(-50%,-50%)` 讓
        硬幣的圓心真的對準指示條當下的位置,不再偏移半個硬幣寬度。
        `overflow:hidden` 也拿掉(硬幣圓形比原本的窄條高,原本的
        overflow:hidden 會把硬幣上下切掉一截)。
     2. sweet spot 寬度從 24%(對應 resolvePusherLockIn() 的 dist<=.12,
        即左右各 12%)縮到 10%(對應 dist<=.05),連帶指示條速度也調快
        (見 updateIndoor() 那段 `ARCADE_ANIM.barPos` 位移量),兩件事
        一起讓「卡準」變成真的要盯著看、抓時機,不是隨便按都差不多。
     **第三輪,kc 直接傳了一張真的十元硬幣照片(2026-08-26)**——原本
     `agBarPin` 是 CSS 漸層畫的假硬幣,換成真照片(`arcade-coin.png`)
     當背景圖,`background-size:cover`+`border-radius:50%` 裁成圓形;
     漸層那層留著疊在圖片下面當退路(圖真的載不出來時還看得到一個
     金色圓,不會變空白),兩層 background 疊圖片在上、漸層在下即可。 */
  #arcadeGame .agBar { position:relative; height:14px; background:#1a1420; border-radius:7px;
    margin:22px 6px 12px; display:none; }
  #arcadeGame .agBarSweet { position:absolute; left:45%; width:10%; top:0; bottom:0; background:#3a7a4a; }
  #arcadeGame .agBarPin { position:absolute; top:50%; left:0%; width:22px; height:22px;
    transform:translate(-50%,-50%);
    background-image:url('../assets/tex/arcade-coin.png'), radial-gradient(circle at 35% 30%, #fff3c4, #e8c85a 45%, #a8791f 100%);
    background-size:cover, cover;
    border:1.5px solid #6b4f18; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.6); }
  #arcadeGame .agBody { text-align:center; font-size:15px; color:#e8ecf1; min-height:22px;
    margin:14px 4px; white-space:pre-line; letter-spacing:.03em; }
  #arcadeGame .agActions { display:flex; flex-direction:column; gap:7px; }
  #arcadeGame .agActions button { text-align:left; background:rgba(12,16,23,.95); color:#dfe4ea;
    border:1px solid #3d4757; border-left:3px solid #55617a; padding:9px 15px;
    font-size:15.5px; font-family:inherit; letter-spacing:.04em; cursor:pointer; border-radius:3px;
    transition:all .13s; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  #arcadeGame .agActions button:hover { background:rgba(32,40,53,.98); border-left-color:#d8b24a; color:#fff; transform:translateX(3px); }
  #arcadeGame .agActions button .cost { font-size:12.5px; color:#8d96a4; white-space:nowrap; }
  #arcadeGame .agActions button.bad { color:#8c7a72; } #arcadeGame .agActions button.bad .cost { color:#a2564c; }
  #arcadeGame .agActions button.back { border-left-color:#39424f; color:#97a0ad; font-size:14px; }

  /* 算命攤抽籤動畫(2026-08-27,kc:「算命會跳出一段動畫,可以參考xx專案
     的機器人」)——kc 指的是他自己另一個 side project(ai-linebot,銀髮
     長輩機器人的「抽籤詩」LIFF 頁,app/silver/fortune/page.tsx)。那頁的
     節奏值得照抄:搖籤筒(shaking,900ms)→籤筒傾倒+一支籤飄落淡出
     (popping,500ms)→翻出結果紙。這裡不是重新設計一套,是把那套節奏
     搬進這個遊戲既有的深色面板語言(跟 #arcadeGame 同一份邊框/陰影/
     字距數值,不是另外發明一套風格)。籤筒圖(fortune-cup.png)、籤詩紙
     底圖(fortune-paper.jpg)直接搬那個專案現成的圖檔過來用(kc 自己的
     素材,兩邊都是他的專案)。 */
  #fortunePanel { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
                  background:rgba(4,5,8,.86); z-index:9; }
  #fortunePanel.on { display:flex; }
  #fortunePanel .fpPanel { width:min(460px,90%); background:linear-gradient(180deg,rgba(14,18,26,.97),rgba(9,12,18,.98));
    border:2px solid #55617a; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.6); padding:20px 26px 24px; text-align:center; }
  #fortunePanel .fpCap { font-size:13px; letter-spacing:.24em; color:#d8b24a; margin-bottom:14px; }
  #fortunePanel .fpStage img { width:120px; height:120px; object-fit:contain;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.5)); }
  #fortunePanel .fpStage.shaking img { animation:fpShake .3s ease-in-out infinite; }
  @keyframes fpShake { 0%,100%{ transform:rotate(-13deg) translateX(-6px); } 50%{ transform:rotate(13deg) translateX(6px); } }
  #fortunePanel .fpStage.tipping img { animation:fpTip .5s ease-out forwards; }
  @keyframes fpTip { 0%{ transform:rotate(0deg); } 100%{ transform:rotate(22deg); } }
  #fortunePanel .fpText { margin-top:14px; font-size:14.5px; color:#c7cdd8; letter-spacing:.04em; }
  /* 結果紙整組重做(2026-08-27,kc:「你為何要改我的樣式,你有看我原本的
     籤詩樣式嗎」)——上一輪把內容(四句/宜忌/六格)搬過來了,但排版是
     我自己重新設計的橫式段落,不是 kc 原本 ai-linebot 那頁真的樣子。
     這輪直接照抄那頁的 CSS 結構(class 名字/巢狀關係/直式文字排版都
     照搬,只換色票),不是「參考精神」而是真的照樣式抄:
     - 籤詩/解籤是直式(`writing-mode:vertical-rl`),由右至左排列
       (`flex-direction:row-reverse`),旁邊各自跟一個直式的「詩曰」/
       「解曰」標籤,中間用左邊框隔開——不是我原本那版橫式一行行往下排。
     - 六格運勢+宜忌是同一排(不是六格一排、宜忌另起一排),宜忌用
       左邊框從六格中間隔開,跟六格同高。
     - 整張紙是雙紅框(`fpSlip` 外框+`fpSlipInner` 內框中間留窄縫),
       四段內容(頭/籤文/解曰/六格)之間用細紅線隔開,不是分開的色塊。
     - 右下角加祈福印章(直式、旋轉、multiply 混合模式)。
     結果紙預設藏著,drawFortuneSlip() 播完動畫才切換顯示——跟 agBar
     那套「display:none 預設藏,程式判斷才開」同一招。 */
  #fortunePanel .fpResult { display:none; }
  #fortunePanel .fpSlip { padding:5px; border:1.5px solid #a82a22; border-radius:6px;
    background-image:url('../assets/tex/fortune-paper.jpg'); background-size:cover; background-position:center;
    box-shadow:0 14px 30px -18px rgba(120,20,20,.45); }
  #fortunePanel .fpSlipInner { border:2.5px solid #a82a22; border-radius:4px; overflow:hidden; }
  #fortunePanel .fpRow { border-top:1px solid rgba(168,42,34,.55); }
  #fortunePanel .fpHead { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; }
  #fortunePanel .fpGradeBig { font-size:26px; font-weight:900; color:#a82a22; letter-spacing:.15em; }
  #fortunePanel .fpVCol { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:.3em; }
  #fortunePanel .fpVCol.fpHeadNo { font-size:13px; font-weight:800; color:#a82a22; }
  #fortunePanel .fpVerseRow { display:flex; align-items:stretch; justify-content:center; padding:14px 10px; gap:10px; min-height:150px; }
  #fortunePanel .fpVerseCols { display:flex; flex-direction:row-reverse; gap:10px; }
  #fortunePanel .fpVCol.fpVerseLine { font-size:19px; font-weight:900; color:#2a2018; }
  #fortunePanel .fpVCol.fpSideLabel { flex:0 0 auto; font-size:13px; font-weight:800; color:#a82a22;
    border-left:1px solid rgba(168,42,34,.4); padding-left:8px; }
  /* 解曰置中+字放大(2026-08-27,kc:「解曰沒放中間,而且第三行為何字
     這麼小」)——align-items 從 flex-start 改 center,「解曰」標籤才會
     跟著解籤文字區塊垂直置中,不是貼齊區塊頂端;字級從 15px 加大到
     17px(照 ai-linebot 原頁的 meaning-vert 字級),跟籤文(19px)的
     落差不要太明顯。 */
  #fortunePanel .fpMeaningRow { display:flex; align-items:center; justify-content:center; padding:14px 10px; gap:10px; }
  /* 解籤字級改回 17px(2026-08-27,kc:「把解曰的字改回來,那一段長度
     剛好,真正有問題的是人際/出行那邊的字太小太上面」)——上一輪誤判,
     解曰這段長度/字級本來就沒問題,kc 指的「太小」其實是下面 fpGridRow
     那組六格運勢裡的人際/出行兩格,不是這裡。 */
  #fortunePanel .fpVCol.fpMeaningVert { height:150px; font-size:17px; font-weight:700; color:#4a3c2e; line-height:2; }
  /* 六格運勢也是直式(2026-08-27,kc 傳了真的截圖:「是長這樣欸」)——
     上一輪雖然照抄了直式籤文/解籤,但六格運勢還是自己做的橫式小方塊
     (標籤在上、數值在下疊成兩行的橫排卡片),原頁其實整頁一路直式到底,
     每一格是「標籤+數值」接在同一條直式文字裡當一欄(class 也是共用
     `v-col`,不是另外一種排法)。改法很單純:gcol() 產生的每格 div
     加上 `fpVCol`,直接繼承上面 `.fpVCol` 那條 writing-mode 規則,不用
     另外寫直式邏輯。
     置中+放大(2026-08-27,同一天,kc:「人際 出行 那邊的字太小太上
     面」)——量過 DOM,八格字級其實完全一樣(12px),不是這兩格特別小;
     真正的原因是 `align-items:flex-start`,字數多的格子(人際/感情,
     7 字)往下長比較長,但全部格子都貼齊列頂端對齊,字數少的格子(出行
     等,6 字)看起來就吊在上面、沒把下面的空間撐滿,才會有「小又偏上」
     的錯覺。改成 `center` 讓短格子跟長格子一樣以列中線對齊,不再貼頂。
     順便把字級跟 headNo/sideLabel/seal 那批次要文字的 13px 對齊(原本
     12px 是唯一比其他次要文字還小的,不是刻意的),拉到 14px。 */
  #fortunePanel .fpGridRow { display:flex; align-items:center; justify-content:center; padding:12px 8px; gap:8px; }
  #fortunePanel .fpVCol.fpGCol { font-size:14px; letter-spacing:.15em; }
  #fortunePanel .fpGCol .fpGL { color:#a82a22; font-weight:800; }
  #fortunePanel .fpGCol .fpGV { color:#4a3c2e; font-weight:700; }
  #fortunePanel .fpGridSide { display:flex; gap:6px; border-left:1px solid rgba(168,42,34,.4); padding-left:8px; margin-left:2px; }
  #fortunePanel .fpSeal { display:flex; justify-content:flex-end; padding:4px 16px 14px; }
  #fortunePanel .fpSealStamp { writing-mode:vertical-rl; text-orientation:upright; font-size:13px; font-weight:900; letter-spacing:.25em;
    color:#a82a22; border:2px solid #a82a22; border-radius:4px; padding:5px 4px; opacity:.7; transform:rotate(-4deg);
    mix-blend-mode:multiply; }
  #fortunePanel #fpClose { margin-top:16px; background:rgba(12,16,23,.95); color:#dfe4ea;
    border:1px solid #3d4757; border-left:3px solid #d8b24a; padding:9px 20px;
    font-size:14.5px; font-family:inherit; letter-spacing:.06em; cursor:pointer; border-radius:3px; }
  #fortunePanel #fpClose:hover { background:rgba(32,40,53,.98); color:#fff; }

  #float { position:fixed; inset:0; pointer-events:none; z-index:7; }
  .fl { position:absolute; font-size:16px; letter-spacing:.06em; font-weight:600;
        text-shadow:0 2px 10px rgba(0,0,0,.9); animation:rise 1.5s ease-out both; }
  @keyframes rise { 0%{opacity:0;transform:translateY(6px);} 18%{opacity:1;}
                    100%{opacity:0;transform:translateY(-34px);} }

  #toast { position:fixed; left:50%; top:16%; transform:translateX(-50%);
           background:rgba(8,10,14,.9); border-left:3px solid #d8b24a; padding:9px 18px;
           font-size:15px; color:#e8ecf1; border-radius:2px; letter-spacing:.05em;
           opacity:0; transition:opacity .4s; pointer-events:none; z-index:7; max-width:62%;
           white-space:pre-line; }
  #toast.on { opacity:1; }

  /* 場景地標標籤(2026-08-19,kc 說廟埕那批方塊分不出哪個是哪個)——除錯用,
     不是給玩家看的正式 UI,先用跟 #hint 同一套深底淺字的簡單樣式,不用另外
     設計。updateWorldLabels() 每幀改 left/top 把它釘在對應 3D 物件正上方。 */
  #wlabels { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .wlabel { position:absolute; transform:translate(-50%,-100%);
            background:rgba(8,10,14,.78); border:1px solid rgba(216,178,74,.55);
            color:#f2d888; font-size:12px; letter-spacing:.06em; padding:2px 7px;
            border-radius:2px; white-space:nowrap; }

  #fade { position:fixed; inset:0; background:#05060a; z-index:9; opacity:0;
          pointer-events:none; transition:opacity .4s;
          display:flex; align-items:center; justify-content:center; flex-direction:column; }
  #fade.on { opacity:1; pointer-events:auto; }
  #fade .place { font-size:28px; letter-spacing:.5em; text-indent:.5em; color:#e8e2d5;
                 opacity:0; transition:opacity .5s .1s; }
  #fade.on .place { opacity:1; }

  /* 失敗結局(2026-08-28)——比照 #fade 全黑蓋滿,但不會自動淡出,要按
     「重新開始」才會離開,見 GAME_OVER_TEXT 那則筆記。 */
  #gameOver { position:fixed; inset:0; background:#05060a; z-index:20; display:none;
              align-items:center; justify-content:center; flex-direction:column;
              padding:0 12%; text-align:center; }
  #gameOver.on { display:flex; }
  #gameOver .goCap { font-size:13px; letter-spacing:.4em; text-indent:.4em;
                      color:#a2564c; margin-bottom:18px; }
  #gameOver .goText { font-size:16px; line-height:2; color:#dfe4ea; max-width:640px; margin-bottom:28px; }
  #gameOver .tool { padding:8px 20px; }

  #bar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:6;
         display:flex; gap:7px; }
  button.tool { background:rgba(20,24,32,.9); color:#c8cfda; border:1px solid #313846;
                padding:6px 13px; font-size:12px; font-family:inherit; letter-spacing:.06em;
                cursor:pointer; border-radius:3px; }
  button.tool:hover { background:#242b36; color:#fff; }
  #keys { position:fixed; left:16px; bottom:12px; z-index:6; font-size:11.5px; color:#6a727f; letter-spacing:.08em; }
  #keys b { color:#9aa3b0; }
  #fps { position:fixed; right:14px; bottom:12px; z-index:6; font-size:11px; color:#5c6470; }

</style>
</head>

  <div class="fpPanel">

function askMakeupExam(){
  const NEED = 3, MAX_MISS = 1;

  busy = true;
  coFade('補考', async () => {

    await imgReady(SCHOOL_STUDY_IMG);
    paintSchoolStudyBackdrop();
    setTimeout(askRound, 1000);
  });
  function finish(pass){
    dlgEl.classList.remove('on');
    studyTakeover = false;
    busy = false;
    paintSchoolBackdrop();
    makeupAnnouncedDay = -1;
    lastExamDay = day;

      chg('star', 6);
      KNOWLEDGE.small += 2;
      playBeats([
        { who:'teacher', text:'他改完直接跟你講分數。' },
        { who:'teacher', text:'「你會啊。」' },
        { who:'teacher', text:'「你只是沒時間。」' }
      ], 0, () => toast('補考過了。（風評 +6，小小知識 +2）', 3400));
    } else {
      chg('star', -4);
      playBeats([
        { who:'pc', text:'那科就這樣掛了。他沒有再提。' }
      ], 0, () => toast('補考沒過。（風評 −4）', 3000));
    }
  }
  function askRound(){
    if(correctCount >= NEED){ finish(true); return; }
    if(missCount > MAX_MISS){ finish(false); return; }
    const q = questions[qi++];
    drawPortrait('pc');
    dName.textContent = `補考 (${correctCount}/${NEED})`;
    dTx.textContent = `【${q.subj}】${q.q}`;
    dCaret.classList.remove('on');
    dlgEl.classList.add('on');
    coShowOptions(q.opts.map((opt, oi) => ({
      label: opt,
      run(){
        document.getElementById('coOpts').innerHTML = '';
        const ok = oi === q.a;
        const flavor = ok ? Quiz.RIGHT[Math.random()*Quiz.RIGHT.length|0] : Quiz.WRONG[Math.random()*Quiz.WRONG.length|0];
        toast(flavor + '\n' + q.note, 3200);
        if(ok) correctCount++; else missCount++;
        askRound();
      }
    })));
  }
}

/* 2026-08-31 第五輪,kc 給了「認真上課」專屬底圖(跟 school-phone.png
   同一套構圖,前排右邊那位同學從滑手機換成正常低頭讀書)——跟
   paintSchoolBackdrop()/paintPhoneBackdrop() 同一招:naturalWidth 判斷
   圖真的載入成功才畫,否則退回原本的教室照片,不會整段空白。家裡書桌
   「讀書」還沒有專屬素材,維持原樣重用 paintBedroomBackdrop()。

   你就是跳到獨立的圖片加上對話匡 這樣才不會重複 我給你的圖就是全圖
   了」——上一輪(第六輪)理解錯了,以為「蓋在原本圖片上面」是要先畫
   原圖再疊新圖(兩張都畫,怕新圖邊緣蓋不滿露出空白),那個「重複畫兩張」
   本身才是 kc 要我拿掉的東西。正解很單純:黑畫面淡出之後就是換成
   「獨立的」新圖(kc 給的圖本身就是完整的一張,不是拿去跟原圖合成用的
   素材),`clearRect()` 清空、只畫新圖這一張,不用先鋪原圖。
   2026-08-31 同一天第八輪,kc 實測抓到真的 bug(不是理解問題):讀書
   解題那格畫面還是顯示原本教室照片,不是新圖——根因是圖片載入競速。
   這兩張圖(2.3~2.4MB)在 `new Image()` 當下就開始下載,但畫底圖那一刻
   (coFade 淡出後 480ms)`.complete && .naturalWidth` 只判斷一次,冷快取
   時很容易還沒載完,判斷失敗就永久退回原本教室照片,之後圖真的載完也
   不會重畫。檔案裡其他每一張背景照片(schoolClassroomImg/homeLivingImg/
   tattooShopImg...)都有 `.onload` 主動重畫的慣例,唯獨這兩張漏掉——但
   kc 這次要求「不要用原本的教室圖」沒有給「短暫顯示也算可以接受」的
   空間,比被動重畫更嚴格,所以不是補 onload 就好,是在黑畫面淡出期間
   主動等圖片就緒(`imgReady()`),等到了才畫,畫面出現的當下保證已經是
   新圖。6 秒逾時當安全網,真的載入失敗才會落到下面 `.complete` 判斷的
   fallback。 */
function imgReady(img, timeoutMs = 6000){
  if(img.complete && img.naturalWidth) return Promise.resolve(true);
  return new Promise(resolve => {
    const done = ok => { img.onload = img.onerror = null; resolve(ok); };
    img.onload = () => done(!!img.naturalWidth);
    img.onerror = () => done(false);
    setTimeout(() => done(img.complete && !!img.naturalWidth), timeoutMs);
  });
}

  if(PHONE_BG_IMG.complete && PHONE_BG_IMG.naturalWidth){
    gbg.imageSmoothingEnabled = true;
    gbg.drawImage(PHONE_BG_IMG, 0,0,1280,720);

  gbg.fillStyle = 'rgba(255,255,255,.8)';
  gbg.fillText(`撐過 ${PHONE_GAME.round}/${PHONE_GAME.totalRounds} 輪 —— 警示亮起時按空白鍵`, 24, 690);

function tickPhoneGame(dt){
  if(!PHONE_GAME.active) return;
  if(PHONE_GAME.warning){
    PHONE_GAME.warnT += dt;
    if(PHONE_GAME.warnT > PHONE_REACT_WINDOW){ endPhoneGame(false); return; }
  } else {
    PHONE_GAME.sinceLast += dt;
    if(PHONE_GAME.sinceLast >= PHONE_GAME.nextWarnAt){ PHONE_GAME.warning = true; PHONE_GAME.warnT = 0; }
  }
  paintPhoneBackdrop();
}

const owned = WEAR_ITEMS.filter(w => !w.locked).map(w => w.id);
const equipped = { hat:null, top:null, bottom:null, shoes:null, neck:null, tattoo:null };
/* 角色欄兩側的裝備小圖示(2026-08-19 第二輪)怎麼分左右純粹是排版好看,
 * 沒有特別意義,3/2 只是配平衡,不喜歡可以直接改這兩個陣列。 */

   好看,沒有特別意義,跟這兩個陣列原本的分法一致。 */
const EQUIP_BADGE_LEFT = ['hat','top','bottom'], EQUIP_BADGE_RIGHT = ['shoes','neck','tattoo'];

/* toggleWear() 改成算「這次穿脫的差量」直接 chg(),不是重算一個絕對值
   再跟 ST.cool 做差(舊版 recomputeCool()/COOL_BASE 那套,2026-08-28
   撤掉)——舊版假設「帥潮永遠等於基準值+目前穿搭總和」,只要有外部原因
   (比如下面的撿垃圾弄髒 -1)直接動了 ST.cool,下次隨便穿脫一件衣服,
   舊版重算會把那次外部改動吃掉、悄悄復原。改成差量寫法後,穿脫這個動作
   只影響「這件衣服的量」,不會動到其他來源造成的變化,不再違反
   docs/DESIGN_NOTES.md「五條指標各自管什麼」節但這次是 kc 自己要求
   帥潮多開一個來源(見「必做任務失敗/帥潮/超商制服」節)。同一格換另一件
   (同 slot 但不同 id)算「先脫舊的、再穿新的」兩次差量疊加,不是整個
   重算。 */
function toggleWear(itemId){
  const it = WEAR_ITEMS.find(w => w.id === itemId); if(!it) return;
  const slot = it.slot, prevId = equipped[slot];
  const applyDelta = (item, sign) => {
    chg('cool', item.cool * sign);
    if(item.star) chg('star', item.star * sign);
  };
  if(prevId === itemId){
    /* 拿不下來的裝備(2026-08-28,刺青那件 removable:false)——擋掉脫下
       這個動作,跳提示交代原因,不要靜默失敗讓 kc 以為點擊沒反應。 */
    if(it.removable === false){ toast('這個拿不下來——要去洗掉才行。', 2400); return; }
    equipped[slot] = null;
    applyDelta(it, -1);
  } else {
    if(prevId){ const prevItem = WEAR_ITEMS.find(w => w.id === prevId); if(prevItem) applyDelta(prevItem, -1); }
    equipped[slot] = itemId;
    applyDelta(it, 1);
  }
  renderWearTab();
  syncPanelStats();
}
function renderEquipBadges(){
  const draw = (hostId, slots) => {
    document.getElementById(hostId).innerHTML = slots.map(s => {
      const it = WEAR_ITEMS.find(w => w.id === equipped[s]);
      return `<div class="equipBadge${it ? ' filled' : ''}" title="${WEAR_SLOT_NAME[s]}：${it ? it.name : '沒穿'}">${it ? it.icon : ''}</div>`;
    }).join('');
  };
  draw('equipLeft', EQUIP_BADGE_LEFT);
  draw('equipRight', EQUIP_BADGE_RIGHT);
}
function renderWearTab(){
  const host = document.getElementById('invWearGrid');
  host.innerHTML = '';
  owned.forEach(id => {
    const it = WEAR_ITEMS.find(w => w.id === id); if(!it) return;
    const el = document.createElement('div');
    el.className = 'itemCard' + (equipped[it.slot] === id ? ' on' : '');
    /* 徽章文字(2026-08-28):制服帥潮是負的,原本寫死的 `+${it.cool}` 會
       印成「+-10」——改成正負號自己判斷,順便把風評加成也顯示出來(制服
       是第一件帶 star 的衣物)。
       2026-09-01 補:成績單只有 star、沒有 cool,原本的字串接法在 cool
       是 undefined 時會印出「undefined／風評+10」,改成兩段各自判斷有沒有
       這個欄位再拼,cool-only/star-only/cool+star 三種組合都印得對。 */
    const badgeParts = [];
    if(it.cool != null) badgeParts.push((it.cool>=0?'+':'')+it.cool);
    if(it.star) badgeParts.push(`風評${it.star>=0?'+':''}${it.star}`);
    const badge = badgeParts.join('／');
    el.innerHTML = `<div class="badge">${badge}</div><div class="ic">${it.icon}</div><div class="lb">${it.name}</div>`;
    el.onclick = () => toggleWear(id);
    host.appendChild(el);
  });
  renderEquipBadges();
}

/* 狀態欄(右欄)直接讀現成 ST,跟左上角 HUD 的 syncHUD() 是同一份資料
 * 兩套顯示,不共用 DOM id 所以分開寫,邏輯故意抄一份保持獨立、互不影響。 */
function syncPanelStats(){
  const set = (id, txt, pct) => {
    const pod = document.getElementById(id);
    pod.querySelector('.nm').textContent = txt;
    if(pct != null) pod.querySelector('.track i').style.width = Math.max(0,Math.min(100,pct)) + '%';
  };
  set('pFullP', ST.full, ST.full);
  set('pCalmP', ST.calm, ST.calm);
  set('pCoolP', ST.cool, ST.cool);
  set('pMoodP', ST.mood, ST.mood);
  set('pStaminaP', ST.stamina, ST.stamina);
  /* 過低警示(2026-08-28,見 syncHUD() 那則同名筆記)——五條都套同一個
     門檻(<=10),不是只有飽足有。 */
  ['Full','Calm','Cool','Mood','Stamina'].forEach(n =>
    document.getElementById('p'+n+'P').classList.toggle('low', ST[n.toLowerCase()] <= 10));
  document.getElementById('pMoneyP').textContent = '$' + ST.money;
  set('pStarP', (ST.star > 0 ? '+' : '') + ST.star, null);
  const starI = document.querySelector('#pStarP .track i');
  const starHalf = Math.abs(ST.star) / 2;
  starI.className = ST.star >= 0 ? 'good' : 'bad';
  starI.style.width = starHalf + '%';
  starI.style.left = (ST.star >= 0 ? 50 : 50 - starHalf) + '%';
}

/* 物品分頁的卡片點了要在下面 #itemDetail 顯示說明,照參考截圖「選中格子

 * 不一樣,呼叫端各自組好字串傳進來,這個函式只管顯示 + 切 .on 這個 class。 */

}
function openInventory(){
  busy = true;
  const fHost = document.getElementById('invFood');
  fHost.innerHTML = '';
  if(FOOD.length === 0) fHost.innerHTML = '<div class="invEmpty">包包裡沒有吃的。</div>';
  FOOD.forEach(item => {
    const el = document.createElement('div');
    el.className = 'itemCard';
    el.innerHTML = `<div class="ic">${item.icon}</div><div class="lb">${item.name}</div>`;
    el.onclick = () => {
      fHost.querySelectorAll('.itemCard').forEach(c => c.classList.remove('on'));
      el.classList.add('on');
      const parts = [];
      if(item.feed) parts.push('飽足 +' + item.feed);
      if(item.mood) parts.push('情緒 ' + (item.mood > 0 ? '+' : '') + item.mood);
      document.getElementById('itemDetail').innerHTML =
        `${item.name}<br>${parts.join('　')}<br><button id="eatBtn">吃掉</button>`;
      document.getElementById('eatBtn').onclick = () => eatFood(item.id);
    };
    fHost.appendChild(el);
  });
  document.getElementById('itemDetail').innerHTML = '';
  const qHost = document.getElementById('invQuests');
  qHost.innerHTML = '';
  let anyDoc = false;
  if(TUITION_QUEST && !TUITION_QUEST.paid){
    anyDoc = true;
    /* 2026-08-21 kc:「有明確繳交期限」——原本只顯示「還剩幾天」,補上真的
       日期(dayToDate()),「還剩幾天」留著當補充,不是取代——兩個一起看
       比較直覺(截止日 9/30、還剩幾天)。 */
    const left = TUITION_QUEST.dueDay - day;
    const detail = `註冊單：<span class="amt">$${TUITION_QUEST.amount}</span> 還沒繳<br>` +
      `截止日：${dayToDate(TUITION_QUEST.dueDay)}<br>` +
      (left > 0 ? `還剩 ${left} 天` : `已經過期 ${-left} 天`);
    const el = document.createElement('div');
    el.className = 'itemCard';
    el.innerHTML = `<div class="ic">🧾</div><div class="lb">註冊單</div>`;
    el.onclick = () => showItemDetail(el, qHost, detail);
    qHost.appendChild(el);
  }
  /* 機車分期收據(2026-08-21,kc:「做成物品、收據之類的」)——跟註冊單同一
     格式(itemCard+showItemDetail),放進同一個「文件」分頁,不是另開分頁。
     這裡原本是 if/else 互斥(有註冊單就不顯示空清單提示,沒有就顯示),兩張
     文件現在可能同時存在,改用 anyDoc 累加旗標判斷,跟下面知識分頁的
     anyKnowledge 同一招。 */
  if(MOTO_LOAN.active){
    anyDoc = true;
    const detail = `機車行分期收據:尾款還欠 <span class="amt">$${MOTO_LOAN.balance}</span><br>` +
      `每週扣款:$${MOTO_LOAN.weekly}<br>` +
      `下次扣款:${dayToDate(MOTO_LOAN.nextDueDay)}(回家睡覺自動扣)`;
    const el = document.createElement('div');
    el.className = 'itemCard';
    el.innerHTML = `<div class="ic">🧾</div><div class="lb">機車分期</div>`;
    el.onclick = () => showItemDetail(el, qHost, detail);
    qHost.appendChild(el);
  }
  if(!anyDoc) qHost.innerHTML = '<div class="invEmpty">沒有需要保留的文件。</div>';
  /* 知識(2026-08-19,kc:「為何沒加入物品欄」):KNOWLEDGE 三個等級只要
     count>0 就各開一格,跟標籤/文件同一套 itemCard+showItemDetail 模式。
     count 用 .badge 那個右上角小標籤顯示(跟穿搭分頁「+3 帥潮」那個徽章
     同一個元件),不要塞進 .lb 名字裡變成「略懂書本內容 ×3」那種長標籤。 */
  const kHost = document.getElementById('invKnowledge');
  kHost.innerHTML = '';
  const K_ENTRIES = [
    ['small',   '少少的知識', '📎', '讀書一點一點累積的碎片知識。<br>湊滿 10 個會自動拼成一份「略懂書本內容」。'],
    ['rough',   '略懂書本內容', '📘', '對書的內容有點概念了。<br>湊到 5 份可以在書桌換成「精通知識」。'],
    ['mastery', '精通知識', '🎓', '真的搞懂了。<br>期中考用得到(考試機制還沒做)。']
  ];
  let anyKnowledge = false;
  K_ENTRIES.forEach(([key, name, icon, detail]) => {
    if(!KNOWLEDGE[key]) return;
    anyKnowledge = true;
    const el = document.createElement('div');
    el.className = 'itemCard';
    el.innerHTML = `<div class="badge">×${KNOWLEDGE[key]}</div><div class="ic">${icon}</div><div class="lb">${name}</div>`;
    el.onclick = () => showItemDetail(el, kHost, detail);
    kHost.appendChild(el);
  });
  if(!anyKnowledge) kHost.innerHTML = '<div class="invEmpty">還沒有累積任何知識。</div>';
  renderTrashTab();
  renderWearTab();
  syncPanelStats();
  invOverlay.classList.add('on');
}
/* 雜物分頁(2026-08-21,kc:day3 硬碰硬那個選項要給塑膠項鍊)——這個分頁
   原本只是靜態「沒有雜物。」,沒有真的資料,第一件真的塞進來的雜物就是
   這條項鍊。跟標籤/文件/知識同一套 itemCard+showItemDetail 模式,`TRASH`
   是純陣列,`item.trashItem`(見 applyStoryChoice())push 進去。
   2026-09-01,kc 糾正成績單放錯分頁:「雜物的敘述可以講成績單可裝備,
   有點像是拿給別人看的感覺,所以是可以自由決定」——雜物裡帶 `star` 欄位
   的項目(目前只有成績單)是可以自由開關的「秀給別人看」道具,不是進來
   就永久生效:`t.active` 記目前有沒有帶出來秀,點卡片切換,跟穿搭系統
   `toggleWear()` 同一招「切換那瞬間的差量」寫法,不是重算絕對值。拆成
   獨立函式(不再是 openInventory() 裡面那段),因為切換要能重畫這個分頁
   本身,不能只靠 openInventory() 開分頁那一次性的畫。 */
function renderTrashTab(){
  const tHost = document.getElementById('invTrash');
  tHost.innerHTML = '';
  if(TRASH.length === 0) tHost.innerHTML = '<div class="invEmpty">沒有雜物。</div>';
  TRASH.forEach(t => {
    const togglable = t.star != null;
    const el = document.createElement('div');
    el.className = 'itemCard' + (togglable && t.active ? ' on' : '');
    const badge = togglable ? `<div class="badge">${t.active ? '帶著' : '收著'}</div>` : '';
    el.innerHTML = `${badge}<div class="ic">${t.icon}</div><div class="lb">${t.name}</div>`;
    el.onclick = () => {
      if(togglable){
        t.active = !t.active;
        chg('star', t.active ? t.star : -t.star);
        /* renderTrashTab() 整個分頁重畫(卡片的 .on/badge 狀態靠重畫本身
           就對了),`el` 這個舊節點重畫後已經離開 DOM,不用再靠它找卡片
           高亮,detail 面板是共用的獨立元素,直接寫就好,不用走
           showItemDetail() 那套「先清 host 裡所有卡片的 .on 再點亮這張」
           的邏輯(對 togglable 卡片來說多餘)。 */
        renderTrashTab();
        syncPanelStats();
        document.getElementById('itemDetail').innerHTML = t.detail +
          `<br><br>${t.active ? `帶出來秀了，風評 +${t.star} 生效中。` : '收起來了，這張的風評加成先不算。'}`;
        return;
      }
      showItemDetail(el, tHost, t.detail);
    };
    tHost.appendChild(el);
  });
}

const fmtTime = m => String((m/60|0)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
function syncHUD(){
  set('pMoney', '$' + ST.money, null);
  /* 上限被墊高之後(見上面 ST_MAX 那則筆記)血條寬度要除以「當前上限」
     算百分比,不能再直接拿數值當百分比——不然體力上限被算命道具加高後,
     沒滿的時候血條會看起來比實際還空(110/120 直接當 110% 會被下面的
     set() 夾回 100%,看起來一直是滿的,量不出還差多少)。 */
  set('pFull', ST.full, ST.full/ST_MAX.full*100);
  set('pStamina', ST.stamina, ST.stamina/ST_MAX.stamina*100);
  set('pCalm', ST.calm, ST.calm/ST_MAX.calm*100);
  set('pCool', ST.cool, ST.cool/ST_MAX.cool*100);
  set('pMood', ST.mood, ST.mood/ST_MAX.mood*100);
  /* 過低警示(2026-08-28,kc:「各項數值除了風評低於10會顯示提示過低」)——
     原本只有飽足有這個紅框閃爍(門檻 25),這輪統一成五條都有、門檻改
     10,跟 chg() 裡「歸零直接遊戲失敗」用同一個門檻家族(10 是警示,
     0 是死線),見 GAME_OVER_TEXT 那則筆記。 */
  ['full','calm','cool','mood','stamina'].forEach(k =>
    document.getElementById('p'+k[0].toUpperCase()+k.slice(1)).classList.toggle('low', ST[k] <= 10));
  set('pStar', (ST.star > 0 ? '+' : '') + ST.star, null);
  const starI = document.querySelector('#pStar .track i');
  const starHalf = Math.abs(ST.star) / 2;                // -100~100 對應 track 半邊 0~50%
  starI.className = ST.star >= 0 ? 'good' : 'bad';
  starI.style.width = starHalf + '%';
  starI.style.left = (ST.star >= 0 ? 50 : 50 - starHalf) + '%';
  document.querySelector('#clock .t').textContent = fmtTime(minute);
  /* 2026-08-21:這格原本是寫死的「週三」。同一天 kc 自己也在改這一行
     (把它接成 `'週'+DAYS[day%7]` 那個算式),跟我這輪加的 `dayToDate()`
     撞在同一個 `.d` 元素上——兩個都對,不是二選一,合併成一行(日期＋
     星期),不要留兩條互相蓋掉的寫入。 */
  document.querySelector('#clock .d').textContent = dayToDate(day) + ' 週' + DAYS[day%7];
  function set(id, txt, pct){
    const pod = document.getElementById(id);
    pod.querySelector('.nm').textContent = txt;
    if(pct != null) pod.querySelector('.track i').style.width = Math.max(0,Math.min(100,pct)) + '%';
  }
}
const COLOR = { money:'#f2d888', full:'#c9bb44', calm:'#6fc3b4', cool:'#d05fa0', mood:'#f2b25c', stamina:'#6fc98a' };
const NAMES = { money:'', full:'飽足', calm:'歸屬感', cool:'帥潮', mood:'情緒', stamina:'體力', star:'風評' };
/* 扣體力換算成經過的時間(2026-09-02,kc:「扣體力的時候也要等比例增加
 * 時間,比較有過完今天的感覺」)——比例是我自己抓的,沒跟 kc 對過確切
 * 數字,不喜歡再調。5 分鐘/點,對齊「上班一整輪(−40 體力)大概 3 小時」
 * 這句舊 comment 原本就有的敘事量級(40×5=200 分鐘≈3.3 小時)。 */
const STAMINA_MINUTES = 5;
function chg(k, d){
  if(!d) return;
  if(gameOver) return;   // 遊戲結束後所有指標凍結,不用逐一擋每個呼叫端
  const before = ST[k];
  ST[k] += d;
  /* 風評(star)2026-08-14 從 0~5(通緝星星)改成雙向 -100~+100,見
     docs/DESIGN_NOTES.md「通緝改名風評」——中間 0,左邊壞事、右邊好事,
     不再只往一個方向長。其餘指標維持原本 0~100。 */
  if(k === 'star') ST[k] = Math.max(-100, Math.min(100, ST[k]));
  else if(k !== 'money') ST[k] = Math.max(0, Math.min(ST_MAX[k] ?? 100, ST[k]));
  /* 過低警示 + 歸零失敗(2026-08-28,kc:「各項數值除了風評低於10會顯示
     提示過低,如果0會遊戲直接失敗」)——星星/金錢排除在外,理由見
     GAME_OVER_TEXT 那則筆記。警示只在「剛跌破 10」那一刻跳一次(用
     before 判斷邊界,不是每次低於 10 的 chg() 都跳,不然會洗版),歸零
     則不管跌破幾次都會觸發,但 triggerGameOver() 自己擋了重複呼叫。 */
  if(k !== 'star' && k !== 'money'){
    if(ST[k] <= 0) triggerGameOver(k);
    else if(before > 10 && ST[k] <= 10) toast(`${NAMES[k]}太低了，再這樣下去會撐不住。`, 3000);
  }
  /* 扣體力同步扣飽足感(2026-08-28,kc:「扣體力的事情會同步扣飽足感」,
     理由是遊戲目前沒誘因逼你回家/找東西吃)。只在真的「扣」(d<0)才連動,
     睡覺回滿體力(sleep() 那筆 d>0)不算,不然睡一覺會把飽足感也順便補滿,
     變成免費吃飯。比例先抓 1:1(扣多少體力就扣多少飽足),沒跟 kc 對過
     確切數字,不喜歡再調。 */
  if(k === 'stamina' && d < 0) chg('full', d);
  /* 上面「扣飽足」那條的同一天新增(2026-09-02)——單一入口保證全專案
     任何扣體力的地方都自動吃到經過時間,不用每個呼叫端各自補
     advanceTime()。sleep() 補滿體力(d>0)不算,不然睡一覺會把時間也
     往前推。這條之前有幾個呼叫端自己手動配了 advanceTime(),已經拔掉
     避免重複算(讀書/上課/偷滑手機/巷子付錢跟走那四處),不要看到舊
     commit 又補回去。 */
  if(k === 'stamina' && d < 0) advanceTime(-d * STAMINA_MINUTES);
  /* 體力低於 50 又還沒去學校的提醒,見上面 schoolRemindedDay 那則筆記。
     跳在數值飄字之後沒有先後順序上的講究,只是程式碼寫在這裡比較順——
     兩個都是這次 chg() 呼叫的副作用,誰先跳不影響觀感。 */
  if(k === 'stamina' && ST.stamina < 50 && lastSchoolDay !== day && schoolRemindedDay !== day){
    schoolRemindedDay = day;
    toast('你想到，你今天還沒去學校。', 3000);
  }
  syncHUD();
  const el = document.getElementById({money:'pMoney',full:'pFull',calm:'pCalm',cool:'pCool',mood:'pMood',stamina:'pStamina',star:'pStar'}[k]);
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  const f = document.createElement('div');
  f.className = 'fl';
  /* 風評雙向,飄字顏色跟著這次變動的方向走(綠=好事、紅=壞事),不是固定
     一個顏色——固定紅色會讓「+風評」看起來也像壞事。其餘指標維持單一顏色。 */
  f.style.color = k === 'star' ? (d > 0 ? '#6fc98a' : '#e0483a') : COLOR[k];
  f.style.left = (el.offsetLeft+8)+'px'; f.style.top = (el.offsetTop+el.offsetHeight+4)+'px';
  f.textContent = (NAMES[k] + ' ' + (d>0?'+':'') + (k==='money'?'$'+d:d)).trim();
  document.getElementById('float').appendChild(f);
  setTimeout(() => f.remove(), 1500);
}
const toastEl = document.getElementById('toast');
function toast(txt, ms){
  toastEl.textContent = txt; toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('on'), ms || 2800);
}
function advanceTime(min){
  minute += min;
  while(minute >= 24*60){ minute -= 24*60; day++; }
  syncHUD();
}

/* 街頭藝人的歌聲(見上面 BUSKER_POS 那段註解)。<audio> 一定要在使用者
   互動(keydown)裡才准 play(),不能頁面一載入就開——瀏覽器的 autoplay
   政策會直接擋掉,靜音也不報錯,踩了會覺得「明明寫了怎麼沒聲音」,先在這裡
   說清楚。startBuskerAudio() 只會真的跑一次(靠 buskerAudioEl 判斷有沒有
   建過),之後每次 keydown 呼叫都是白工但無害。
   2026-08-31 換成真人錄音(kc 用 Suno 寫的容身,見 lib/rhythm-troupe.js
   那段筆記):原本是純 Web Audio 合成五聲音階佔位唱腔,現在直接播放
   容身整首 mp3,loop 整首——街頭藝人是背景氣氛,聽整首比較自然,**故意
   寫死 `assets/audio/rongshen.mp3` 這條路徑,不是讀
   `RhythmTroupe.SONGS.rongshen.src`**:那個路徑 2026-08-31 第五輪改成
   只給音遊用的 20 秒剪好片段(`rongshen-clip.mp3`,見那則筆記為什麼
   要剪段),街頭藝人跟音遊用的是同一首歌但不同檔案,共用同一個變數會
   把街頭藝人的歌聲也跟著剪短。 */
let buskerAudioEl = null;
function startBuskerAudio(){
  if(buskerAudioEl) { buskerAudioEl.play().catch(()=>{}); return; }
  buskerAudioEl = new Audio('../assets/audio/rongshen.mp3');
  buskerAudioEl.loop = true;
  buskerAudioEl.volume = 0;
  buskerAudioEl.play().catch(()=>{});
}
/* 靠近淡入、走遠淡出——20 單位外完全聽不到,站在他面前(距離 0)音量封頂
   在 .55,不是開到最大聲,街頭藝人不該蓋過其他環境音。updateCity() 每幀
   呼叫,數字沒特別校過,kc 覺得聽起來範圍不對再調。 */
function updateBuskerAudio(px, pz){
  if(!buskerAudioEl) return;
  const d = Math.hypot(px-BUSKER_POS.x, pz-BUSKER_POS.z);
  buskerAudioEl.volume = Math.max(0, 1 - d/20) * .55;
}

/* 走路提示線(2026-08-31,kc:「走路要有提示線」)——單靠螢幕上那顆

   感比單一個文字標籤更直覺。

   平台(含這個專案在跑的桌面 Chrome)會直接忽略 LineBasicMaterial 的
   `linewidth`,細線永遠只有 1px,再加上截圖 JPEG 壓縮,貼在暗色路面上
   等於沒有。改用一條會跟著長度/角度即時變形的扁平色帶(PlaneGeometry
   + MeshBasicMaterial,不受光照影響,永遠亮),寬度用真的世界座標(0.5
   個單位)撐出來,不是線寬那種平台不保證的東西。旋轉用 atan2 對齊兩點

   碰撞判定用的 .15 再低一點,避免蓋住玩家腳,但要夠高不會被地面
   z-fighting 吃掉)。顏色跟 `.wlabel` 那個金色系(#d8b24a)呼應,同一套
   「巡邏系提示」視覺語言。
   2026-08-31 第二輪,kc:「效果對了但你的線怎這麼醜」——第一版是純色實心
   長方形+關掉深度測試,兩個問題疊在一起:①一整條粗色塊,看起來像貼歪
   的色紙,不像遊戲會出現的導航提示;②depthTest:false 讓它不管前面有沒有
   建築物都畫在最上層,穿透感很怪,不像真的貼在地上的東西。這輪改用
   canvas 現畫一張「箭頭往前流動」的重複貼圖(不是純色),寬度收窄到
   0.28、加 AdditiveBlending 讓它像會發光的導引箭頭,並且**恢復
   depthTest:true**(靠 Y 墊高到 .12、renderOrder 適度拉高,不是完全關掉
   深度測試那種暴力解法)。貼圖 repeat.x 跟著 dist 縮放,不管線多長,
   箭頭圖案大小都固定,不會被拉伸變形;offset.x 每幀往前推一點,箭頭會
   有「往目的地流動」的動態感,比死板的靜態貼圖更看得出方向。 */
const PATROL_ARROW_TEX = (() => {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 16;
  const cx = c.getContext('2d');
  cx.clearRect(0, 0, 64, 16);
  cx.fillStyle = '#f2d888';
  cx.beginPath();
  cx.moveTo(4, 3); cx.lineTo(24, 8); cx.lineTo(4, 13); cx.lineTo(10, 8);
  cx.closePath(); cx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.needsUpdate = true;
  return tex;
})();
const PATROL_LINE_GEOM = new THREE.PlaneGeometry(1, .28);
const PATROL_LINE_MAT = new THREE.MeshBasicMaterial({
  map:PATROL_ARROW_TEX, color:0xd8b24a, transparent:true, opacity:.9,
  side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending
});
const patrolLine = new THREE.Mesh(PATROL_LINE_GEOM, PATROL_LINE_MAT);
patrolLine.rotation.x = -Math.PI/2;   // PlaneGeometry 預設立在 XY 面,轉平躺到地面(XZ 面)
patrolLine.visible = false;
patrolLine.frustumCulled = false;
patrolLine.renderOrder = 5;   // 有測深度(depthTest 沒關),但地面/道路那類貼地 mesh 常常也是 y≈0,同一個深度值誰先畫誰蓋過誰不保證,拉高一點 render order 避免被地面貼圖搶著畫
scene.add(patrolLine);
function updatePatrolMarker(dt){
  if(!MOTO_IMPOUND.patrolActive || MOTO_IMPOUND.patrolVisited >= MOTO_PATROL_POINTS.length){
    patrolMarkerEl.style.display = 'none';
    patrolLine.visible = false;
    return;
  }
  const [px, pz] = MOTO_PATROL_POINTS[MOTO_IMPOUND.patrolVisited];
  _patrolV.set(px, 2.4, pz).project(camera);
  if(_patrolV.z > 1 || _patrolV.z < -1) patrolMarkerEl.style.display = 'none';
  else {
    patrolMarkerEl.style.display = '';
    patrolMarkerEl.style.left = ((_patrolV.x*.5+.5) * innerWidth) + 'px';
    patrolMarkerEl.style.top  = ((1-(_patrolV.y*.5+.5)) * innerHeight) + 'px';
  }
  const heroPos = hero.group.position;
  const dx = px - heroPos.x, dz = pz - heroPos.z;
  const dist = Math.hypot(dx, dz);
  patrolLine.position.set((heroPos.x+px)/2, .12, (heroPos.z+pz)/2);
  patrolLine.rotation.z = -Math.atan2(dz, dx);
  patrolLine.scale.set(dist, 1, 1);
  patrolLine.visible = dist > .5;   // 太近(幾乎踩在點上)就不畫,避免縮成一個點還在那閃
  PATROL_ARROW_TEX.repeat.x = dist / 1.6;   // 箭頭圖案固定約 1.6 個世界單位一組,不管線多長都不會被拉伸
  PATROL_ARROW_TEX.offset.x = (PATROL_ARROW_TEX.offset.x + (dt||16)*.0012) % 1;   // 往前流動的動態感
}

   「接下來要做、之後回報」的任務都要進同一個面板,阿成的撿垃圾任務是
   第一個補進去的例子。picked/need 有進度,面板文字要跟著即時更新
   (不像算命攤那組只有「去/回去」兩種狀態),taskDone 之後改顯示「回去
   跟阿成說一聲」。呼叫時機:接下委託(talkToAcheng() active=true 那個
   分支)/每撿一件垃圾(interactProp() 撿垃圾那段)/回報拿獎勵
   (talkToAcheng() done=true 那個分支)三處都呼叫,不用自己複製貼上
   push/移除邏輯。 */
function syncLitterQuestPanel(){
  const q = ACHENG.litterQuest;
  const idx = ACTIVE_QUESTS.findIndex(x => x.id === 'acheng-litter');
  if(!q.active || q.done){ if(idx >= 0) ACTIVE_QUESTS.splice(idx, 1); renderQuestPanel(); return; }
  const hint = q.taskDone ? '回去跟阿成說一聲' : `撿廟口垃圾（${q.picked}/${q.need}）`;
  if(idx >= 0) ACTIVE_QUESTS[idx].hint = hint;
  else ACTIVE_QUESTS.push({ id:'acheng-litter', title:'阿成的委託', hint });
  renderQuestPanel();
}

/* 回傳值(2026-09-02 第八輪,kc:「對話不了欸」——原本沒有手動互動入口,
   純靠自動觸發,但沒進度可推的時候玩家走過去按空白鍵完全沒反應,像壞掉。
   補一個回傳值,讓下面新的 talkToFat() 知道這次呼叫有沒有真的推進劇情,
   沒有的話才退回 npc-temple.js 本來就寫好、一直沒接的 talk[] 閒聊池。 */
function checkFatArc(){
  if(FAT.gone) return false;
  /* 班費失竊・小胖給提示(2026-09-02,見上面 CLASSFUND 那則長筆記)——
     排在他自己那條連續劇情最前面,不用等 YUAN.visits/hasTattoo 那些

     askBeats/woundBeats 共用同一套 playBeats+toast 語感,但這條不是
     里程碑劇情,不用 playBeats() 疊好幾句,一句 say() 帶過就好。 */
  if(CLASSFUND.foundEvidence && !CLASSFUND.toldByFat){
    CLASSFUND.toldByFat = true;
    const idx = ACTIVE_QUESTS.findIndex(x => x.id === 'classfund');
    if(idx >= 0) ACTIVE_QUESTS[idx].hint = '去刺青店問問師傅';
    renderQuestPanel();
    say('fat', '「你想知道齁？」他湊過來看了一眼收據。「師傅之前有來拜拜過，你去問他啊。」', () => {
      toast('小胖指了指刺青店的方向。', 2600);
    });
    return true;
  }
  if(!FAT.seenAsk && YUAN.visits >= 1){
    FAT.seenAsk = true;
    playBeats(FAT_DATA.askBeats, 0, () => {
      chg('calm', FAT_DATA.askCalm);
      toast(FAT_DATA.askQuiet, 3000);
    });
    return true;
  }
  if(FAT.seenAsk && !FAT.seenWound && YUAN.hasTattoo){
    FAT.seenWound = true;
    FAT.questActive = true; FAT.questStartDay = day;
    ACTIVE_QUESTS.push({ id:'fat-wound', title:'小胖的傷口', hint:'去超商買消毒藥水給他' });
    renderQuestPanel();
    playBeats(FAT_DATA.woundBeats, 0, () => { toast(FAT_DATA.woundQuiet, 3200); });
    return true;
  }
  if(FAT.questActive && FAT.hasMedicine){
    FAT.resolved = true; FAT.questActive = false;
    const idx = ACTIVE_QUESTS.findIndex(x => x.id === 'fat-wound');
    if(idx >= 0) ACTIVE_QUESTS.splice(idx, 1);
    renderQuestPanel();
    playBeats(FAT_DATA.resolvedBeats, 0, () => {
      chg('calm', FAT_DATA.resolvedCalm); chg('cool', FAT_DATA.resolvedCool);
      toast(FAT_DATA.resolvedQuiet, 3000);
    });
    return true;
  }
  if(FAT.questActive && !FAT.reminded && day >= FAT.questStartDay + 5){
    FAT.reminded = true;
    playBeats(FAT_DATA.reminderBeats, 0, () => {});
    return true;
  }
  if(FAT.questActive && day >= FAT.questStartDay + 10){
    FAT.gone = true; FAT.questActive = false;
    const idx = ACTIVE_QUESTS.findIndex(x => x.id === 'fat-wound');
    if(idx >= 0) ACTIVE_QUESTS.splice(idx, 1);
    renderQuestPanel();
    toast(FAT_DATA.goneLine, 3600);
    return true;
  }
  return false;
}

/* 三條的任務面板統一走這個函式(2026-08-31)——跟阿正月長線那個
   syncBrotherArcPanel() 是平行的兩套,不合併是因為觸發時機不同:月長線

   但 ID_CARD 的「還要等 N 天」倒數會被裸放著不刷新,所以還是把它排進
   updateCity() 每幀跑(見下面 updateCity() 呼叫處),cheap operation 不用
   省。 */
function syncMiscQuestPanel(){
  let idx = ACTIVE_QUESTS.findIndex(x => x.id === 'moto-impound');
  if(MOTO_IMPOUND.active){
    const hint = MOTO_IMPOUND.patrolActive
      ? (MOTO_IMPOUND.patrolVisited >= MOTO_PATROL_POINTS.length
          ? '巡邏完了，回警局跟阿正報到'
          : `沿西園街巡邏中，往廟口方向（${MOTO_IMPOUND.patrolVisited}/${MOTO_PATROL_POINTS.length}）`)
      : `去警局跟阿正繳罰款贖車（$${MOTO_IMPOUND.fine}），或幫忙巡邏抵`;
    if(idx >= 0) ACTIVE_QUESTS[idx].hint = hint; else ACTIVE_QUESTS.push({ id:'moto-impound', title:'贖車', hint });
  } else if(idx >= 0) ACTIVE_QUESTS.splice(idx, 1);

  idx = ACTIVE_QUESTS.findIndex(x => x.id === 'id-card');
  if(ID_CARD_QUEST.active){
    const hint = ID_CARD_QUEST.requestedDay < 0
      ? '去警局跟阿正申請良民證（$200）'
      : (day < ID_CARD_QUEST.readyDay ? `良民證還在辦，還要等${ID_CARD_QUEST.readyDay - day}天`
         : (ST.star < -10 ? '良民證辦好了，但風評太差阿正不肯發（風評要到 -10 以上）' : '良民證好了，去警局跟阿正拿'));
    if(idx >= 0) ACTIVE_QUESTS[idx].hint = hint; else ACTIVE_QUESTS.push({ id:'id-card', title:'辦良民證', hint });
  } else if(idx >= 0) ACTIVE_QUESTS.splice(idx, 1);

  idx = ACTIVE_QUESTS.findIndex(x => x.id === 'snitch');
  if(SNITCH_QUEST.active){
    const hint = `一週內決定：跟阿正報、或去警告阿源（還有${Math.max(0, SNITCH_QUEST.startDay+7-day)}天，不選也沒關係）`;
    if(idx >= 0) ACTIVE_QUESTS[idx].hint = hint; else ACTIVE_QUESTS.push({ id:'snitch', title:'贓物協尋', hint });
  } else if(idx >= 0) ACTIVE_QUESTS.splice(idx, 1);

  /* 阿霞(2026-09-01,kc:「那任務匡呢 我要來解這個任務」)——沒有獨立的
     .active 旗標(不像上面幾個要先滿足某個門檻才「接到」),她本來就站在
     永安公車站,任何時候都能去找她,所以「還沒解決」直接當「進行中」。 */

  if(!AXIA.resolved){

      : ridingMoto ? '騎車經過永安公車站，載阿霞去中華路'
      : '去永安公車站找阿霞——給她計程車錢，或有機車的話載她去中華路';
    if(idx >= 0) ACTIVE_QUESTS[idx].hint = hint; else ACTIVE_QUESTS.push({ id:'axia', title:'阿霞等公車', hint });
  } else if(idx >= 0) ACTIVE_QUESTS.splice(idx, 1);

  renderQuestPanel();
}

(function attachGuitar(){
  const model = buskerNPC.group.children[0];
  if(!model){ requestAnimationFrame(attachGuitar); return; }
  const wood = new THREE.MeshStandardMaterial({ color:0x8a5a32, roughness:.7 });
  const dark = new THREE.MeshStandardMaterial({ color:0x2a1c12, roughness:.6 });
  const guitar = new THREE.Group();
  /* 吉他身:兩個疊起來的扁圓柱湊出「腰身」輪廓(上半窄、下半寬,不是一顆
     正圓餅乾),琴頸是一根細長方柱斜插出去。**第一版尺寸抓太大**——套上去
     整顆像抱了個南瓜/盾牌貼在背後,截圖核對才發現(見 DESIGN_NOTES),
     這版尺寸砍半重抓,肉眼比對跟角色肩寬同一個量級才收。 */
  const bodyLower = new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.05,16), wood);
  bodyLower.rotation.x = Math.PI/2; bodyLower.position.set(0,-.12,0);
  const bodyUpper = new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.05,16), wood);
  bodyUpper.rotation.x = Math.PI/2; bodyUpper.position.set(0,.08,0);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(.03,.42,.015), dark);
  neck.position.set(0,.38,.01); neck.rotation.z = .08;
  guitar.add(bodyLower, bodyUpper, neck);
  /* 斜背在胸前(2026-08-20 kc:「手上要拿吉他」的簡化版——見上面長註解,
     這個 rig 沒有手部骨骼可以真的握,斜揹的角度從正面看很像雙手扶著
     琴身彈唱,是折衷,不是偷懶漏做)。offset 貼緊軀幹(z 只推 .12,不是

/* success=true(玩家有看到、回去跟阿源講到)/false(小美哥先走到門口)
   兩邊都收尾同一套:分身 NPC 移除、小美哥固定站位那具恢復顯示、
   WATCHJOB 狀態歸零(lastDay 卡住同一天不會再被邀約第二次)。 */
function resolveWatchJob(success){
  if(WATCHJOB.resolved) return;
  WATCHJOB.resolved = true; WATCHJOB.active = false; WATCHJOB.lastDay = day;
  scene.remove(WATCHJOB.walker.group);
  const idx = NPCS.indexOf(WATCHJOB.walker);
  if(idx >= 0) NPCS.splice(idx, 1);
  WATCHJOB.walker = null;
  brotherNPC.group.visible = true;
  { const idx = ACTIVE_QUESTS.findIndex(x => x.id === 'watchjob'); if(idx >= 0) ACTIVE_QUESTS.splice(idx, 1); }
  renderQuestPanel();
  const D = success ? NpcTemple.WATCH_JOB.success : NpcTemple.WATCH_JOB.fail;
  playBeats(D.beats, 0, () => {
    if(success){ chg('money', 1000); chg('calm', 6); chg('mood', 8); }
    else { chg('money', -300); chg('calm', -6); chg('mood', -8); }
    toast(D.quiet, 3200);
  });
}

   調整」)——跟 tweakDadPanel() 同一招,即時改、不用重整頁。轉角度存在

   animate() 裡 targetY/baseRotationY 那段,偶爾轉向玩家 + 原地重心晃動)
   每一幀都會把 model.rotation.y 算回 baseRotationY 附近,外部直接改
   model.rotation.y 只撐得過一幀就被蓋掉,肉眼看起來像完全沒反應,不是
   事件沒觸發(STATUE_PED_TWEAK 的數字其實有在變,只是畫面沒跟著動)。
   改用 buildNPC() 已經有現成的 setFacing(angle)(收銀小遊戲排隊客人
   「輪到就轉向玩家」在用同一個 API,scene-city3d.js 那邊有找到),它改的
   是 baseRotationY 本尊,動畫邏輯下一幀就會用新角度收斂過去,才是真的
   会生效的寫法。 */
function tweakStatuePedsPanel(){
  const old = document.getElementById('statuePedTweakPanel');
  if(old){ old.remove(); return; }
  const panel = document.createElement('div');
  panel.id = 'statuePedTweakPanel';
  panel.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;background:#1b202bee;color:#eee;padding:12px 14px;border-radius:8px;font:12px/1.6 sans-serif;width:220px;box-shadow:0 4px 20px #000a';
  const rows = [['aDeg','路人 A(說她生平那位)', STATUE_PED_A], ['bDeg','路人 B(說她媽媽那位)', STATUE_PED_B]];
  panel.innerHTML = '<div style="font-weight:bold;margin:0 0 6px">圓環路人朝向(度)</div>' +
    rows.map(([key,label]) =>
      `<div style="margin-bottom:8px">${label}: <span id="tweak_sp_${key}_v">${STATUE_PED_TWEAK[key]}</span><br>
       <input type="range" id="tweak_sp_${key}" min="0" max="360" step="1" value="${STATUE_PED_TWEAK[key]}" style="width:100%">
       </div>`
    ).join('') + '<div style="margin-top:4px;opacity:.7">關掉:再打一次 __dbg.tweakStatuePeds()</div>';
  document.body.appendChild(panel);
  rows.forEach(([key,,npc]) => {
    const input = document.getElementById(`tweak_sp_${key}`);
    const out = document.getElementById(`tweak_sp_${key}_v`);
    input.addEventListener('input', () => {
      STATUE_PED_TWEAK[key] = +input.value;
      out.textContent = input.value;
      npc.setFacing(STATUE_PED_TWEAK[key]*Math.PI/180);
    });
  });
}

    ['ck_w','寬度(w)', 40, 400, 1, 'w'],
    ['ck_h','高度(h)', 40, 400, 1, 'h'],

    ['ck_y','垂直位置(y)', 0, 400, 1, 'y'],

  ];

  panel.id = 'clerkTweakPanel';
  panel.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;background:#1b202bee;color:#eee;padding:12px 14px;border-radius:8px;font:12px/1.6 sans-serif;width:230px;box-shadow:0 4px 20px #000a';
  panel.innerHTML =
    '<div style="font-weight:bold;margin-bottom:6px">店員定位滑桿</div>' +
    rows.map(([id,label,min,max,step,key]) =>
      `<div style="margin-bottom:8px">${label}: <span id="${id}_v">${CLERK_TWEAK[key]}</span><br>
       <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${CLERK_TWEAK[key]}" style="width:100%"></div>`
    ).join('') +
    '<div style="margin-top:4px;opacity:.7">關掉:再打一次 __dbg.tweakClerk()<br>拉到滿意後跟我說最終數字就好</div>';
  document.body.appendChild(panel);

}

/* 教室疊圖的亮度/色版滑桿(2026-08-25,見上面 MEI_DESK_TWEAK 那則筆記)——

   增益(單獨調 R/G/B)內建濾鏡沒有對應函式,借一個 inline SVG
   feColorMatrix(對角矩陣,只縮放 R/G/B,不動 A)用 data URI 當
   `url(...)` 濾鏡接上去——不用真的建立 DOM 裡的 <svg>,字串現串現丟給
   `ctx.filter` 瀏覽器就會解析。tweak 物件的 r/g/b/brightness 都是
   百分比,100 = 原圖不變。
   兩個坑,都是本機用假 canvas 現場測出來的,不是查文件查到的:
   1) data URI 不能寫 `image/svg+xml;utf8,`——`utf8` 不是合法的 MIME
      參數格式(應該是 `;charset=utf-8` 或乾脆不寫),寫了 Chrome 會直接
      判定濾鏡載入失敗,套用結果是整張圖變全透明黑([0,0,0,0]),不是
      忽略那段濾鏡繼續套用其他部分。
   2) `url(...)` 濾鏡跟內建 `brightness()` 疊在同一個 filter 字串時,
      **順序會影響能不能用**——`url(...) brightness()` 正常,反過來
      `brightness() url(...)` 一樣整張變全透明黑。原因不明(可能是
      Chrome 內部把 url() 濾鏡跟後面的內建濾鏡函式編譯成一條 pipeline
      時,url() 濾鏡要在最前面才解析得動),照這個順序寫就好,不用深究
      為什麼。 */
function schoolPropFilter(tweak){
  const { r, g, b, brightness } = tweak;
  if(r === 100 && g === 100 && b === 100 && brightness === 100) return 'none';
  const m = [r/100,0,0,0,0, 0,g/100,0,0,0, 0,0,b/100,0,0, 0,0,0,1,0].join(' ');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg'><filter id='f'><feColorMatrix type='matrix' values='${m}'/></filter></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}#f") brightness(${brightness}%)`;
}

     <input type="range" id="stallDrop" min="0.05" max="0.9" step="0.01" value="${cur}" style="width:100%"></div>` +
    '<div style="margin-top:4px;opacity:.7">關掉:再打一次 __dbg.tweakStall()<br>拉到滿意後跟我說最終數字就好</div>';

   off=水平偏移、ry/offy=垂直),照原本 wallSideA/B 的鏡射公式即時算回

function tweakPolicePanel(){
  const old = document.getElementById('policeTweakPanel');
  if(old){ old.remove(); return; }

  if(!pw || !pw.front || !pw.front.map){

    return;
  }
  const fm = pw.front.map, sa = pw.sideA.map, sb = pw.sideB.map;
  // 從目前的 sideB(未翻轉那顆)反推共用參數初始值
  const side0 = { r: sb.repeat.x, off: sb.offset.x, ry: sb.repeat.y, offy: sb.offset.y };
  const rows = [
    ['front_rx','正面 repeat.x', 0.2, 1, 0.01, () => fm.repeat.x, v => fm.repeat.x = v],
    ['front_ry','正面 repeat.y', 0.2, 1, 0.01, () => fm.repeat.y, v => fm.repeat.y = v],
    ['front_ox','正面 offset.x', -0.5, 0.5, 0.01, () => fm.offset.x, v => fm.offset.x = v],
    ['front_oy','正面 offset.y', -0.5, 0.5, 0.01, () => fm.offset.y, v => fm.offset.y = v],
    ['side_r','側面 寬度裁切 r', 0.1, 1, 0.01, () => side0.r, v => { side0.r=v; }],
    ['side_off','側面 offset(水平)', -0.5, 1, 0.01, () => side0.off, v => { side0.off=v; }],
    ['side_ry','側面 repeat.y', 0.1, 1, 0.01, () => side0.ry, v => { side0.ry=v; }],
    ['side_oy','側面 offset.y', -0.5, 0.5, 0.01, () => side0.offy, v => { side0.offy=v; }]

  document.body.appendChild(panel);
  function applySide(){
    sa.repeat.set(-side0.r, side0.ry); sa.offset.set(side0.off+side0.r, side0.offy);
    sb.repeat.set(side0.r, side0.ry); sb.offset.set(side0.off, side0.offy);
    sa.needsUpdate = true; sb.needsUpdate = true;

      set(v);

const grain = (() => {
  const c = document.createElement('canvas'); c.width = LW; c.height = LH;
  const x = c.getContext('2d'), img = x.createImageData(LW, LH);
  let s = 20260804;
  const rnd = () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
  for(let i=0;i<img.data.length;i+=4){
    const v = rnd() < .5 ? 0 : 255;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3] = rnd() < .05 ? 10 : 0;
  }
  x.putImageData(img,0,0); return c;
})();

   可逆數字,一整局遊戲只跳這一次(`momEchoShown`),不是每次超過門檻都
   跳——這是一個瞬間的自我察覺,跳太多次會變成說教式的重複提醒,違反
   基準線(不要居高臨下)。台詞照 kc 原話,不加碼延伸,不寫「你決定不要
   再賭了」這種說教式收尾——這遊戲的規矩是講到這裡就停,讓玩家自己接。
   接在正常結果 toast 之後跳第二則(比照書架線索那套「先講結果、再跳
   獨立提示句」的節奏),不跟第一則擠在同一個 toast 裡。 */
const ARCADE_GAMBLE = { netLoss: 0, momEchoShown: false, momEchoPending: false, momConfronted: false };
function gambleResolve(cost, resolveFn){
  if(ST.money < cost){ toast('你身上不夠。', 2000); return null; }
  chg('money', -cost);
  const r = resolveFn();
  if(r.payout) chg('money', r.payout);
  chg('mood', r.mood);
  const net = cost - r.payout;
  if(net > 0) ARCADE_GAMBLE.netLoss += net;
  /* 情緒變化這輪起要在對話匡裡看得到,不只是 HUD 上一閃而過的飄字
     (2026-08-26,kc:「玩遊戲情緒值會上升,虧錢會略略下降,對話匡要
     顯示」)——toast()跟agShowResult()(見下面)都補上這行。 */
  toast(r.line + (r.payout ? `\n（拿回 $${r.payout}）` : '') + `\n（情緒 ${r.mood>0?'+':''}${r.mood}）`, 3000);
  /* 2026-08-27,kc:「你想起媽媽也是這樣要自言自語的對話匡,比較有感」
     ——原本用 toast() 飄過去,改成 say('pc', ...) 自言自語對話匡(WHO.pc
     名字是「你」,本來就是給玩家內心話用的身分)比較有份量。不能在這裡
     直接呼叫 say()——這時候 #arcadeGame 大面板還開著(z-index:9),
     #dialog 只有 z-index:8,對話匡會被面板整片遮住,玩家看不到、以為
     壞掉了。改成先記 momEchoPending,等玩家真的走開、大面板關掉
     (closeArcadeGame())之後才把這句話說出來,不用去動全站共用的
     z-index 排序。 */
  if(!ARCADE_GAMBLE.momEchoShown && ARCADE_GAMBLE.netLoss >= 500){
    ARCADE_GAMBLE.momEchoShown = true;
    ARCADE_GAMBLE.momEchoPending = true;
  }
  return r;   // 給 #arcadeGame 大面板用來把結果文字寫進 agBody,不是只靠 toast 飄過去
}
/* 機台真的有演出/操作了(2026-08-26,kc:「遊戲內容照你說的做」,見討論
   當下提的分層方案)——slot/roulette 是純視覺演出,轉輪/輪盤跑完固定時間
   才呼叫 gambleResolve(),機率完全不受這段演出影響(跟功德箱那類選單式
   互動同一個「決定權在遊戲端」的精神,沒有因為加了動畫就變成玩家能
   影響機率);pusher 是三台裡唯一真的看手感的——指示條左右來回跑,玩家
   按空白鍵卡時機,卡得準不准直接改這把的中獎機率。三台共用同一個狀態機
   `ARCADE_ANIM`,`busy=true` 鎖住室內移動,跑完/操作完才解鎖。
   `kind==='pusher'` 這支的空白鍵不是「按下去看結果」的觸發鍵那麼簡單——
   它要在 `updateIndoor()` 早退之前先被 keydown 攔截(見下面 keydown 那段
   新增的判斷),不然會落進 openIndoorSpot(IN.near) 那條路徑,被
   `if(busy||dlg.on) return;` 擋掉,空白鍵等於失靈。 */
const ARCADE_ANIM = { active:false, kind:null, t:0, dur:0, cb:null, barPos:0, barDir:1, outcome:null };
/* slot/roulette 的 outcome 在開始演出**之前**就先擲骰決定好(見下面
   openIndoorSpot() 的 'slot'/'roulette' 分支),存在 ARCADE_ANIM.outcome——
   agDrawSpin() 收尾那幾百毫秒要顯示「對上的顏色」,跟最後真正
   gambleResolve() 用的是同一份結果,不是動畫演一套、結算另外骰一次。 */
function startArcadeSpin(kind, dur, outcome, onDone){
  ARCADE_ANIM.active = true; ARCADE_ANIM.kind = kind; ARCADE_ANIM.t = 0; ARCADE_ANIM.dur = dur;
  ARCADE_ANIM.outcome = outcome; ARCADE_ANIM.cb = onDone; busy = true;
}
/* 投錢動畫(2026-08-26,kc:「推幣機很沒有帶入感...我想要有投錢下去推的
   感覺」)——按下「投 $20」不是直接跳出時機條,先跑一小段代幣掉落的
   演出(ARCADE_ANIM.kind==='pusher-drop',純視覺,固定 450ms),跑完才
   真的開始 startPusherGame() 的時機條。畫面在 agDrawSpin() 畫,見那邊。 */
function startPusherDrop(onDone){
  ARCADE_ANIM.active = true; ARCADE_ANIM.kind = 'pusher-drop'; ARCADE_ANIM.t = 0; ARCADE_ANIM.dur = 450;
  ARCADE_ANIM.cb = onDone; busy = true;
}
function startPusherGame(){
  ARCADE_ANIM.active = true; ARCADE_ANIM.kind = 'pusher'; ARCADE_ANIM.barPos = 0; ARCADE_ANIM.barDir = 1;
  busy = true;
}
/* 中獎後的代幣滑落演出(2026-08-26,同一輪)——贏了才播,輸了就直接跳
   結果文字(沒有代幣可以演)。跟 pusher-drop 一樣是純視覺的固定時長
   演出,跑完才呼叫 agShowResult()。 */
function startPusherPayout(win, onDone){
  if(!win){ onDone(); return; }
  ARCADE_ANIM.active = true; ARCADE_ANIM.kind = 'pusher-payout'; ARCADE_ANIM.t = 0; ARCADE_ANIM.dur = 650;
  ARCADE_ANIM.cb = onDone; busy = true;
}
/* 推幣機命中判定(2026-08-26)——sweet spot 卡在正中央(0.5)附近,離中心
   越近中獎機率越高。三段門檻(準/普通/差)是這輪先抓的小的可逆數字,
   賠率(payout)也跟著分三級,獎勵真的卡準的那一下。 */
function resolvePusherLockIn(){
  if(!ARCADE_ANIM.active || ARCADE_ANIM.kind !== 'pusher') return;
  const pos = ARCADE_ANIM.barPos;
  ARCADE_ANIM.active = false; busy = false;
  agBarEl.style.display = 'none';
  let win = false;
  /* 難度調高(2026-08-26 第二輪,kc:「難度太簡單」)——sweet spot 從
     dist<=.12(對應 CSS 24% 寬)縮到 dist<=.05(對應 10% 寬),ok 這個
     「還可以」的緩衝帶也從 .3 收到 .2,三檔機率都調低一截(.8→.7,
     .45→.3,.15→.08),配合 updateIndoor() 那邊調快的指示條速度,真的
     要盯著看才卡得到,不是隨便按都有四五成機會。
     **期望值檢查(2026-08-26 第三輪,kc:「檢查一下整體的期望值要是負的,
     不能鼓勵他們賭博」)**——slot(−20%)、roulette(−2.7%,真實歐式輪盤
     莊家優勢)本來就是負的,但這裡原本 great 那檔用 .7 機率、45 賠率
     算出來是 **正**期望值(.7*(45-20)+.3*(-20)=+11.5,練到穩定卡進
     great 反而長期會賺)——這正是要避免的漏洞,不能讓「練熟手感」變成
     穩賺。把 great 賠率從 45 調到 25,期望值變成
     .7*(25-20)+.3*(-20)=-2.5,三檔(great/ok/bad)全部負值,skill 只能
     「輸得比較少」,不能翻正。 */
  const r = gambleResolve(20, () => {
    const dist = Math.abs(pos - .5);
    const tier = dist <= .05 ? 'great' : dist <= .2 ? 'ok' : 'bad';
    const chance = tier === 'great' ? .7 : tier === 'ok' ? .3 : .08;
    win = Math.random() < chance;
    /* 情緒:2026-08-27 kc 推翻「輸了也要+,只是打折」那個舊設計,改成
       「賭博輸了會小扣情緒」——3→-2,見 DESIGN_NOTES「遊藝場文字風格」
       節後面補的異動記錄,理由不重複貼在這裡。 */
    if(!win) return { payout:0, mood:-2, line:'那疊代幣晃了一下，還是沒掉下來。' };
    const payout = tier === 'great' ? 25 : 30;
    return { payout, mood:4,
      line: tier === 'great' ? '卡得正準——一整排代幣被推下來了。' : '一小疊代幣被推下來，落進出幣口。' };
  });
  busy = true;   // startPusherPayout()/agShowResult() 之間有一小段沒有 ARCADE_ANIM.active 的空檔,手動頂住
  startPusherPayout(win, () => { busy = false; agShowResult(r, showPusherBets); });
}
/* #arcadeGame 大面板的下注畫面(2026-08-26)——每台機台一個 showXxxBets()
   函式,負責畫出「下注選項」那一頁;結果出來後 agShowResult() 提供
   「再玩一次」(呼叫同一個 showXxxBets)/「走開」兩個按鈕,不用另外
   重新走一次 openIndoorSpot()。 */
function agShowResult(r, replay){
  agActions.innerHTML = '';
  agBody.textContent = r ? (r.line + (r.payout ? `\n（拿回 $${r.payout}）` : '') + `\n（情緒 ${r.mood>0?'+':''}${r.mood}）`) : '';
  if(r) agButton('再玩一次', '', '', replay);
  agButton('走開', '', 'back', closeArcadeGame);
}
function showSlotBets(){
  agSlotTier = 'lose'; agSlotLoseIdx = Math.random()*ARCADE_SLOT_IMG.lose.length|0;   // 面板剛開/走開重進都退回中立的預設畫面,不留著上一把的結果
  agBody.textContent = ''; agActions.innerHTML = '';
  agButton('拉一次', '$50', ST.money<50?'bad':'', () => {
    if(ST.money < 50){ toast('你身上不夠。', 2000); return; }
    agActions.innerHTML = ''; agBody.textContent = '';
    const rr = Math.random();
    /* 情緒:2026-08-27 kc 推翻舊設計,改成輸了小扣——4→-2,理由同上面
       pusher 那則筆記,不重複貼。 */
    const outcome = rr < .05 ? { payout:500, mood:6, line:'三顆金磚排成一線——中大獎了！', tier:'jackpot' }
                   : rr < .20 ? { payout:100, mood:6, line:'兩顆對上，小賺一筆。', tier:'small' }
                   : { payout:0, mood:-2, line:'轉輪停下，什麼都沒對上。', tier:'lose' };
    startArcadeSpin('slot', 1100, outcome, () => agShowResult(gambleResolve(50, () => outcome), showSlotBets));
  });
  agButton('走開', '', 'back', closeArcadeGame);
}
/* 真的算出球停在哪個號碼上(2026-08-26,kc:「你的球沒有真的停在不同
   地方,而且沒有真的判定」)——之前 agDrawSpin() 的球角度是寫死的
   `3.2*2π*ease`,不管押什麼、輸贏,每次動畫最後都轉到同一個角度停下,
   跟結果完全沒關係。這輪改成真的照歐式輪盤的號碼順序算出球實際落在
   哪一格,球的終點角度直接對應那個號碼在照片上的實際位置——順序/紅黑
   都是真的輪盤規則(不是隨便編的),`arcade-roulette.png` 裡看得到的
   號碼排列(3,26,0,32,15...)跟這個順序對得上。 */
/* 號碼順序(2026-08-26,kc 親自對著 arcade-roulette.png 逐格核對後給的
   最終版本)——這張照片是 AI 生的,號碼本身跟真實歐式輪盤不完全一樣
   (有幾格重複,例如 13/28 各出現兩次),kc 明確要求「照圖片本身的版本」
   不要照真實輪盤規則腦補修正,所以這裡故意不是 0~36 unique 的標準
   序列。角度校正是對的、不用再調(kc:「你的角度是對的不用調整,是
   數字要調整」)——`ROULETTE_ZERO_ANGLE_DEG` 那組像素分析量出來的
   -93.4° 維持不變,見下面的說明。因為有重複數字,角度查詢改成用
   **index**(陣列位置)而不是用數字反查(`indexOf` 遇到重複數字只會
   抓到第一個位置,球會一直轉去同一格,即使玩家骰到的是後面那格重複的
   同一個數字)。陣列長度也不是寫死的 37(這張圖數出來是 36 格),角度
   換算一律除以 `ROULETTE_WHEEL_ORDER.length`,不要哪天陣列又調整了
   角度卻沒跟著變。 */
const ROULETTE_WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,13,30,10,24,5,33,16,20,1,31,14,23,9,29,18,28,7,28,12,35,3,26];
/* 顏色改成「按格子(index)量」,不是按數字查表(2026-08-26,kc:「這邊
   23 是黑欸」)——`23` 在真實輪盤規則裡是紅的,但這張 AI 生圖的顏色
   跟真實規則本來就對不上(已經確認號碼順序也對不上,見上面那則筆記),
   繼續假設「紅黑照真實輪盤規則」只會一直踩到類似的坑。
   2026-08-26 那版是寫腳本在 `arcade-roulette.png` 上算座標取樣像素
   (6 個半徑多數決),結果 2026-08-27 kc 截圖抓到還是有錯:「你黑紅
   有錯欸,你直接看圖片不要用算的,數字對應的顏色不能錯」——像素取樣
   腳本在算格子座標時跟真實照片(有真的透視、不是正圓)對不上,偏移
   到鄰格,取樣到錯的顏色。這輪整個放棄用座標公式算,改成把圖片裁成
   四塊肉眼看得清楚的局部特寫(頂/左/右/下四段)直接讀,36 格全部
   重新核對過一次,有 13 格跟舊版不一樣(34/6/27/13(第一個)/36/13
   (第二個)/30/16/20/1/31/14/9 這些格子紅黑對調)。 */
const ROULETTE_COLOR_BY_INDEX = ['green','red','black','red','black','red','black','red','black','red','black','red','black','red','black','red','black','black','red','black','red','black','red','black','red','black','red','black','red','black','red','black','red','black','red','black'];
const ROULETTE_ZERO_ANGLE_DEG = -93.4;
function rouletteIndexAngle(i){
  return ROULETTE_ZERO_ANGLE_DEG*Math.PI/180 + i * (2*Math.PI/ROULETTE_WHEEL_ORDER.length);
}
function rouletteColorNameAt(idx){
  const c = ROULETTE_COLOR_BY_INDEX[idx];
  return c === 'green' ? '綠' : c === 'red' ? '紅' : '黑';
}
/* 押注選項改成五個(2026-08-26,kc:「選項改成壓紅 壓黑 壓奇數 壓偶數
   壓0」)——原本「押紅／黑」含糊指同一個按鈕,拆成真的紅/黑/奇/偶四個
   各自獨立的「賠率相同注」(真實輪盤的 even-money 外圍注,18/37 中,
   賠 2 倍),0 維持原本「押單一號碼」那個特例(1/37 中,賠 36 倍)。
   `qualifies(idx, n)` 判斷某一格算不算中——紅/黑吃 `ROULETTE_COLOR_BY_INDEX`
   (按格子,見上面那則筆記),奇/偶吃數字本身(這個沒有顏色那種問題,
   單雙就是數字的數學性質,不受這張圖畫錯顏色影響)。 */
const ROULETTE_EVEN_MONEY_BETS = [
  { label:'押紅', qualifies:(idx,n) => ROULETTE_COLOR_BY_INDEX[idx] === 'red' },
  { label:'押黑', qualifies:(idx,n) => ROULETTE_COLOR_BY_INDEX[idx] === 'black' },
  { label:'押奇數', qualifies:(idx,n) => n !== 0 && n % 2 === 1 },
  { label:'押偶數', qualifies:(idx,n) => n !== 0 && n % 2 === 0 }
];
/* 下注→骰出真的落點的「格子」(index,不是數字)→算出對應角度→跑演出
   →演出跑完才真的結算(gambleResolve 拿到的 line 這輪也帶上實際號碼/
   顏色,不是只講「中/沒中」的空話)。挑 index 而不是挑數字再反查——
   陣列裡有重複數字(13/28 各兩格),同一個數字對應兩個不同角度,一定要
   先選中格子、再讀那一格的數字跟角度,不能反過來。spins 是額外轉的
   整圈數,帶一點隨機讓每次視覺上轉的圈數不完全一樣。 */
function spinRouletteTo(betLabel, win, winLine, loseLine, payout){
  const pool = ROULETTE_WHEEL_ORDER
    .map((n,i) => i)
    .filter(i => win ? qualifiesFor(betLabel, i) : !qualifiesFor(betLabel, i));
  const idx = pool[Math.random()*pool.length|0];
  const number = ROULETTE_WHEEL_ORDER[idx];
  const spins = 3 + Math.floor(Math.random()*2);
  /* 情緒:2026-08-27 kc 推翻舊設計,改成輸了小扣——5→-3,理由同上面
     pusher 那則筆記,不重複貼。贏的時候維持不變(8)。 */
  const outcome = { payout: win ? payout : 0, mood: win ? 8 : -3, number,
    line: (win ? winLine : loseLine) + `（${number} ${rouletteColorNameAt(idx)}）`,
    finalAngle: spins*2*Math.PI + rouletteIndexAngle(idx) };
  startArcadeSpin('roulette', 1400, outcome, () => agShowResult(gambleResolve(100, () => outcome), showRouletteBets));
}
function qualifiesFor(betLabel, idx){
  const n = ROULETTE_WHEEL_ORDER[idx];
  if(betLabel === '押0') return n === 0;
  return ROULETTE_EVEN_MONEY_BETS.find(b => b.label === betLabel).qualifies(idx, n);
}
function showRouletteBets(){
  agBody.textContent = ''; agActions.innerHTML = '';
  ROULETTE_EVEN_MONEY_BETS.forEach(b => {
    agButton(b.label, '$100', ST.money<100?'bad':'', () => {
      if(ST.money < 100){ toast('你身上不夠。', 2000); return; }
      agActions.innerHTML = ''; agBody.textContent = '';
      const win = Math.random() < 18/37;
      spinRouletteTo(b.label, win, '球停在你押的格子上，莊家推了兩倍籌碼過來。', '球彈進別的格子，籌碼被收走了。', 200);
    });
  });
  agButton('押0', '$100', ST.money<100?'bad':'', () => {
    if(ST.money < 100){ toast('你身上不夠。', 2000); return; }
    agActions.innerHTML = ''; agBody.textContent = '';
    const win = Math.random() < 1/37;
    spinRouletteTo('押0', win, '球穩穩停在 0——你自己都愣住了。', '球停在別的格子，你押的 0 沒中。', 3600);
  });
  agButton('走開', '', 'back', closeArcadeGame);
}
function showPusherBets(){
  agBody.textContent = ''; agActions.innerHTML = ''; agBarEl.style.display = 'none';
  agButton('投 $20', '$20', ST.money<20?'bad':'', () => {
    if(ST.money < 20){ toast('你身上不夠。', 2000); return; }
    agActions.innerHTML = ''; agBody.textContent = '';
    startPusherDrop(() => {
      agBody.textContent = '按空白鍵卡時機';
      agBarEl.style.display = 'block'; agBarPin.style.left = '0%';
      startPusherGame();
    });
  });
  agButton('走開', '', 'back', closeArcadeGame);
}
/* 結帳(2026-08-24 kc:「買東西要加入去結帳的流程」)——鮮食櫃/貨架/飲料櫃
 * 選了東西不再當場扣錢,先進 `IN.basket`(拿在手上),真正的金錢/飽足/情緒
 * 變動延後到櫃台按「結帳」才一次算。沒結帳就想走出門口會被擋(見
 * openIndoorSpot() 的 'door' 分支),擋下來的選單另外提供「放回架上」直接

function basketTotal(){ return IN.basket.reduce((s,it) => s + it.price, 0); }

 * 按過對話才跳出「付款/先不要」這個很單純的二選一選單,不用再重複列
 * 清單。
 * 付款也不再直接套飽足/情緒(kc:「不會馬上加飽足感,要到背包裡面點擊
 * 物品吃掉」)——每樣東西變成 FOOD 陣列裡的一筆,角色面板「食物」區塊
 * 點了才呼叫 eatFood() 真的吃掉。 */
function checkout(){
  const total = basketTotal();
  const receipt = IN.basket.map(it => it.name + '　$' + it.price).join('\n') + '\n\n共 $' + total;
  say('clerk', receipt, () => {
    openMenu('結帳', [
      { label:'付款', cost:'共 $' + total, cls: ST.money<total?'bad':'', run:() => {
        if(ST.money < total){ say('clerk', '「總共 ' + total + ' 塊。」\n你身上只有 ' + ST.money + '，還差一點。'); return; }
        chg('money', -total);
        let line = '';
        IN.basket.forEach(it => {
          FOOD.push({ id: ++FOOD_SEQ, name: it.name, icon: it.icon, feed: it.feed, mood: it.mood });
          if(it.line) line = it.line;   // 目前一次結帳最多一件會帶特殊台詞(即期便當),直接蓋過去就好
        });
        advanceTime(3);
        IN.basket = [];
        toast(line || '結帳完成,東西收進包包裡了。要吃到「角色」欄點開。', 2600);
      } },
      { label:'先不要', cls:'back', run(){} }

}

       不能兩個一起做,不然對話開著人已經淡出離開學校了(2026-09-01)。 */
    else if(id === 'outside'){ maybeTriggerStoryNode([['school', schoolStorySource([13])]], leaveIndoor); return; }
    else if(id === 'kiosk'){ openTuitionKiosk(); return; }
    else if(id === 'jiaoguan'){ talkToJiaoguanCorridor(); return; }
    return;
  }
  /* 遊藝場(2026-08-26,kc:「裡面有 2d 場景 可以去跟機台對話玩遊戲 吃角子
     老虎 俄羅斯輪盤 推幣機之類」+「真的賭博,情緒一定＋ 金錢賭」)——三台
     機台共用 gambleResolve() 那個「扣注金→擲骰→結果」的小函式,不做即時
     操作型的小遊戲(跟收銀那種真的有手感操作的不同層級,這裡是選單+RNG,
     比照功德箱/買機車那類互動)。情緒不管輸贏都固定加(呼應「賭癮爽的是
     玩的當下,不是贏錢那一刻」),金錢期望值刻意做負(真賭場邏輯,玩家
     長期玩會慢慢輸)。三台數字都是這輪自己抓的小的可逆參數,不喜歡跟我
     說一聲就改。 */
  if(PLACE === 'arcade'){
    if(id === 'door'){ leaveIndoor(); return; }
    /* 三台機台改走 #arcadeGame 大面板(2026-08-26,kc:「互動是應該要彈出
       一個大框框」),不再用小小一條 openMenu() 清單——openArcadeGame()
       開面板+畫機台特寫,showXxxBets() 畫下注選項,詳細流程見那幾個函式
       旁邊的筆記。 */
    else if(id === 'slot'){ openArcadeGame('slot', '吃角子老虎'); showSlotBets(); return; }
    else if(id === 'roulette'){ openArcadeGame('roulette', '俄羅斯輪盤'); showRouletteBets(); return; }
    else if(id === 'pusher'){ openArcadeGame('pusher', '推幣機'); showPusherBets(); return; }
    return;
  }
  /* 刺青店(2026-08-28)——SPOTS 沿用 SceneTattoo.SPOTS。'chair'
     (talkToTattooMaster())、'wait'(lookAtWaitingMagazine(),見走失狗
     那則長筆記)、'flash'(lookAtFlashWall(),圖牆詳細介紹)、'bench'
     (lookAtBench(),工作檯麵包)接了真邏輯,只剩'case'(展示櫃)還是
     單純逛場景的氣氛 toast,跟教室書架(lookAtBookshelf() 之外那種純
     環境調味)同一個份量,不用每個角落都掛系統。 */
  if(PLACE === 'tattoo'){
    if(id === 'door'){ leaveIndoor(); return; }
    else if(id === 'chair'){ talkToTattooMaster(); return; }
    else if(id === 'wait'){ lookAtWaitingMagazine(); return; }
    else if(id === 'flash'){ lookAtFlashWall(); return; }
    else if(id === 'bench'){ lookAtBench(); return; }
    else if(id === 'case'){ toast('玻璃櫃裡是耳環跟鼻環，你沒有多餘的錢想那個。', 2600); return; }
    return;
  }
  if(id === 'door'){
    /* 2026-08-24 kc:「如果沒結帳會不讓你出門(你也可以放回去)」——basket
       非空就擋在門口,另外開一個小選單,不是單純 toast 卡死沒有退路。 */
    if(IN.basket.length){
      openMenu('你手上還有東西沒結帳', [
        { label:'放回架上', run:() => { IN.basket = []; toast('你把手上的東西放回去了。', 1800); } },
        { label:'再想想', cls:'back', run(){} }
      ]);

    }
