/* ===================================================================
   家裡的拉扯:母·賭 + 父·喝(唯一接進遊戲的一組,見 DESIGN_NOTES
   「範圍:先只做一組父母」)。story-bet.js/story-drink.js 是純資料
   (NODES 陣列,按第幾天觸發),這裡是唯一的「消費端」——直接餵給既有的
   say()/openMenu()/chg()/toast(),不另外做一套對話系統。
   =================================================================== */
const seenStoryDays = new Set();      // 'bet-6'、'drink-15' 這種 key,防止同一天重複觸發
const knownTruths = new Set();        // story-bet.js 的 TRUTHS 編號,目前沒有獨立 UI 顯示,先記著
/* 主動找爸爸(2026-08-19,kc:「跟他講話可以了解他的近況」):跟
   story-drink.js 按天觸發的節點是兩回事——那邊是「他的事找上你」,
   這裡是「你自己想看看他現在怎樣」,純觀察,不開分支、不扣/加任何指標,
   跟超商「看店員在幹嘛」同一個等級,隨機挑一句 toast。故意不寫「跟他
   對話」的內容(問他話、他回答)——story-drink.js 的節點才是真的對話,
   這裡重複寫等於提前爆雷/稀釋掉那幾句台詞的重量。
   **「近況」要跟著劇情進度變(kc 提醒的)**:按 seenStoryDays 裡
   `drink-N` 記到哪一階,換不同那組句子。**目前只做到第 9 天**(kc 這輪
   要求「之後的劇情先不做」,story-drink.js 也只寫到第 9 天),14/20/26
   那三階連同對應的節點一起被拿掉了,git log 找得到那版——之後真的接上
   那幾天的節點,再把對應階的句子一起補回來,不要只接節點漏了這裡。 */
const DAD_CHECKIN_LINES = {
  /* 第4天前(2026-08-19 kc 補的內容):「我是你老子,你給我錢是應該的」——
     理所當然討錢的調調,在第4天那個節點真的發生之前就先埋一句。 */
  0: ['電視開著,他好像沒有真的在看。', '「我是你老子,你給我錢是應該的。」他說得很理所當然。'],
  /* 第4~8天(kc:「第4~9天會發酒瘋」):第4天節點已經發生過,他喝更多、
     更常鬧——純觀察,不是新的暴力事件,那條線只有第4天那次真的動手。 */
  4: ['他喝到一半,開始罵些聽不懂的話。', '他又在講那句「我是你老子」,你已經數不清第幾次了。'],
  9: ['他手邊那罐,不知道今天是第幾罐。', '你進門那幾秒,還是習慣先繞一下。']
};
function dadCheckinLines(){
  const stages = [9, 4];
  const s = stages.find(d => seenStoryDays.has('drink-'+d)) ?? 0;
  return DAD_CHECKIN_LINES[s];
}
/* 媽媽的近況(2026-08-19,kc:「賭博要錢相關的對話還有不想付撫養責任」)
   跟爸爸那組同一個等級——純觀察,不開分支、不扣分。分階跟著 story-bet.js
   的 `bet-N`(第3天「兩千」節點)走,目前只有兩階:節點發生前/發生後,
   之後那五個節點(6/10/14/18/22)先不補,理由跟爸爸那邊一樣——等真的要
   做那幾天的近況再一起補。 */
const MOM_CHECKIN_LINES = {
  0: ['她在滑手機,螢幕上是骰子的畫面。', '「養小孩是你爸的事,又不是只有我一個人的責任。」她講得像在講別人的事。'],
  3: ['她又在滑那個 app,輸了兩把,她沒有停。', '「你這麼大了,不需要我一直顧吧。」她說得很輕描淡寫。']
};
function momCheckinLines(){
  const s = seenStoryDays.has('bet-3') ? 3 : 0;
  return MOM_CHECKIN_LINES[s];
}
/* 註冊單債務(2026-08-18,媽媽把兩千拿去「投資」、另外塞一張一千塊註冊單
 * 給主角那段):跟 knownTruths 同一個等級——**先記狀態,沒有獨立 UI**,
 * kc 說之後要做「點角色卡跳出角色/背包介面」才會有地方顯示,這輪不做那個
 * 面板。story-bet.js 的節點資料只給 `tuitionQuest:{amount,days}`(純資料,
 * 不碰 DOM),真的建立這個物件、算到期日、跳 toast 提醒都在這裡做——跟
 * item.money/calm 那些欄位由 `applyStoryChoice()` 消費是同一個分工方式。
 * **逾期沒繳的後果目前沒有定義**,到期日到了不會扣任何東西,只是資料上
 * 記得住「逾期了」——這是刻意留白,不是漏做,後果是什麼要 kc 再定。 */
let TUITION_QUEST = null;
/* beats 是 [{who,text}] 或 [{toast,ms}] 的混合陣列,照順序一句一句播完再
 * 呼叫 done——跟既有 say() 手動巢狀 callback 是同一招,只是資料量大了
 * (最多到 6 句)用遞迴展開,不用每加一句就多縮排一層。 */
/* IN_TARGETS(2026-08-18):家庭 NPC 在客廳的固定站位,给 beats 裡的
   `{ walkTo: 'mom' }` 這種寫法用。2026-08-19 第四版背景媽媽烤進照片裡、
   不再是可調的疊圖(見 paintHomeBackdrop() 那段拿掉 momSitImg 的說明),
   px 改成直接在新照片上拉格線量她的位置(native x≈785,乘 0.383 換算)——
   跟門口/房間門用同一套量法,不是精算。face:'B' 是「背對鏡頭、面向沙發」,
   媽媽坐沙發面對鏡頭,玩家要面對她本來就該背對鏡頭。 */
const IN_TARGETS = { mom: { px: 300, face:'B' } };
/* menu 型 beat(2026-08-19,爸爸「打工→要錢→給/不給」那段用):playBeats
   跑到 `{ menu:[...] }` 這種 beat,開一個子選單,選完照 applyStoryChoice()
   吃 calm/mood/money 那些欄位、播完該選項自己的 beats,再接回原本那串
   beats 的下一句——跟 maybeTriggerStoryNode() 開頂層選單完全同一招,只是
   巢狀一層,不用另外寫一套。 */
function playBeats(beats, i, done){
  if(!beats || i >= beats.length){ done && done(); return; }
  const b = beats[i];
  if('toast' in b){ toast(b.toast, b.ms); playBeats(beats, i+1, done); }
  else if('walkTo' in b){
    const t = IN_TARGETS[b.walkTo];
    if(!t){ playBeats(beats, i+1, done); return; }   // 沒設站位就直接跳過,不會卡住
    IN.walkTarget = { px:t.px, face:t.face, cb: () => playBeats(beats, i+1, done) };
  }
  else if('menu' in b){
    openMenu(b.cap || '', b.menu.map(item => ({
      label: item.label, cost: item.cost,
      run: () => { applyStoryChoice(item); playBeats(item.beats, 0, () => playBeats(beats, i+1, done)); }
    })));
  }
  else say(b.who, b.text, () => playBeats(beats, i+1, done));
}
/* debt(欠更多錢)這次沒有另開一條指標——kc 原話「債務就是扣金錢啊」,
 * 直接當 money 的負向變動處理。money 沒有下限(見 chg() 的 clamp 規則),
 * 負數就是「在欠錢」的意思,不用另外畫一條進度條。 */
/* mood 欄位(2026-08-19,爸爸「不給錢就打你」那段用):DESIGN_NOTES「第六條:
   情緒」原本的規則是家裡拉扯的情緒衝擊只用 toast 文字講,不進數值——這裡
   是 kc 這輪明確要求的例外(「你會扣情緒跟歸屬感」),被打是唯一一個真的
   進數值的家庭衝突,其餘家裡劇情的情緒衝擊依然只用文字,不要照這裡的
   先例把其他節點也改成扣 mood。 */
function applyStoryChoice(item){
  if(item.calm) chg('calm', item.calm);
  if(item.mood) chg('mood', item.mood);
  if(item.money) chg('money', item.money);
  if(item.moneyAll) chg('money', -ST.money);
  if(item.debt) chg('money', -item.debt);
  if(item.truth) knownTruths.add(item.truth);
}
/* 規則 1(DESIGN_NOTES「家裡的拉扯」):「他主動來找你,你躲不掉」——不是
 * 走到沙發按空白鍵那種互動點,是一進客廳當天撞到節點就直接播,擋住(say/
 * openMenu 本身就會靠 dlg.on/busy 擋住移動,不用額外加鎖)。兩條線目前
 * 觸發天數沒有重疊(bet: 3/6/10/14/18/22,drink: 4/9/15/20/26),一天最多
 * 只會撞到一個,所以先不處理「同一天兩條都要播」的排隊邏輯。 */
function maybeTriggerStoryNode(){
  const sources = [['bet', StoryBet], ['drink', StoryDrink]];
  for(const [key, src] of sources){
    const node = src.NODES.find(n => n.day === day);
    if(node && !seenStoryDays.has(key+'-'+node.day)){
      seenStoryDays.add(key+'-'+node.day);
      playBeats(node.beats, 0, () => {
        if(node.tuitionQuest && !TUITION_QUEST){
          TUITION_QUEST = { amount: node.tuitionQuest.amount, dueDay: day + node.tuitionQuest.days, paid: false };
          toast(`註冊單:三個月內要湊出 $${node.tuitionQuest.amount}`, 3600);
        }
        openMenu(node.title, node.menu.map(item => ({
          label: item.label, cost: item.cost,
          run: () => { applyStoryChoice(item); playBeats(item.beats, 0, () => {}); }
        })));
      });
      return;
    }
  }
}

/* ===================================================================
   輸入 / 主迴圈
   =================================================================== */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  startBuskerAudio();          // 第一次按鍵才建立 AudioContext,見上面那段註解
  if(k === ' ' || k === 'enter'){
    e.preventDefault();
    if(advanceDialog()) return;
    if(menuEl.classList.contains('on')) return;
    if(MODE === 'indoor'){ if(IN.near) openIndoorSpot(IN.near); }
    else if(ridingMoto) dismountMoto();
    else if(nearDoor && !busy) enterIndoor(nearDoor);
    else if(nearProp && !busy) interactProp(nearProp);
  }
  if(k === 'escape' && menuEl.classList.contains('on')) closeMenu();
  if(k === 'escape' && invOverlay.classList.contains('on')) closeInventory();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let camYaw = 0, nearDoor = null, nearProp = null, walkIn = null;
const tmp = new THREE.Vector3();

/* 騎機車(2026-08-14,kc 要的——原本地圖太大,走路逛一圈太久)。ridingMoto
   是 city.motos 裡正在騎的那個 entry,null 就是走路。角色本體不藏起來
   (第一版藏起來,kc 玩起來說像鬼在騎車,當場改掉,見 mountMoto() 那段
   註解)——那台車的 group 每幀跟著玩家座標/朝向跑(見 updateCity 移動那段),
   下車時把車的 x/z 更新成當下位置——同一顆 THREE.Group,不是複製一份。
   MOTO_MULT 比 Shift 跑步(run=2)還快,不然騎車不如用跑的沒有意義;騎乘中
   Shift 不再疊加,見 updateCity 那行 speed 算式,先簡化成固定倍率,kc 覺得
   不夠快再調。 */
let ridingMoto = null;
const MOTO_MULT = 3.2;
let MOTO_SEAT_OFFSET = 0.75;    // 2026-08-17 定案值(正值 = 往後輪方向)。暫時改回 let
                                 // 給 #tune 面板拖,錄完會改回 const。
let MOTO_SEAT_Y = 0.95;         // 同上,座墊高度。

/* 騎乘姿勢調整面板 wiring——暫時的,見上面 #tune 那段 CSS 註解。 */
let tunePanelSynced = false;
const tuneInputs = {
  Offset: document.getElementById('tOffset'), SeatY: document.getElementById('tSeatY'),
  Splay:  document.getElementById('tSplay'),  ArmX:  document.getElementById('tArmX'),
  ArmZ:   document.getElementById('tArmZ'),   ArmY:  document.getElementById('tArmY')
};
function syncTunePanel(){
  tuneInputs.Offset.value = MOTO_SEAT_OFFSET;
  tuneInputs.SeatY.value  = MOTO_SEAT_Y;
  tuneInputs.Splay.value  = RIDE_POSE.thighSplay;
  tuneInputs.ArmX.value   = RIDE_POSE.armX;
  tuneInputs.ArmZ.value   = RIDE_POSE.armZ;
  tuneInputs.ArmY.value   = RIDE_POSE.armY;
  Object.keys(tuneInputs).forEach(k => tuneInputs[k].dispatchEvent(new Event('input')));
}
tuneInputs.Offset.addEventListener('input', e => { MOTO_SEAT_OFFSET = +e.target.value; document.getElementById('tvOffset').textContent = MOTO_SEAT_OFFSET.toFixed(2); });
tuneInputs.SeatY .addEventListener('input', e => { MOTO_SEAT_Y      = +e.target.value; document.getElementById('tvSeatY').textContent  = MOTO_SEAT_Y.toFixed(2); });
tuneInputs.Splay .addEventListener('input', e => { RIDE_POSE.thighSplay = +e.target.value; document.getElementById('tvSplay').textContent = RIDE_POSE.thighSplay.toFixed(2); });
tuneInputs.ArmX  .addEventListener('input', e => { RIDE_POSE.armX   = +e.target.value; document.getElementById('tvArmX').textContent   = RIDE_POSE.armX.toFixed(2); });
tuneInputs.ArmZ  .addEventListener('input', e => { RIDE_POSE.armZ   = +e.target.value; document.getElementById('tvArmZ').textContent   = RIDE_POSE.armZ.toFixed(2); });
tuneInputs.ArmY  .addEventListener('input', e => { RIDE_POSE.armY   = +e.target.value; document.getElementById('tvArmY').textContent   = RIDE_POSE.armY.toFixed(2); });
/* 買機車(2026-08-17,kc 要求「只有機車行能買,騎別人的扣風評」)——
   MOTO_PRICE 是我先湊的數字,沒跟 kc 對過,價位刻意訂得比現在身上的錢
   ($63)高一大截,呼應這遊戲「想翻身但每條路都關著」的基準線(見
   docs/DESIGN_NOTES.md),不是隨口喊個數字湊功能而已——kc 不喜歡的話說
   一聲就改。騎沒買的車扣風評的量比照 steal() 被當場抓到那組(-1),不是
   偷完脫身被抓的重罰組(-2),見 mountMoto() 那段。 */
const MOTO_PRICE = 1800;

/* 相機防穿牆(kc 之前就遇過):建築/招牌都是 add() 直接掛在 scene 底下的
   Mesh,角色跟 NPC 是 Group,只抓 scene.children 裡 isMesh 的那層、不遞迴,
   天然排除人物,場景建好就不會再變,先快取一次。跟 street3d.html 同一招,
   細節見那邊的註解。 */
const occluders = scene.children.filter(o => o.isMesh);
const camRay = new THREE.Raycaster();
const eyePos = new THREE.Vector3(), camDir = new THREE.Vector3();
const whereEl = document.getElementById('where');

function updateCity(dt){
  if(keys['q']) camYaw -= dt*.0018;
  if(keys['e']) camYaw += dt*.0018;

  const run = keys['shift'] ? 2 : 1;
  const pos = hero.group.position;
  let moving = false;

  if(walkIn){
    /* 進門的最後幾步不是玩家按出來的,是腳本算出來的方向直接走到門的座標——
       跟下面手動輸入共用同一顆 hero.animate(),角色不會在切換的瞬間卡一下。 */
    const dx = walkIn.x - pos.x, dz = walkIn.z - pos.z, dist = Math.hypot(dx, dz);
    if(dist < .12){
      const done = walkIn.done; walkIn = null; done();
    } else {
      const speed = 0.0055 * dt;
      pos.x += (dx/dist) * speed; pos.z += (dz/dist) * speed;
      hero.group.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
  } else if(!busy && !dlg.on){
    let ix=0, iz=0;
    if(keys['a']||keys['arrowleft'])  ix -= 1;
    if(keys['d']||keys['arrowright']) ix += 1;
    if(keys['w']||keys['arrowup'])    iz -= 1;
    if(keys['s']||keys['arrowdown'])  iz += 1;
    if(ix||iz){
      const speed = 0.005 * dt * (ridingMoto ? MOTO_MULT : run);
      const len = Math.hypot(ix,iz);
      /* 移動要跟著鏡頭轉(kc 抓到的問題),細節見 street3d.html 同一段註解。 */
      const dx = (ix*Math.cos(camYaw) + iz*Math.sin(camYaw))/len;
      const dz = (-ix*Math.sin(camYaw) + iz*Math.cos(camYaw))/len;
      const nx = pos.x + dx*speed, nz = pos.z + dz*speed;
      if(!city.blocked(nx, pos.z)) pos.x = Math.max(CITY.bounds.x[0], Math.min(CITY.bounds.x[1], nx));
      if(!city.blocked(pos.x, nz)) pos.z = Math.max(CITY.bounds.z[0], Math.min(CITY.bounds.z[1], nz));
      hero.group.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
  }
  hero.animate(dt, moving, run, !!ridingMoto);      // 第 4 參數:騎乘中蓋掉 idle/walk/run,撐坐姿(見 scene-city3d.js)
  NPCS.forEach(n => n.animate(dt, pos));            // pos 給小步待機拿去算轉頭朝向,見 buildNPC 註解

  /* 騎乘中:那台車的 group 每幀跟著玩家座標/朝向跑(見 mountMoto()/
     dismountMoto()——角色本體不藏,坐姿疊在車上)。碰撞/邊界檢查都還是
     用 pos(hero.group.position),車只是換皮,不是另一套移動邏輯。
     MOTO_SEAT_OFFSET:propModel() 把整台車的 bounding box 幾何中心對齊
     local (0,0,0),但座墊實際位置不是正中心,車的 group 往騎士反方向
     推出去 MOTO_SEAT_OFFSET,等於把座墊那端拉回騎士(pos)所在的位置。
     只動車的視覺位置,不動 pos 本身,碰撞/下車停車座標(m.x/m.z,見
     dismountMoto())不受影響。數字來源見上面 MOTO_SEAT_OFFSET 那行註解。 */
  if(ridingMoto && ridingMoto.group){
    const fx = Math.sin(hero.group.rotation.y), fz = Math.cos(hero.group.rotation.y);
    ridingMoto.group.position.set(pos.x + fx*MOTO_SEAT_OFFSET, 0, pos.z + fz*MOTO_SEAT_OFFSET);
    ridingMoto.group.rotation.y = hero.group.rotation.y;
  }

  if(ridingMoto){
    /* 座墊高度,數字來源見上面 MOTO_SEAT_Y 那行註解。 */
    pos.y += (MOTO_SEAT_Y - pos.y) * .3;
  } else {
    let onRoad = false;
    for(const r of CITY.H_ROADS) if(Math.abs(pos.z-r.z) < CITY.ROAD_HW) onRoad = true;
    for(const r of CITY.V_ROADS) if(Math.abs(pos.x-r.x) < CITY.ROAD_HW) onRoad = true;
    pos.y += ((onRoad ? .1 : .3) - pos.y)*.3;
  }

  tmp.set(Math.sin(camYaw)*CAM.dist, CAM.high, Math.cos(camYaw)*CAM.dist);
  tmp.add(pos);
  /* 相機防穿牆,細節見 street3d.html 同一段註解——理想機位跟角色中間隔了
     牆的話,把鏡頭拉到撞點前面一點。 */
  eyePos.set(pos.x, pos.y + hero.eyeY*CAM.lookY, pos.z);
  camDir.subVectors(tmp, eyePos);
  const wantDist = camDir.length();
  let camTarget = tmp;
  if(wantDist > .01){
    camDir.divideScalar(wantDist);
    camRay.set(eyePos, camDir);
    camRay.far = wantDist;
    const hit = camRay.intersectObjects(occluders, false)[0];
    if(hit) camTarget = eyePos.clone().addScaledVector(camDir, Math.max(3, hit.distance - 1.2));
  }
  camera.position.lerp(camTarget, 1 - Math.pow(.0015, dt/1000));
  camera.lookAt(pos.x, pos.y + hero.eyeY*CAM.lookY, pos.z);

  keyLight.position.set(pos.x-24, 34, pos.z+20);
  keyLight.target.position.copy(pos);
  city.updateLights(pos.x, pos.z);
  updateBuskerAudio(pos.x, pos.z);
  city.updateBushBillboards(camera.position.x, camera.position.z);
  whereEl.textContent = city.whereAmI(pos.x, pos.z);

  nearDoor = null;
  for(const d of city.doors)
    if(Math.hypot(pos.x-d.x, pos.z-d.z) < 3.6){ nearDoor = d; break; }

  /* 街上的小互動(摸狗、撿垃圾),2026-08-13 加的——跟門用同一套「距離內才
     顯示提示、按空白鍵觸發」,但門優先(nearDoor 先判斷),同一格站著不會
     兩個提示打架。litter 撿過會被移出 city.litter(見 interactProp),
     不用另外記一份「已撿」清單。 */
  nearProp = null;
  /* 騎乘中不能再摸狗/撿垃圾/上另一台車(騎在車上手不空),也不進門——
     ridingMoto 擋掉整段偵測,下面 hint 區塊另外處理「按空白鍵下車」。 */
  if(!nearDoor && !ridingMoto){
    for(const p of city.pets)
      if(Math.hypot(pos.x-p.x, pos.z-p.z) < 3.2){ nearProp = { type:'pet', ref:p }; break; }
    if(!nearProp) for(const l of city.litter)
      if(Math.hypot(pos.x-l.x, pos.z-l.z) < 3.2){ nearProp = { type:'litter', ref:l }; break; }
    if(!nearProp) for(const p of city.play)
      if(Math.hypot(pos.x-p.x, pos.z-p.z) < 3.2){ nearProp = { type:'play', ref:p }; break; }
    if(!nearProp) for(const m of city.motos)
      if(!m.ridden && Math.hypot(pos.x-m.x, pos.z-m.z) < 3.2){ nearProp = { type:'moto', ref:m }; break; }
    if(!nearProp && Math.hypot(pos.x-ALLEY_WORKER.x, pos.z-ALLEY_WORKER.z) < 3.2)
      nearProp = { type:'worker', ref:ALLEY_WORKER };
    if(!nearProp && Math.hypot(pos.x-STATUE.x, pos.z-STATUE.z) < 3.2)
      nearProp = { type:'statue', ref:STATUE };
    /* 路人搭話(2026-08-19,kc 要求「路邊人物都至少可以對話一句話」)——
       PEDESTRIANS 走位置會變,不能像 pets/litter 那樣讀固定的 x/z,直接
       讀 npc.group.position。純背景路人,不記名字、不分支對話,一句隨機
       閒聊蓋過去就好,跟阿源/阿姨那種有 npc-temple.js 完整資料的劇情
       NPC 不同層級,不要混在一起。 */
    if(!nearProp) for(const p of PEDESTRIANS)
      if(Math.hypot(pos.x-p.group.position.x, pos.z-p.group.position.z) < 2.6){
        nearProp = { type:'pedestrian', ref:p }; break;
      }
  }
  /* 巷口先聽到聲音再看到人(kc:「會聽到聲音」)——距離比互動範圍(3.2)
     寬一截,只飄一次(ALLEY_WORKER.heard 擋掉),不然每幀都跳字很吵。走過
     一次之後這句就不會再出現,跟 doors/nearProp 那套「範圍內才顯示」不同,
     這個是「路過聽到」的單次環境音,不是持續提示。 */
  if(!ALLEY_WORKER.heard && Math.hypot(pos.x-ALLEY_WORKER.x, pos.z-ALLEY_WORKER.z) < 9){
    ALLEY_WORKER.heard = true;
    toast('「小帥哥,要不要休息一下?」', 2600);
  }

  if(nearDoor && !busy && !dlg.on){
    hintEl.innerHTML = nearDoor.name + '　按 <b>空白鍵</b> 進去';
    hintEl.classList.add('on');
  } else if(nearProp && !busy && !dlg.on){
    hintEl.innerHTML = nearProp.type === 'pet' ? nearProp.ref.label + '　按 <b>空白鍵</b> 摸摸看'
                      : nearProp.type === 'play' ? nearProp.ref.label + '　按 <b>空白鍵</b> 玩一下'
                      : nearProp.type === 'moto' ? (nearProp.ref.forSale && !nearProp.ref.owned
                          ? '按 <b>空白鍵</b> 跟老闆談車'
                          : '按 <b>空白鍵</b> 騎上去')
                      : nearProp.type === 'worker' ? '按 <b>空白鍵</b> 搭話'
                      : nearProp.type === 'statue' ? '按 <b>空白鍵</b> 看看牌子上寫什麼'
                      : nearProp.type === 'pedestrian' ? '按 <b>空白鍵</b> 打聲招呼'
                      : '按 <b>空白鍵</b> 撿起垃圾';
    hintEl.classList.add('on');
  } else if(ridingMoto && !dlg.on){
    hintEl.innerHTML = '按 <b>空白鍵</b> 下車';
    hintEl.classList.add('on');
  } else if(MODE === 'city') hintEl.classList.remove('on');

  if(ridingMoto && !tunePanelSynced){ syncTunePanel(); tunePanelSynced = true; }
  else if(!ridingMoto) tunePanelSynced = false;
  tuneEl.classList.toggle('on', !!ridingMoto);
}

/* 2026-08-14 街上補了一隻貓(scene-city3d.js 的 placePet())——原本三句台詞
   是照狗寫的(「尾巴搖得很兇」對貓來說是不爽,不是開心),照 pet.label 分開
   兩組,不要共用同一份文案硬套在不同動物身上。 */
const PET_LINES = {
  '小狗': [
    '牠讓你摸了好一會,尾巴搖得很兇。',
    '牠靠著你的腳,好像沒有很想理你以外的人。',
    '摸起來有點髒,但牠好像很開心。'
  ],
  '貓': [
    '牠瞇著眼讓你摸了幾下,然後就走開了。',
    '牠用頭蹭了蹭你的手,但只有一下。',
    '摸到一半牠忽然翻過身,不知道是要你摸肚子還是想咬你。'
  ]
};
/* 五種垃圾的模型 2026-08-14 陸續換過(見 scene-city3d.js 的 LITTER_MODELS
   那段註解——判準是「一眼看得出是被丟掉的東西」,不是乾淨的產品模型),
   這裡的顯示文字要跟著模型長相走,不然撿起來的 toast 文案會跟畫面對不上:
   bottle 現在是黑色垃圾袋、lunchbox 是散落紙屑、flyer 是攤開的碎紙片、
   cup 是混雜垃圾堆(已經不是杯子形狀)。 */
/* 每種各自帶量詞,不是套固定的「一個」——cup 是混雜垃圾堆,套「一個垃圾堆」
   讀起來很怪(kc,2026-08-14),改用「一包垃圾」;其他四種維持「一個」。 */
const LITTER_KIND_NAME = { bottle:'一個垃圾袋', lunchbox:'一個紙屑', cig:'一個菸蒂', flyer:'一張傳單', cup:'一包垃圾' };
const PLAY_LINES = [
  '玩了一下,喘得比想像中快。',
  '好像有點久沒這樣玩了。',
  '玩到有點累,但心情好一點。'
];
/* 2026-08-13 kc 加的體力值:摸狗、撿垃圾、玩遊樂器材都要扣一點,見 DESIGN_NOTES
   「stamina」那節——範圍先只接這三種街上互動,沒有動到打工/上課/劇情那些
   既有系統。 */
/* 摸貓狗／撿垃圾 2026-08-14 補了彎腰動作(hero.playOnce(),見 scene-city3d.js
   的 rig.once)——玩家在動畫播完前不能再動、不能重複觸發,所以用 busy 卡住,
   跟開選單/走進門那些既有的 busy 用法一致。獎勵(改指標、丟 toast、移除
   垃圾)延到動畫播完的 callback 才做,不是按下空白鍵那一刻就做——這樣「蹲下
   去」跟「東西消失/指標變動」在時間上才對得上。playOnce() 找不到動畫檔案
   時會直接同步呼叫 callback(見那邊的註解),所以這裡不用另外判斷動畫載了
   沒,即使還沒有動畫可放,行為也跟改動前一樣。 */
/* 上車不用 hero.playOnce() 那套彎腰動畫——沒有騎乘姿勢的模型,先試「角色
   站在車上跟著走」(不是藏起來,kc 玩起來說角色整個消失像鬼在騎車,2026-08-14
   當場改掉)。角色本體位置本來就是 pos == hero.group.position,跟騎乘移動
   共用同一個座標,不用另外同步——只是站相,不是坐姿,kc 覺得站姿穿模/太怪
   再回頭調高度或找騎乘動畫。上車瞬間不 busy=true(跟摸貓狗/撿垃圾不一樣),
   因為不需要等動畫播完才能動,按下去立刻就能騎走。 */
/* 騎別人的車扣風評(2026-08-17,kc 要求)——只在「上車那一刻」扣一次,
   不是騎乘中持續扣(kc 明確選過,跟 fullness 那種持續消耗不一樣)。量比照
   steal() 當場被抓到那組(-1,不是脫身後被抓的重罰 -2),見上面 MOTO_PRICE
   的說明。m.owned 的車(跟機車行買下的那台)騎不扣分。 */
function mountMoto(m){
  ridingMoto = m; m.ridden = true;
  hintEl.classList.remove('on');
  if(m.owned){
    toast('騎上自己的車。', 1600);
  } else {
    chg('star', -1);
    toast('騎上別人的車——不是你的,先別想太多。', 2000);
  }
}
function dismountMoto(){
  const m = ridingMoto; if(!m) return;
  const pos = hero.group.position;
  m.x = pos.x; m.z = pos.z;                     // 車停在下車當下的位置,不是彈回原地
  m.ridden = false; ridingMoto = null;
  toast('把車停好,下車走路。', 1600);
}
/* 跟機車行買車(2026-08-17)——m.forSale 那台才會走這條,其餘車(包括這台
   買下之前)按空白鍵直接是 mountMoto(),見下面 interactProp() 那段判斷。
   付完錢當場 owned=true,之後騎這台不再扣風評(見 mountMoto())。 */
function buyMoto(m){
  openMenu('機車行', [
    { label:'付錢買下這台', cost:'$'+MOTO_PRICE, cls: ST.money<MOTO_PRICE?'bad':'',
      run(){
        if(ST.money < MOTO_PRICE){ toast('錢不夠,老闆看了你一眼。', 2000); return; }
        chg('money', -MOTO_PRICE); m.owned = true;
        toast('這台現在是你的了。', 2000);
        mountMoto(m);
      } },
    { label:'先騎騎看(不買)', cls:'risk', run: () => mountMoto(m) },
    { label:'算了', cls:'back', run(){} }
  ]);
}
/* 巷子那段互動(2026-08-17)——價位($500)先湊的數字,沒跟 kc 對過,比照
   MOTO_PRICE 那個做法先訂再說。三個選項刻意不寫成「選了壞結局/好結局」
   二分——「跟她走」不扣風評(這是私下的事,不是被抓到偷東西那種公開失格),
   純粹金錢/時間的交換;「聊兩句」給的是她這個人的一句處境,不是搞笑台詞,
   對照 CLAUDE.md 那條基準線。畫面上不演「跟她走」實際發生什麼,直接跳
   toast 帶過,跟這遊戲寫「偷東西」的做法(steal() 也是不演犯案過程)是
   同一個分寸。 */
const WORKER_PRICE = 500;
function talkToWorker(w){
  say('worker', '「怎樣,要不要陪你走一段?」\n\n她看你一眼,沒有堆笑臉,就是在問。', () => {
    openMenu('巷子裡', [
      { label:'付錢,跟她走', cost:'$'+WORKER_PRICE, cls: ST.money<WORKER_PRICE?'bad':'',
        run(){
          /* 2026-08-20 改成室內場景(見 enterMassage())之後,每個分支結束
             都要呼叫 leaveIndoor() 把玩家送回巷子,不然 openMenu() 一
             closeMenu() 就把 busy 放掉,人會卡在沒有 spots/collider 的
             越式按摩空場景裡動彈不得(那句「不用走動」是這個場景的設計,
             不是漏做離場邏輯)。錢不夠這條也要送出去,不是留在原地乾等。 */
          if(ST.money < WORKER_PRICE){
            toast('錢不夠。她聳聳肩,轉向別人。', 2000);
            setTimeout(leaveIndoor, 2000);
            return;
          }
          chg('money', -WORKER_PRICE); chg('mood', 6); chg('stamina', -10);
          advanceTime(25);
          w.talked = true;
          toast('半小時後,你一個人走回巷口。', 2600);
          /* 完整故事(圓環雕像那條支線,2026-08-20,見 DESIGN_NOTES)只在第一次
             「付錢跟她走」之後追加,用 setTimeout 接在上面那句 toast 淡出之後
             才跳出來,不要兩段疊在一起搶畫面。w.toldStory 擋之後重複——比較
             像「她只在那一次多說了」,不是每次都重播同一段獨白。錢買的是她的
             時間,不是這段故事本身,所以框架上不寫成「因為付了錢所以講」,
             是她自己選擇在這段安靜時間裡說出來。第一次講完故事、之後每次
             重複都用 leaveIndoor 當 say()/setTimeout 的收尾,送玩家回巷子。 */
          if(!w.toldStory){
            w.toldStory = true;
            setTimeout(() => say('worker',
              '她點了根菸,難得多說了幾句。\n\n「我有兩個查某囝仔。大的那個,以前被她爸打得很兇,我沒能力帶她走。她自己長大了,說要帶一群跟她一樣沒人要的女生打棒球——真的打起來了,還上過報。」\n\n她把菸捻熄。「後來出車禍,人就沒了。圓環那尊,是球隊那些人湊錢立的,不是我立的,我沒那個資格。」\n\n她看了你一眼,像是隨口感慨。「若她還活著,大概也跟你差不多歲數了。」',
              leaveIndoor
            ), 2700);
          } else {
            setTimeout(leaveIndoor, 2700);
          }
        } },
      { label:'就聊兩句,不談這個', cls:'',
        run(){
          w.talked = true;
          /* 追加一句埋伏筆(2026-08-20)——不點名跟圓環雕像的關係,只是先讓
             玩家知道她家裡還有一個小的,完整關係要付錢跟她走才會知道。
             say() 的 after 直接接 leaveIndoor,讀完這段話就送回巷子。 */
          say('worker', '「不是每個人站在這都是要幹嘛。」\n\n她說,眼睛沒離開巷口那頭的路燈。\n\n「有時候就是,這裡比家裡安靜。」\n\n她頓了一下,像是想到什麼。「家裡還有一個要顧,比較小的。」沒有再說下去。', leaveIndoor);
        } },
      { label:'不說話,轉身走掉', cls:'back', run(){ leaveIndoor(); } }
    ]);
  });
}
function interactProp(prop){
  /* 2026-08-20:跟她搭話不再直接在 3D 街景上彈選單,先 fade 進越式按摩店
     室內(enterMassage()),talkToWorker() 本身沒有改參數/呼叫時機,只是
     現在是從室內場景裡呼叫,不是從街上。 */
  if(prop.type === 'worker'){ enterMassage(); return; }
  /* 圓環雕像的碑文(2026-08-20)——單句、不署名不寫年份,跟 pet/litter 同
     層級的輕互動,一個 toast 帶過就好,不開選單。跟這尊雕像有關的完整
     故事在別處(圓環路人的 statueLine、talkToWorker() 的完整故事分支),
     這裡刻意留白,不重複講。 */
  if(prop.type === 'statue'){
    toast('（雕像底下有一塊小小的牌子)\n「致 那些沒有人要的女孩,妳們值得站上場。」\n沒有寫名字,也沒有寫年份。', 3600);
    return;
  }
  if(prop.type === 'moto'){
    if(prop.ref.forSale && !prop.ref.owned) buyMoto(prop.ref);
    else mountMoto(prop.ref);
    return;
  }
  if(prop.type === 'pet'){
    busy = true;
    /* 貓/狗共用摸的動作會摸空——貓矮,狗那份「Petting Animal」動畫伸手的
       高度對不到貓身上(kc:「貓還是完全沒摸到,貓要摸得更低」)。貓走
       pet_low(蹲到底那份,見 scene-city3d.js 的 rig.once 註解),其餘(狗)
       維持原本的 pet。 */
    const anim = prop.ref.label === '貓' ? 'pet_low' : 'pet';
    hero.playOnce(anim, () => {
      busy = false;
      chg('mood', 4);
      chg('stamina', -3);
      const lines = PET_LINES[prop.ref.label] || PET_LINES['小狗'];
      toast(lines[Math.random()*lines.length|0], 2400);
    });
  } else if(prop.type === 'play'){
    chg('mood', 3);
    chg('stamina', -5);
    toast(prop.ref.label + '。' + PLAY_LINES[Math.random()*PLAY_LINES.length|0], 2400);
  } else if(prop.type === 'pedestrian'){
    /* statueLine(2026-08-20):圓環雕像旁那隻路人專屬台詞,優先於下面的
       共用池——不受風評檔位影響,他講的是雕像的來歷,不是關於玩家的閒話。 */
    if(prop.ref.statueLine){ toast(prop.ref.statueLine, 3200); return; }
    /* 風評 <=-10 才會扯到家人(2026-08-19 kc 從 -40 改成 -10,門檻拉低,
       家人話題更容易觸發),-10~0 之間只是冷淡防備,>=0 維持原本的閒聊。
       聽到最難聽那檔扣一點心情,呼應「這種話真的會傷人」,不是聽聽就算了。 */
    const cruel = ST.star <= -10, cold = !cruel && ST.star < 0;
    const pool = cruel ? PEDESTRIAN_LINES_CRUEL : cold ? PEDESTRIAN_LINES_COLD : PEDESTRIAN_LINES;
    if(cruel) chg('mood', -4);
    toast(pool[Math.random()*pool.length|0], 2200);
  } else {
    const l = prop.ref;
    busy = true;
    hero.playOnce('pickup', () => {
      busy = false;
      chg('mood', -3);
      chg('stamina', -2);
      chg('star', 1);                                   // 好事,見 DESIGN_NOTES「風評」,2026-08-14 雙向化後好事要往正的走
      if(l.kind === 'bottle') chg('money', 2);
      toast('你撿起了' + (LITTER_KIND_NAME[l.kind] || '一個垃圾') + '。'
            + (l.kind === 'bottle' ? '（$2）' : ''), 2200);
      scene.remove(l.mesh);
      if(l.glow) scene.remove(l.glow);
      /* indexOf 可能是 -1(這個 litter 物件已經被移除過一次)——splice(-1,1)
         會誤刪陣列最後一個元素,測動畫版撿垃圾時手動連續呼叫兩次踩過這個
         (2026-08-14)。正常操作(空白鍵,keydown 那邊有 !busy 擋)不會重複
         觸發,但陣列操作本來就該防這一步,不要假設呼叫端一定乾淨。 */
      const li = city.litter.indexOf(l);
      if(li !== -1) city.litter.splice(li, 1);
      nearProp = null;
      hintEl.classList.remove('on');
    });
  }
}

let lastW=0, lastH=0;
function fit(){
  if(innerWidth===lastW && innerHeight===lastH) return;
  lastW=innerWidth; lastH=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}

const fpsEl = document.getElementById('fps');
let last = performance.now(), acc = 0, frames = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(50, now-last); last = now;
  fit(); tickDialog(dt);
  if(MODE === 'city'){ updateCity(dt); updateWorldLabels(); composer.render(); }
  else { updateIndoor(dt); renderIndoor3D(dt); renderIndoorForeground(); }
  acc += dt; frames++;
  if(acc > 500){ fpsEl.textContent = Math.round(frames*1000/acc)+' fps'; acc=0; frames=0; }
});

syncHUD(); drawTags();

/* 除錯用:主控台可以直接把角色傳到某個門口，省得走一分鐘 */
window.__dbg = {
  /* scene/city(2026-08-18):之前 __dbg 沒有直接暴露 3D 場景本身,要查某顆
     mesh 的材質/貼圖有沒有真的套上去,只能用 near() 那組間接資訊(位置/
     尺寸),沒法驗證材質——巷子冷氣機箱體那次(kc 說「根本沒有方塊啊」)
     就是靠暴露 scene 才能直接把材質暫時換成高強度發光色現場驗證,查出
     幾何/材質/貼圖其實都是對的,是巷子環境光真的太暗才讀不出來,不是
     哪裡漏接。留著這兩個當永久除錯工具,以後同類問題不用再繞。 */
  scene, city, PEDESTRIANS,
  goto(id){
    const d = city.doors.find(x => x.id === id);
    if(!d) return '沒有這個門：' + city.doors.map(x=>x.id).join(', ');
    hero.group.position.set(d.x, .3, d.z);
    return `已移到 ${d.name} (${d.x.toFixed(1)}, ${d.z.toFixed(1)})`;
  },
  enter(id){ const d = city.doors.find(x => x.id === id); if(d) enterIndoor(d); return MODE; },
  at(x, z){ hero.group.position.set(x, .3, z); return `已移到 (${x}, ${z})`; },
  near(x, z, r){ return scene.children.filter(o => o.isMesh && Math.hypot(o.position.x-x, o.position.z-z) < (r||3))
    .map(o => ({ pos:[+o.position.x.toFixed(2),+o.position.y.toFixed(2),+o.position.z.toFixed(2)],
                 rot:[+o.rotation.x.toFixed(3),+o.rotation.y.toFixed(3),+o.rotation.z.toFixed(3)],
                 scale:[+o.scale.x.toFixed(2),+o.scale.y.toFixed(2),+o.scale.z.toFixed(2)],
                 size: o.geometry?.parameters,
                 mat: (Array.isArray(o.material) ? o.material : [o.material]).map(m => ({
                   color: m.color?.getHexString(), map: !!m.map, mapSrc: m.map?.image?.src,
                   metalness: m.metalness, roughness: m.roughness
                 })) })); },
  leave(){ leaveIndoor(); },
  setIndoor(px, py, face){ IN.px=px; IN.py=py; if(face) IN.face=face; },
  tick(dt){ renderIndoor3D(dt||16); renderIndoorForeground(); },   // 手動推進一幀,不用等 rAF,方便測室內位置
  heroIndoor, indoorScene, renderer3d, IN, paintStoreBackdrop, paintHomeBackdrop,
  DAD_TWEAK, SHADOW_TWEAK, tweakDad: tweakDadPanel, tweakStall: tweakStallPanel,
  BEDROOM_WALK_TWEAK, tweakBedroom: tweakBedroomPanel,
  tuitionQuest: () => TUITION_QUEST, maybeTriggerStoryNode, seenStoryDays, dadCheckinLines,
  KNOWLEDGE, studyGainKnowledge,
  day: (n) => { if(n != null) day = n; return day; },
  indoorCalib(){
    const s = heroIndoor.group.scale.x;
    return { FIXTURE_COLLIDERS, heroPos: heroIndoor.group.position.toArray(), heroScale: s,
      footScreenY: heroIndoor.group.position.y, headScreenY: heroIndoor.group.position.y - s*PLAYER.height };
  },
  mode: () => MODE,
  place: () => PLACE,
  busy: () => busy,
  dlgOn: () => dlg.on,
  bounds: () => (PLACE === 'store' ? STORE : PLACE === 'home' ? HOME : BEDROOM),
  cam: indoorCamera,
  chg, steal, updateIndoor, openIndoorSpot, startCheckoutShift, getCO: () => CO,
  hire(){ IN.hired = true; return 'hired'; },
  pendingTheft: () => pendingTheft,
  /* 暫時性:只是要把店員的 3D 骨架轉成正面/背面兩張透明底 PNG 貼圖用,
     截完圖就會把這段刪掉,不是要留店員在場景裡即時渲染(那正是上一輪
     「跟照片級背景質感差太多」被拿掉的原因,見 DESIGN_NOTES)。 */
  spawnClerk(rotY, rig){
    if(this._clerk) indoorScene.remove(this._clerk.group);
    this._clerk = buildNPC(THREE, indoorScene, {
      rig: rig||'m2', rotationY: rotY||0,
      skin:'#cfa279', hair:'#201b17', hood:'#4a09b6', pants:'#2c3340', shoe:'#1a1a1a',
      tex:{ hood:'clerk-uniform.png' }   // 2026-08-14 kc 生的制服布料,跟 char-yuan-shirt.png 同一套 UV 鏡射貼法
    });
    this._clerk.group.position.set(640, 200, 0);
    this._clerk.group.scale.setScalar(INDOOR_HERO_SCALE);   // 跟 heroIndoor 同一招,見上面「畫面固定身高」
    return 'spawned';
  },
  clerkTick(dt){ if(this._clerk) this._clerk.animate(dt||16); renderer3d.render(indoorScene, indoorCamera); },
  captureClerk(){ return c3d.toDataURL('image/png'); },
  /* 2026-08-17:爸爸醉倒那張截圖用,跟 spawnClerk 同一招。2026-08-18 第二輪
     試過換成 pose:'lie'(Mixamo「Lying Down」,見 assets/models/README 跟
     scene-city3d.js MODELS.m.lie)拍側面全身躺平,kc 看了實際效果後打回票——
     **要的其實是坐姿、背對鏡頭**(口語的「醉倒」不是真的整個人躺平,是
     「癱坐著喝到不省人事」那種),跟 v2/v3 同一個方向,retire pose:'lie'
     這條路(程式碼留著、MODELS 裡的 lie 也留著,只是這裡不用了,以後真的
     要人整個躺平再撿回來用)。 */
  spawnDad(rotY){
    if(this._dad) indoorScene.remove(this._dad.group);
    this._dad = buildNPC(THREE, indoorScene, {
      /* 2026-08-18:kc 說「爸爸不夠老」——rig 'm'(Remy)本身是年輕成人的
         臉/體型,幾何換不了(見 DESIGN_NOTES「一顆骨架、多套皮膚」,髮型
         都換不了造型只能換色了,更別說臉),能動的只有髮色——原本
         HP.dadHair 是深棕黑(#26201c),這裡改成灰白撐老態,這是這條管線
         能做到的極限,不是精準的老人建模。 */
      rig:'m', rotationY: rotY||0, pose:'sit',
      skin: HP.dadSkin, hair:'#8a8a82', hood: HP.dadTop, pants: HP.dadPants, shoe:'#1a1a1a'
    });
    this._dad.group.position.set(640, 200, 0);
    this._dad.group.scale.setScalar(INDOOR_HERO_SCALE);
    return 'spawned';
  },
  dadTick(dt){ if(this._dad) this._dad.animate(dt||16); renderer3d.render(indoorScene, indoorCamera); },
  /* 2026-08-18:媽媽坐沙發那張截圖用,跟 spawnDad 同一招,rig 換 'f'
     (Sophie),借同一顆 sit.glb(見 scene-city3d.js MODELS.f.sit 那段
     註解)。截完就可以刪。 */
  spawnMom(rotY){
    if(this._mom) indoorScene.remove(this._mom.group);
    this._mom = buildNPC(THREE, indoorScene, {
      rig:'f', rotationY: rotY||0, pose:'sit',
      skin: HP.momSkin, hair:HP.momHair, hood: HP.momTop, pants: HP.momPants, shoe:'#1a1a1a'
    });
    this._mom.group.position.set(640, 200, 0);
    this._mom.group.scale.setScalar(INDOOR_HERO_SCALE);
    return 'spawned';
  },
  momTick(dt){ if(this._mom) this._mom.animate(dt||16); renderer3d.render(indoorScene, indoorCamera); },
  state: () => ({ ...ST, tags:CH.tags.slice(), time:fmtTime(minute),
                  pos:[+hero.group.position.x.toFixed(1), +hero.group.position.z.toFixed(1)] }),
  ridePose(patch){ if(patch) Object.assign(RIDE_POSE, patch); return { ...RIDE_POSE }; },
  isRiding: () => !!ridingMoto,
  boneWorldPos(){
    const bones = hero.debugBones();
    const out = {};
    Object.entries(bones).forEach(([name, b]) => {
      if(!b) { out[name] = null; return; }
      b.updateWorldMatrix(true, false);
      const e = b.matrixWorld.elements;
      out[name] = [+e[12].toFixed(3), +e[13].toFixed(3), +e[14].toFixed(3)];
    });
    return out;
  }
};
