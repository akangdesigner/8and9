  }
  else if(id === 'hot') openMenu('鮮食櫃', [
    { label:'拿即期便當', cost:'$58　飽足 +45　情緒 −3',
      run:() => addToBasket('即期珍食便當', 58, 45, -3, '🍱', '即期折扣的那格空了一個。') },
    { label:'排骨便當', cost:'$89　飽足 +48　情緒 +6', cls: ST.money<89?'bad':'',
      run:() => addToBasket('排骨便當', 89, 48, 6, '🍱') },
    { label:'蔬菜便當', cost:'$75　飽足 +38　情緒 +5', cls: ST.money<75?'bad':'',
      run:() => addToBasket('蔬菜便當', 75, 38, 5, '🍱') },
    { label:'茶葉蛋', cost:'$15　飽足 +10　情緒 +1', run:() => addToBasket('茶葉蛋', 15, 10, 1, '🥚') },
    { label:'雞排', cost:'$65　飽足 +30　情緒 +8', cls: ST.money<65?'bad':'', run:() => addToBasket('雞排', 65, 30, 8, '🍗') },
    { label:'塞進外套', cost:'看店員', cls:'risk', run:() => steal(45) },
    { label:'不拿了', cls:'back', run(){} }
  ]);
  else if(id === 'shelf') openMenu('貨架', [
    { label:'買泡麵', cost:'$25　飽足 +20　情緒 +1', run:() => addToBasket('泡麵', 25, 20, 1, '🍜') },
    { label:'買洋芋片', cost:'$40　飽足 +15　情緒 +6', run:() => addToBasket('洋芋片', 40, 15, 6, '🍟') },
    /* 小胖的傷口任務用的藥水(2026-08-31,見上面 FAT 那則長筆記)——只在
       任務開著、還沒買過的時候才出現,不會平白多一個跟食物架格格不入的
       選項。不走 addToBasket()/FOOD 那套(那是給「角色面板點開才吃掉」
       的食物用的),直接當場扣錢+設旗標,買了就是買了,不用另外去背包
       點一次。 */
    ...(FAT.questActive && !FAT.hasMedicine ? [{ label:'買消毒藥水', cost:'$40', cls: ST.money<40?'bad':'',
      run:() => {
        if(ST.money < 40){ toast('你身上不夠。', 2000); return; }
        chg('money', -40);
        toast('你買了瓶消毒藥水，收進口袋。', 2200);
        FAT.hasMedicine = true;
      } }] : []),
    { label:'塞進口袋', cost:'看店員', cls:'risk', run:() => steal(20) },
    { label:'離開', cls:'back', run(){} }
  ]);
  else if(id === 'fridge') openMenu('飲料櫃', [
    { label:'買礦泉水', cost:'$15　飽足 +3', run:() => addToBasket('礦泉水', 15, 3, 0, '💧') },
    { label:'買豆漿', cost:'$20　飽足 +12　情緒 +3', run:() => addToBasket('豆漿', 20, 12, 3, '🥛') },
    { label:'買運動飲料', cost:'$30　飽足 +6　情緒 +5', run:() => addToBasket('運動飲料', 30, 6, 5, '🧃') },
    { label:'買奶茶', cost:'$35　飽足 +8　情緒 +7', run:() => addToBasket('奶茶', 35, 8, 7, '🧋') },
    { label:'塞進口袋', cost:'看店員', cls:'risk', run:() => steal(8) },
    { label:'離開', cls:'back', run(){} }
  ]);
  else if(id === 'counter'){
    const items = [];
    if(IN.basket.length) items.push({ label:'結帳', cost:'共 $' + basketTotal(), run: checkout });
    if(!IN.askedJob) items.push({ label:'問有沒有缺人', cost:'打工', run:() => {
      IN.askedJob = true;
      say('clerk','「你幾歲？」', () =>
      say('pc','「十六。」', () =>
      say('clerk','「大夜要滿十八。」\n\n他頓了一下。\n\n「白天早班可以，一小時一百八十三。\n　你要留個電話嗎？」',
          () => { IN.hired = true; chg('calm',-4); toast('早班的時間，是你上課的時間。', 3400); })));
    }});
    /* 上班(2026-08-19,kc 要求「早班不是死門,是翹課換錢」,見
       docs/DESIGN_NOTES.md「早班不是死門」節)——`IN.askedJob` 那段問完
       之後 `IN.hired` 就是 true,櫃台就會多這個選項,點了直接開始收銀
       小遊戲。沒有另外接「今天是不是排班日」的日曆邏輯,想上班隨時可以
       上,範圍先縮到這裡。
       一天只能上班一次(2026-08-19 第九輪,kc 要求)——跟 steal()/
       stealCaughtDay 同一招:記「上次上班是哪一天」,今天已經上過班了
       選項還在,點下去只丟 toast 說明,不是直接把選項藏起來(藏起來玩家
       會搞不懂「上班」怎麼不見了,steal() 那套已經驗證過這樣比較清楚)。 */
    /* 2026-08-21 kc:「工作...都會扣體力」——一整輪班(3 小時收銀)扣 −40
      (第一版 −20,同一天第二輪 kc 要求連同對話/讀書一起調重,見
      interactProp() 上面那則筆記),比對話/讀書都重,做完一輪班應該要
      累到想回家。體力歸零擋在開班之前,不是開下去才發現扣成負的
      (chg() 本來就會 clamp 在 0,但擋在門口訊息比較清楚,跟讀書/對話
      那兩處做法一致)。 */
    if(IN.hired) items.push({ label:'上班',
      cost: day === workedDay ? '今天上過班了' : (ST.stamina<=0 ? '體力不夠' : '翹課,開始收銀　體力 −40'),
      cls: (day !== workedDay && ST.stamina<=0) ? 'bad' : '',
      run: () => {
        if(day === workedDay){ toast('店長說今天班表滿了,明天再來。', 2400); return; }
        if(ST.stamina <= 0){ toast('你累到不行了，先回家睡一下。', 2400); return; }
        chg('stamina', -40);
        startCheckoutShift();
      } });
    items.push({ label:'看店員在幹嘛', cost:'', run:() =>
      toast(IN.clerkFace === 'B' ? '他背對著你在補菸。' : '他站在收銀機前面，眼睛掃過店裡。', 2400) });
    items.push({ label:'離開', cls:'back', run(){} });
    openMenu('櫃台', items);
  }
}

/* ===================================================================
   收銀小遊戲(2026-08-19)——見 docs/DESIGN_NOTES.md「早班不是死門,是
   翹課換錢:結帳小遊戲」節。自成一套 requestAnimationFrame 迴圈,開著的
   時候不動主線的 city/indoor render loop,關掉就停,互不干擾。

   第三輪(同一天):kc 玩過第二版(客人排隊、玩家換裝站櫃檯)說「不要
   黑畫面計算機」——原本置中彈窗+九宮格數字鍵盤拿掉,改走遊戲既有的
   對話框(`#dialog`/`say()`):客人的商品用一句台詞講出來(含單價跟
   「第二件五折」,總金額不直接講,算術題目還在),玩家按 Enter/數字鍵
   直接在對話框裡打字回答「找多少」,不用滑鼠點按鈕。同時排隊的人改成
   「側面站著等、輪到才轉向玩家」(kc 原話「人會面對側邊」),玩家站位
   也真的被櫃檯擋住下半身(`coDrawClerkClip()`,照 `buildHotCutMask()`
   那套「從背景照片裁一塊貼在 3D 層上面」的既有手法,不是新技術)。
   這輪定案的構圖先畫了一張示意圖跟 kc 對過,見對話紀錄。 */
/* 品項/價格直接照抄鮮食櫃/貨架/飲料櫃那三個 openMenu() 陣列裡的數字
   (2026-08-19 這輪定的),沒有抽成共用陣列去改那三處——那是已經在跑的
   購買邏輯,不想為了這裡的重用冒風險去動它。之後兩邊價錢要是不同步了,
   兩處都要改,先記著。 */
const CHECKOUT_ITEMS = [
  { name:'i珍食便當', price:58 }, { name:'排骨便當', price:89 }, { name:'蔬菜便當', price:75 },
  { name:'茶葉蛋', price:15 }, { name:'雞排', price:65 },
  { name:'泡麵', price:25 }, { name:'洋芋片', price:40 },
  { name:'礦泉水', price:15 }, { name:'豆漿', price:20 }, { name:'運動飲料', price:30 }, { name:'奶茶', price:35 }
];
const CO_CUSTOMERS_PER_SHIFT = 5;
const CO_TIME_PER_CUSTOMER = 10000;   // 毫秒,「有時間壓力」是 kc 定的,10 秒先抓一個量級
const CO_WRONG_MONEY = -20, CO_WRONG_MOOD = -5;   // 算錯:扣錢(收銀機短少自己補)+ 扣情緒(被罵),kc 2026-08-19 定案
/* 上班本身耗情緒(2026-08-26,kc:「讀書工作本身會扣情緒」)——不分算對算錯,
   每接一位客人都扣一點,見 coResolve()。算錯那筆(CO_WRONG_MOOD)疊在這筆
   上面,不是取代——一整班 5 位客人全對也會扣 10 情緒(工作本來就累),
   算錯的那幾位額外更痛。 */
const CO_BASE_MOOD = -2;
const CO_RIGHT_WAGE = 35;                          // 算對一筆的錢,不是真的照時薪算,先抓一個感覺對的數字

/* 排隊位置(640×360 邏輯座標,跟 IN.px/IN.py 同一套,見 renderIndoor3D()
   那邊的說明)——肉眼抓的,面對櫃台的方向排成一直線,只做水平移動
   (kc 原話「他們只是水平往前走到櫃檯」),沒有前後深度變化。排隊時
   rotationY 用 90 度(側面),輪到那位在 coUpdateQueue() 裡臨時轉正
   (0 度,面向玩家),見下面。 */
const CO_QUEUE_PX = [500, 430, 360], CO_QUEUE_PY = 260;
const CO_CLERK_PX = 540, CO_CLERK_PY = 210;   // 玩家上班時站的位置(原本走去互動櫃台的那一帶)
/* 玩家站位下半身被櫃檯擋住(2026-08-19 第三輪,kc 要求「主角要在櫃檯內」)
   ——照 buildHotCutMask() 同一招:從已經合成好的 c2dbg(1280×720,跟畫布
   同一個座標系統)裁一塊「櫃檯前緣以下」的區域貼到 3D 玩家層上面。**第一版
   直接從 wallImg 裁被 kc 抓到「破圖」**——wallImg 是原始檔案(1668×943 或
   類似的真實解析度),`paintStoreBackdrop()` 畫到 1280×720 畫布上時整張
   縮放過,直接拿 1280×720 空間的座標去裁「還沒縮放」的原始檔案,裁到的
   內容跟畫面實際比例對不上,貼上去自然是歪的。改成從 c2dbg(已經是縮放
   合成後的結果)裁,來源座標系統才會跟畫面一致,跟鮮食櫃遮擋那段用的是
   同一份邏輯,不是另外發明一套。
   **第二版寬度(950~1280,330px)蓋過頭,把最前面那位客人(CO_QUEUE_PX[0]
   =500,世界座標 1000)也一起遮住,只剩一雙鞋浮在畫面上**——kc 抓到「第一
   個客人不能被擋掉」。第三版收窄到 1020~1140,kc 玩起來還是回報「有點
   被切掉」——玩家模型本身在這個縮放比例下腿部寬度粗抓只需要 50px 左右
   (INDOOR_HERO_SCALE 換算回來的量級),1020~1140(120px)留了兩倍以上
   的餘裕,代表問題不是矩形不夠窄,是離客人(世界座標 1000)不夠遠
   (只留 20px)。**這輪原則改成:矩形盡量窄、但離客人盡量遠**——收窄到
   剛好蓋住玩家腿部的寬度(1045~1115,70px,一樣以玩家中心 1080 對稱),
   跟客人的淨空從 20px 拉開到 45px。kc 玩起來如果還是覺得切到,代表玩家
   实際腿部寬度比這裡估的更寬,要再加寬,但同時把整條排隊線
   (CO_QUEUE_PX)往左移遠一點分攤壓力,不要只靠縮窄矩形這一個手段。 */
/* 第四輪(2026-08-19,kc:「手不會在櫃檯前面,所以不會看到櫃檯下方的手」)
   ——前三輪只顧著量腿的寬度,矩形卡得剛好貼腿,站定不動時看起來是對的;
   idle 動畫手臂會擺動,擺到 70px 這條窄欄外面就會露出來,變成「手穿模」。
   左邊(x:1045)是客人淨空的硬限制不能再往左收,右邊沒有這個限制,直接
   加寬(70→130)吃掉手臂擺動的空間;高度也往上多留 20px(y 254 起),
   蓋住手臂稍微抬高、還沒抬到櫃檯桌面之上那個過渡帶。如果玩起來手還是
   露在左邊(客人那一側),下一步照上面第三輪筆記講的,把 CO_QUEUE_PX
   整條往左移遠,不要再往左收這個矩形。 */
const CO_CLERK_CLIP = { x:1045, y:CLERK_TWEAK.clipY-20, w:130, h:220 };
function coDrawClerkClip(){
  const r = CO_CLERK_CLIP;
  g2f.imageSmoothingEnabled = true;
  g2f.drawImage(c2dbg, r.x, r.y, r.w, r.h, r.x, r.y, r.w, r.h);
}
/* 2026-08-20:原本 5 組只有 m/f/m2 三副骨架湊,重複用了兩次 rig 'f' 跟兩次
   rig 'm',kc 玩起來覺得排隊客人臉都差不多。補了 m3(Brian)/f2(Megan)
   兩副新骨架後,把原本重複的第 4/5 組換成新骨架,5 組現在各自一副骨架,
   不重複了——見 assets/models/README.md 跟 DESIGN_NOTES「排隊客人外觀會
   重複」那節。 */
const CO_CUSTOMER_LOOKS = [   // 純色換裝,跟巷子/廟口那些配角同一套,不用新素材
  { rig:'m',  skin:'#c2a17e', hair:'#2c2622', hood:'#3a4a5c', pants:'#2b2b2b', shoe:'#4a4038' },
  { rig:'f',  skin:'#c9a077', hair:'#241f1c', hood:'#6a3a4a', pants:'#333333', shoe:'#4a4038' },
  { rig:'m2', skin:'#b98a63', hair:'#3a3128', hood:'#4a4a3a', pants:'#26241f', shoe:'#3a3430' },
  { rig:'f2', skin:'#c9976e', hair:'#3a2e26', hood:'#5c4a3a', pants:'#232323', shoe:'#3a3430' },
  { rig:'m3', skin:'#b98a63', hood:'#2e4a3a', pants:'#2b2b2b', shoe:'#4a4038' }
];
function coSpawnQueueMember(px){
  const look = CO_CUSTOMER_LOOKS[Math.floor(Math.random()*CO_CUSTOMER_LOOKS.length)];
  const npc = buildNPC(THREE, indoorScene, {
    rotationY: Math.PI/2, rig: look.rig,   // 側面排隊,見上面 CO_QUEUE_PX 註解
    skin: look.skin, hair: look.hair, hood: look.hood, pants: look.pants, shoe: look.shoe
  });
  npc.group.position.set(px*SC, 720 - CO_QUEUE_PY*SC, 0);
  npc.group.scale.setScalar(INDOOR_HERO_SCALE);
  return { npc, px, targetPx: px };
}
function coUpdateQueue(dt){
  CO.queue.forEach((m,i) => {
    m.px += (m.targetPx - m.px) * Math.min(1, dt*.006);
    m.npc.group.position.x = m.px*SC;
    m.npc.animate(dt);
    /* 正在服務的那位轉向玩家(2026-08-19 第六輪)——`0`、`Math.PI/2`(排隊
       預設值)、`-Math.PI/2` 都被 kc 實測抓到方向不對,四個角度只剩
       `Math.PI` 沒試過,這輪換這個。細節見 DESIGN_NOTES「客人轉錯邊」

/* 「第二件五折」的算法只寫這一處——coBasketLine() 組台詞、算總計都要用
   同一份公式,不然會出現「台詞裡的單價乘一乘,跟遊戲內部算的總計對不上」
   的錯覺(2026-08-19 第一版就在這裡踩過一次,見 DESIGN_NOTES)。 */
function coLineTotal(b){
  if(b.promo && b.qty >= 2) return b.price + Math.round(b.price/2)*(b.qty-1);
  return b.price*b.qty;
}
function coGenCustomer(){
  const n = 1 + Math.floor(Math.random()*3);
  const basket = [];
  for(let i=0;i<n;i++){
    const it = CHECKOUT_ITEMS[Math.floor(Math.random()*CHECKOUT_ITEMS.length)];
    const promo = CO.promoSet.includes(it.name);
    const qty = (promo && Math.random()<.6) ? 2 : 1;
    basket.push({ name:it.name, price:it.price, qty, promo });
  }
  const total = basket.reduce((s,b) => s + coLineTotal(b), 0);
  const payQR = Math.random() < .4;
  /* given 不管 payQR 都要算(2026-08-19 第九輪)——手機支付這單用不到真的
     找零,但選項要跟現金客人共用同一組「$金額」干擾項,這個假想的找零錨點
     兩種客人都要有。 */
  const bills=[100,500,1000];
  const given = bills.find(v => v >= total) || 1000;
  return { basket, total, payQR, given };
}
/* 客人講的話——故意不直接講總金額,只講每樣東西的單價(跟「第二件五折」
   標註),總金額/找零還是要玩家自己心算,不然這個小遊戲的算術挑戰就
   被講話直接洩題了。 */
function coBasketLine(c){
  const parts = c.basket.map(b => {
    const promoTxt = (b.promo && b.qty >= 2) ? '，第二件五折' : '';
    return b.qty > 1 ? `${b.name} ${b.qty}份（$${b.price}／份${promoTxt}）` : `${b.name}（$${b.price}）`;
  });
  const itemsText = parts.join('、');
  return c.payQR ? `「${itemsText}。我用手機付。」` : `「${itemsText}。這是 $${c.given}。」`;
}

/* 找零改成選項(2026-08-19 第七輪,kc 說「我要可以直接有選項」)——上上輪
   打字輸入(鍵盤直接在對話框裡打數字)整套拿掉。金額選項一個是正確
   答案,其餘是 `CO_WRONG_DELTAS` 裡隨機抽的偏移量湊出來的錯誤選項
   (可能同分重複,`Set` 去重到湊滿為止)。 */
const CO_WRONG_DELTAS = [10,-10,20,-20,5,-5,50,-50,15,-15];
function coShuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* count/mustIncludeCorrect(2026-08-19 第九輪)——手機支付客人也要跟現金
   客人共用這組金額選項當干擾項,但那個「找多少」的錨點對手機客人來說
   本來就不會是正確答案,不用特別把它塞進 Set(mustIncludeCorrect=false),
   單純拿來湊 3 個看起來合理的金額誘餌。 */
function coChangeOptions(correct, count=4, mustIncludeCorrect=true){
  const pool = coShuffle(CO_WRONG_DELTAS);
  const opts = new Set(mustIncludeCorrect ? [correct] : []);
  for(const d of pool){
    if(opts.size >= count) break;
    const v = correct + d;
    if(v >= 0 && v !== correct) opts.add(v);
  }
  return coShuffle([...opts]).slice(0, count);
}
/* 手機支付跟找零合併成同一組選項(2026-08-19 第九輪,kc 抓到「每個客人
   都要問問題,只是如果他有提到手機支付你就選掃 QR CODE,誤選也算錯」)

   沒有真的在考;現在不管客人付現還付手機,都是同一組 4 個選項(QR CODE
   +3 個金額干擾項),玩家要真的聽客人講的是「我用手機付」還是報金額現金,
   選錯——不管是現金客人選了 QR、還是手機客人選了金額——都算
   coResolve(false)。金額干擾項的錨點是 given-total(假裝這單是現金會
   找多少),手機客人這個錨點只拿來生像樣的干擾選項,不會被判定正確。 */
function coBeginAnswer(){
  const c = CO.customer;
  const change = c.given - c.total;
  dName.textContent = '客人';
  /* 2026-08-21 kc 玩過反映「怎麼收這筆？」誤導,以為只是選付款方式——
     原本故意寫中性是要考「有沒有聽客人講手機支付」(見上面第九輪那則
     筆記),kc 現場決定推翻,改回直接問「要找多少錢？」,接受 QR 客人
     這句話會比較容易被猜到,清楚優先。 */
  dTx.textContent = `${coBasketLine(c)}\n要找多少錢？`;
  dCaret.classList.remove('on');
  const moneyOpts = coChangeOptions(change, 3, !c.payQR).map(v => ({
    label: '$' + v, correct: !c.payQR && v === change
  }));
  const qrOpt = { label:'掃 QR CODE', correct: c.payQR };
  coShowOptions(coShuffle([qrOpt, ...moneyOpts]).map(o => ({
    label: o.label,
    run: () => coResolve(o.correct)
  })));
}
/* WRONG_LINES(2026-08-19)——kc 定案「算錯會被罵」,語氣照這個專案一貫

/* 下班結算分級(2026-08-19 第十輪,kc 要求「不是說算對幾個是失誤幾次」

const CO_BONUS = 40;   // 表現好的額外獎金,不是按時薪算,先抓一個感覺對的數字
function coShiftReview(n, correct){
  const wrong = n - correct;
  if(wrong === 0) return {
    lines: [ `「今天 ${n} 個客人，一次都沒錯。」`, '「算你會做事，多給你一點。」' ],
    tip: '客人越急你反而要慢下來算——這個訣竅你自己抓到了。',
    bonus: CO_BONUS
  };
  if(wrong <= 2) return {
    lines: [ `「${n} 個裡面錯 ${wrong} 個，還可以。」` ],
    tip: '找錢先算總金額，再算差額，不要一步到位用猜的。',
    bonus: 0
  };
  return {
    lines: [ `「${n} 個裡面錯了 ${wrong} 個，這樣我要自己貼多少你知道嗎？」`,
              '「你這種背景的，我大概猜得到會這樣。」' ],
    tip: '算不出來就慢下來重算一次，比錯了道歉快。',
    bonus: 0
  };
}
function coEndShift(){

  /* 下班後店員跟你對話核發工資(2026-08-19 第九輪,kc 要求)——原本是
     toast 帶過,改成真的幾句店員台詞(main lines + 小叮嚀),用
     coSayChain() 接力播,錢在最後一句 main line 出現前給
     (chg('money',wage),飄字會跟對話同時跳出來,視覺上像「這是你的
     錢」那個動作)。busy 這裡照舊放開(跟其他 say() 呼叫端一樣),接下來
     擋玩家走動的是 dlg.on,不是 busy——兩者是分開判斷的(見移動邏輯的
     `!busy && !dlg.on`),不用在這裡刻意再鎖一次。 */
  /* 超商制服(2026-08-28,kc:「超商打工可以獲得超商的衣服」)——第一次
     下班就拿到,不分表現好壞(制服是上班本來就會發的,不是獎勵),之後
     每次下班 `owned.includes` 都會是 true,不會重複發。 */
  const gotUniform = !owned.includes('uniform');
  if(gotUniform) owned.push('uniform');
  coFade('下班', () => {
    busy = false;
    advanceTime(180);
    chg('money', wage);
    if(gotUniform) toast('店長把備用制服丟給你：「上班要穿這件。」（衣櫃多了一件超商制服）', 3200);
    coSayChain('clerk', [...review.lines, review.tip]);
  });
}
/* say() 一次只能播一句,接力播多句要靠 after 回呼一路串下去——跟
   game.html 別處(問有沒有缺人那段)手寫巢狀 say() 是同一招,只是這裡
   句數會變(2~3 句看分級結果),包成一個小函式比每個分級各寫一次巢狀
   呼叫省事。 */
function coSayChain(who, lines, i, after){
  i = i || 0;
  if(i >= lines.length){ after && after(); return; }
  say(who, lines[i], () => coSayChain(who, lines, i+1, after));
}

function updateIndoor(dt){
  /* 越式按摩室內(2026-08-20)沒有 spots/collider,整段是 say()/openMenu()
     鎖住輸入的對話場景,kc 明確要求「不用走動」——直接在這裡擋掉,不要
     依賴 busy/dlg.on 剛好全程都是 true 這個隱含假設(付錢那個分支 toast
     跟下一段對話中間有一小段 busy/dlg.on 都是 false 的空檔,那段空檔方向鍵
     還是會動,所以要在這裡明講擋掉,不是繞個彎湊巧擋住)。 */
  if(PLACE === 'massage') return;
  /* 醫院(2026-09-02)——跟越式按摩同一個做法,整段是 playBeats() 鎖住輸入
     的一次性演出,見上面「阿嬤在醫院」那則長筆記跟 scene-hospital.js
     開頭的說明。 */
  if(PLACE === 'hospital') return;
  /* 偷玩手遊小遊戲進行中(2026-08-31)——跟下面 ARCADE_ANIM 那段同精神,
     整段搶走輸入,每幀跑 tickPhoneGame() 算警示計時+重畫。 */
  if(PHONE_GAME.active){ tickPhoneGame(dt); IN.near = null; return; }
  /* 機台演出/推幣機小遊戲進行中(2026-08-26,第二輪改成畫在 #arcadeGame
     大面板,見上面 agDrawSpin() 那則筆記)——整段搶走輸入,跟 walkTarget
     那段同一個精神。pusher 的指示條每幀來回跑(ping-pong,0~1 之間),
     直接改 #agBarPin 的 style.left(DOM 元素,不是畫在 canvas 上);
     slot/roulette 是倒數計時,每幀呼叫 agDrawSpin() 重畫一次,時間到才
     呼叫 cb()(真正的 gambleResolve())。pusher 的「按空白鍵鎖定」攔在
     keydown 那邊(resolvePusherLockIn()),不是這裡。 */
  if(ARCADE_ANIM.active){
    if(ARCADE_ANIM.kind === 'pusher'){
      /* 難度調高(2026-08-26 第二輪)——速度從 .0016 提到 .0026(+62%),
         配合 resolvePusherLockIn() 縮小的 sweet spot,兩件事一起做才
         真的變難,只調其中一個(縮小範圍但速度不變,或加快但範圍不變)
         效果都不夠明顯。 */
      ARCADE_ANIM.barPos += ARCADE_ANIM.barDir * dt * .0026;
      if(ARCADE_ANIM.barPos >= 1){ ARCADE_ANIM.barPos = 1; ARCADE_ANIM.barDir = -1; }
      else if(ARCADE_ANIM.barPos <= 0){ ARCADE_ANIM.barPos = 0; ARCADE_ANIM.barDir = 1; }
      agBarPin.style.left = (ARCADE_ANIM.barPos*100) + '%';
    } else {
      ARCADE_ANIM.t += dt;
      agDrawSpin();
      if(ARCADE_ANIM.t >= ARCADE_ANIM.dur){
        const cb = ARCADE_ANIM.cb; ARCADE_ANIM.active = false; ARCADE_ANIM.cb = null; busy = false;
        cb && cb();
      }
    }
    IN.near = null;
    return;
  }
  /* 自動走位(2026-08-18,媽媽借錢那段「先說欸→你自動走到她面前→才開口
     借錢」用):`IN.walkTarget` 有值就整段搶走玩家輸入,自己把 IN.px 往
     target.px 推,跟按鍵移動共用同一個每幀步進量(1.35,沒有乘 dt——
     這個檔案裡按鍵移動本來就是這樣算的,固定幀距步進不是真的 delta-time
     移動,這裡跟著同一個假設走,不要自己另外做一套更精確但手感不一致的
     版本)。到達(差距 < 步進量)才 snap 到 target.px、把臉轉成
     `target.face`、清掉 walkTarget、呼叫 `target.cb()`——呼叫時機故意
     放在清空 walkTarget 之後,cb 裡如果又設了新的 walkTarget(這輪沒用到,
     但這樣寫比較不會被未來的呼叫方踩到「呼叫時前一個 walkTarget 還沒清」
     的坑)。 */
  if(IN.walkTarget){
    const t = IN.walkTarget;
    const dpx = t.px - IN.px;
    if(Math.abs(dpx) <= 1.35){
      IN.px = t.px; IN.face = t.face; IN.moving = false;
      IN.walkTarget = null;
      t.cb && t.cb();
    } else {
      IN.px += Math.sign(dpx)*1.35;
      IN.face = dpx < 0 ? 'L' : 'R';
      IN.moving = true; IN.walkT += dt;
    }
    IN.near = null; hintEl.classList.remove('on');
    return;
  }
  /* 店員轉身/事後抓包只在超商發生,家裡/房間沒有店員,整段跳過。 */
  if(PLACE === 'store'){
    /* 2026-08-14 kc:「店員背面跟隨機轉身」——不用固定週期(舊的 2D 像素人
       時代是 `clerkT % 6600 < 2400` 那種固定循環,現在改成每次轉身後隨機
       抽下一次轉身要等多久,3~8 秒之間,比固定節奏更像真人站著不耐煩偶爾
       轉一下,不是機械化的來回擺頭。轉身當下才呼叫 paintStoreBackdrop()
       重繪背景貼對應那張圖,不是每幀都重畫。 */
    IN.clerkT += dt;
    if(IN.clerkT >= IN.clerkNextTurn){
      IN.clerkFace = IN.clerkFace === 'F' ? 'B' : 'F';
      IN.clerkNextTurn = IN.clerkT + 3000 + Math.random()*5000;
      paintStoreBackdrop();
      /* 2026-08-14 kc:轉回正面那一刻,如果玩家手上還有沒安全脫身的贓款
         (pendingTheft>0)——人還在店裡,算事後被抓一次總帳:扣風評、東西
         退回去(chg('full',-pendingTheft) 把之前偷到的飽足感扣回來)、
         今天不能再偷(stealCaughtDay=day,steal() 開頭會擋)。玩家已經走出
         超商的話 MODE 不會是 'indoor',updateIndoor() 根本不會被呼叫到,
         等於「走出去之前都算在店內」,跟 steal() 那句 toast 的說法一致。 */
      if(IN.clerkFace === 'F' && pendingTheft > 0){
        const amt = pendingTheft; pendingTheft = 0; stealCaughtDay = day;
        chg('full', -amt); chg('star', -2); chg('calm', -20);
        say('clerk', '「等一下。」\n\n他轉過身,先看你的外套,再看架上少的那格。\n沒有人說話。你把東西放回去。',
            () => toast('這家店你今天別再想了。', 3200));
      }
    }
  }

  const bounds = PLACE === 'store' ? STORE : PLACE === 'home' ? HOME
               : PLACE === 'school' ? SCHOOL : PLACE === 'arcade' ? ARCADE
               : PLACE === 'corridor' ? CORRIDOR : PLACE === 'tattoo' ? TATTOO : BEDROOM;

  let dx=0, dy=0;
  if(keys['a']||keys['arrowleft'])  dx -= 1;
  if(keys['d']||keys['arrowright']) dx += 1;
  if(keys['w']||keys['arrowup'])    dy -= 1;
  if(keys['s']||keys['arrowdown'])  dy += 1;
  /* 教室禁止斜走(2026-08-25,kc:「主角橫著走之後只有正面往老師的方向
     才能前後走,不然會撞到其他角色的圖」)——小美/主角空位那兩張疊圖是
     平面去背貼紙,只有側面(L/R)姿態的碰撞框沒有另外量過,斜著走
     (同時按住左右+上下)會用正面的深度移動疊到側面站姿的位置,視覺上
     整個人陷進疊圖裡。最簡單的擋法是不讓斜走發生:有 dx 就把 dy 歸零,
     逼玩家鬆開左右鍵、單獨按上下鍵(這樣按下去 IN.face 才會轉回
     'F'/'B',跟「正面才能走」那句話是同一件事的兩種講法)。其他場景
     (store/home/bedroom)不受影響,那些沒有這批側面疊圖的問題。 */
  if(PLACE === 'school' && dx) dy = 0;
  /* 客廳/房間只能轉面、不能走深度(2026-08-19),見 DESIGN_NOTES「客廳
     第三版:只能轉面、不能走深度」。房間是這輪新加的——kc 截圖抓到走到
     深處人會浮在地板上方(固定鏡頭高度的正交鏡頭,沒有真的跟著照片的
     透視走,只有 walkS 附近那條線眼睛校過看起來是對的,再往後退誤差就
     露出來),鎖住深度直接讓玩家永遠站在那條校過的線上,不用再另外解
     透視校正。 */
  const lockDepth = PLACE === 'home' || PLACE === 'bedroom' || PLACE === 'corridor';

  if(!busy && !dlg.on && (dx||dy)){
    /* 2D 室內也能跑(2026-08-19,kc 要求):跟 updateCity() 的 Shift=2 倍
       同一顆 keys['shift']、同一個倍率,手感才一致——街上用 Shift 跑習慣了
       走進室內卻沒反應會覺得壞掉。 */
    const run = keys['shift'] ? 2 : 1;
    const sp = 1.35 * run * (dx&&dy ? .71 : 1);
    /* 房間水平範圍吃 BEDROOM_WALK_TWEAK 滑桿(2026-08-19),不是通用的
       20~LW-20——衣櫃層架伸到走道上,maxPx 比一般房間邊界窄。 */
    const pxMin = PLACE === 'bedroom' ? BEDROOM_WALK_TWEAK.minPx : 20;
    const pxMax = PLACE === 'bedroom' ? BEDROOM_WALK_TWEAK.maxPx : LW-20;
    const nx = Math.max(pxMin, Math.min(pxMax, IN.px + dx*sp));
    if(!inBlocked(nx, IN.py)) IN.px = nx;
    if(!lockDepth){
      const ny = Math.max(bounds.walkN, Math.min(bounds.walkS, IN.py + dy*sp*.62));
      if(!inBlocked(IN.px, ny)) IN.py = ny;
    }
    IN.moving = true; IN.walkT += dt;
    if(dx<0) IN.face='L'; else if(dx>0) IN.face='R';
    else if(dy<0) IN.face='B'; else if(dy>0) IN.face='F';
  } else IN.moving = false;

  IN.near = null;
  for(const sp of bounds.spots)
    if(IN.px > sp.x-12 && IN.px < sp.x+sp.w+12 && IN.py >= sp.y0 && IN.py <= sp.y1){ IN.near = sp.id; break; }
  const show = IN.near && !busy && !dlg.on;
  if(show){
    hintEl.innerHTML = bounds.spots.find(s=>s.id===IN.near).name + '　按 <b>空白鍵</b>';
    hintEl.classList.add('on');
  } else hintEl.classList.remove('on');
}

/* c2df 疊最上層:玩家站到鮮食櫃「後面」(IN.py < STORE.hot.y,離鏡頭比較
   遠)**而且**左右也在鮮食櫃範圍內時,把 `hotCutBuf`(上緣漸層淡出過的
   鮮食櫃裁切圖,見上面 `buildHotCutMask()`)蓋在玩家身上,做出前後遮擋
   ——玩家畫在 c3d,比 c2df 低一層,蓋上去就會被擋住。顆粒雜訊疊在最上面。
   2026-08-14 kc 抓到「鮮食櫃分身」:原本只判斷 IN.py,沒判斷 IN.px,玩家
   站在飲料櫃、貨架這些跟鮮食櫃完全無關的地方也會觸發疊繪,跟背景裡已經
   畫好的鮮食櫃疊成雙重影像——這裡沿用同一個 x/y 判斷,換成獨立圖之後
   這個坑不會重踩(畫的是同一張圖、同一個矩形,跟 paintStoreBackdrop()
   貼的位置不會脫鉤)。 */
/* 鮮食櫃遮擋判斷(2026-08-19 收銀小遊戲那輪擴充):原本只看玩家的
   IN.px/IN.py,排隊的客人(coSpawnQueueMember)是另一批獨立的 3D NPC,
   座標不會反映在 IN.px/py 上——kc 玩起來抓到排在鮮食櫃那一排的客人會
   穿模疊在鮮食櫃前面。判斷式抽成函式,玩家、每個排隊中的客人都各自
   算一次,只要有任何一個人站在鮮食櫃的範圍內就要疊繪遮擋圖,不是只看
   玩家。遮擋圖本身(`hotCutBuf`)只是背景照片的翻拍,跟誰站在裡面無關,
   一次疊繪就同時擋住站在那個位置的所有人,不用分開處理。 */
function inHotZone(px, py){
  return py < STORE.hot.y && px > STORE.hot.x && px < STORE.hot.x + STORE.hot.w;
}
/* 教室橫排課桌椅遮擋(2026-08-25,kc:「當穿過橫向的課桌椅,前景會擋掉
   本人才對」)——照 coDrawClerkClip() 那招最簡單的版本,直接從 c2dbg
   (已經合成好的教室背景)裁一塊貼回 c2df,不用像鮮食櫃那樣另外做
   上緣漸層的 hotCutBuf(這裡沒有「一半露出來一半被擋住」的中間態,
   碰撞框已經把兩張桌子擋成不能走進去,只有走近講台那段玩家真的走得到
   「視覺上比桌椅更深」的位置,矩形整塊裁最簡單)。
   `SCHOOL_DESKROW_CLIP`(canvas px)蓋住兩個學生+講台老師整排,從頭頂到
   椅腳。觸發門檻只看 IN.py——碰撞已經把兩張桌子的深度鎖在 237 以南,
   IN.py 真的小於 245 只可能發生在桌子兩側/中間的開放地板(走去講台或
   繞去門那邊),此時排/老師的圖層本來就該蓋過玩家。
   **v2(2026-08-25 同一天,kc 換圖後重量)**:新圖沒有女生那組跟原本的
   空桌椅,x 範圍照兩張桌子+講台的新座標重抓(native x400~1260 抓一點
   margin,換算成 canvas px)。 */
const SCHOOL_DESKROW_CLIP = { x:306, y:138, w:658, h:444 };
const SCHOOL_DESKROW_OCCLUDE_PY = 245;
function inSchoolDeskZone(px, py){
  return py < SCHOOL_DESKROW_OCCLUDE_PY && px > 150 && px < 482;
}
/* 遊藝場機台演出(2026-08-26 第二輪,改成畫在 #arcadeGame 大面板的
   agCanvas 上,不是房間裡的小色塊——kc 要求互動要彈成大框框、有真的
   演出感)。座標吃 scene-arcade.js 匯出的 CLOSEUP_* 那組,跟
   renderCloseup() 畫靜態機台用的是同一份數字,轉輪閃爍/球轉動才會疊在
   正確的位置上。pusher 的時機條是 DOM 元素(#agBarPin),不在這裡畫,見
   updateIndoor() 那段直接改 style.left。 */
function agDrawSpin(){
  const A = ARCADE_ANIM;
  /* slot 這輪換成真的照片切換(2026-08-26,kc 選的方案 B)——不再是「畫
     底圖+疊色塊」,是三張真的轉輪結果照片(ARCADE_SLOT_IMG)之間快速
     切換,`agSlotTier` 決定 agDrawIdle('slot') 當下畫哪一張。最後 250ms
     鎖定成跟真正 outcome.tier 一致的那張,鎖定之後保持顯示(不再繼續閃),
     跟結算文字對得上——沒有這三張照片(還沒生/檔名打錯)會自動退回
     SceneArcade.renderCloseup() 的色塊版,不會壞。 */
  if(A.kind === 'slot'){
    const settling = (A.dur - A.t) < 250;
    const tier = A.outcome && A.outcome.tier;
    agSlotTier = settling ? tier : ['lose','small','jackpot'][Math.random()*3|0];
    if(agSlotTier === 'lose') agSlotLoseIdx = Math.random()*ARCADE_SLOT_IMG.lose.length|0;
    agDrawIdle('slot');
    return;
  }
  /* 'pusher-drop'/'pusher-payout' 不是真的機台種類,是推幣機那台的兩段
     演出狀態(見 startPusherDrop()/startPusherPayout()),底圖一樣要畫
     推幣機那張特寫,不能直接拿這兩個字串去查 ARCADE_MACHINE_IMG。 */
  agDrawIdle(A.kind.startsWith('pusher') ? 'pusher' : A.kind);
  if(A.kind === 'roulette'){
    /* 球從外圈滑軌慢慢滑進內側號碼格(2026-08-26,kc:「軌跡會是從外圍
       慢慢往內滑落才是正邏輯」)——半徑從 rOuter 線性滑向 rInner,跟角度
       的 easeOut 分開算,角度負責「轉速變慢」,半徑負責「往內滑落」,
       兩個真實世界裡本來就是同時但各自獨立發生的效果。
       **同一天下一輪,kc:「球沒有真的停在不同地方,而且沒有真的判定」**
       ——角度終點原本是寫死的 `3.2*2π`,不管結果一律轉到同一個地方停。
       改成讀 `A.outcome.finalAngle`(spinRouletteTo() 算好、真的對應到
       骰出來那個號碼在照片上的角度),球每次都停在跟結算文字一致的
       真實位置上。 */
    const W = SceneArcade.CLOSEUP_ROULETTE_WHEEL;
    const t = Math.min(1, A.t/A.dur);
    const ease = 1 - Math.pow(1 - t, 3);
    const angle = (A.outcome ? A.outcome.finalAngle : 3.2*2*Math.PI) * ease;
    const r = W.rOuter + (W.rInner - W.rOuter) * t;
    const bx = W.cx + Math.cos(angle)*r, by = W.cy + Math.sin(angle)*r*.82;
    agCtx.fillStyle = '#f2e9d0';
    agCtx.beginPath(); agCtx.arc(bx, by, 8, 0, Math.PI*2); agCtx.fill();
  } else if(A.kind === 'pusher-drop'){
    /* 一枚代幣掉進投幣口(2026-08-26,kc:「我想要有投錢下去推的感覺」,
       同一天第二輪 kc 又糾正「對準是指對準代幣入口」+ 附了投幣口特寫
       截圖)——這輪照那張截圖 + 第一人稱正圖重新精量:投幣口(「代幣
       入口」金屬面板上那條深色縫)在原圖大約 x:1090,y:955(圖

    const ease = Math.min(1, A.t/A.dur);

       2.「推下來是從上面平台推掉下面,不是推到機器外」——原本演出是

         推幣機是上層代幣被推板推過一個階梯狀護欄,掉落到下層那堆代幣

    for(let i=0;i<5;i++){

/* 硬幣畫法共用(2026-08-26,kc:「硬幣要真的硬幣」,同一天第二輪 kc 直接
   傳了一張真的十元硬幣照片)——優先貼真照片(圓形裁切),没載出來時退回
   原本放射狀金色漸層+深色外緣描邊。 */
function drawPusherCoin(x, y, r){
  agCtx.save();
  agCtx.beginPath(); agCtx.arc(x, y, r, 0, Math.PI*2); agCtx.clip();
  if(ARCADE_COIN_IMG.naturalWidth){
    agCtx.drawImage(ARCADE_COIN_IMG, x-r, y-r, r*2, r*2);
  } else {
    const g = agCtx.createRadialGradient(x-r*.3,y-r*.35,r*.15, x,y,r);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(.55, '#e8c85a'); g.addColorStop(1, '#a8791f');
    agCtx.fillStyle = g;
    agCtx.fillRect(x-r, y-r, r*2, r*2);
  }
  agCtx.restore();
  agCtx.strokeStyle = '#6b4f18'; agCtx.lineWidth = 1.2;
  agCtx.beginPath(); agCtx.arc(x, y, r, 0, Math.PI*2); agCtx.stroke();
}

       (maybeAnnounceExam())排在 after,只在這次沒有撞到劇情節點時才會
       檢查,避免兩個自動彈出的對話疊在一起搶畫面。 */
    maybeTriggerStoryNode([['school', schoolStorySource([5, 18, 21])]], maybeAnnounceExam);
  } else if(PLACE === 'arcade'){

function enterIndoor(door){
  if(door.id !== 'store' && door.id !== 'home' && door.id !== 'school' && door.id !== 'arcade' && door.id !== 'tattoo'){
    toast(door.name + ' 的室內場景還沒做。', 3600);
    return;
  }
  returnTo.x = hero.group.position.x; returnTo.z = hero.group.position.z;
  busy = true;
  walkIn = { x: door.x, z: door.z, done(){
    fade(door.id === 'store' ? '超商' : door.id === 'school' ? '學校' : door.id === 'arcade' ? '遊藝場'
        : door.id === 'tattoo' ? '刺青店' : '家', () => warpIntoPlace(door));
  }};
}
function leaveIndoor(){
  pendingTheft = 0;   // 安全走出超商——見 steal() 那句「你走出去之前，那段路特別長」
  const wasHome = PLACE === 'home';
  fade(city.whereAmI(returnTo.x, returnTo.z), () => {
    MODE = 'city';
    document.getElementById('indoor').classList.remove('on');
    document.getElementById('city').style.display = '';
    wlabelsEl.style.display = '';
    hero.group.position.set(returnTo.x, .3, returnTo.z);
    advanceTime(1);
    /* MOM_THEFT 揭曉點,見上面那則長筆記——只在「家」的門口出去、
       而且至少過了一天(day > 設定當下那天)才觸發,同一天走出去不算。 */
    if(wasHome && MOM_THEFT > 0 && day > MOM_THEFT_DAY){
      const amt = Math.min(MOM_THEFT, ST.money);

      }
    }
    checkGrandmaCall();
  });
}

const seenStoryDays = new Set();      // 'bet-6'、'drink-15' 這種 key,防止同一天重複觸發
const knownTruths = new Set();        // story-bet.js 的 TRUTHS 編號,目前沒有獨立 UI 顯示,先記著

 * 被媽媽偷走了」——改成**延遲揭曉的偷竊**,不是當場扣錢:選了拒絕分支
 * 只記金額+當下的 day(MOM_THEFT/MOM_THEFT_DAY),要等**隔天**(day 真的

 * 目前 bet 節點間隔至少 4 天,不會撞在一起)用累加、不是覆蓋,避免漏算。 */
let MOM_THEFT = 0, MOM_THEFT_DAY = -1;
/* ===================================================================
   阿嬤在醫院(2026-09-02,起案脈絡:kc「阿源找你幫忙(前提是你找過他)
   然後準備要去撐場的時候接到醫院通知要趕去看阿嬤」)。
   幾輪來回定案的樣子,跟第一版猜的不一樣,記清楚給下次改動的人看:
   ① **不是阿源 vs 醫院的兩條內容分支**(kc 糾正:「這不是分支,是你可以
      選擇要不要過去」)。傍晚固定時間點(見下面 GRANDMA_CALL_DAY/MINUTE)
      跳出「現在去／不去」,跟阿源的「看場子」任務完全脫鉤——不去就是

      那個既有節點沒有動,它很符合「阿嬤剛走,媽在迴避」的氣氛,不用重寫。
   ③ **不管玩家人在哪都要追得到**(kc:「不要的話你就是正常去學校之類,

      setInterval。但沒有做成「每一幀都檢查」那麼激進:這個檔案裡有不少
      toast→setTimeout→下一句對話的鏈式演出(worker 那段獨白、走失狗

      warpIntoPlace()/leaveIndoor()/enterBedroom()/leaveBedroom()/
      enterCorridor()/leaveCorridorToClassroom() 各自的 fade 回呼尾端)
      ——玩家正常玩幾乎每次切場景都會經過這些點,不會感覺是「卡在等
      什麼」,但避開了鏈式演出中間的空檔。
   ④ **醫院那幕不能走動**(跟越式按摩室內同一套,`updateIndoor()` 開頭
      直接 `if(PLACE==='hospital') return;`),見 scene-hospital.js
      開頭的筆記。

   「扣體力換算時間」規則會自動變成 150 分鐘)、去/不去的歸屬感增減都是
   我自己選的參數,不喜歡跟我說一聲就改。 */
const GRANDMA_CALL_DAY = 16, GRANDMA_CALL_MINUTE = 18*60;

let yuanMorningCallFired = false;   // sleep() 那段「阿源早上打電話來」用,見那則筆記

  if(hospitalCallFired || gameOver || busy || dlg.on) return;

  { who:'pc',    text:'病房裡,阿嬤還醒著。' },

  { who:'pc',    text:'你在床邊坐下,不知道該說什麼。' },
  { who:'granny',text:'「有沒有吃飽。」她問的還是這句。' },
  { who:'pc',    text:'你說有。' },

];
/* goToHospital() 只管扣代價+切場景,「切場景+講故事+離場」那段拆進
   enterHospital(),跟 enterMassage() 同一個分工。 */
function goToHospital(){
  GRANDMA.dead = true; GRANDMA.wentToSee = true;
  /* 體力最少留 1,不讓這筆扣款剛好把體力砍到 0——這是劇情事件,不該因為
     玩家當下體力剛好見底就順便觸發 triggerGameOver('stamina') 那個泛用的
     「你倒在路邊」死亡畫面,那句台詞跟這裡要演的東西完全對不上。
     advanceTime 走 chg() 統一算,這裡不用另外呼叫。 */
  chg('stamina', -Math.min(30, Math.max(0, ST.stamina - 1)));
  if(MODE === 'city'){ returnTo.x = hero.group.position.x; returnTo.z = hero.group.position.z; }

function enterHospital(){
  busy = true;
  fade('醫院', () => {
    MODE = 'indoor';
    PLACE = 'hospital';

/* menu 型 beat(2026-08-19,爸爸「打工→要錢→給/不給」那段用):playBeats
   跑到 `{ menu:[...] }` 這種 beat,開一個子選單,選完照 applyStoryChoice()

  if(item.star) chg('star', item.star);
  if(item.money) chg('money', item.money);
  if(item.moneyAll) chg('money', -ST.money);
  if(item.debt) chg('money', -item.debt);

const keys = {};
/* 陣頭音遊的五個判定鍵(2026-08-31 第二輪,太鼓達人四方向+kc 加碼的空白鍵
   重拍)——擋在最前面單獨處理,不跟下面 ' '/'enter' 那個共用區塊混,因為
   上下左右平常另有用途(WASD 替代鍵,見 updateCity()/updateIndoor() 移動
   那段),只有 TROUPE_GAME.active 期間才搶下來當判定鍵。 */
const TROUPE_KEY_LANE = { arrowup:'up', arrowdown:'down', arrowleft:'left', arrowright:'right', ' ':'space' };
addEventListener('keydown', e => {
  if(gameOver) return;   // 失敗結局蓋上之後不接受任何操作,見 triggerGameOver()
  const k = e.key.toLowerCase();
  keys[k] = true;

  if(TROUPE_GAME.active && TROUPE_KEY_LANE[k]){
    e.preventDefault();
    resolveTroupeHit(TROUPE_KEY_LANE[k]);
    return;
  }
  if(k === ' ' || k === 'enter'){
    e.preventDefault();
    /* 推幣機小遊戲(2026-08-26)——攔在 advanceDialog() 前面,不然這個空白鍵
       會被 openIndoorSpot(IN.near) 那條路徑吃掉(那邊一開頭就 `if(busy||
       dlg.on) return;`,pusher 進行中 busy 是 true,空白鍵會直接失效)。 */
    if(ARCADE_ANIM.active && ARCADE_ANIM.kind === 'pusher'){ resolvePusherLockIn(); return; }
    if(FOREMAN_GAME.active){ resolveForemanLockIn(); return; }
    if(PHONE_GAME.active){ resolvePhoneReact(); return; }
    if(advanceDialog()) return;
    if(menuEl.classList.contains('on')) return;
    if(MODE === 'indoor'){ if(IN.near) openIndoorSpot(IN.near); }
    else if(ridingMoto) dismountMoto();
    else if(nearDoor && !busy) enterIndoor(nearDoor);
    else if(nearProp && !busy) interactProp(nearProp);
  }
  if(k === 'escape' && menuEl.classList.contains('on')) closeMenu();
  if(k === 'escape' && invOverlay.classList.contains('on')) closeInventory();
  /* ESC 關掉遊藝場大面板(2026-08-26)——跟 menu/inventory 同一個習慣,但
     機台演出/推幣機小遊戲進行中(ARCADE_ANIM.active)不能用 ESC 逃掉——
     這時候玩家已經按下「拉一次/投 $20」,金錢會在演出跑完(slot/roulette)
     或鎖定當下(pusher)才真的扣,ESC 跳出去會留在一個演出演到一半、
     cb() 卻永遠不會被呼叫的卡死狀態。 */
  /* 2026-08-28:扛磚小遊戲借用同一個 #arcadeGame 面板,但 closeArcadeGame()

     不是只擋 FOREMAN_GAME.active 那個「單趟計時中」的窄窗口。 */
  if(k === 'escape' && agEl.classList.contains('on') && !ARCADE_ANIM.active && !foremanShiftOn && !troupeShiftOn) closeArcadeGame();

/* 騎機車(2026-08-14,kc 要的——原本地圖太大,走路逛一圈太久)。ridingMoto

   結算時機點用 `day`(跟 MEI 的 5 天期借款、教官的上學出席同一套「靠既有

const MOTO_DOWNPAYMENT = 600, MOTO_INSTALLMENT_TOTAL = 1950, MOTO_WEEKLY = 225;
const MOTO_LOAN = { active:false, balance:0, weekly:MOTO_WEEKLY, nextDueDay:null };

/* 相機防穿牆(kc 之前就遇過):建築/招牌都是 add() 直接掛在 scene 底下的

const occluders = scene.children.filter(o => o.isMesh);
const camRay = new THREE.Raycaster();
const eyePos = new THREE.Vector3(), camDir = new THREE.Vector3();
const whereEl = document.getElementById('where');

function updateCity(dt){
  /* 工地扛磚時機條(2026-08-28)——跟 updateIndoor() 的 ARCADE_ANIM.active
     那段同一個精神(整段搶走輸入,指示條每幀 ping-pong),但那段只在室內
     tick 跑,這裡是戶外 3D 街景自己的頭,提早 return 不跑下面的移動/鏡頭
     邏輯,只留 hero.animate() 讓角色不要卡在走路姿勢半途。 */
  if(TROUPE_GAME.active){
    agDrawTroupe(dt);
    hero.animate(dt, false, 1, false);
    return;
  }
  if(FOREMAN_GAME.active){
    /* 難度隨疊高提升(2026-08-28,kc:「為何堆的都不會倒」)——原本速度
       固定,miss 門檻(resolveForemanLockIn 那邊 dist>.4)又只佔擺盪範圍
       兩端各 10%,正常手感很難真的按到那個窄區間,無限模式變成事實上
       疊不完會倒。改成疊越高擺盪越快,越到後面越難卡準,風險才會隨著
       貪心疊高真的上升(倍率封頂 2.2,不要快到完全打不到)。 */
    const speedMult = Math.min(2.2, 1 + FOREMAN_GAME.stack.length * 0.08);
    FOREMAN_GAME.barPos += FOREMAN_GAME.barDir * dt * .0024 * speedMult;
    if(FOREMAN_GAME.barPos >= 1){ FOREMAN_GAME.barPos = 1; FOREMAN_GAME.barDir = -1; }
    else if(FOREMAN_GAME.barPos <= 0){ FOREMAN_GAME.barPos = 0; FOREMAN_GAME.barDir = 1; }
    agDrawForeman();
    hero.animate(dt, false, 1, false);
    return;
  }
  /* 阿嬤在醫院的電話(2026-09-02)——只在「正常走在街上」的幀檢查(上面
     兩段小遊戲搶輸入的分支已經 return 掉了,不會跑到這裡),見那則長筆記。 */
  checkGrandmaCall();
  if(keys['q']) camYaw -= dt*.0018;
  if(keys['e']) camYaw += dt*.0018;

  const run = keys['shift'] ? 2 : 1;
  const pos = hero.group.position;
  let moving = false;

  if(walkIn){
    /* 進門的最後幾步不是玩家按出來的,是腳本算出來的方向直接走到門的座標——
       跟下面手動輸入共用同一顆 hero.animate(),角色不會在切換的瞬間卡一下。 */
    const dx = walkIn.x - pos.x, dz = walkIn.z - pos.z, dist = Math.hypot(dx, dz);
    if(dist < .12){
      const done = walkIn.done; walkIn = null; done();
    } else {
      const speed = 0.0055 * dt;
      pos.x += (dx/dist) * speed; pos.z += (dz/dist) * speed;
      hero.group.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
  } else if(!busy && !dlg.on){
    let ix=0, iz=0;
    if(keys['a']||keys['arrowleft'])  ix -= 1;
    if(keys['d']||keys['arrowright']) ix += 1;
    if(keys['w']||keys['arrowup'])    iz -= 1;
    if(keys['s']||keys['arrowdown'])  iz += 1;
    if(ix||iz){
      const speed = 0.005 * dt * (ridingMoto ? MOTO_MULT : run);
      const len = Math.hypot(ix,iz);
      /* 移動要跟著鏡頭轉(kc 抓到的問題),細節見 street3d.html 同一段註解。 */
      const dx = (ix*Math.cos(camYaw) + iz*Math.sin(camYaw))/len;
      const dz = (-ix*Math.sin(camYaw) + iz*Math.cos(camYaw))/len;
      const nx = pos.x + dx*speed, nz = pos.z + dz*speed;
      if(!city.blocked(nx, pos.z)) pos.x = Math.max(CITY.bounds.x[0], Math.min(CITY.bounds.x[1], nx));
      if(!city.blocked(pos.x, nz)) pos.z = Math.max(CITY.bounds.z[0], Math.min(CITY.bounds.z[1], nz));
      hero.group.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
  }
  hero.animate(dt, moving, run, !!ridingMoto);      // 第 4 參數:騎乘中蓋掉 idle/walk/run,撐坐姿(見 scene-city3d.js)
  NPCS.forEach(n => n.animate(dt, pos));            // pos 給小步待機拿去算轉頭朝向,見 buildNPC 註解

  /* 顧場子(2026-08-26)——見 WATCHJOB 那則長筆記。「看到了沒」不做視錐/
     遮蔽判斷,單純玩家有沒有靠近過走動中的小美哥(kc:「主要是如果玩家的
     視線有看到警察就可以回去通報了,來得及啦」)。半徑 16 比一般互動範圍
     (3.2)寬很多,因為這是「遠遠看到人影」不是「走到面前說話」。走到門口
     (路徑最後一點)前都沒被看到算沒通報成功,直接判失敗。 */
  if(WATCHJOB.active && WATCHJOB.walker){
    const wp = WATCHJOB.walker.group.position;
    if(!WATCHJOB.spotted && Math.hypot(pos.x-wp.x, pos.z-wp.z) < 16){
      WATCHJOB.spotted = true;
      toast('你看到小美哥往遊藝場那邊走了——快去跟阿源說！', 3000);
    }
    const door = WATCHJOB_PATH[WATCHJOB_PATH.length-1];
    if(Math.hypot(wp.x-door[0], wp.z-door[1]) < 1.2) resolveWatchJob(false);
  }

  /* 小美哥的月長線改成主動觸發(2026-08-31,kc:「不要用成天數觸發這樣
     很容易錯過,應該要是天數到之後,不管啥時候去都會觸發第一次主動對話
     (靠近警察局)」)——原本要玩家自己走到他面前按空白鍵,天數到了但

     (maybeTriggerStoryNode,「他主動來找你,你躲不掉」)同一個精神,不用
     玩家自己按互動鍵。半徑原本抓 10,kc 現場測完反應「觸發範圍太小」,
     這輪放大到 22(WATCHJOB 那組「遠遠看到人影」是 16,這裡再寬一點——
     他是站在警局門口攔人,街上老遠看到玩家經過就會開口,不用真的走到
     門口台階上)。busy/dlg.on 兩個鎖都要空,避免打斷玩家正在做的其他事
     (開著選單/已經在對話中)。第一次質問跟按天推進的四個節點共用
     talkToBrother() 同一份判斷邏輯,這裡只是換一個呼叫時機,邏輯本身
     不用重寫;原本走到面前按空白鍵的互動路徑(interactProp() 'brother'
     分支)沒有拿掉,平常日子(沒有節點要播)靠近他還是可以主動聊閒聊句。 */
  /* 2026-08-31 加碼:贓物協尋的「第一次揭露」也算主動觸發(跟月長線節點
     同一個精神——kc 要的是「不用玩家自己想到要去找他」)。贖車那條的
     揭露改成 sleep() 的拖吊通知單(見那則長筆記),不再靠走近阿正觸發,
     這裡拿掉了。故意只在「還沒揭露過」那一刻算 urgent,已經揭露、還沒
     解決的狀態不會每次走近就重播一次選單,要繼續處理的話任務面板已經
     有提示,玩家自己按空白鍵走過去互動就好,見 interactProp() 'brother'
     分支(這裡沒有動它)。良民證那條也沒有加進來:它是工地老闆開口的,
     不是阿正主動找你,語意上不該是「走近警局」觸發。 */
  /* 2026-08-31 抓到的 bug(kc:「卡bug 我接任務後他會一直提示我還沒尋完
     我尋完會自己回報啦」)——巡邏第一個點(-78,90)離阿正只有 8.5 個單位,
     整段都在他 22 半徑的主動觸發圈內。如果這時候剛好還有別的事(比如
     月長線某個節點到期)也算 urgent,巡邏中每一幀都會被拉去
     talkToBrother(),但 talkToBrother() 判斷順序是 MOTO_IMPOUND 優先,
     顯示的是「還沒巡完喔」——關掉對話框、還站在原地(還在 22 半徑內)
     下一幀又重新判定 urgent,變成無限彈出同一句,玩家會被卡死在原地。
     修法很直接:巡邏中(patrolActive)整段主動觸發都跳過,巡邏是玩家

     走過去按空白鍵。
     **2026-09-01 擴大同一個修法:**上面那個坑不是只有「巡邏中」會踩到——
     `MOTO_IMPOUND.active` 為 true 但玩家還沒選繳錢/巡邏(`patrolActive`

     **2026-09-01 第二輪,kc 抓到漏掉的第三個:**贓物協尋自己觸發之後
     (`SNITCH_QUEST.active` 變 true,選單問「查得怎樣？」),玩家選
     「還沒有」把選單關掉,人還站在 22 半徑內,同一幀又被判定成
     urgent——這次是靠 `nextBrotherArcDay()!=null`(月長線剛好也到期)
     那個條件重新拉回 talkToBrother(),但 talkToBrother() 內部順序
     SNITCH_QUEST.active 排在月長線前面,又卡回同一句「查得怎樣？」,
     一樣無限彈。**這裡的通則(以後阿正這邊再加新的「掛著沒解決」的狀態,
     照這個原則補,不要又漏一個)是:talkToBrother() 內部任何一個
     `if(X.active){ ...; return; }` 這種「事情還沒解決會攔住往下走」的
     分支,對應的 X.active 都要出現在這裡的排除清單——因為那些分支的

     一樣的條件成立就會再被拉回同一句。三個都補齊:
     `!MOTO_IMPOUND.active && !ID_CARD_QUEST.active && !SNITCH_QUEST.active`。 */
  if(!busy && !dlg.on && !MOTO_IMPOUND.active && !ID_CARD_QUEST.active && !SNITCH_QUEST.active && Math.hypot(pos.x-BROTHER.x, pos.z-BROTHER.z) < 22){
    const snitchNew = !SNITCH_QUEST.active && SNITCH_QUEST.resolved === null && day >= 18 && YUAN.visits > 0;
    if(MEI.together && !BROTHER.met) talkToBrother();
    else if(BROTHER.met && (nextBrotherArcDay() != null || snitchNew)) talkToBrother();
  }
  syncBrotherArcPanel();
  syncMiscQuestPanel();
  /* 巡邏抵罰款(2026-08-31,kc:「比如幫警察徒步巡邏城鎮一段範圍」,第二輪
     「巡邏點太輕鬆了啦至少要尋到廟口」)——跟 ACHENG.litterQuest 同一套
     「visited/need 進度」模式,不是計時器。MOTO_PATROL_POINTS 沿西園街
     從警局附近一路巡到廟口(見那則長筆記),每幀檢查下一個「還沒巡過」
     的點,半徑抓 6(比一般互動 3.2 寬一點,巡邏本來就不用精準站在一個點
     上)。巡完五點不會自動結束(還是要回警局跟阿正報到,見
     talkToBrother() 那個分支),這裡只推進進度。
     2026-08-31 第三輪,kc:「你模擬玩我做完任務 我會餓死 在廟口前快巡邏完
     的階段」——抓到真正的原因:chg() 裡有一條全專案共用的規則
     (2026-08-28 就定案,見那則筆記)「扣體力會同步扣飽足感,比例
     1:1」,不是這條任務獨有的邏輯,是我加的時候沒注意到。原本每點扣
     -8、五點扣滿 -40,不是只扣體力,是體力跟飽足感各扣 40——`ST.full`
     新遊戲開局只有 42,扣 40 幾乎等於扣到見底,路線又剛好比原本(4 點,
     總扣 32)拉更長,兩件事疊在一起才會走到廟口前夕差點餓死。改成每點
     -3(五點扣滿 -15,體力/飽足感各少 15),量級對齊工地扛磚一次
     (-20)的七成左右,不是免費,但不會走一趟長路線走到餓死。 */
  if(MOTO_IMPOUND.patrolActive && MOTO_IMPOUND.patrolVisited < MOTO_PATROL_POINTS.length){
    const [px, pz] = MOTO_PATROL_POINTS[MOTO_IMPOUND.patrolVisited];
    if(Math.hypot(pos.x-px, pos.z-pz) < 6){
      MOTO_IMPOUND.patrolVisited++;
      chg('stamina', -3);
      syncMiscQuestPanel();
      toast(MOTO_IMPOUND.patrolVisited >= MOTO_PATROL_POINTS.length
        ? '巡邏點都走過了，回警局跟阿正報到。'
        : `巡到一個點了（${MOTO_IMPOUND.patrolVisited}/${MOTO_PATROL_POINTS.length}）。`, 2200);
    }
  }

  /* 小胖的連續劇情(2026-08-31,見上面 FAT 那則長筆記+ checkFatArc())——
     跟 BROTHER 月長線同一招「靠近才自動觸發」,但小胖沒有 3D 模型可以
     靠近,直接沿用 YUAN 的座標當廟埕位置判斷。 */
  if(!busy && !dlg.on && Math.hypot(pos.x-FAT.x, pos.z-FAT.z) < 10){
    checkFatArc();
  }

  /* 騎乘中:那台車的 group 每幀跟著玩家座標/朝向跑(見 mountMoto()/
     dismountMoto()——角色本體不藏,坐姿疊在車上)。碰撞/邊界檢查都還是
     用 pos(hero.group.position),車只是換皮,不是另一套移動邏輯。
     MOTO_SEAT_OFFSET:propModel() 把整台車的 bounding box 幾何中心對齊
     local (0,0,0),但座墊實際位置不是正中心,車的 group 往騎士反方向
     推出去 MOTO_SEAT_OFFSET,等於把座墊那端拉回騎士(pos)所在的位置。
     只動車的視覺位置,不動 pos 本身,碰撞/下車停車座標(m.x/m.z,見
     dismountMoto())不受影響。數字來源見上面 MOTO_SEAT_OFFSET 那行註解。 */
  if(ridingMoto && ridingMoto.group){
    const fx = Math.sin(hero.group.rotation.y), fz = Math.cos(hero.group.rotation.y);
    ridingMoto.group.position.set(pos.x + fx*MOTO_SEAT_OFFSET, 0, pos.z + fz*MOTO_SEAT_OFFSET);
    ridingMoto.group.rotation.y = hero.group.rotation.y;
  }

  /* 阿霞後座(2026-09-01)——跟上面機車本身的同步同一招,往騎士朝向的
     反方向(-fx/-fz)退 PASSENGER_SEAT_OFFSET,不是往前——騎士在前座、
     乘客在後座。setRideTransform() 只負責套用,算座標的邏輯留在呼叫端,
     跟 scene-city3d.js 那邊的分工說明一致。 */
  if(axiaRiding){
    const fx = Math.sin(hero.group.rotation.y), fz = Math.cos(hero.group.rotation.y);
    AXIA_NPC.setRideTransform(pos.x - fx*PASSENGER_SEAT_OFFSET, PASSENGER_SEAT_Y, pos.z - fz*PASSENGER_SEAT_OFFSET, hero.group.rotation.y);
  }

  if(ridingMoto){
    /* 座墊高度,數字來源見上面 MOTO_SEAT_Y 那行註解。 */
    pos.y += (MOTO_SEAT_Y - pos.y) * .3;
  } else {
    let onRoad = false;
    for(const r of CITY.H_ROADS) if(Math.abs(pos.z-r.z) < CITY.ROAD_HW) onRoad = true;
    for(const r of CITY.V_ROADS) if(Math.abs(pos.x-r.x) < CITY.ROAD_HW) onRoad = true;
    pos.y += ((onRoad ? .1 : .3) - pos.y)*.3;
  }

  tmp.set(Math.sin(camYaw)*CAM.dist, CAM.high, Math.cos(camYaw)*CAM.dist);
  tmp.add(pos);
  /* 相機防穿牆,細節見 street3d.html 同一段註解——理想機位跟角色中間隔了
     牆的話,把鏡頭拉到撞點前面一點。 */
  eyePos.set(pos.x, pos.y + hero.eyeY*CAM.lookY, pos.z);
  camDir.subVectors(tmp, eyePos);
  const wantDist = camDir.length();
  let camTarget = tmp;
  if(wantDist > .01){
    camDir.divideScalar(wantDist);
    camRay.set(eyePos, camDir);
    camRay.far = wantDist;
    const hit = camRay.intersectObjects(occluders, false)[0];
    if(hit) camTarget = eyePos.clone().addScaledVector(camDir, Math.max(3, hit.distance - 1.2));
  }
  camera.position.lerp(camTarget, 1 - Math.pow(.0015, dt/1000));
  camera.lookAt(pos.x, pos.y + hero.eyeY*CAM.lookY, pos.z);

  keyLight.position.set(pos.x-24, 34, pos.z+20);
  keyLight.target.position.copy(pos);
  city.updateLights(pos.x, pos.z);
  updateBuskerAudio(pos.x, pos.z);
  city.updateBushBillboards(camera.position.x, camera.position.z);
  whereEl.textContent = city.whereAmI(pos.x, pos.z);

  nearDoor = null;
  for(const d of city.doors)
    if(Math.hypot(pos.x-d.x, pos.z-d.z) < 3.6){ nearDoor = d; break; }

  /* 街上的小互動(摸狗、撿垃圾),2026-08-13 加的——跟門用同一套「距離內才
     顯示提示、按空白鍵觸發」,但門優先(nearDoor 先判斷),同一格站著不會
     兩個提示打架。litter 撿過會被移出 city.litter(見 interactProp),
     不用另外記一份「已撿」清單。 */
  nearProp = null;
  /* 騎乘中不能再摸狗/撿垃圾/上另一台車(騎在車上手不空),也不進門——
     ridingMoto 擋掉整段偵測,下面 hint 區塊另外處理「按空白鍵下車」。 */
  if(!nearDoor && !ridingMoto){
    for(const p of city.pets)
      if(Math.hypot(pos.x-p.x, pos.z-p.z) < 3.2){ nearProp = { type:'pet', ref:p }; break; }
    if(!nearProp) for(const l of city.litter)
      if(Math.hypot(pos.x-l.x, pos.z-l.z) < 3.2){ nearProp = { type:'litter', ref:l }; break; }
    if(!nearProp) for(const p of city.play)
      if(Math.hypot(pos.x-p.x, pos.z-p.z) < 3.2){ nearProp = { type:'play', ref:p }; break; }
    if(!nearProp) for(const m of city.motos)
      if(!m.ridden && !(MOTO_IMPOUND.active && m === MOTO_IMPOUND.motoRef) && Math.hypot(pos.x-m.x, pos.z-m.z) < 3.2){ nearProp = { type:'moto', ref:m }; break; }
    if(!nearProp && Math.hypot(pos.x-ALLEY_WORKER.x, pos.z-ALLEY_WORKER.z) < 3.2)
      nearProp = { type:'worker', ref:ALLEY_WORKER };
    if(!nearProp && Math.hypot(pos.x-STATUE.x, pos.z-STATUE.z) < 3.2)
      nearProp = { type:'statue', ref:STATUE };
    if(!nearProp && Math.hypot(pos.x-PISS_SPOT.x, pos.z-PISS_SPOT.z) < 3.2)
      nearProp = { type:'piss', ref:PISS_SPOT };
    if(!nearProp && Math.hypot(pos.x-BUSH_SPOT.x, pos.z-BUSH_SPOT.z) < 4)
      nearProp = { type:'bushes', ref:BUSH_SPOT };
    /* 供桌本身的 solid() 碰撞會擋住正中央,半徑用 4.5(理由同 AYI/ACHENG,
       見上面 ALTAR 那則筆記)。 */
    if(!nearProp && Math.hypot(pos.x-ALTAR.x, pos.z-ALTAR.z) < 4.5)
      nearProp = { type:'altar', ref:ALTAR };
    if(!nearProp && Math.hypot(pos.x-BENCH.x, pos.z-BENCH.z) < 3.2)
      nearProp = { type:'bench', ref:BENCH };
    /* 阿姨(2026-08-20)——固定站點,跟 STATUE/ALLEY_WORKER 同一套用常數座標
       量距離,不用像 PEDESTRIANS 那樣讀會變動的 group.position。 */
    /* 阿姨/阿成互動半徑用 4.5,不是其他 3.2 那批(貓/垃圾/雕像這些站在
       開闊地上的互動物)——kc:「人站在攤位前面就可以觸發對話,這才正常」。
       兩人都站在攤子後方(z-93.5),客人正常站的位置是櫃檯前緣(case box
       前緣 z-90.8 再往外一點,約 z-89~-90),距離大概 3.5~4.5,3.2 量不到,
       站在正常買東西的位置反而觸發不了對話。 */
    if(!nearProp && Math.hypot(pos.x-AYI.x, pos.z-AYI.z) < 4.5)
      nearProp = { type:'ayi', ref:AYI };
    if(!nearProp && Math.hypot(pos.x-ACHENG.x, pos.z-ACHENG.z) < 4.5)
      nearProp = { type:'acheng', ref:ACHENG };
    /* 算命攤半徑用 4.5,跟阿姨/阿成同一個理由(站在桌子前緣的正常位置
       量出來就是這個距離,3.2 那個窄半徑站不到)。 */
    if(!nearProp && Math.hypot(pos.x-FORTUNE.x, pos.z-FORTUNE.z) < 4.5)
      nearProp = { type:'fortune', ref:FORTUNE };
    if(!nearProp && Math.hypot(pos.x-MOTOBOSS.x, pos.z-MOTOBOSS.z) < 3.2)
      nearProp = { type:'motoboss', ref:MOTOBOSS };
    if(!nearProp && Math.hypot(pos.x-YUAN.x, pos.z-YUAN.z) < 3.2)
      nearProp = { type:'yuan', ref:YUAN };
    /* 小胖(2026-09-02 第八輪)——之前完全沒有 nearProp 入口,靠近廟口的
       自動觸發(checkFatArc(),見 updateCity() 那段)是唯一管道,kc 玩起來
       抓到「對話不了」——他消失(FAT.gone)之後這裡直接不給互動提示,
       跟阿源當兵/GONE 那批消失邏輯同一個「消失就是消失,不留一個空氣牆
       提示」精神。 */
    if(!nearProp && !FAT.gone && Math.hypot(pos.x-FAT.x, pos.z-FAT.z) < 3.2)
      nearProp = { type:'fat', ref:FAT };
    /* 學校三人(2026-08-21)——固定站點,跟阿姨/阿成/阿源同一套,半徑用
       3.2(站在開闊草地上,不像攤位需要放寬)。 */
    if(!nearProp && Math.hypot(pos.x-MEI.x, pos.z-MEI.z) < 3.2)
      nearProp = { type:'mei', ref:MEI };
    if(!nearProp && Math.hypot(pos.x-JIAOGUAN.x, pos.z-JIAOGUAN.z) < 3.2)
      nearProp = { type:'jiaoguan', ref:JIAOGUAN };
    if(!nearProp && Math.hypot(pos.x-AREN.x, pos.z-AREN.z) < 3.2)
      nearProp = { type:'aren', ref:AREN };
    if(!nearProp && Math.hypot(pos.x-BROTHER.x, pos.z-BROTHER.z) < 3.2)
      nearProp = { type:'brother', ref:BROTHER };
    if(!nearProp && Math.hypot(pos.x-KAI.x, pos.z-KAI.z) < 3.2)
      nearProp = { type:'kai', ref:KAI };
    if(!nearProp && Math.hypot(pos.x-FOREMAN.x, pos.z-FOREMAN.z) < 3.2)
      nearProp = { type:'foreman', ref:FOREMAN };
    /* 走失狗(2026-08-28,kc:「跟狗講話可以把狗帶回去給刺青店老闆」)——
       上一輪是走近自動判定「找到」,這輪改成跟摸貓狗/垃圾同一套「按空白鍵
       才觸發」的互動,不是自動的。只有任務進行中(active)、還沒找到過
       (!found)才會摸到這個 nearProp,跟摸貓狗同一個互動半徑(3.2)。 */
    if(!nearProp && TATTOO_DOG.active && !TATTOO_DOG.found && city.construction.dog &&
       Math.hypot(pos.x-city.construction.dog.position.x, pos.z-city.construction.dog.position.z) < 3.2)
      nearProp = { type:'tattoodog', ref: city.construction.dog };
    /* 路人搭話(2026-08-19,kc 要求「路邊人物都至少可以對話一句話」)——
       PEDESTRIANS 走位置會變,不能像 pets/litter 那樣讀固定的 x/z,直接
       讀 npc.group.position。純背景路人,不記名字、不分支對話,一句隨機
       閒聊蓋過去就好,跟阿源/阿姨那種有 npc-temple.js 完整資料的劇情
       NPC 不同層級,不要混在一起。 */
    if(!nearProp) for(const p of PEDESTRIANS)
      if(Math.hypot(pos.x-p.group.position.x, pos.z-p.group.position.z) < 2.6){
        nearProp = { type:'pedestrian', ref:p }; break;
      }
  }
  /* 巷口先聽到聲音再看到人(kc:「會聽到聲音」)——距離比互動範圍(3.2)
     寬一截,只飄一次(ALLEY_WORKER.heard 擋掉),不然每幀都跳字很吵。走過
     一次之後這句就不會再出現,跟 doors/nearProp 那套「範圍內才顯示」不同,
     這個是「路過聽到」的單次環境音,不是持續提示。 */
  if(!ALLEY_WORKER.heard && Math.hypot(pos.x-ALLEY_WORKER.x, pos.z-ALLEY_WORKER.z) < 9){
    ALLEY_WORKER.heard = true;
    toast('「小帥哥,要不要休息一下?」', 2600);
  }
  /* 小美騎車搭話(2026-08-21,kc:「帥潮>22 後騎機車去找她,她會問可以
     載我出去玩嗎」)——跟上面 ALLEY_WORKER.heard 同一套「範圍內單次觸發」,
     但這裡要開對話+選單,不是單純 toast,所以額外擋 !dlg.on/!busy,不然
     可能跟其他正在進行的對話疊在一起。半徑用 6(比走路互動的 3.2 寬——
     騎車速度快,窄範圍很容易一晃就錯過;比 ALLEY_WORKER 的 9 窄,不用
     整條路都聽得到)。獨立於 met/dated 進度,見 npc-school.js rideHook
     那則筆記——觸發時如果還沒 met 會順便補上,但不動 dated,順風車不算
     mei2 那筆正式約會。 */
  if(!MEI.rideAsked && ridingMoto && ST.cool >= 22 && !dlg.on && !busy &&
     Math.hypot(pos.x-MEI.x, pos.z-MEI.z) < 6){
    MEI.rideAsked = true;
    if(!MEI.met) MEI.met = true;
    const D = NpcSchool.MEI;
    playBeats(D.rideHook, 0, () => {
      openMenu('小美', [
        { label:'載她一圈', cls:'', run(){
            playBeats(D.rideBeats, 0, () => {
              chg('calm', 10); chg('cool', 2);
              advanceTime(20);
              toast(D.rideQuiet, 3200);
            });
          } },
        { label:'「改天啦。」', cls:'back', run(){
            chg('calm', -3);
            say('mei', '「喔，好啊。」她笑了一下，沒有很失望，但也沒再多說。');
          } }
      ]);
    });
  }
  /* 阿霞・載她一程(2026-09-01)——跟上面 MEI.rideAsked 同一招,騎車經過
     公車站才會問(不是走近就問,走近按空白鍵是 talkToAxia() 那條不同的
     入口,見 interactProp() pedestrian 分支)。resolved 之後(不管是搭
     計程車還是已經載過)兩條路都不會再觸發。 */
  if(!AXIA.resolved && !AXIA.rideAsked && ridingMoto && !dlg.on && !busy &&
     Math.hypot(pos.x-AXIA.x, pos.z-AXIA.z) < 6){
    AXIA.rideAsked = true;
    say('axia', '「咦——你有機車？」她看了一眼末班車時刻表，又看看你。「載我到中華路那邊好不好？我家巷子在那附近，不會很遠。」', () => {
      openMenu('阿霞', [
        { label:'載她去中華路', cls:'', run(){ startAxiaRide(); } },
        { label:'「不順路欸。」', cls:'back', run(){
            say('axia', '「喔……好啦，沒關係。」她轉回頭繼續看時刻表。');
          } }
      ]);
    });
  }

  if(nearDoor && !busy && !dlg.on){
    hintEl.innerHTML = nearDoor.name + '　按 <b>空白鍵</b> 進去';
    hintEl.classList.add('on');
  } else if(nearProp && !busy && !dlg.on){
    hintEl.innerHTML = nearProp.type === 'pet' ? nearProp.ref.label + '　按 <b>空白鍵</b> 摸摸看'
                      : nearProp.type === 'play' ? nearProp.ref.label + '　按 <b>空白鍵</b> 玩一下'
                      : nearProp.type === 'moto' ? (nearProp.ref.forSale && !nearProp.ref.owned
                          ? '按 <b>空白鍵</b> 跟老闆談車'
                          : '按 <b>空白鍵</b> 騎上去')
                      : nearProp.type === 'worker' ? '按 <b>空白鍵</b> 搭話'
                      : nearProp.type === 'statue' ? '按 <b>空白鍵</b> 看看牌子上寫什麼'
                      : nearProp.type === 'altar' ? '按 <b>空白鍵</b> 靠近功德箱'
                      : nearProp.type === 'piss' ? '按 <b>空白鍵</b> 解決一下'
                      : nearProp.type === 'bushes' ? '按 <b>空白鍵</b> 翻翻草叢'
                      : nearProp.type === 'bench' ? '按 <b>空白鍵</b> 坐下來休息一下'
                      : nearProp.type === 'ayi' ? '按 <b>空白鍵</b> 找阿姨'
                      : nearProp.type === 'acheng' ? '按 <b>空白鍵</b> 找阿成'
                      : nearProp.type === 'fortune' ? '按 <b>空白鍵</b> 算一下'
                      : nearProp.type === 'motoboss' ? '按 <b>空白鍵</b> 找老闆'
                      : nearProp.type === 'yuan' ? '按 <b>空白鍵</b> 找阿源'
                      : nearProp.type === 'fat' ? '按 <b>空白鍵</b> 找小胖'
                      : nearProp.type === 'mei' ? '按 <b>空白鍵</b> 找小美'
                      : nearProp.type === 'jiaoguan' ? '按 <b>空白鍵</b> 找教官'
                      : nearProp.type === 'aren' ? '按 <b>空白鍵</b> 找阿仁'
                      : nearProp.type === 'brother' ? '按 <b>空白鍵</b> 跟他說話'
                      : nearProp.type === 'kai' ? '按 <b>空白鍵</b> 找阿凱'
                      : nearProp.type === 'pedestrian' ? '按 <b>空白鍵</b> 打聲招呼'
                      : nearProp.type === 'foreman' ? '按 <b>空白鍵</b> 找老闆'
                      : nearProp.type === 'tattoodog' ? '按 <b>空白鍵</b> 靠近牠'
                      : '按 <b>空白鍵</b> 撿起垃圾';
    hintEl.classList.add('on');
  } else if(ridingMoto && !dlg.on){
    hintEl.innerHTML = '按 <b>空白鍵</b> 下車';
    hintEl.classList.add('on');
  } else if(MODE === 'city') hintEl.classList.remove('on');
}

/* 2026-08-14 街上補了一隻貓(scene-city3d.js 的 placePet())——原本三句台詞
   是照狗寫的(「尾巴搖得很兇」對貓來說是不爽,不是開心),照 pet.label 分開
   兩組,不要共用同一份文案硬套在不同動物身上。 */
const PET_LINES = {
  '小狗': [
    '牠讓你摸了好一會,尾巴搖得很兇。',
    '牠靠著你的腳,好像沒有很想理你以外的人。',
    '摸起來有點髒,但牠好像很開心。'
  ],
  '貓': [
    '牠瞇著眼讓你摸了幾下,然後就走開了。',
    '牠用頭蹭了蹭你的手,但只有一下。',
    '摸到一半牠忽然翻過身,不知道是要你摸肚子還是想咬你。'
  ]
};
/* 五種垃圾的模型 2026-08-14 陸續換過(見 scene-city3d.js 的 LITTER_MODELS
   那段註解——判準是「一眼看得出是被丟掉的東西」,不是乾淨的產品模型),
   這裡的顯示文字要跟著模型長相走,不然撿起來的 toast 文案會跟畫面對不上:
   bottle 現在是黑色垃圾袋、lunchbox 是散落紙屑、flyer 是攤開的碎紙片、
   cup 是混雜垃圾堆(已經不是杯子形狀)。 */
/* 每種各自帶量詞,不是套固定的「一個」——cup 是混雜垃圾堆,套「一個垃圾堆」
   讀起來很怪(kc,2026-08-14),改用「一包垃圾」;其他四種維持「一個」。 */
const LITTER_KIND_NAME = { bottle:'一個垃圾袋', lunchbox:'一個紙屑', cig:'一個菸蒂', flyer:'一張傳單', cup:'一包垃圾' };
const PLAY_LINES = [
  '玩了一下,喘得比想像中快。',
  '好像有點久沒這樣玩了。',
  '玩到有點累,但心情好一點。'
];
/* 2026-08-13 kc 加的體力值:摸狗、撿垃圾、玩遊樂器材都要扣一點,見 DESIGN_NOTES
   「stamina」那節——範圍先只接這三種街上互動,沒有動到打工/上課/劇情那些
   既有系統。 */
/* 摸貓狗／撿垃圾 2026-08-14 補了彎腰動作(hero.playOnce(),見 scene-city3d.js
   的 rig.once)——玩家在動畫播完前不能再動、不能重複觸發,所以用 busy 卡住,
   跟開選單/走進門那些既有的 busy 用法一致。獎勵(改指標、丟 toast、移除
   垃圾)延到動畫播完的 callback 才做,不是按下空白鍵那一刻就做——這樣「蹲下
   去」跟「東西消失/指標變動」在時間上才對得上。playOnce() 找不到動畫檔案
   時會直接同步呼叫 callback(見那邊的註解),所以這裡不用另外判斷動畫載了
   沒,即使還沒有動畫可放,行為也跟改動前一樣。 */
/* 上車不用 hero.playOnce() 那套彎腰動畫——沒有騎乘姿勢的模型,先試「角色
   站在車上跟著走」(不是藏起來,kc 玩起來說角色整個消失像鬼在騎車,2026-08-14
   當場改掉)。角色本體位置本來就是 pos == hero.group.position,跟騎乘移動
   共用同一個座標,不用另外同步——只是站相,不是坐姿,kc 覺得站姿穿模/太怪
   再回頭調高度或找騎乘動畫。上車瞬間不 busy=true(跟摸貓狗/撿垃圾不一樣),
   因為不需要等動畫播完才能動,按下去立刻就能騎走。 */
/* 騎別人的車扣風評(2026-08-17,kc 要求)——只在「上車那一刻」扣一次,
   不是騎乘中持續扣(kc 明確選過,跟 fullness 那種持續消耗不一樣)。量比照
   steal() 當場被抓到那組(-1,不是脫身後被抓的重罰 -2),見上面 MOTO_PRICE
   的說明。m.owned 的車(跟機車行買下的那台)騎不扣分。 */
/* 兜風加情緒(2026-08-26,kc:「騎機車兜風也會加情緒」)——只認自己的車
   (m.owned),別人的車已經扣風評,不應該再疊加一份好處。不做逐幀累加
   (那要另外接一個計時器,量級跟這遊戲其他環境互動不對稱),改成「上車
   位置→下車位置」直線距離門檻,超過 MOTO_JOYRIDE_MIN_DIST 才算真的兜了
   一圈,不是原地上下車骗獎勵——跟摸貓狗/長椅同一個「單一動作、單一
   結算點」的層級,只是結算點放在下車,不是上車(上車那一刻還不知道
   玩家會不會真的騎去哪裡)。沒有每日次數限制,跟功德箱/隨地小便同一個
   「不特別防刷,反正要花真的遊玩時間騎過去」的態度。 */
const MOTO_JOYRIDE_MIN_DIST = 15, MOTO_JOYRIDE_MOOD = 5;
let motoMountPos = null;
function mountMoto(m){
  ridingMoto = m; m.ridden = true;
  motoMountPos = { x: hero.group.position.x, z: hero.group.position.z };
  hintEl.classList.remove('on');
  if(m.owned){
    toast('騎上自己的車。', 1600);
  } else {
    chg('star', -1);
    toast('騎上別人的車——不是你的,先別想太多。', 2000);
  }
}
/* 阿霞真的坐上後座(2026-09-01)——呼叫 scene-city3d.js buildNPC() 那組
   新函式讓她的骨架借同一副 rig 的 sit 動畫+疊跨坐姿,座標/朝向每幀在
   updateCity() 裡用 PASSENGER_SEAT_OFFSET/PASSENGER_SEAT_Y 算好丟給她
   (見 setRideTransform() 呼叫處),這裡只負責啟動。 */
function startAxiaRide(){
  axiaRiding = true;
  AXIA_NPC.mountRide();
  toast('她坐上後座，手搭著你的肩膀。「中華路那邊就好，謝謝你。」', 2600);
}
function dismountMoto(){
  const m = ridingMoto; if(!m) return;
  const pos = hero.group.position;
  let joyrode = false;
  if(m.owned && motoMountPos && Math.hypot(pos.x-motoMountPos.x, pos.z-motoMountPos.z) >= MOTO_JOYRIDE_MIN_DIST){
    chg('mood', MOTO_JOYRIDE_MOOD);
    joyrode = true;
  }
  motoMountPos = null;
  m.x = pos.x; m.z = pos.z;                     // 車停在下車當下的位置,不是彈回原地
  m.ridden = false; ridingMoto = null;
  /* 阿霞下車結算(2026-09-01)——跟一般下車共用同一個時機點,她的結算
     文字優先顯示,不疊兩則 toast(toast() 是單一插槽,連續呼叫兩次只會
     看到後面那則,直接 return 跳過下面那句一般的「把車停好」)。
     2026-09-01 補目的地判定(kc:「要給導引線 跟巡邏一樣」——跟巡邏點
     visited 同一個精神,不是隨便哪裡下車都算數):要在 AXIA_DEST 附近
     (半徑 8,跟巡邏點觸發半徑 6 同量級,騎車速度快留寬一點)才算真的
     送到,resolved 才會變 true、才會給獎勵。中途下車她會下去but沒解決,
     人留在原地(不強制傳送回公車站,街上隨便一個定點路過還能再問一次
     載不載,跟原本 rideAsked 只擋「主動搭話邀請」不擋 talkToAxia() 空白鍵
     入口同一個道理)。 */
  if(axiaRiding){
    axiaRiding = false;
    AXIA_NPC.dismountRide();
    const dest = AXIA_DEST, nearDest = Math.hypot(pos.x-dest.x, pos.z-dest.z) < 8;
    if(nearDest){
      AXIA.resolved = true;
      AXIA_NPC.group.position.set(pos.x-1, .3, pos.z-1);
      chg('calm', 10);
      toast('「謝謝你載我一程，路上小心。」她朝你揮揮手，走進巷子裡。（歸屬感 +10）', 2800);
    } else {
      /* 沒送到地方就下車:把她放回公車站(不是留在半路),任務面板的
         「去永安公車站找阿霞」提示才會繼續對得上她實際站的位置。 */
      AXIA_NPC.group.position.set(AXIA.x, .3, AXIA.z);
      toast('「呃……這裡還沒到吧？」她有點尷尬地下車，往回走了。', 2600);
    }
    return;
  }
  toast(joyrode ? '騎了一圈,風吹過來整個人鬆一點。把車停好,下車走路。' : '把車停好,下車走路。', 1600);
}
/* 阿霞・走近按空白鍵(2026-09-01)——跟騎車經過的「載她一程」邀請
   (見上面 AXIA.rideAsked 那段)是兩個獨立入口,原本走路過去只有給錢/
   先走兩個選項,kc:「走路過去也要觸發選項 只是他會說你有車再說吧」——
   「載她一程」現在兩邊選單都會出現,差別只在走路過去(!ridingMoto)點下
   去不會真的上車,她只回一句「你有車再說吧」,不改 resolved、不觸發
   startAxiaRide()。resolved 之後(不管走哪條路解決)固定回一句,不會
   再開選單。 */
function talkToAxia(){
  if(AXIA.resolved){
    toast('「謝謝你那天啊。」她笑了笑，繼續等車。', 2200);
    return;
  }
  say('axia', '「末班車……我看是搭不到了齁。」她手上拎著打包的晚餐廚餘，一臉下班的疲態。', () => {
    openMenu('阿霞', [
      { label:'載她去中華路', cls:'', run(){
          if(ridingMoto) startAxiaRide();
          else say('axia', '「你有車再說吧。」她笑了一下，搖搖頭。');
        } },
      { label:'給她計程車錢', cls:'', cost:'-$50', disabled: ST.money < 50, run(){
          chg('money', -50); chg('calm', 4);
          AXIA.resolved = true;
          toast('「這樣就好，謝謝你。」她轉身走進暗處攔車。（$-50，歸屬感 +4）', 2600);
        } },
      { label:'「先走了。」', cls:'back', run(){} }
    ]);
  });
}
/* 後座位置滑桿(2026-09-01,kc:「新增動畫好了...我在調整位置就好 你開
   給我調」)——調的是 PASSENGER_SEAT_OFFSET/PASSENGER_SEAT_Y 這兩個
   let 變數,跟上面 updateCity() 裡「每幀重算 setRideTransform()」直接
   讀同一份變數,滑桿一拖動畫面立刻跟著變,不用額外的 apply()。要能看到
   效果得先真的在騎乘中(axiaRiding),所以下面另外開一個
   __dbg.axiaTestRide() 方便現場測,不用真的滿足「有機車+騎車經過她」
   這串前置條件。 */
function tweakPassengerSeatPanel(){
  const old = document.getElementById('passengerSeatTweakPanel');
  if(old){ old.remove(); return; }
  const rows = [
    ['ps_off','後座前後距離(往後退多遠)', 0, 3, 0.02, () => PASSENGER_SEAT_OFFSET, v => PASSENGER_SEAT_OFFSET = v],
    ['ps_y','座墊高度', 0.3, 1.6, 0.02, () => PASSENGER_SEAT_Y, v => PASSENGER_SEAT_Y = v]
  ];
  const panel = document.createElement('div');
  panel.id = 'passengerSeatTweakPanel';
  panel.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;background:#1b202bee;color:#eee;padding:12px 14px;border-radius:8px;font:12px/1.6 sans-serif;width:240px;box-shadow:0 4px 20px #000a';
  panel.innerHTML =
    '<div style="font-weight:bold;margin-bottom:6px">後座位置滑桿</div>' +
    rows.map(([id,label,min,max,step,get]) =>
      `<div style="margin-bottom:8px">${label}: <span id="${id}_v">${get().toFixed(2)}</span><br>
       <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${get()}" style="width:100%"></div>`
    ).join('') +
    '<div style="margin-top:4px;opacity:.7">還沒在騎乘阿霞的話先按「阿霞上/下車」按鈕<br>關掉:再按一次「後座滑桿」按鈕<br>拉到滿意後跟我說最終數字就好</div>';
  document.body.appendChild(panel);
  rows.forEach(([id,,,,,, set]) => {
    document.getElementById(id).addEventListener('input', e => {
      const v = +e.target.value;
      set(v);
      document.getElementById(`${id}_v`).textContent = v.toFixed(2);
    });
  });
}

   還沒做,先加 window.__dbg.joinedTroupe(true) 這個開關讓 kc 現場測,

   2026-08-21 更新:音遊(跳陣頭本體)還是沒做,但「加入陣頭練習」這個

   一半,音遊本體還是空的。 */
let joinedTroupe = false;
const AYI_DATA = NpcTemple.NPCS.find(n => n.id === 'ayi');
const ACHENG_DATA = NpcTemple.NPCS.find(n => n.id === 'acheng');
function openStallMenu(vendorLabel, whoName, price, full, buyLine, discountLine, extra){
  const discount = joinedTroupe;
  const p = discount ? Math.round(price * .7) : price;
  const items = [
    { label: discount ? '買一份(自己人價)' : '買一份來吃', cost:'$'+p, cls: ST.money<p?'bad':'',
      run(){
        if(ST.money < p){ toast('錢不夠,' + whoName + '看了你一眼,還是先笑笑。', 2000); return; }
        chg('money', -p); chg('full', full);
        toast(discount ? discountLine : buyLine, 2000);
      } }
  ];
  if(extra) items.push(...extra);
  items.push({ label:'不買,聊聊就好', cls:'', run(){} }, { label:'走掉', cls:'back', run(){} });
  openMenu(vendorLabel, items);
}
/* talkGivesCalm:阿成專屬(kc:「一直跟他聊天會加歸屬感」)——阿姨的閒聊
   talk[] 不給數值,只有 events[] 才給,阿成連隨機閒聊都給一點點
   歸屬感(calm),兩人待客邏輯不一樣,不能共用同一份「聊天有沒有加成」
   判斷,拆成參數。 */
function talkToStallVendor(state, data, whoKey, onBuyMenu, opts){
  opts = opts || {};
  state.visits++;
  const ev = data.events.find(e => e.at === state.visits && !state.seenEvents[e.at]);
  if(ev){
    state.seenEvents[ev.at] = true;
    playBeats(ev.beats, 0, () => {
      if(ev.calm) chg('calm', ev.calm);
      if(ev.money) chg('money', ev.money);
      if(ev.full) chg('full', ev.full);
      const isTransaction = !!(ev.money || ev.full);
      if(ev.quiet) toast(ev.quiet, 3200);
      if(!isTransaction) setTimeout(onBuyMenu, ev.quiet ? 3400 : 400);
    });
  } else {
    if(opts.talkGivesCalm) chg('calm', opts.talkGivesCalm);
    const line = data.talk[Math.random()*data.talk.length|0];
    say(whoKey, line, onBuyMenu);
  }
}

        run(){ q.active = true; toast('「謝謝啊,牠認生,你去摸摸牠就好。」', 2400); } });
    }
    openStallMenu('阿姨的攤子', '阿姨', 50, 18, '「來,趁熱。」', '「自己人,算你便宜。」', extra);

}

    }
    openStallMenu('阿成的麵攤', '阿成', 45, 16, '「趁熱吃。」', '「自己人,不用跟我客氣。」', extra);

function statGoodness(k){ return k === 'star' ? (ST.star+100)/2 : ST[k]; }
function coldReadPick(){
  const stat = FORTUNE_STATS[Math.floor(Math.random()*FORTUNE_STATS.length)];
  const g = statGoodness(stat.k);
  const tier = g >= 70 ? 'high' : g < 30 ? 'low' : 'mid';
  const grade = tier === 'high' ? '上籤' : tier === 'low' ? '下籤' : '中籤';
  const content = stat[tier];
  const lines = tier === 'high' ? content.lines : stat.lines;
  return { k:stat.k, tier, grade, no:stat.no, lines, meaning:content.meaning, followUp:content.followUp, grid:stat.grid };
}

   後面,一次 say() 播完),不再分兩顆對話框。 */
function pitchTextFor(pick){
  if(!pick || FORTUNE.quest) return null;
  if(pick.k === 'stamina'){
    if(luckBuys >= LUCK_MAX_BUYS) return null;
    return {
      text:'「你這樣硬撐不是辦法，要不要備一個轉運金牌，戴著你撐得比別人久一點。」',
      open(){
        openMenu('轉運金牌', [
          { label:'好啊，我去跑一趟', run(){
              startFortuneQuest({ id:'luck', stat:'stamina', isLuck:true, target:'moto',
                buy:'「戴著它，你撐得比別人久一點。」' });
            } },
          { label:'不用了，謝謝', cls:'back', run(){} }
        ]);
      }
    };
  }
  const item = FORTUNE_ITEMS.find(it => it.stat === pick.k);
  if(!item) return null;
  return {
    text:item.pitch,
    open(){
      openMenu(item.name, [
        { label:'好啊，我去跑一趟', run(){ startFortuneQuest(item); } },
        { label:'不用了，謝謝', cls:'back', run(){} }
      ]);
    }
  };
}
/* 接下任務:記進 FORTUNE.quest(done 一開始是 false),再讓他交代地點
   (FORTUNE_QUEST_TEXT[target].ask)+ 飄一個地點提示。真的完成要等玩家
   跑到 completeFortuneQuestAt() 掛的那個地點(見 talkToMotoBoss()/
   interactProp() 'bushes' 分支),回來找他才會真的拿到道具/加值(見
   talkToFortune() 開頭那段)。 */
function startFortuneQuest(entry){
  FORTUNE.quest = { id:entry.id, stat:entry.stat, amount:entry.amount,
                     isLuck:!!entry.isLuck, buy:entry.buy, target:entry.target, done:false };
  const qt = FORTUNE_QUEST_TEXT[entry.target];
  ACTIVE_QUESTS.push({ id:'fortune', title:'算命攤委託', hint:qt.hint.replace(/^[（(]|[)）]$/g, '') });
  renderQuestPanel();
  say('fortune', qt.ask, () => toast(qt.hint, 3200));
}
/* 在對應地點觸發——不是 FORTUNE.quest 這個任務、或還沒交代任務、或
   已經完成過,都不動作(回傳 false 讓呼叫端照原本邏輯繼續跑,例如
   talkToMotoBoss() 正常的買車/劇情對話)。true 才代表這次互動被任務
   吃掉,呼叫端要 return,不要再往下執行原本的邏輯。 */
function completeFortuneQuestAt(target){
  if(!FORTUNE.quest || FORTUNE.quest.done || FORTUNE.quest.target !== target) return false;
  FORTUNE.quest.done = true;
  const q = ACTIVE_QUESTS.find(x => x.id === 'fortune');
  if(q){ q.hint = '回去找先生交差'; renderQuestPanel(); }
  toast(FORTUNE_QUEST_TEXT[target].find, 3200);
  return true;
}

function tryJoinTroupe(){
  if(YUAN.debuted){ offerTroupeRoutine(); return; }
  const gate = NpcTemple.TROUPE.need;
  if(ST.cool < gate.cool){
    const r = NpcTemple.TROUPE.rejectCool;
    playBeats(r.beats, 0, () => {
      toast(r.quiet + '\n（帥潮要到 ' + gate.cool + ' 以上，他們才會找你——目前 ' + ST.cool + '）', 3400);
    });
    return;
  }
  if(ST.star < gate.repMin){
    const r = NpcTemple.TROUPE.rejectRep;
    playBeats(r.beats, 0, () => {
      toast(r.quiet + '\n（風評要到 ' + gate.repMin + ' 以上，廟方才會收——目前 ' + ST.star + '）', 3400);
    });
    return;
  }
  joinedTroupe = true;
  const practice = NpcTemple.TROUPE.practice;
  /* 2026-08-31:練習/出陣中間插進陣頭音遊(見 startTroupeGame() 那則
     筆記)——打好才真的算過這次(practiceIdx 前進/debuted 設 true),
     打不好這次不算數,套 TROUPE.practiceFail/debutFail 那段安慰劇情,
     下次找阿源可以重來。體力不管打好打壞都扣(人真的練了/演了)。 */
  if(YUAN.practiceIdx < practice.length){
    const ev = practice[YUAN.practiceIdx];
    playBeats(ev.beats, 0, () => {
      startTroupeGame('rongshen', (success) => {
        if(ev.stamina) chg('stamina', ev.stamina);
        if(success){
          YUAN.practiceIdx++;
          if(ev.calm) chg('calm', ev.calm);
          if(ev.cool) chg('cool', ev.cool);
          if(ev.quiet) toast(ev.quiet, 3400);
        } else {
          const fail = NpcTemple.TROUPE.practiceFail;
          chg('calm', fail.calm);
          playBeats(fail.beats, 0, () => { if(fail.quiet) toast(fail.quiet, 3000); });
        }
      });
    });
    return;
  }
  const ev = NpcTemple.TROUPE.debut;
  playBeats(ev.beats, 0, () => {
    startTroupeGame('wurenwang', (success) => {
      if(ev.stamina) chg('stamina', ev.stamina);
      if(success){
        YUAN.debuted = true;
        if(ev.calm) chg('calm', ev.calm);
        if(ev.cool) chg('cool', ev.cool);
        if(ev.quiet) toast(ev.quiet, 3400);
      } else {
        const fail = NpcTemple.TROUPE.debutFail;
        chg('calm', fail.calm);
        playBeats(fail.beats, 0, () => { if(fail.quiet) toast(fail.quiet, 3000); });
      }
    });
  });
}

function offerTroupeRoutine(){

function playTroupeRoutine(songKey){

/* 選了「先聊聊」——內容原封不動從舊版 talkToYuan() 搬過來,friend/asked/
   events/lowCoolTalk 那整套順序/門檻都沒變。 */
function yuanCasualTalk(){
  if(YUAN.friend){
    YUAN.visits++;

  if(YUAN.asked && YUAN.hasTattoo && YUAN.hasGirlfriend){
    const ev = YUAN_DATA.becomeFriend;
    playBeats(ev.beats, 0, () => {
      if(ev.calm) chg('calm', ev.calm);
      if(ev.cool) chg('cool', ev.cool);
      YUAN.friend = true;
      if(ev.quiet) toast(ev.quiet, 3200);
    });
    return;
  }
  if(YUAN.asked){
    const missing = [!YUAN.hasTattoo && '刺青', !YUAN.hasGirlfriend && '帶女朋友來'].filter(Boolean).join('、');
    say('yuan', '他看了你一眼。\n\n「' + missing + '還沒喔。」');
    return;
  }
  if(ST.cool > 30){
    const ev = YUAN_DATA.askFriend;
    playBeats(ev.beats, 0, () => {
      YUAN.asked = true;
      if(ev.quiet) toast(ev.quiet, 3200);
    });
    return;
  }
  /* 帥潮 <=30(2026-08-20,kc:「會被酸言酸語」)——events[]（at:3/at:6 那
     兩段,實際是他關心你的深層時刻)照舊按次數觸發,只有「這次沒有事件」
     的閒聊 fallback 換成 lowCoolTalk(酸你的那組),不是 talk[]（那組現在
     保留給 friend=true 之後用,見上面 talk[] 那則筆記）。不能直接呼叫
     talkToStallVendor()，因為它固定讀 data.talk，沒有辦法換成 lowCoolTalk。 */
  YUAN.visits++;
  const ev = YUAN_DATA.events.find(e => e.at === YUAN.visits && !YUAN.seenEvents[e.at]);
  if(ev){
    YUAN.seenEvents[ev.at] = true;
    playBeats(ev.beats, 0, () => {
      if(ev.calm) chg('calm', ev.calm);
      if(ev.quiet) toast(ev.quiet, 3200);
    });
  } else {
    say('yuan', YUAN_DATA.lowCoolTalk[Math.random()*YUAN_DATA.lowCoolTalk.length|0]);
  }
}

       本身——2026-08-31 起 tryJoinTroupe() 的 rejectCool/rejectRep 也改

function getTattoo(id, price){
  if(ST.money < price){ toast('錢不夠。', 2200); return; }
  chg('money', -price);
  owned.push(id);
  toggleWear(id);   // 永久裝備,這一款自己的 cool 從這裡套用,見 toggleWear() 的 removable 筆記
  YUAN.hasTattoo = true;
  advanceTime(90);
  say('tattooMaster', '「刺完了，包著保鮮膜，回去別馬上洗。」', () => {
    toast('刺青加進裝備欄了——拿不下來，除非去洗掉。', 3800);
  });
}
function removeTattoo(){
  if(ST.money < TATTOO_REMOVE_PRICE){ toast('錢不夠。', 2200); return; }
  const id = equipped.tattoo, it = WEAR_ITEMS.find(w => w.id === id);
  chg('money', -TATTOO_REMOVE_PRICE);
  if(it) chg('cool', -it.cool);
  equipped.tattoo = null;
  const i = owned.indexOf(id); if(i !== -1) owned.splice(i, 1);
  YUAN.hasTattoo = false;
  advanceTime(180);
  renderWearTab(); syncPanelStats();
  say('tattooMaster', '「洗完了，會分好幾次退色，這次只是開始。」', () => {
    toast('刺青洗掉了，裝備欄那格空了。', 3200);
  });
}

/* 小美哥(2026-08-21)——見 npc-school.js BROTHER 那則長筆記。刺青/知識
   兩邊獨立判定、效果疊加,不是二選一分支,所以這裡不是 openMenu 選單,
   是一路 playBeats 播下去,依序插入該插的段落。 */
/* 小美哥的月長線(2026-08-31,見 npc-school.js BROTHER day8Beats 那則
   長筆記)——四個節點按天解鎖(8/16/24/30,避開母賭 3/6/10/14/18/22、
   父喝 4/9/15/20/26 撞期),`seenStoryDays` 記重複鍵(跟 bet/drink 同一套
   dedupe,key 是 'brother-'+day),一次只推進一個節點,不會因為玩家隔了
   好幾天沒來就一次補播全部。
   day16/24 的分岔判準直接讀既有三個數值,沒有另開新旗標:
     - brotherTrendGood()：day16 用,門檻鬆(風評回到 −10 以上、知識夠)——
       這裡只是「風向」,講白提示,不是定案。
     - brotherFinalGood()：day24 用,門檻嚴一點(風評轉正、知識夠、沒刺青)
       ——這裡才是真的鎖定 BROTHER.path('A'/'B'),day30 直接讀鎖定結果,
       不重新判一次(跟這遊戲「沒有安全選項、選了就不能回頭」的基本盤
       一致,kc 這輪沒有要求開回頭路)。
   day24 的「小任務」kc 留給我選一個小的可逆參數,這裡選最簡單的版本:
   不是另外開一個「維持乾淨 N 天」的獨立任務物件,直接用 day24 當下的
   即時數值做最終判定——不喜歡跟我說一聲,要換成真的任務物件也不難。 */
const BROTHER_ARC_DAYS = [8, 16, 24, 30];
function brotherTrendGood(){ return ST.star >= -10 && KNOWLEDGE.rough >= 1; }
function brotherFinalGood(){ return ST.star >= 0 && KNOWLEDGE.rough >= 1 && !YUAN.hasTattoo; }
function nextBrotherArcDay(){
  return BROTHER_ARC_DAYS.find(d => day >= d && !seenStoryDays.has('brother-'+d));
}
/* 任務面板提示(2026-08-31,kc 第一輪:「提示不夠,比如需要最高級知識0/1
   之類的,當然不要強制要求玩家」→ 補了『讀書 0/1、風評不夠』這版,kc
   測完第二輪嫌太不明顯,三個具體毛病:①「讀書」講太籠統,場上讀書系統
   本來就有正式物品名(小知識碎片→略懂書本內容→精通知識三階,見上面
   K_ENTRIES 那個表),要講就講對名字,不要自己發明一個模糊詞;②風評
   「不夠」沒講清楚要多少才算夠,要秀出目標門檻(跟 rough 那個 0/1 進度
   同一種格式);③一定要註明這不是任務門檻、不會卡玩家,只是決定小美哥
   day24/30 那兩段劇情走哪個分支。
   門檻數字直接對齊 brotherFinalGood() 真正在判的兩個值(rough≥1、
   star≥0),不是另外編好記的假數字——標籤用「略懂書本內容」(K_ENTRIES
   裡 rough 那階的正式物品名),不是自創的「讀書」。風評這裡例外顯示
   精確數字(跟現在/目標門檻做「x/0」格式,呼應知識那半的 x/1),不是
   之前想避免跟 HUD 重複的「及格/不夠」——kc 明確要「風評要多少才對」,
   精確數字比方向性判斷更符合這個要求,寧可跟 HUD 的風評條資訊重疊一點,
   也不要讓玩家猜門檻在哪。BROTHER.met 之後、四個節點還沒全部播完之前
   都顯示,day30 播完自動消失。 */
function brotherArcActive(){
  return MEI.together && BROTHER.met && !BROTHER_ARC_DAYS.every(d => seenStoryDays.has('brother-'+d));
}
function syncBrotherArcPanel(){
  const idx = ACTIVE_QUESTS.findIndex(x => x.id === 'brother-arc');
  if(!brotherArcActive()){
    if(idx >= 0){ ACTIVE_QUESTS.splice(idx, 1); renderQuestPanel(); }
    return;
  }
  /* 時間提示(2026-08-31,kc:「而且要有時間提示吧 會懲罰那天當deadline」)
     ——原本只給進度數字,沒講「什麼時候」,玩家沒辦法規劃要在哪天之前
     把知識/風評補到位。加一段倒數,用既有 dayToDate() 轉成跟 HUD 時鐘/
     註冊單截止日同一種「9/24」格式,不是裸的 day 數字。day24 是真的會
     套用獎懲、鎖定 path 的那個節點(kc 說的「懲罰那天」),標成「定案」
     特別標出來;其餘三個(8/16/30)只是「下一步」,語氣輕一點。用
     BROTHER_ARC_DAYS.find(...) 直接找下一個還沒播過的節點,不看 day>=d
     (那是 nextBrotherArcDay() 給「現在就能觸發」用的,這裡要找的是還沒
     到、用來倒數的下一個)。 */
  const nd = BROTHER_ARC_DAYS.find(d => !seenStoryDays.has('brother-'+d));
  const deadline = nd == null ? '' :
    nd === 24 ? `　下次 ${dayToDate(nd)}（還有${Math.max(0,nd-day)}天）——這天定案，風評/知識要在這之前到位`
              : `　下次 ${dayToDate(nd)}（還有${Math.max(0,nd-day)}天）`;
  const hint = `略懂書本內容 ${KNOWLEDGE.rough}/1、風評 ${ST.star}/0（不是任務門檻，會決定阿正後面怎麼待你）${deadline}`;
  if(idx >= 0){
    if(ACTIVE_QUESTS[idx].hint !== hint){ ACTIVE_QUESTS[idx].hint = hint; renderQuestPanel(); }
  } else {
    ACTIVE_QUESTS.push({ id:'brother-arc', title:'阿正的觀察', hint });
    renderQuestPanel();
  }
}

/* 疊磚畫面(2026-08-28 改款,kc:「照 StackTainers 的疊高手感,但走工人肩扛
   視角,不要吊車」)——原本這裡只畫一塊寫死文字的板子,判定靠藏在 DOM 裡
   的 agBar/agBarPin。現在改成 canvas 直接畫出「玩家看得到的磚在哪」:
   FOREMAN_GAME.barPos(0~1,updateCity() 那段 ping-pong 更新)同時拿來當
   畫面上的水平位移,不是只拿來算隱形距離——玩家按空白鍵當下看到的位置
   就是判定依據,不再是對著看不見的指針猜時機。 */
const FOREMAN_BRICK_W = 92, FOREMAN_BRICK_H = 34, FOREMAN_SWING_RANGE = 130;
function foremanOffsetPx(){ return (FOREMAN_GAME.barPos - .5) * FOREMAN_SWING_RANGE * 2; }
function foremanDrawBrick(cx, y, w, h, mat, dim){
  agCtx.globalAlpha = dim ? .85 : 1;
  if(mat.img && mat.img.naturalWidth){
    agCtx.drawImage(mat.img, cx - w/2, y, w, h);
    /* 疊層之間貼著同一張照片會糊在一起分不出層次,加一道細邊界線
       (不是照片內容,是疊圖後才畫的)幫玩家看清楚疊了幾層。 */
    agCtx.strokeStyle = 'rgba(0,0,0,.35)'; agCtx.lineWidth = 1.5;
    agCtx.strokeRect(cx - w/2, y, w, h);
  } else {
    agCtx.fillStyle = mat.base; agCtx.fillRect(cx - w/2, y, w, h);
    agCtx.strokeStyle = mat.line; agCtx.lineWidth = 2; agCtx.strokeRect(cx - w/2, y, w, h);
    agCtx.globalAlpha = (dim ? .85 : 1) * .5;
    agCtx.beginPath(); agCtx.moveTo(cx - w/2, y + h/2); agCtx.lineTo(cx + w/2, y + h/2); agCtx.stroke();
  }
  agCtx.globalAlpha = 1;
}
/* carryTopY 是「正在扛的磚」那個矩形的上緣(跟 foremanDrawBrick 傳的 y

   (FOREMAN_WORKER_HAND_X/Y_FRAC)對過去,磚才會看起來是疊在手上、不是
   浮在人旁邊。 */
/* 人物是釘在「現在扛的那個點」上,不是釘在 groundY 那條真的地面線——
   這是刻意的,不是漏掉沒接(2026-08-28,kc:「地板高度是指磚頭的不是
   人的」問起來才發現這條沒講清楚):無限疊高會捲鏡頭,carryY 疊越高
   在世界座標裡爬得越高,跟 groundY 的世界座標距離會一路變大,如果硬把
   人的腳釘死在 groundY,疊高之後人會被拉爆(整張照片放大到爆掉那種),
   所以人物大小/位置維持固定,跟著扛磚點一起捲,疊高了看起來像「爬上
   自己疊的磚堆」——這個效果是這輪順便驗證過覺得合理才留著的(見
   resolveForemanLockIn 那次疊 4 層的截圖)。人物自己的大小/微調獨立開
   workerH/workerDy 兩個滑桿,不要跟 groundY 混在一起調。 */
function foremanDrawWorker(x, carryTopY){
  const handY = carryTopY + FOREMAN_BRICK_H*.5;
  if(FOREMAN_WORKER_IMG.naturalWidth){
    const dh = FOREMAN_TWEAK.workerH, dw = dh * (FOREMAN_WORKER_IMG.naturalWidth/FOREMAN_WORKER_IMG.naturalHeight);
    agCtx.drawImage(FOREMAN_WORKER_IMG, x - FOREMAN_WORKER_HAND_X_FRAC*dw, handY - FOREMAN_WORKER_HAND_Y_FRAC*dh, dw, dh);
  } else {
    const footY = handY + 40;
    agCtx.fillStyle = '#e0a339'; agCtx.beginPath(); agCtx.arc(x, footY-58, 10, 0, Math.PI*2); agCtx.fill();
    agCtx.fillStyle = '#3d5a73'; agCtx.fillRect(x-13, footY-48, 26, 32);
    agCtx.fillStyle = '#2b2f36'; agCtx.fillRect(x-11, footY-16, 10, 16); agCtx.fillRect(x+1, footY-16, 10, 16);
  }
}
