<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>no-way-up ／ 街上 ⇄ 室內</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0c10; }
  body { font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }

  #city, #indoor { position:fixed; inset:0; }
  #city canvas { display:block; }
  #indoor { display:none; align-items:center; justify-content:center; background:#0a0c10; }
  #indoor.on { display:flex; }
  #indoorStage { position:relative; width:100%; max-width:1280px; aspect-ratio:1280/720; }
  #c3d, #c2df { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---- HUD(兩層共用) ---- */
  .hud { position:fixed; left:16px; top:14px; z-index:6; display:flex; gap:7px; font-size:12px; }
  .pod { background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28);
         border-radius:4px; padding:5px 10px 6px; min-width:74px; backdrop-filter:blur(4px); }
  .pod .lb { color:#7c8593; font-size:10px; letter-spacing:.14em; }
  .pod .nm { color:#eef1f5; font-size:15px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .pod.money .nm { color:#f2d888; }
  .pod .track { height:4px; margin-top:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
  .pod .track i { display:block; height:100%; width:0; transition:width .45s cubic-bezier(.3,.9,.3,1); }
  .pod.full i { background:linear-gradient(90deg,#8a9a4a,#c9bb44); }
  .pod.full.low { border-color:rgba(224,72,58,.8); animation:lowpulse 1.15s infinite; }
  .pod.full.low i { background:linear-gradient(90deg,#e0552f,#e0483a); }
  @keyframes lowpulse { 50% { border-color:rgba(224,72,58,.2); } }
  .pod.calm i { background:linear-gradient(90deg,#3f8f86,#6fc3b4); }
  .pod.cool i { background:linear-gradient(90deg,#8a4fa8,#d05fa0); }
  .pod.mood i { background:linear-gradient(90deg,#c98a3f,#f2b25c); }
  .pod.stamina i { background:linear-gradient(90deg,#4a8a5c,#6fc98a); }
  .pod .stars { margin-top:3px; font-size:14px; letter-spacing:.12em; color:#333a45; line-height:1; }
  .pod .stars b { color:#e0483a; font-weight:400; text-shadow:0 0 9px rgba(224,72,58,.65); }
  .pod.bump { animation:bump .5s; }
  @keyframes bump { 30% { border-color:rgba(216,178,74,.8); transform:translateY(-3px); } }

  /* ---- 標籤列:src/tags.js 的資料,身上帶著的東西 ---- */
  #tags { position:fixed; left:16px; top:74px; z-index:6; display:flex; gap:6px; flex-wrap:wrap; max-width:44vw; }
  .tag { background:#e8e3d6; color:#23262c; font-size:12px; letter-spacing:.04em;
         padding:3px 9px 4px; border-radius:2px; box-shadow:1px 2px 0 rgba(0,0,0,.45);
         animation:slap .35s cubic-bezier(.2,1.5,.5,1) both; }
  @keyframes slap { from { transform:scale(1.5); opacity:0; } to { transform:scale(1); opacity:1; } }

  #where { position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:6;
           background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28); border-radius:4px;
           padding:6px 18px; font-size:14px; color:#e6eaf0; letter-spacing:.18em; backdrop-filter:blur(4px); }
  #clock { position:fixed; right:14px; top:14px; z-index:6; text-align:right;
           background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28);
           border-radius:4px; padding:6px 13px; backdrop-filter:blur(4px); }
  #clock .d { font-size:10px; letter-spacing:.16em; color:#7c8593; }
  #clock .t { font-size:17px; color:#e6eaf0; letter-spacing:.1em; font-variant-numeric:tabular-nums; }

  #hint { position:fixed; left:50%; bottom:16%; transform:translateX(-50%); z-index:6;
          background:rgba(8,10,14,.88); border:1px solid #3b4452; padding:7px 17px;
          font-size:15px; color:#e8ecf1; border-radius:3px; letter-spacing:.05em;
          opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  #hint.on { opacity:1; }
  #hint b { color:#f2d888; }

  #dialog { position:fixed; left:5%; right:5%; bottom:5%; display:none; padding-top:44px; z-index:8; }
  #dialog.on { display:block; }
  #portrait { position:absolute; left:20px; top:0; width:100px; height:100px; z-index:3;
              background:#1b202b; border:2px solid #55617a; border-radius:4px;
              box-shadow:0 6px 18px rgba(0,0,0,.55); image-rendering:pixelated; }
  #dialog .frame { padding:15px 22px 17px 144px; min-height:108px; max-width:1180px; margin:0 auto;
    background:linear-gradient(180deg,rgba(14,18,26,.96),rgba(9,12,18,.98));
    border:2px solid #55617a; border-radius:5px;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07); }
  .dname { font-size:14px; letter-spacing:.12em; color:#d8b24a; margin-bottom:7px; }
  .dbody { font-size:18px; line-height:1.8; color:#eef1f5; letter-spacing:.05em; white-space:pre-line; }
  .caret { display:inline-block; margin-left:6px; color:#d8b24a; opacity:0; animation:bob 1s infinite; }
  .caret.on { opacity:1; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(3px);} }

  #menu { position:fixed; left:50%; transform:translateX(-50%); bottom:6%;
          display:none; flex-direction:column; gap:5px; width:min(560px,82%); z-index:8; }
  #menu.on { display:flex; }
  #menu .cap { font-size:11.5px; letter-spacing:.28em; color:#8b94a3; padding-left:4px; margin-bottom:3px; }
  #menu button { text-align:left; background:rgba(12,16,23,.95); color:#dfe4ea;
    border:1px solid #3d4757; border-left:3px solid #55617a; padding:9px 15px;
    font-size:15.5px; font-family:inherit; letter-spacing:.04em; cursor:pointer; border-radius:3px;
    transition:all .13s; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  #menu button:hover { background:rgba(32,40,53,.98); border-left-color:#d8b24a; color:#fff; transform:translateX(3px); }
  #menu button .cost { font-size:12.5px; color:#8d96a4; white-space:nowrap; }
  #menu button.bad { color:#8c7a72; } #menu button.bad .cost { color:#a2564c; }
  #menu button.risk { border-left-color:#a2564c; }
  #menu button.back { border-left-color:#39424f; color:#97a0ad; font-size:14px; }

  #float { position:fixed; inset:0; pointer-events:none; z-index:7; }
  .fl { position:absolute; font-size:16px; letter-spacing:.06em; font-weight:600;
        text-shadow:0 2px 10px rgba(0,0,0,.9); animation:rise 1.5s ease-out both; }
  @keyframes rise { 0%{opacity:0;transform:translateY(6px);} 18%{opacity:1;}
                    100%{opacity:0;transform:translateY(-34px);} }

  #toast { position:fixed; left:50%; top:16%; transform:translateX(-50%);
           background:rgba(8,10,14,.9); border-left:3px solid #d8b24a; padding:9px 18px;
           font-size:15px; color:#e8ecf1; border-radius:2px; letter-spacing:.05em;
           opacity:0; transition:opacity .4s; pointer-events:none; z-index:7; max-width:62%; }
  #toast.on { opacity:1; }

  #fade { position:fixed; inset:0; background:#05060a; z-index:9; opacity:0;
          pointer-events:none; transition:opacity .4s;
          display:flex; align-items:center; justify-content:center; flex-direction:column; }
  #fade.on { opacity:1; pointer-events:auto; }
  #fade .place { font-size:28px; letter-spacing:.5em; text-indent:.5em; color:#e8e2d5;
                 opacity:0; transition:opacity .5s .1s; }
  #fade.on .place { opacity:1; }

  #bar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:6;
         display:flex; gap:7px; }
  button.tool { background:rgba(20,24,32,.9); color:#c8cfda; border:1px solid #313846;
                padding:6px 13px; font-size:12px; font-family:inherit; letter-spacing:.06em;
                cursor:pointer; border-radius:3px; }
  button.tool:hover { background:#242b36; color:#fff; }
  #keys { position:fixed; left:16px; bottom:12px; z-index:6; font-size:11.5px; color:#6a727f; letter-spacing:.08em; }
  #keys b { color:#9aa3b0; }
  #fps { position:fixed; right:14px; bottom:12px; z-index:6; font-size:11px; color:#5c6470; }
</style>
</head>
<body>

<div id="city"></div>
<div id="indoor"><div id="indoorStage">
  <canvas id="c3d"></canvas>
  <canvas id="c2df" width="1280" height="720"></canvas>
</div></div>

<div class="hud">
  <div class="pod money" id="pMoney"><div class="lb">金錢</div><div class="nm">$63</div></div>
  <div class="pod full"  id="pFull"><div class="lb">飽足</div><div class="nm">42</div><div class="track"><i></i></div></div>
  <div class="pod stamina" id="pStamina"><div class="lb">體力</div><div class="nm">100</div><div class="track"><i></i></div></div>
  <div class="pod calm"  id="pCalm"><div class="lb">歸屬感</div><div class="nm">55</div><div class="track"><i></i></div></div>
  <div class="pod cool"  id="pCool"><div class="lb">帥潮</div><div class="nm">8</div><div class="track"><i></i></div></div>
  <div class="pod mood"  id="pMood"><div class="lb">情緒</div><div class="nm">60</div><div class="track"><i></i></div></div>
  <div class="pod star"  id="pStar"><div class="lb">通緝</div><div class="stars"></div></div>
</div>
<div id="tags"></div>
<div id="where">中華路</div>
<div id="clock"><div class="d">週三</div><div class="t">20:14</div></div>

<div id="hint"></div>
<div id="toast"></div>
<div id="float"></div>

<div id="dialog">
  <canvas id="portrait" width="100" height="100"></canvas>
  <div class="frame">
    <div class="dname" id="dName">你</div>
    <div class="dbody"><span id="dTx"></span><span class="caret" id="dCaret">▼</span></div>
  </div>
</div>
<div id="menu"></div>
<div id="fade"><div class="place" id="fPlace"></div></div>

<div id="keys"><b>WASD</b> 走　<b>Q E</b> 轉相機（街上）　<b>Shift</b> 跑　<b>空白</b> 互動</div>
<div id="bar"><button class="tool" onclick="location.reload()">重來</button></div>
<div id="fps">—</div>

<script src="lib/character.js"></script>
<script src="lib/scene-store-front.js"></script>
<script src="../src/tags.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { CITY, CAM, PLAYER, buildCity, buildPlayer, buildNPC } from './lib/scene-city3d.js';

/* ===================================================================
   共用狀態 —— 兩層都吃同一份。走進超商買東西，出來街上錢就少了。
   =================================================================== */
/* mood(情緒):2026-08-13 kc 決定開的第六條,見 DESIGN_NOTES「五條指標各自
   管什麼」節尾的補記——原本「五條是上限」的規則被 kc 自己推翻,不是我看漏。
   只由路上的小互動改變(摸貓狗、撿垃圾這種環境小事),不要拿去承接家庭劇情
   的情緒衝擊——那些依然是「感受用文字承接,不要用數值」,只用 toast 講,
   這條規則沒被推翻,只是多開了一條專門給「街上的小確幸/小噁心」用。 */
/* stamina(體力):2026-08-13 kc 要的第七條——DESIGN_NOTES 原本明講「體力」
   這個名字踩過雷,決定不要另開、掛歸屬感/飽足就好,這次 kc 自己又推翻一次,
   跟 mood 那次一樣不是後面的 Claude 看漏。範圍先只接街上的小互動(摸貓狗、
   撿垃圾、玩遊樂器材)跟回家睡覺回滿,沒有去動整個遊戲其他系統(上課、
   打工、劇情選項那些)——「每做一件事都會消耗」這句要真的做到全遊戲每個
   動作都扣,是動到很多既有系統的大重構,今天先只接這三種新街上互動 +
   睡覺回滿,其餘之後再擴。 */
const ST = { money:63, full:42, calm:55, cool:8, mood:60, stamina:100, star:0 };
let minute = 20*60 + 14, day = 3;
const DAYS = ['日','一','二','三','四','五','六'];

/* 標籤:直接用 src/tags.js 的核心，不自己發明一套 */
const CH = createCharacter(['single'], 10);      // 開局:單親。其餘在遊戲裡長出來
function addTag(id){
  if(CH.tags.includes(id)) return;
  CH.tags.push(id);
  drawTags();
  const t = getTag(id);
  toast('你身上多了一格：' + (t ? t.name : id) + '。拿不掉。', 4200);
}
function drawTags(){
  const host = document.getElementById('tags');
  host.innerHTML = '';
  CH.tags.forEach(id => {
    const t = getTag(id); if(!t) return;
    const el = document.createElement('div');
    el.className = 'tag'; el.textContent = t.name;
    el.title = t.detail + (t.cover ? `（可以${t.cover.cover?.label || t.cover.label}）` : '（遮不了）');
    host.appendChild(el);
  });
}

const fmtTime = m => String((m/60|0)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
function syncHUD(){
  set('pMoney', '$' + ST.money, null);
  set('pFull', ST.full, ST.full);
  set('pStamina', ST.stamina, ST.stamina);
  set('pCalm', ST.calm, ST.calm);
  set('pCool', ST.cool, ST.cool);
  set('pMood', ST.mood, ST.mood);
  document.getElementById('pFull').classList.toggle('low', ST.full <= 25);
  document.querySelector('#pStar .stars').innerHTML =
    '<b>' + '★'.repeat(ST.star) + '</b>' + '★'.repeat(5-ST.star);
  document.querySelector('#clock .t').textContent = fmtTime(minute);
  document.querySelector('#clock .d').textContent = '週' + DAYS[day%7];
  function set(id, txt, pct){
    const pod = document.getElementById(id);
    pod.querySelector('.nm').textContent = txt;
    if(pct != null) pod.querySelector('.track i').style.width = Math.max(0,Math.min(100,pct)) + '%';
  }
}
const COLOR = { money:'#f2d888', full:'#c9bb44', calm:'#6fc3b4', cool:'#d05fa0', mood:'#f2b25c', stamina:'#6fc98a', star:'#e0483a' };
const NAMES = { money:'', full:'飽足', calm:'歸屬感', cool:'帥潮', mood:'情緒', stamina:'體力', star:'通緝' };
function chg(k, d){
  if(!d) return;
  ST[k] += d;
  if(k !== 'money') ST[k] = Math.max(0, Math.min(k==='star'?5:100, ST[k]));
  syncHUD();
  const el = document.getElementById({money:'pMoney',full:'pFull',calm:'pCalm',cool:'pCool',mood:'pMood',stamina:'pStamina',star:'pStar'}[k]);
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  const f = document.createElement('div');
  f.className = 'fl'; f.style.color = COLOR[k];
  f.style.left = (el.offsetLeft+8)+'px'; f.style.top = (el.offsetTop+el.offsetHeight+4)+'px';
  f.textContent = (NAMES[k] + ' ' + (d>0?'+':'') + (k==='money'?'$'+d:d)).trim();
  document.getElementById('float').appendChild(f);
  setTimeout(() => f.remove(), 1500);
}
const toastEl = document.getElementById('toast');
function toast(txt, ms){
  toastEl.textContent = txt; toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('on'), ms || 2800);
}
function advanceTime(min){
  minute += min;
  while(minute >= 24*60){ minute -= 24*60; day++; }
  syncHUD();
}

/* ===================================================================
   對話框 / 選單(兩層共用)
   =================================================================== */
const SF = SceneStoreFront, P2 = SF.P;
const dlgEl = document.getElementById('dialog'), dTx = document.getElementById('dTx');
const dName = document.getElementById('dName'), dCaret = document.getElementById('dCaret');
const portC = document.getElementById('portrait').getContext('2d');
const menuEl = document.getElementById('menu'), hintEl = document.getElementById('hint');

const WHO = {
  pc:    { name:'你',   opt:{ face:'F', skin:P2.pcSkin, hair:P2.pcHair, top:P2.pcHood, topD:P2.pcHoodD, pants:P2.pcPants, shoe:P2.pcShoe, hood:true } },
  clerk: { name:'店員', opt:{ face:'F', skin:P2.clSkin, hair:P2.clHair, top:P2.clVest, topD:P2.clShirt, pants:'#2c3340' } }
};
function drawPortrait(who){
  const w = WHO[who] || WHO.pc, S = portC.canvas.width;
  portC.clearRect(0,0,S,S); portC.fillStyle = '#1b202b'; portC.fillRect(0,0,S,S);
  portC.save(); portC.imageSmoothingEnabled = false;
  const k = S/33; portC.scale(k,k);
  SF.person(portC, (S/k)/2, 108, Object.assign({k:1}, w.opt));
  portC.restore(); dName.textContent = w.name;
}
let dlg = { on:false, full:'', shown:0, timer:0, done:false, after:null };
function say(who, text, after){
  drawPortrait(who);
  dlg = { on:true, full:text, shown:0, timer:0, done:false, after:after||null };
  dTx.textContent = ''; dCaret.classList.remove('on'); dlgEl.classList.add('on');
}
function tickDialog(dt){
  if(!dlg.on || dlg.done) return;
  dlg.timer += dt;
  while(dlg.timer > 36 && dlg.shown < dlg.full.length){
    dlg.timer -= 36; dlg.shown++;
    dTx.textContent = dlg.full.slice(0, dlg.shown);
  }
  if(dlg.shown >= dlg.full.length){ dlg.done = true; dCaret.classList.add('on'); }
}
function advanceDialog(){
  if(!dlg.on) return false;
  if(!dlg.done){ dlg.shown = dlg.full.length; dlg.done = true;
                 dTx.textContent = dlg.full; dCaret.classList.add('on'); return true; }
  dlgEl.classList.remove('on'); dlg.on = false;
  const fn = dlg.after; dlg.after = null; if(fn) fn();
  return true;
}
let busy = false;
function closeMenu(){ menuEl.classList.remove('on'); menuEl.innerHTML = ''; busy = false; }
function openMenu(cap, items){
  busy = true;
  menuEl.innerHTML = '<div class="cap">'+cap+'</div>';
  items.forEach(it => {
    const b = document.createElement('button');
    if(it.cls) b.className = it.cls;
    b.innerHTML = '<span>'+it.label+'</span><span class="cost">'+(it.cost||'')+'</span>';
    b.onclick = () => { closeMenu(); it.run(); };
    menuEl.appendChild(b);
  });
  menuEl.classList.add('on');
}

/* ===================================================================
   3D 街區
   =================================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d141e);
scene.fog = new THREE.FogExp2(0x0d141e, 0.0058);

const camera = new THREE.PerspectiveCamera(CAM.fov, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 29, 23);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.32;
document.getElementById('city').appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.48, 0.55, 0.82));
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0x6b7fa4, 0x3a3f4a, 1.85));
const keyLight = new THREE.DirectionalLight(0xd2dfff, 1.0);
keyLight.position.set(-24, 34, 20); keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 130;
keyLight.shadow.camera.left = -44; keyLight.shadow.camera.right = 44;
keyLight.shadow.camera.top = 40;   keyLight.shadow.camera.bottom = -40;
keyLight.shadow.bias = -0.0013;
scene.add(keyLight, keyLight.target);

const city = buildCity(THREE, scene);
const hero = buildPlayer(THREE, scene);
hero.group.position.set(CITY.spawn.x, .3, CITY.spawn.z);

/* 廟口 NPC,2026-08-12 起先接兩個(其餘見 lib/npc-temple.js 的文字資料)。
 * 只做阿源跟阿姨——小胖(14 歲)、阿伯(70 幾)體型跟現有兩副骨架差太多,
 * 硬套會不像人,等有更合適的骨架再補,見 DESIGN_NOTES「3D 街上的角色」。
 * 座標抓在廟埕開闊的地方(廟門口在 z=-98,香爐/供桌在 z=-86 一帶)。 */
const NPCS = [
  buildNPC(THREE, scene, {                            // 阿源・24歲・板模・陣頭學長
    /* rig 改回 'm'(Remy,短袖):'m2'(Leonard)雖然換了髮型,但長袖毛衣會把
       花襯衫的短袖版型跟前臂刺青都蓋住,兩個新需求都需要短袖,優先度比髮型高。
       髮色(漂黃)還是跟主角拉開差異,只是身形輪廓一樣,先這樣,之後真的要
       兼顧兩者再去找一個「短袖 + 不同髮型」的來源模型。 */
    x:-6, z:-86, rotationY:0, rig:'m',
    height: PLAYER.height * .93,                        // 比主角矮一點、壯一點,不要跟玩家長一樣
    skin:'#c9976e', hair:'#d9a53a',                     // 挑染/漂黃
    hood:'#3a1010',                                    // 花襯衫貼圖蓋不到的地方(領口內側等)用暗紅墊底
    pants:'#2b2b2b', shoe:'#e8e4d8',                    // 藍白拖的白色調子先用鞋子顏色代
    tex:{ hood:'char-yuan-shirt.png' },                 // 真的花襯衫材質
    tattoo:{ texFile:'tattoo-dragon-koi.png' }          // 前臂刺青,位置是目前肉眼調的最佳猜測,還沒最終確認
  }),
  buildNPC(THREE, scene, {                             // 阿姨・50幾・廟口攤子
    x:6, z:-86, rotationY:0, rig:'f',
    skin:'#c9a077', hair:'#2c2420',
    hood:'#5c4a3a', pants:'#333333', shoe:'#4a4038'
  })
];

/* ===================================================================
   2D 室內:超商(維持平視,因為這裡的內容是臉)
   =================================================================== */
const c2df = document.getElementById('c2df'), g2f = c2df.getContext('2d');
const LW = 640, LH = 360, SC = 2;
const STORE = {
  bgSrc:'../assets/bg/store-wall.png', walkN:190, walkS:345,
  hot:{ x:230, y:290, w:208, h:100, cut:{ sx:600, sy:495, sw:545, sh:260 } },
  spots:[
    { id:'door',    name:'門口',   x:6,   w:120, y0:190, y1:345 },
    { id:'fridge',  name:'飲料櫃', x:140, w:158, y0:190, y1:238 },
    { id:'hot',     name:'鮮食櫃', x:230, w:208, y0:288, y1:340 },
    { id:'shelf',   name:'貨架',   x:316, w:126, y0:190, y1:238 },
    { id:'counter', name:'櫃台',   x:462, w:170, y0:190, y1:250 }
  ]
};

/* ===================================================================
   室內超商:整個場景(背景 + 鮮食櫃)搬進同一個 3D scene,角色也在裡面
   (2026-08-12 kc:「場景也做個簡單 3D 圖,反正不會轉視角,一樣可以貼
   圖」)。動機:先前「2D 背景 + 3D 角色疊圖」那版,角色要去對齊一張本質上
   是手畫線性透視的背景圖,兩條透視曲線對不上,尺寸校正、鮮食櫃擋圖怎麼調
   都有殘留的違和感(見下面舊筆記/docs/DESIGN_NOTES.md「室內 3D 疊圖尺寸
   校正」)。現在背景跟鮮食櫃都變成 3D 場景裡正對鏡頭的貼圖平面(不是真的
   建模——鏡頭固定不轉,一片平面貼圖跟真的建體積,鏡頭看起來沒有差別),
   跟角色共用同一個投影,鮮食櫃的「玩家走到後面被擋住」直接靠 WebGL 深度
   測試自動處理,不用再手動判斷 IN.py 跟鮮食櫃前後、也不用再算校正參數去
   凑合兩條對不上的透視曲線。 */
const c3d = document.getElementById('c3d');
const indoorScene = new THREE.Scene();
indoorScene.add(new THREE.HemisphereLight(0xfff6e0, 0x2a2a30, 1.6));
const indoorKey = new THREE.DirectionalLight(0xfff2d8, 1.1);
indoorKey.position.set(-2, 5, 6);
indoorScene.add(indoorKey);

const indoorCamera = new THREE.PerspectiveCamera(32, LW/LH, 0.1, 60);
/* 平視,不要斜俯視——跟 2D 那套「臉與視線」的構圖原則一致。 */
indoorCamera.position.set(0, 1.7, 12);
indoorCamera.lookAt(0, 1.35, 0);
/* 校正用的 screenY()/screenX()(下面整段)在第一次 render() 之前就會被呼叫
 * (算 NZ_HOT/NZ_WALL/hotRect/wallRect/bgRect 這些模組層級常數),但
 * camera.matrixWorldInverse 預設是單位矩陣,要 updateMatrixWorld() 跑過
 * 一次才會真的反映上面 position/lookAt 設的值——沒有這行,所有校正都是拿
 * 錯的(單位矩陣)鏡頭去反推,算出來的深度/尺寸全部不準,卻不會報錯,非常
 * 難查(2026-08-12 踩了整個下午,鮮食櫃/貨架板子位置一直對不齊就是這個
 * 原因)。 */
indoorCamera.updateMatrixWorld(true);

const renderer3d = new THREE.WebGLRenderer({ canvas:c3d, antialias:true });
renderer3d.setSize(1280, 720, false);
renderer3d.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer3d.outputColorSpace = THREE.SRGBColorSpace;

/* 算「在深度 nz 要填滿畫面矩形 (x0,y0)~(x1,y1)(canvas px)需要多大的世界
   座標平面」——背景板、鮮食櫃板兩個都用這個,靠 THREE.Vector3.project()
   反推,不是憑眼睛湊尺寸。 */
function screenY(nz, y){
  const v = new THREE.Vector3(0, y, nz).project(indoorCamera);
  return (1 - v.y) / 2 * 720;
}
function screenX(x, y, nz){
  const v = new THREE.Vector3(x, y, nz).project(indoorCamera);
  return (v.x + 1) / 2 * 1280;
}
function bisect(fn, target, lo, hi){
  const rising = fn(hi) > fn(lo);
  for(let i=0; i<40; i++){
    const mid = (lo+hi)/2;
    if((fn(mid) < target) === rising) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}
function frameRectAtDepth(nz, x0, y0, x1, y1){
  const yMid = 1.2;   // 算左右邊界時取一個代表性高度,鏡頭幾乎平視,誤差可忽略
  return {
    left:   bisect(x => screenX(x, yMid, nz), x0, -40, 40),
    right:  bisect(x => screenX(x, yMid, nz), x1, -40, 40),
    top:    bisect(y => screenY(nz, y), y0, -30, 30),
    bottom: bisect(y => screenY(nz, y), y1, -30, 30)
  };
}
function planeFromRect(THREE, rect, nz, texture){
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(rect.right-rect.left, rect.top-rect.bottom),
    new THREE.MeshBasicMaterial({ map:texture })
  );
  mesh.position.set((rect.left+rect.right)/2, (rect.top+rect.bottom)/2, nz);
  return mesh;
}
/* 有厚度的箱體版 planeFromRect——正面(朝鏡頭)貼原本校正過的照片材質,
   其餘五面共用一個素色材質。2026-08-13 kc 截圖抓到:鏡頭雖然固定平視,但
   position.y=1.7 略高於 lookAt 的 1.35,是稍微往下看的角度,箱體的頂面
   (朝上那面)其實會被看到一小條,原本用近黑色(0x2b2b2e)那面在鮮食櫃
   頂端露出一條刺眼的黑邊。改成接近照片裡不鏽鋼檯面的淺灰,露出來也不突兀。
   側/背面實際上仍然看不到,不用另外做圖。正面深度維持在 nz 不變,只往鏡頭
   反方向長出 depth,原本 planeFromRect 那版驗證過的視覺對齊不受影響。見
   docs/DESIGN_NOTES.md「室內固定物件的碰撞」那節。 */
const FIXTURE_SIDE_MAT = new THREE.MeshBasicMaterial({ color:0xb8b8b8 });
function boxFromRect(THREE, rect, nz, depth, texture, sideMat){
  const faceMat = new THREE.MeshBasicMaterial({ map:texture });
  const side = sideMat || FIXTURE_SIDE_MAT;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(rect.right-rect.left, rect.top-rect.bottom, depth),
    [side, side, side, side, faceMat, side]
  );
  mesh.position.set((rect.left+rect.right)/2, (rect.top+rect.bottom)/2, nz - depth/2);
  return mesh;
}

/* 深度:門口(遠)到最近牆(近)的世界深度範圍。2026-08-12 kc 反應「走到底
   感覺沒有真的很靠近貨架」,把 NZ_FAR 推到 -14 之後又反應「穿牆」——
   原因是貨架那張照片本身就有透視(離鏡頭較遠的貨架在照片裡本來就該畫得
   比人矮),角色貼近之後,一顆「畫面高度固定」的頭直接高過了照片裡貨架
   在那個位置該有的視覺高度,看起來像頭穿進貨架的陳列區。退回一個沒那麼
   極端的距離(-8),沒有完全貼齊貨架(那需要貨架自己也有一塊 3D 校正過的
   板子,跟鮮食櫃一樣,或整個重抓比例——範圍更大,先不做)。 */
const NZ_FAR = -8, NZ_NEAR = 5;
function nzForPy(py){
  const t = (py - STORE.walkN) / (STORE.walkS - STORE.walkN);
  return NZ_FAR + t * (NZ_NEAR - NZ_FAR);
}
/* nzForPy 的反函式——把「箱體正面深度」換算回 py,拿去當碰撞邊界。
   2026-08-13:碰撞從這裡反推,不再手打第二份座標,見 DESIGN_NOTES。 */
function pyForNz(nz){
  const t = (nz - NZ_FAR) / (NZ_NEAR - NZ_FAR);
  return STORE.walkN + t * (STORE.walkS - STORE.walkN);
}
/* 三個室內固定物件先共用一個厚度(世界單位,約 0.59 公尺,對照
   scene-city3d.js「1 單位 ≈ 0.42 公尺」)。playtest 覺得某個櫃子看起來/
   擋起來不對再拆成各自的值。 */
const FIXTURE_DEPTH = 1.4;
/* NZ_HOT 不能用 nzForPy(STORE.hot.y)——那只是沿用「角色深度」那條線性公式,
   跟「鮮食櫃在照片裡貼地的畫面位置」沒有直接關係,兩者剛好對上純屬巧合
   (加上今天稍早 camera.updateMatrixWorld() 沒補那個 bug,巧合更巧合)。
   跟 NZ_WALL 一樣,改用 bisect 直接反推「世界 Y=0(真地板)投影到哪」,
   角色站到鮮食櫃前面互動時腳才會踩在地上,不會懸空(2026-08-12 kc 截圖
   抓到:腳跟地板中間有一截空隙)。 */
const NZ_HOT = bisect(nz => screenY(nz,0), STORE.hot.y * SC, -60, 11.9);
const NZ_HOT_BACK = NZ_HOT - FIXTURE_DEPTH;

/* 2026-08-13:背景圖改成 store-wall.png(只有牆——門口/飲料櫃/貨架,
   不含收銀台、不含鮮食櫃),取代原本整間店都畫在一張照片裡的 store-front.png
   ——鮮食櫃、櫃台現在都是各自獨立的 3D 物件、各自的貼圖(見下面),不用再
   靠裁切同一張照片湊,也不會再跟新蓋的 3D 家具「疊出兩個一樣的東西」
   (kc 截圖抓到的問題)。之前那段暫時擋著的遮色板邏輯(`bgMaskCanvas` 等)
   已經整段刪掉,不再需要。 */
const bgTex = new THREE.TextureLoader().load(STORE.bgSrc, () => { refreshWallTex(); });
bgTex.colorSpace = THREE.SRGBColorSpace;
const NZ_BG = -22;
indoorScene.add(planeFromRect(THREE, frameRectAtDepth(NZ_BG, 0,0,1280,720), NZ_BG, bgTex));

/* 鮮食櫃板:2026-08-13 改成獨立貼圖(store-hot-cabinet.png,見
   assets/bg/PROMPTS.md),不再裁自背景圖——整張圖本身就是這個箱體正面要
   貼的內容,直接當材質,不用另外裁切到獨立畫布。 */
const hotTex = new THREE.TextureLoader().load('../assets/bg/store-hot-cabinet.png');
hotTex.colorSpace = THREE.SRGBColorSpace;
const hotRect = frameRectAtDepth(NZ_HOT,
  STORE.hot.x*SC, (STORE.hot.y-STORE.hot.h)*SC, (STORE.hot.x+STORE.hot.w)*SC, STORE.hot.y*SC);
indoorScene.add(boxFromRect(THREE, hotRect, NZ_HOT, FIXTURE_DEPTH, hotTex));

/* 後牆那排(飲料櫃/貨架)也補一塊板子(2026-08-12,kc:「還是有走到裡面
   去的感覺」)——這兩個原本只有背景那張遠景平面(NZ_BG),角色貼近時沒有
   東西擋住,看起來像整個人陷進貨架的陳列區裡。裁切座標是直接在原圖
   (`assets/bg/store-front.png`,1672×941)上量出來的,深度算法見下面
   NZ_WALL 那行的註解——玩家走近時會被這塊板子擋住下半身,只露頭肩膀,
   跟鮮食櫃那個效果一樣。
   **收銀台刻意不含在這塊板子裡**——店員站在收銀台後面,深度比這塊板子
   還遠,會被整個擋住(踩過這個坑,店員一度只剩兩隻腳露在板子下面)。 */
const WALL_CUT = { sx:350, sy:65, sw:830, sh:435 };
const IMG_TO_CANVAS_X = 1280/1672, IMG_TO_CANVAS_Y = 720/941;
const wallCanvas = document.createElement('canvas');
wallCanvas.width = WALL_CUT.sw; wallCanvas.height = WALL_CUT.sh;
const wallCtx = wallCanvas.getContext('2d');
const wallTex = new THREE.CanvasTexture(wallCanvas);
wallTex.colorSpace = THREE.SRGBColorSpace;
function refreshWallTex(){
  const c = WALL_CUT;
  wallCtx.drawImage(bgTex.image, c.sx,c.sy,c.sw,c.sh, 0,0,c.sw,c.sh);
  wallTex.needsUpdate = true;
}
/* NZ_WALL 不能沿用 nzForPy() 隨便挑一個深度——踩過一次坑:一開始用
   nzForPy(230),角色整個消失了(頭反而被擋、腳露在外面),因為那個深度的
   「地板」投影位置跟照片裡貨架真正貼地的畫面位置對不上,solve 出來的板子
   底邊懸在半空中(世界 Y=1.4,不是 0)。改成用 bisect 直接反推:哪個深度
   讓「世界 Y=0(真地板)」剛好投影到貨架貼地那個畫面位置,板子才會真的
   從地板長起來,擋住的才會是下半身而不是頭。 */
const NZ_WALL = bisect(nz => screenY(nz,0), (WALL_CUT.sy+WALL_CUT.sh)*IMG_TO_CANVAS_Y, -60, 11.9);
const wallRect = frameRectAtDepth(NZ_WALL,
  WALL_CUT.sx*IMG_TO_CANVAS_X, WALL_CUT.sy*IMG_TO_CANVAS_Y,
  (WALL_CUT.sx+WALL_CUT.sw)*IMG_TO_CANVAS_X, (WALL_CUT.sy+WALL_CUT.sh)*IMG_TO_CANVAS_Y);
indoorScene.add(boxFromRect(THREE, wallRect, NZ_WALL, FIXTURE_DEPTH, wallTex));

/* 櫃台原本刻意沒有近景看板(店員站在後面要被完整擋住,見上面「收銀台刻意
   不含在這塊板子裡」)——2026-08-13 kc 截圖抓到:碰撞修好、玩家真的能貼近
   之後,店員下半身沒東西擋,跟玩家整個疊在一起。

   一開始比照鮮食櫃/貨架牆那套「照片矩形貼到箱體上,用 frameRectAtDepth
   反推對齊」的做法,結果一路踩坑:深度淺了側面會露出來、店員站太近會
   z-fighting、深度退深了比例又跟 kc 的參考圖差一大截、寬度不夠店員肩膀會
   露出箱體外——每次都是在同一個「拿 2D 照片矩形硬套 3D 深度」的框架裡
   打補丁。**kc 一句話點出根本方向錯了:櫃台應該當真的 3D 物件蓋出來,跟
   街上的小狗、路口圓環同一套做法**(`scene-city3d.js` 的 `buildDog()`/
   `roundabout()`,基本幾何 + 素色材質,給真實世界尺寸,不從照片反推)。
   寬高深都是設計時就決定好的真實數字,店員站在後面自然就對,因為兩者
   活在同一個真實比例的 3D 世界裡,不需要另外對齊、不需要量店員肩膀
   幾個像素去卡邊界。

   尺寸對照 scene-city3d.js「1 單位 ≈ 0.42 公尺」:高 2.1(≈90cm,既有
   COUNTER_WORLD_HEIGHT 這個數字幾輪驗證下來是對的,沿用)、寬 3.6
   (≈1.5m,比店員肩膀寬綽有餘,不用再卡邊界)、深 1.3(≈55cm,真實
   物理厚度,不是為了怕側面穿幫刻意縮薄的障眼法,側面本來就看得到,是
   真正的箱體側面)。深度位置(NZ_COUNTER)沿用這幾輪已經校正過、比例
   跟參考圖對得上的值。 */
const NZ_COUNTER = -8;
const COUNTER_WORLD_HEIGHT = 2.1, COUNTER_WORLD_WIDTH = 3.6, COUNTER_WORLD_DEPTH = 1.3;
/* 正面貼獨立生成的 store-counter.png(2026-08-13,見 assets/bg/PROMPTS.md)
   ——櫃台是獨立 3D 家具,不再跟牆面共用/裁切同一張背景照片。 */
const counterFaceTex = new THREE.TextureLoader().load('../assets/bg/store-counter.png');
counterFaceTex.colorSpace = THREE.SRGBColorSpace;
const COUNTER_BODY_SIDE_MAT = new THREE.MeshStandardMaterial({ color:0x9c8e78, roughness:.9 });
const COUNTER_BODY_FACE_MAT = new THREE.MeshStandardMaterial({ map:counterFaceTex, roughness:.9 });
const COUNTER_TOP_MAT = new THREE.MeshStandardMaterial({ color:0xb8b8b8, roughness:.6, metalness:.2 });
const COUNTER_MONITOR_MAT = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:.5 });
const COUNTER_SCREEN_MAT = new THREE.MeshStandardMaterial({ color:0x9fc8e0, roughness:.4, emissive:0x2a4a5c, emissiveIntensity:.6 });
function buildCounterDesk(nz, screenXTarget){
  const g = new THREE.Group();
  const cx = worldXForScreenX(screenXTarget, nz);
  const cz = nz - COUNTER_WORLD_DEPTH/2;              // 正面卡在 nz,往鏡頭反方向長出深度
  g.position.set(cx, 0, cz);

  /* BoxGeometry 材質陣列順序是 [+x,-x,+y,-y,+z,-z]——鏡頭在 +z 方向看過來,
     朝鏡頭那面(+z,index 4)貼照片材質,其餘素色,跟 boxFromRect() 同一招。 */
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(COUNTER_WORLD_WIDTH, COUNTER_WORLD_HEIGHT, COUNTER_WORLD_DEPTH),
    [COUNTER_BODY_SIDE_MAT, COUNTER_BODY_SIDE_MAT, COUNTER_BODY_SIDE_MAT, COUNTER_BODY_SIDE_MAT,
     COUNTER_BODY_FACE_MAT, COUNTER_BODY_SIDE_MAT]);
  body.position.y = COUNTER_WORLD_HEIGHT/2;
  g.add(body);

  const top = new THREE.Mesh(
    new THREE.BoxGeometry(COUNTER_WORLD_WIDTH+.15, .08, COUNTER_WORLD_DEPTH+.15),
    COUNTER_TOP_MAT);
  top.position.y = COUNTER_WORLD_HEIGHT + .04;
  g.add(top);

  /* 收銀機示意,不強制要有——一個小箱體疊在檯面上,增加識別度,比照
     buildDog() 疊耳朵/尾巴那種「基本幾何堆出輪廓」的做法。這麼小的物件
     不值得另外裁一張照片材質(kc 抓到「收銀機也沒貼」——這裡先用兩層
     素色做出「深色機身 + 亮螢幕」的意思,比純黑一塊看起來有東西,真的
     要照片級細節再回頭補)。 */
  const monitor = new THREE.Mesh(new THREE.BoxGeometry(.35,.32,.05), COUNTER_MONITOR_MAT);
  monitor.position.set(-COUNTER_WORLD_WIDTH*.22, COUNTER_WORLD_HEIGHT+.24, -COUNTER_WORLD_DEPTH*.3);

  g.add(screen);

}

/* 身高:2026-08-12 先讓角色照真的透視縮放,kc 反應「變小的幅度好誇張」→
   改成只留一點暗示的縮放範圍 → kc 反應「乾脆不要調小」→ 改成固定世界身高
   (不再每幀調 scale),但**世界身高固定,鏡頭一樣會把比較遠的東西畫小,

/* IN.px/IN.py(2D 640×360 邏輯座標)換算成這個獨立場景的世界座標:
   py 對到「離鏡頭遠近」(world Z),用上面 nzForPy();px 對到左右(world X)
   ——2026-08-12 踩過一個坑:一開始 nx 用跟深度無關的線性公式,結果角色走去
   門口(nz 比較遠)時,因為 nx 沒有跟著深度縮放,實際落點跑到鮮食櫃那塊
   3D 貼圖板的「陰影」範圍裡,被錯誤地整個擋住(不是視覺 bug,是真的站在
   板子後面,深度測試正確地擋住它,只是站錯地方)。screenX() 對世界 X 是
   線性的(鏡頭沒有 roll),所以每幀重算「這個深度下,1 世界 X 單位對應幾個
   畫面 px」不貴,不用整段都用固定公式。 */
function worldXForScreenX(targetScreenX, nz){
  const y = 1.2;
  const x0 = screenX(0, y, nz), x1 = screenX(1, y, nz);
  return (targetScreenX - x0) / (x1 - x0);
}
function renderIndoor3D(dt){

  const nx = worldXForScreenX(IN.px * SC, nz);
  heroIndoor.group.position.set(nx, 0, nz);
  heroIndoor.group.scale.setScalar(heroScaleFor(nz));
  heroIndoor.group.rotation.y =
    IN.face === 'F' ? 0 : IN.face === 'B' ? Math.PI :
    IN.face === 'L' ? -Math.PI/2 : Math.PI/2;
  heroIndoor.animate(dt, IN.moving, 1);
  clerkNPC.group.rotation.y = IN.clerkFace === 'B' ? Math.PI : 0;
  clerkNPC.animate(dt);
  renderer3d.render(indoorScene, indoorCamera);
}

const grain = (() => {
  const c = document.createElement('canvas'); c.width = LW; c.height = LH;
  const x = c.getContext('2d'), img = x.createImageData(LW, LH);
  let s = 20260804;
  const rnd = () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
  for(let i=0;i<img.data.length;i+=4){
    const v = rnd() < .5 ? 0 : 255;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3] = rnd() < .05 ? 10 : 0;
  }
  x.putImageData(img,0,0); return c;
})();

function updateIndoor(dt){
  IN.clerkT += dt;
  IN.clerkFace = (IN.clerkT % 6600) < 2400 ? 'B' : 'F';

  let dx=0, dy=0;
  if(keys['a']||keys['arrowleft'])  dx -= 1;
  if(keys['d']||keys['arrowright']) dx += 1;
  if(keys['w']||keys['arrowup'])    dy -= 1;
  if(keys['s']||keys['arrowdown'])  dy += 1;

  if(!busy && !dlg.on && (dx||dy)){
    const sp = 1.35 * (dx&&dy ? .71 : 1);
    const nx = Math.max(20, Math.min(LW-20, IN.px + dx*sp));
    const ny = Math.max(STORE.walkN, Math.min(STORE.walkS, IN.py + dy*sp*.62));
    if(!inBlocked(nx, IN.py)) IN.px = nx;
    if(!inBlocked(IN.px, ny)) IN.py = ny;
    IN.moving = true; IN.walkT += dt;
    if(dx<0) IN.face='L'; else if(dx>0) IN.face='R';
    else if(dy<0) IN.face='B'; else if(dy>0) IN.face='F';
  } else IN.moving = false;

  IN.near = null;
  for(const sp of STORE.spots)
    if(IN.px > sp.x-12 && IN.px < sp.x+sp.w+12 && IN.py >= sp.y0 && IN.py <= sp.y1){ IN.near = sp.id; break; }
  const show = IN.near && !busy && !dlg.on;
  if(show){
    hintEl.innerHTML = STORE.spots.find(s=>s.id===IN.near).name + '　按 <b>空白鍵</b>';
    hintEl.classList.add('on');
  } else hintEl.classList.remove('on');
}

let camYaw = 0, nearDoor = null, nearProp = null, walkIn = null;
const tmp = new THREE.Vector3();

/* 相機防穿牆(kc 之前就遇過):建築/招牌都是 add() 直接掛在 scene 底下的
   Mesh,角色跟 NPC 是 Group,只抓 scene.children 裡 isMesh 的那層、不遞迴,
   天然排除人物,場景建好就不會再變,先快取一次。跟 street3d.html 同一招,
   細節見那邊的註解。 */
const occluders = scene.children.filter(o => o.isMesh);
const camRay = new THREE.Raycaster();
const eyePos = new THREE.Vector3(), camDir = new THREE.Vector3();
const whereEl = document.getElementById('where');

function updateCity(dt){
  if(keys['q']) camYaw -= dt*.0018;
  if(keys['e']) camYaw += dt*.0018;

  const run = keys['shift'] ? 2 : 1;
  const pos = hero.group.position;
  let moving = false;

  if(walkIn){
    /* 進門的最後幾步不是玩家按出來的,是腳本算出來的方向直接走到門的座標——
       跟下面手動輸入共用同一顆 hero.animate(),角色不會在切換的瞬間卡一下。 */
    const dx = walkIn.x - pos.x, dz = walkIn.z - pos.z, dist = Math.hypot(dx, dz);
    if(dist < .12){
      const done = walkIn.done; walkIn = null; done();
    } else {
      const speed = 0.0055 * dt;
      pos.x += (dx/dist) * speed; pos.z += (dz/dist) * speed;
      hero.group.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
  } else if(!busy && !dlg.on){
    let ix=0, iz=0;
    if(keys['a']||keys['arrowleft'])  ix -= 1;
    if(keys['d']||keys['arrowright']) ix += 1;
    if(keys['w']||keys['arrowup'])    iz -= 1;
    if(keys['s']||keys['arrowdown'])  iz += 1;
    if(ix||iz){
      const speed = 0.005 * dt * run;
      const len = Math.hypot(ix,iz);
      /* 移動要跟著鏡頭轉(kc 抓到的問題),細節見 street3d.html 同一段註解。 */
      const dx = (ix*Math.cos(camYaw) + iz*Math.sin(camYaw))/len;
      const dz = (-ix*Math.sin(camYaw) + iz*Math.cos(camYaw))/len;
      const nx = pos.x + dx*speed, nz = pos.z + dz*speed;
      if(!city.blocked(nx, pos.z)) pos.x = Math.max(CITY.bounds.x[0], Math.min(CITY.bounds.x[1], nx));
      if(!city.blocked(pos.x, nz)) pos.z = Math.max(CITY.bounds.z[0], Math.min(CITY.bounds.z[1], nz));
      hero.group.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
  }
  hero.animate(dt, moving, run);
  NPCS.forEach(n => n.animate(dt));

  let onRoad = false;
  for(const r of CITY.H_ROADS) if(Math.abs(pos.z-r.z) < CITY.ROAD_HW) onRoad = true;
  for(const r of CITY.V_ROADS) if(Math.abs(pos.x-r.x) < CITY.ROAD_HW) onRoad = true;
  pos.y += ((onRoad ? .1 : .3) - pos.y)*.3;

  tmp.set(Math.sin(camYaw)*CAM.dist, CAM.high, Math.cos(camYaw)*CAM.dist);
  tmp.add(pos);
  /* 相機防穿牆,細節見 street3d.html 同一段註解——理想機位跟角色中間隔了
     牆的話,把鏡頭拉到撞點前面一點。 */
  eyePos.set(pos.x, pos.y + hero.eyeY*CAM.lookY, pos.z);
  camDir.subVectors(tmp, eyePos);
  const wantDist = camDir.length();
  let camTarget = tmp;
  if(wantDist > .01){
    camDir.divideScalar(wantDist);
    camRay.set(eyePos, camDir);
    camRay.far = wantDist;
    const hit = camRay.intersectObjects(occluders, false)[0];
    if(hit) camTarget = eyePos.clone().addScaledVector(camDir, Math.max(3, hit.distance - 1.2));
  }
  camera.position.lerp(camTarget, 1 - Math.pow(.0015, dt/1000));
  camera.lookAt(pos.x, pos.y + hero.eyeY*CAM.lookY, pos.z);

  keyLight.position.set(pos.x-24, 34, pos.z+20);
  keyLight.target.position.copy(pos);
  city.updateLights(pos.x, pos.z);
  whereEl.textContent = city.whereAmI(pos.x, pos.z);

  nearDoor = null;
  for(const d of city.doors)
    if(Math.hypot(pos.x-d.x, pos.z-d.z) < 3.6){ nearDoor = d; break; }

  /* 街上的小互動(摸狗、撿垃圾),2026-08-13 加的——跟門用同一套「距離內才
     顯示提示、按空白鍵觸發」,但門優先(nearDoor 先判斷),同一格站著不會
     兩個提示打架。litter 撿過會被移出 city.litter(見 interactProp),
     不用另外記一份「已撿」清單。 */
  nearProp = null;
  if(!nearDoor){
    for(const p of city.pets)
      if(Math.hypot(pos.x-p.x, pos.z-p.z) < 3.2){ nearProp = { type:'pet', ref:p }; break; }
    if(!nearProp) for(const l of city.litter)
      if(Math.hypot(pos.x-l.x, pos.z-l.z) < 3.2){ nearProp = { type:'litter', ref:l }; break; }
    if(!nearProp) for(const p of city.play)
      if(Math.hypot(pos.x-p.x, pos.z-p.z) < 3.2){ nearProp = { type:'play', ref:p }; break; }
  }

  if(nearDoor && !busy && !dlg.on){
    hintEl.innerHTML = nearDoor.name + '　按 <b>空白鍵</b> ' + (nearDoor.id === 'home' ? '睡覺' : '進去');
    hintEl.classList.add('on');
  } else if(nearProp && !busy && !dlg.on){
    hintEl.innerHTML = nearProp.type === 'pet' ? nearProp.ref.label + '　按 <b>空白鍵</b> 摸摸看'
                      : nearProp.type === 'play' ? nearProp.ref.label + '　按 <b>空白鍵</b> 玩一下'
                      : '按 <b>空白鍵</b> 撿起來';
    hintEl.classList.add('on');
  } else if(MODE === 'city') hintEl.classList.remove('on');
}

const PET_LINES = [
  '牠讓你摸了好一會,尾巴搖得很兇。',
  '牠靠著你的腳,好像沒有很想理你以外的人。',
  '摸起來有點髒,但牠好像很開心。'
];
const LITTER_KIND_NAME = { bottle:'寶特瓶', lunchbox:'保麗龍便當盒', cig:'菸蒂', flyer:'傳單', cup:'手搖杯' };
const PLAY_LINES = [
  '玩了一下,喘得比想像中快。',
  '好像有點久沒這樣玩了。',
  '玩到有點累,但心情好一點。'
];
/* 2026-08-13 kc 加的體力值:摸狗、撿垃圾、玩遊樂器材都要扣一點,見 DESIGN_NOTES
   「stamina」那節——範圍先只接這三種街上互動,沒有動到打工/上課/劇情那些
   既有系統。 */
function interactProp(prop){
  if(prop.type === 'pet'){
    chg('mood', 4);
    chg('stamina', -3);
    toast(PET_LINES[Math.random()*PET_LINES.length|0], 2400);
  } else if(prop.type === 'play'){
    chg('mood', 3);
    chg('stamina', -5);
    toast(prop.ref.label + '。' + PLAY_LINES[Math.random()*PLAY_LINES.length|0], 2400);
  } else {
    const l = prop.ref;
    chg('mood', -3);
    chg('stamina', -2);
    chg('star', -1);                                    // 善值:見 DESIGN_NOTES「風評」,好事讓它往好的方向動
    if(l.kind === 'bottle') chg('money', 2);
    toast('撿起一個' + (LITTER_KIND_NAME[l.kind] || '垃圾') + '丟進垃圾桶。'
          + (l.kind === 'bottle' ? '（$2）' : ''), 2200);
    scene.remove(l.mesh);
    if(l.glow) scene.remove(l.glow);
    city.litter.splice(city.litter.indexOf(l), 1);
    nearProp = null;
    hintEl.classList.remove('on');
  }
}

let lastW=0, lastH=0;
function fit(){
  if(innerWidth===lastW && innerHeight===lastH) return;
  lastW=innerWidth; lastH=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}

const fpsEl = document.getElementById('fps');
let last = performance.now(), acc = 0, frames = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(50, now-last); last = now;
  fit(); tickDialog(dt);
  if(MODE === 'city'){ updateCity(dt); composer.render(); }
  else { updateIndoor(dt); renderIndoor3D(dt); renderIndoorForeground(); }
  acc += dt; frames++;
  if(acc > 500){ fpsEl.textContent = Math.round(frames*1000/acc)+' fps'; acc=0; frames=0; }
});

syncHUD(); drawTags();

/* 除錯用:主控台可以直接把角色傳到某個門口，省得走一分鐘 */
window.__dbg = {
  goto(id){
    const d = city.doors.find(x => x.id === id);
    if(!d) return '沒有這個門：' + city.doors.map(x=>x.id).join(', ');
    hero.group.position.set(d.x, .3, d.z);
    return `已移到 ${d.name} (${d.x.toFixed(1)}, ${d.z.toFixed(1)})`;
  },
  enter(id){ const d = city.doors.find(x => x.id === id); if(d) enterIndoor(d); return MODE; },
  at(x, z){ hero.group.position.set(x, .3, z); return `已移到 (${x}, ${z})`; },
  near(x, z, r){ return scene.children.filter(o => o.isMesh && Math.hypot(o.position.x-x, o.position.z-z) < (r||3))
    .map(o => ({ pos:[+o.position.x.toFixed(2),+o.position.y.toFixed(2),+o.position.z.toFixed(2)],
                 rot:[+o.rotation.x.toFixed(3),+o.rotation.y.toFixed(3),+o.rotation.z.toFixed(3)],
                 scale:[+o.scale.x.toFixed(2),+o.scale.y.toFixed(2),+o.scale.z.toFixed(2)],
                 size: o.geometry?.parameters })); },
  leave(){ leaveIndoor(); },
  setIndoor(px, py, face){ IN.px=px; IN.py=py; if(face) IN.face=face; },
  tick(dt){ renderIndoor3D(dt||16); renderIndoorForeground(); },   // 手動推進一幀,不用等 rAF,方便測室內位置
  heroIndoor, indoorScene, renderer3d,
  indoorCalib(){
    const z = heroIndoor.group.position.z, s = heroIndoor.group.scale.x;
    return { NZ_FAR, NZ_HOT, NZ_NEAR, NZ_WALL, NZ_COUNTER, FIXTURE_COLLIDERS,
      heroPos: heroIndoor.group.position.toArray(), heroScale: s,
      footScreenY: screenY(z, 0), headScreenY: screenY(z, s*PLAYER.height) };
  },
  mode: () => MODE,
  screenY, screenX, cam: indoorCamera,
  state: () => ({ ...ST, tags:CH.tags.slice(), time:fmtTime(minute),
                  pos:[+hero.group.position.x.toFixed(1), +hero.group.position.z.toFixed(1)] })
};
</script>
