     照片實際圍籬/地面交界目測抓的(1536×1024,跟畫布 640×420 長寬比幾乎
     一樣,cover 貼滿裁掉的量小到可以忽略),現在可以用 __dbg.tweakForeman()
     現場調(見 FOREMAN_TWEAK 那則筆記)。 */
  if(FOREMAN_BG_IMG.naturalWidth){
    const s = Math.max(w/FOREMAN_BG_IMG.naturalWidth, h/FOREMAN_BG_IMG.naturalHeight);
    const iw = FOREMAN_BG_IMG.naturalWidth*s, ih = FOREMAN_BG_IMG.naturalHeight*s;
    agCtx.drawImage(FOREMAN_BG_IMG, (w-iw)/2 + FOREMAN_TWEAK.bgDx, (h-ih)/2 + FOREMAN_TWEAK.bgDy, iw, ih);
  } else {
    const sky = agCtx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'#7fb8e0'); sky.addColorStop(1,'#cfe6f2');
    agCtx.fillStyle = sky; agCtx.fillRect(0,0,w,h);
    agCtx.fillStyle = 'rgba(60,68,58,.35)';
    for(let x=-20;x<w+40;x+=54) agCtx.fillRect(x, groundY-162, 8, 90);
    agCtx.fillRect(0, groundY-162, w, 10);
    agCtx.fillStyle = '#8b8578'; agCtx.fillRect(0, groundY, w, 4000);
    agCtx.fillStyle = 'rgba(0,0,0,.12)'; agCtx.fillRect(0, groundY, w, 4);
  }

  /* 無限疊高(2026-08-28,kc:「可以無限扛」)——磚堆會超過畫布高度,
     跟著疊的層數往下捲場景(捲的是磚堆/工人這個「世界」,背景照片留在
     畫布座標不跟著捲,模擬鏡頭一路往上爬、看到的都是更高的天空)。
     scrollY 只在疊到快頂到上緣時才開始生效,矮的時候跟以前一樣不捲。 */
  const visibleTop = 60;
  const totalH = FOREMAN_GAME.stack.length * FOREMAN_BRICK_H;
  const scrollY = Math.max(0, totalH - (groundY - visibleTop));

  agCtx.save();
  agCtx.translate(0, scrollY);

  FOREMAN_GAME.stack.forEach((b, i) => {
    foremanDrawBrick(cx + b.offset, groundY - (i+1)*FOREMAN_BRICK_H, FOREMAN_BRICK_W, FOREMAN_BRICK_H, b.mat);
  });
  if(FOREMAN_GAME.fallen){
    agCtx.save();
    agCtx.translate(FOREMAN_GAME.fallen.x, groundY - 10);
    agCtx.rotate(FOREMAN_GAME.fallen.rot);
    foremanDrawBrick(0, -FOREMAN_BRICK_H*.4, FOREMAN_BRICK_W*.8, FOREMAN_BRICK_H*.8, FOREMAN_GAME.fallen.mat, true);
    agCtx.restore();
  }
  const stackTopY = groundY - FOREMAN_GAME.stack.length*FOREMAN_BRICK_H;
  agCtx.save();
  agCtx.strokeStyle = 'rgba(255,255,255,.45)'; agCtx.setLineDash([6,6]);
  agCtx.beginPath(); agCtx.moveTo(cx, visibleTop - scrollY); agCtx.lineTo(cx, stackTopY); agCtx.stroke();
  agCtx.restore();

  if(FOREMAN_GAME.active){
    const mat = FOREMAN_MATERIALS[FOREMAN_GAME.round % FOREMAN_MATERIALS.length];
    /* carryReach 現在是「疊 0 層時人+磚在哪」的絕對高度,不是相對 stackTopY
       的距離——kc 抓到「groundY 不該影響真人拿磚頭」,原本用 stackTopY(=
       groundY 算出來的)當基準,拉地板高度滑桿會連帶把人跟磚也拖走。改成
       獨立的 carryBaseY,只跟疊了幾層(FOREMAN_GAME.stack.length)有關,
       跟 groundY 完全脫鉤,拉地板滑桿現在只會動已經疊好的那疊磚。
       workerDy 加在這裡(兩邊共用),不要各自加——kc 抓到「人跟手裡的磚
       要一起調整」,原本 workerDy 只加在 foremanDrawWorker() 內部的
       handY,磚還是用沒加過的值,滑桿一拉人跟磚就分家了。 */
    const carryBaseY = FOREMAN_TWEAK.carryReach - FOREMAN_GAME.stack.length*FOREMAN_BRICK_H;
    const carryY = Math.max(visibleTop - scrollY + 10, carryBaseY) + FOREMAN_TWEAK.workerDy;
    const bx = cx + foremanOffsetPx();
    foremanDrawWorker(bx, carryY);
    foremanDrawBrick(bx, carryY, FOREMAN_BRICK_W, FOREMAN_BRICK_H, mat);
  }
  agCtx.restore();
}
function startForemanShift(){
  busy = true;
  foremanShiftOn = true;
  chg('stamina', -20);
  FOREMAN.workedDay = day;
  FOREMAN.shiftsWorked++;
  FOREMAN_GAME.round = 0; FOREMAN_GAME.earned = 0;
  FOREMAN_GAME.stack = []; FOREMAN_GAME.fallen = null;
  agEl.classList.add('on');
  agCap.textContent = '工地・扛磚';
  agActions.innerHTML = '';
  agBarEl.style.display = 'none';   // 這個小遊戲改走 canvas 畫面判定,不用推幣機那套隱形指針(見 agDrawForeman 筆記)
  agDrawForeman();
  startForemanRound();
}
function startForemanRound(){
  FOREMAN_GAME.active = true;
  FOREMAN_GAME.barPos = 0; FOREMAN_GAME.barDir = 1;
  FOREMAN_GAME.fallen = null;
  agBody.innerHTML = `第 ${FOREMAN_GAME.round+1} 趟——按空白鍵，抓準時機把磚放下（疊越高賺越多，偏差太大會塌）`;
}
/* 命中判定跟賠率經濟學無關(這是老闆給的工錢,不是賭博機台,不用照
   resolvePusherLockIn() 那套「三檔全負期望值」的顧慮)——純粹手感越準
   工錢越高,沒有隨機骰勝負。
   2026-08-28 第二輪改款(kc:「可以無限扛,如果偏差太大才會搖晃輸掉,
   然後跌多少賺多少」)——原本固定 5 趟、每趟各自結算的模式拿掉,改成
   無限疊下去,只有最差那檔(tier 'miss')會讓整落磚塌掉、結束這班;
   great/ok/bad 三檔都照樣疊上去、照樣領那趟的錢,只是歪一點。「跌多少
   賺多少」的意思是塌掉當下不倒扣——FOREMAN_GAME.earned 是每趟疊上去就
   直接累加,不是疊到最後才結算,所以塌掉那瞬間身上已經有的錢不會被拿走,
   只是不能再繼續疊。
   2026-08-28 第三輪(kc:「為何堆的都不會倒」)——miss 門檻原本是 dist>.4,
   只佔擺盪範圍兩端各 10% 寬,正常手感幾乎按不到那個窄區間,配上上面
   updateCity() 新加的隨疊高加速,兩邊一起調才會真的有塌的風險:miss 門檻
   從 .4 收窄到 .3(其餘三檔門檻等比例收窄,不是只動 miss 那一刀)。 */
function resolveForemanLockIn(){
  if(!FOREMAN_GAME.active) return;
  const dist = Math.abs(FOREMAN_GAME.barPos - .5);
  const mat = FOREMAN_MATERIALS[FOREMAN_GAME.round % FOREMAN_MATERIALS.length];
  FOREMAN_GAME.active = false;
  const tier = dist<=.04 ? 'great' : dist<=.15 ? 'ok' : dist<=.3 ? 'bad' : 'miss';
  const pay  = { great:150, ok:90, bad:40, miss:0 }[tier];
  const line = { great:'一次到位，磚疊得整整齊齊。', ok:'差不多，堆得還算穩。',
                 bad:'歪了一點，老闆皺了下眉。', miss:'手一滑，沒扶好——整落磚「轟」一聲塌了。' }[tier];
  let toppled = false;
  if(tier === 'miss'){
    toppled = true;
    const sign = Math.sign(FOREMAN_GAME.barPos - .5) || 1;
    FOREMAN_GAME.fallen = { x: agCanvas.width/2 + sign*90, rot: sign*.6, mat };
  } else {
    FOREMAN_GAME.stack.push({ offset: foremanOffsetPx(), mat });
    FOREMAN_GAME.earned += pay;
  }
  agDrawForeman();
  const layers = FOREMAN_GAME.stack.length;
  agBody.innerHTML = toppled
    ? `${line}\n\n今天疊到第 ${layers} 層，老闆給了你 $${FOREMAN_GAME.earned}。`
    : `${line}（+$${pay}，目前 $${FOREMAN_GAME.earned}）`;
  FOREMAN_GAME.round++;
  setTimeout(() => {
    if(toppled) endForemanShift(); else startForemanRound();
  }, toppled ? 1600 : 900);
}
function endForemanShift(){
  agEl.classList.remove('on');
  busy = false;
  foremanShiftOn = false;
  chg('money', FOREMAN_GAME.earned);
  toast(`今天疊到第 ${FOREMAN_GAME.stack.length} 層磚塌了，老闆給了你 $${FOREMAN_GAME.earned}。`, 3200);
}
/* 陣頭音遊本體(2026-08-31 第二輪,太鼓達人手感)——見上面 TROUPE_GAME 那則
   長筆記。這輪把 `prototypes/rhythm-linzitou.html`(2026-08-20 的原型,
   kc 提醒「之前我們有做好太鼓達人的玩遊戲畫面」才發現這輪漏看)的機制/
   資產搬進 #arcadeGame,音符軌改成水平飄向左邊的判定圈,不是垂直落下,
   加了 kc 要的「拉長音」(hold>0,要按住到尾端)跟「空白鍵」(第五個判定
   鍵,沒有方向,當大鼓重拍)兩種變化。startTroupeGame() 由 talkToYuan()
   呼叫,songKey 對應 lib/rhythm-troupe.js 的 SONGS 鍵名,onDone(success,
   rate) 是判定完之後要接回劇情的收尾。 */
const TROUPE_LANES = {
  up:    { key:'arrowup',    color:'#e0483a', dx:0,  dy:-1 },
  down:  { key:'arrowdown',  color:'#4fa3c8', dx:0,  dy:1  },
  left:  { key:'arrowleft',  color:'#5fb87a', dx:-1, dy:0  },
  right: { key:'arrowright', color:'#d8b24a', dx:1,  dy:0  },
  space: { key:' ',          color:'#f0e6d8', dx:0,  dy:0  }   // 大鼓重拍,沒有方向,badge 畫菱形跟箭頭區分
};
/* 廟口背景(2026-08-31 第六輪換成 kc 重生的版本,更有煙火/人潮的戲劇感)。
   沒圖之前退回色塊,同一招 naturalWidth 判斷(跟 FOREMAN_BG_IMG 那套一樣)。 */
const TROUPE_BG_IMG = new Image();
TROUPE_BG_IMG.src = '../assets/rhythm-bg-temple.png';
/* 2026-08-31 第七輪(kc 貼參考圖後再回報「兩個人好小顏色好淺」)——原本
   紙娃娃拆件(TROUPE_PARTS/char-parade-*.png,關節旋轉那套)換掉,改用
   kc 生的三張真人定裝照(parade-perf-left/center/right.png,ChatGPT 直接
   生成就帶乾淨 alpha,不用再跑 green-to-alpha.py)。真人照片做關節旋轉
   會很假,所以不追求「走路動畫」,改成固定站位+呼吸感的浮動/打點縮放,
   三個人一開場就全部顯示(不再靠 combo 累積才「現身」——kc 要的是清楚
   看得到,不是要練出成績才看得到)。char-parade-*.png 那組舊資產沒刪,
   `rhythm-linzitou.html` 那個獨立原型頁還在用。 */
const TROUPE_PERF = [
  { img:new Image(), src:'../assets/tex/parade-perf-left.png',   xFrac:.16, hFrac:.62, phase:0.3 },
  { img:new Image(), src:'../assets/tex/parade-perf-center.png', xFrac:.50, hFrac:.80, phase:0    },
  { img:new Image(), src:'../assets/tex/parade-perf-right.png',  xFrac:.85, hFrac:.60, phase:0.9  }
];
TROUPE_PERF.forEach(p => { p.img.src = p.src; });
const TROUPE_BPM = 96, TROUPE_STEP_HZ = (TROUPE_BPM/60) * Math.PI * 2 / 2;   // 呼吸/晃動節拍跟音樂 BPM 綁在一起(踩點,不是隨機晃)

function startTroupeGame(songKey, onDone){
  const def = RhythmTroupe.SONGS[songKey];
  TROUPE_GAME.active = true;
  TROUPE_GAME.song = def;
  TROUPE_GAME.notes = def.chart.map(n => ({ t:n.t, lane:n.lane, hold:n.hold, hit:null, holding:false, holdTier:null }));
  TROUPE_GAME.onDone = onDone;
  TROUPE_GAME.score = 0; TROUPE_GAME.combo = 0; TROUPE_GAME.popups = []; TROUPE_GAME.dancerPulse = 0;
  TROUPE_GAME.flash = { up:0, down:0, left:0, right:0, space:0 };
  /* 2026-08-31 抓到的真正 bug(kc:「沒音樂沒音符啊」,第一版猜是
     loadedmetadata 時機沒等到,補了那個修法還是沒用,再查才找到根因):
     `python -m http.server` 不支援 Range request,Chrome 的
     `<audio>.seekable` 因此永遠回報 `[0,0]`——即使 `buffered` 早就顯示
     整個檔案(5MB 這麼小,本地網路根本不用等)都下載完了,只要
     seekable 說不能 seek,設 currentTime 就一律被吃掉,音樂只會從第 0
     秒正常播,跟譜面時間點全部對不上。真正的修法是**不要在遊戲裡動態
     seek**:改用 lib/rhythm-troupe.js 裡已經預先剪好的片段檔
     (`*-clip.mp3`,ffmpeg 剪的,剪法見那份檔案的行內註解),直接從 0
     秒放到結束,完全繞開 seekable 這個環境限制。 */
  TROUPE_GAME.audio = new Audio(def.src);
  TROUPE_GAME.audio.volume = .8;
  TROUPE_GAME.audio.play().catch(()=>{});
  busy = true;
  troupeShiftOn = true;
  agEl.classList.add('on', 'troupe');
  agCap.textContent = def.title + '・跳陣頭';
  agActions.innerHTML = '';
  agBarEl.style.display = 'none';
  agBody.innerHTML = '↑↓←→ 跟拍，空白鍵是重拍，拉長音要按住到尾端';
  agDrawTroupe(16);
}
function troupeJudgeX(w){ return w*0.16; }
function troupeTrackY(h){ return h*0.34; }
/* 一顆判定圖示:圓底色=該方向專屬顏色,裡面畫三角形指向 dx/dy;space 沒有
   方向,改畫實心菱形(呼應太鼓達人的「大鼓中心」跟兩側鈸聲視覺上要分得
   出來),不用字型畫箭頭符號(不同字型渲染高度對不齊,自己畫圖形比較穩,
   照抄 rhythm-linzitou.html drawArrowBadge() 那套)。 */
function troupeBadge(x, y, lane, r, alpha){
  const L = TROUPE_LANES[lane];
  agCtx.save(); agCtx.globalAlpha = alpha;
  agCtx.beginPath(); agCtx.arc(x,y,r,0,Math.PI*2);
  agCtx.fillStyle = L.color; agCtx.fill();
  agCtx.strokeStyle = 'rgba(255,255,255,.55)'; agCtx.lineWidth = 2; agCtx.stroke();
  if(lane === 'space'){
    agCtx.translate(x,y); agCtx.rotate(Math.PI/4);
    const s = r*.45;
    agCtx.fillStyle = '#3a1010'; agCtx.fillRect(-s,-s,s*2,s*2);
  } else {
    agCtx.translate(x,y); agCtx.rotate(Math.atan2(L.dy, L.dx));
    const s = r*.5;
    agCtx.beginPath(); agCtx.moveTo(s,0); agCtx.lineTo(-s*.6,-s*.75); agCtx.lineTo(-s*.6,s*.75); agCtx.closePath();
    agCtx.fillStyle = '#fff'; agCtx.fill();
  }
  agCtx.restore();
}
/* 2026-08-31 第六輪(kc 貼了一張參考圖,要「89 跳陣頭」的爽感)——判定字
   從「剛好/還行/普通」換成 PERFECT/讚/過/MISS,配台語俚語(水啦/落漆),
   顏色也不再照 lane 的方向色,改成統一金/紅,呼應參考圖的字卡風格。 */
function troupePopup(text, lane, color){
  const jx = troupeJudgeX(agCanvas.width), y = troupeTrackY(agCanvas.height);
  TROUPE_GAME.popups.push({ text, x:jx, y:y-34, life:1, color: color || TROUPE_LANES[lane].color });
}
/* 一次判定成立(不管是點一下的音符,還是拉長音按到尾端)才會走到這裡——
   加 combo/score、亮判定圈那個方向的 flash、噴判定字。 */
function troupeRegisterHit(lane, tier){
  TROUPE_GAME.flash[lane] = 1;
  TROUPE_GAME.dancerPulse = 1;
  TROUPE_GAME.combo++;
  TROUPE_GAME.score += tier==='great' ? 300 : tier==='ok' ? 120 : 60;
  const label = tier==='great' ? 'PERFECT 水啦！' : tier==='ok' ? '讚！' : '過';
  const color = tier==='great' ? '#ffd75e' : tier==='ok' ? '#d8b24a' : '#b8a08e';
  troupePopup(label, lane, color);
}
function troupeDrawBg(){
  const w = agCanvas.width, h = agCanvas.height;
  if(TROUPE_BG_IMG.naturalWidth){
    const ia = TROUPE_BG_IMG.naturalWidth/TROUPE_BG_IMG.naturalHeight, ca = w/h;
    let sw, sh, sx, sy;
    if(ia > ca){ sh = TROUPE_BG_IMG.naturalHeight; sw = sh*ca; sy = 0; sx = (TROUPE_BG_IMG.naturalWidth-sw)/2; }
    else { sw = TROUPE_BG_IMG.naturalWidth; sh = sw/ca; sx = 0; sy = (TROUPE_BG_IMG.naturalHeight-sh)/2; }
    agCtx.drawImage(TROUPE_BG_IMG, sx, sy, sw, sh, 0, 0, w, h);
    /* 2026-08-31 第七輪:kc 新生的背景本身已經很有戲劇感(煙火/燈籠/人潮),
       原本 .55 那層黑幕壓太暗,把新背景的顏色悶掉了,收到 .3——底下那條
       地板漸層(壓暗給前景演出者站的區域用)維持不變,那個是刻意的。 */
    agCtx.fillStyle = 'rgba(10,6,5,.3)'; agCtx.fillRect(0,0,w,h);
    const g = agCtx.createLinearGradient(0, h*.6, 0, h*.95);
    g.addColorStop(0,'rgba(6,3,2,0)'); g.addColorStop(1,'rgba(6,3,2,.75)');
    agCtx.fillStyle = g; agCtx.fillRect(0, h*.6, w, h*.35);
  } else {
    const sky = agCtx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'#2a1414'); sky.addColorStop(1,'#4a1c1c');
    agCtx.fillStyle = sky; agCtx.fillRect(0,0,w,h);
  }
}
/* 三個真人演出者(2026-08-31 第七輪,見上面 TROUPE_PERF 那則筆記)——固定
   站位,一開場全部顯示、全不透明,只用垂直浮動(呼吸感)+ 打點縮放(呼應
   節奏),不做關節動畫。中間那個(center,面對鏡頭蹲低)離鏡頭最近、畫
   最大,兩側(left/right)較小、當左右護衛,呼應參考圖「中間主角+兩側
   配角」的構圖,不是三個人等大排排站。沒圖之前(naturalWidth 是 0)整個
   跳過那個人,不畫色塊佔位——真人照片沒有「幾何佔位版」可以退,乾脆先
   不畫,圖秒載入完就會自己補上,不會一直空著。 */
function troupeDrawDancers(elapsed){
  const w = agCanvas.width, h = agCanvas.height;
  TROUPE_PERF.forEach((p,i) => {
    if(!p.img.naturalWidth) return;
    const walk = elapsed*TROUPE_STEP_HZ + p.phase;
    const bob = Math.sin(walk) * 4;
    const pulse = TROUPE_GAME.dancerPulse * (i===1 ? 1 : .5);   // 中間那個對打點反應最明顯
    const drawH = h*p.hFrac * (1 + pulse*0.05);
    const drawW = drawH * (p.img.naturalWidth/p.img.naturalHeight);
    const cx = w*p.xFrac, baseY = h - drawH*0.04;   // 底部留一點點裁切,腳掌貼著畫面下緣不留空隙
    const x = cx - drawW/2, y = baseY - drawH + bob - pulse*10;

    agCtx.save();
    const glow = agCtx.createRadialGradient(cx, baseY, 4, cx, baseY, drawW*0.55);
    glow.addColorStop(0, `rgba(255,150,90,${.28+pulse*.2})`); glow.addColorStop(1, 'rgba(255,150,90,0)');
    agCtx.fillStyle = glow; agCtx.beginPath(); agCtx.arc(cx, baseY, drawW*0.55, 0, Math.PI*2); agCtx.fill();
    agCtx.restore();

    agCtx.drawImage(p.img, x, y, drawW, drawH);
  });
  TROUPE_GAME.dancerPulse = Math.max(0, TROUPE_GAME.dancerPulse-.07);
}
/* 判定圈固定畫在畫面左側(judgeX),音符從右邊飄過來——跟垂直落下版最大的
   差別。拉長音額外畫一條從音符頭到尾端的粗線(寬度=hold 秒數換算的
   像素),按住時比較亮,呼應「這條要按住撐到底」的視覺提示。 */
function troupeDrawTrack(elapsed){
  const w = agCanvas.width, h = agCanvas.height;
  const y = troupeTrackY(h), jx = troupeJudgeX(w), speed = (w-jx)/TROUPE_APPROACH;
  agCtx.strokeStyle = 'rgba(216,178,74,.35)'; agCtx.lineWidth = 3;
  agCtx.beginPath(); agCtx.moveTo(0,y); agCtx.lineTo(w,y); agCtx.stroke();

  agCtx.beginPath(); agCtx.arc(jx, y, 22, 0, Math.PI*2);
  agCtx.strokeStyle = 'rgba(216,178,74,.5)'; agCtx.lineWidth = 3; agCtx.stroke();
  Object.keys(TROUPE_LANES).forEach(lane => {
    const f = TROUPE_GAME.flash[lane];
    if(f>0) troupeBadge(jx, y, lane, 20+f*7, .5+f*.5);
    TROUPE_GAME.flash[lane] = Math.max(0, f-.08);
  });

  TROUPE_GAME.notes.forEach(n => {
    if(n.hit !== null) return;
    const dt = n.t - elapsed;
    if(!n.holding && dt < -TROUPE_HIT_WINDOW) return;   // 已經在 troupeUpdateNotes() 判 miss,不用再畫
    if(dt > TROUPE_APPROACH) return;
    const x = jx + dt*speed;
    if(n.hold > 0){
      const tailX = jx + (dt+n.hold)*speed;
      agCtx.save();
      agCtx.strokeStyle = TROUPE_LANES[n.lane].color; agCtx.lineWidth = 9; agCtx.lineCap = 'round';
      agCtx.globalAlpha = n.holding ? .85 : .5;
      agCtx.beginPath(); agCtx.moveTo(Math.max(x,jx-30), y); agCtx.lineTo(Math.max(tailX,jx-30), y); agCtx.stroke();
      agCtx.restore();
    }
    if(x <= w+24) troupeBadge(x, y, n.lane, 17, 1);
  });
}
/* 每幀先跑判定/miss 狀態轉移,再畫圖(troupeDrawTrack 只負責畫,不改
   hit/holding)。拉長音**簡化過**:只在尾端那一瞬間採樣 keys[...] 看
   有沒有按著,不是逐幀盯著「中途放開就立刻算失敗」——這樣可以在中途
   鬆一下手又搶在尾端前按回去照樣過關,是刻意的簡化,不是漏做,真的要
   做逐幀盯防再回來加。 */
function troupeUpdateNotes(elapsed){
  TROUPE_GAME.notes.forEach(n => {
    if(n.hit !== null) return;
    if(n.holding){
      if(elapsed >= n.t + n.hold){
        const stillHeld = !!keys[TROUPE_LANES[n.lane].key];
        n.hit = stillHeld ? n.holdTier : 'miss';
        if(n.hit === 'miss'){ TROUPE_GAME.combo = 0; troupePopup('MISS 落漆…', n.lane, '#e0483a'); }
        else troupeRegisterHit(n.lane, n.hit);
      }
      return;
    }
    if(elapsed - n.t > TROUPE_HIT_WINDOW){
      n.hit = 'miss'; TROUPE_GAME.combo = 0; troupePopup('MISS 落漆…', n.lane, '#e0483a');
    }
  });
}
/* 判定分三檔(跟扛磚 resolveForemanLockIn() 同精神,誤差越小越好),按鍵
   對應的 lane 由呼叫端(keydown 那段 TROUPE_KEY_LANE)決定,只在同一個
   lane 的「還沒判定、還沒進入 holding」音符裡找時間最接近現在那一個——
   玩家可能連按或漏按,音符不一定照順序判定,也不會跨方向誤判到別條音符。
   拉長音只在這裡標記 holding=true+holdTier,真的計分/失敗要等
   troupeUpdateNotes() 到尾端才算,不是按下去當下就給分。 */
function resolveTroupeHit(lane){
  if(!TROUPE_GAME.active) return;
  const elapsed = TROUPE_GAME.audio.currentTime;   // 片段檔本身就是從 0 秒開始,不用再減 clipStart
  let best = null, bestDist = Infinity;
  TROUPE_GAME.notes.forEach(n => {
    if(n.hit !== null || n.holding || n.lane !== lane) return;
    const dist = Math.abs(n.t - elapsed);
    if(dist < bestDist){ bestDist = dist; best = n; }
  });
  if(!best || bestDist > TROUPE_HIT_WINDOW) return;   // 打錯拍子或這條沒音符,不算也不清 combo
  const tier = bestDist<=.07 ? 'great' : bestDist<=.15 ? 'ok' : 'bad';
  if(best.hold > 0){ best.holding = true; best.holdTier = tier; TROUPE_GAME.flash[lane] = 1; }
  else { best.hit = tier; troupeRegisterHit(lane, tier); }
}
/* 「阿伯認可度」完成度條(照抄 rhythm-linzitou.html drawGauge(),連文字都
   沿用)——great/ok/bad 三檔加權(1/.7/.4),miss 不計分,算的是「已判定
   的音符」佔全部音符的加權比例,不是只看已經飄過去的音符,song 還沒放完
   時這條會持續往上補。 */
function troupeDrawGauge(){
  const w = agCanvas.width;
  const gw = w*0.5, gx = w/2-gw/2, gy = 10, gh = 8;
  const weight = { great:1, ok:.7, bad:.4, miss:0 };
  const total = TROUPE_GAME.notes.length;
  const sum = TROUPE_GAME.notes.reduce((s,n) => s + (n.hit ? (weight[n.hit]||0) : 0), 0);
  const pct = total ? sum/total : 0;
  agCtx.fillStyle = 'rgba(255,255,255,.08)'; troupeRoundRect(gx,gy,gw,gh,4); agCtx.fill();
  agCtx.fillStyle = pct>0.55 ? '#5fb87a' : (pct>0.3 ? '#d8b24a' : '#8d3a30');
  troupeRoundRect(gx,gy,gw*pct,gh,4); agCtx.fill();
  agCtx.strokeStyle = 'rgba(255,255,255,.25)'; agCtx.lineWidth = 1; troupeRoundRect(gx,gy,gw,gh,4); agCtx.stroke();
  agCtx.fillStyle = '#b8a08e'; agCtx.font = '10px "Noto Sans TC"'; agCtx.textAlign = 'center';
  agCtx.fillText('阿伯認可度', w/2, gy+gh+13);
}
function troupeRoundRect(x,y,w,h,r){
  agCtx.beginPath(); agCtx.moveTo(x+r,y); agCtx.arcTo(x+w,y,x+w,y+h,r);
  agCtx.arcTo(x+w,y+h,x,y+h,r); agCtx.arcTo(x,y+h,x,y,r); agCtx.arcTo(x,y,x+w,y,r); agCtx.closePath();
}
/* 2026-08-31 第六輪(kc 貼參考圖要「PERFECT/MISS 搭配文字特效」)——字放大
   到 bold 18px、加 shadowBlur 做發光,不是原本 13px 的小字,才有參考圖
   那種字卡爽感。 */
function troupeDrawPopups(dtSec){
  agCtx.textAlign = 'center'; agCtx.font = 'bold 18px "Noto Sans TC"';
  TROUPE_GAME.popups.forEach(p => {
    agCtx.globalAlpha = Math.max(0,p.life);
    agCtx.shadowColor = p.color; agCtx.shadowBlur = 14;
    agCtx.fillStyle = p.color;
    agCtx.fillText(p.text, p.x, p.y-(1-p.life)*30);
    agCtx.shadowBlur = 0;
    p.life -= dtSec*1.4;
  });
  agCtx.globalAlpha = 1;
  TROUPE_GAME.popups = TROUPE_GAME.popups.filter(p => p.life>0);
}
/* combo/score 大字 HUD(2026-08-31 第六輪,照參考圖左上「連莊 89 COMBO」/
   右上「SCORE 888,888」那個排法)——直接畫在 agCanvas 角落,gauge 置中
   佔畫面中間一半寬,兩邊角落留空剛好夠放,不會疊在一起。 */
function troupeDrawHUD(){
  const w = agCanvas.width;
  agCtx.save();
  agCtx.textAlign = 'left';
  agCtx.fillStyle = '#d8b24a'; agCtx.font = 'bold 12px "Noto Sans TC"';

  agCtx.font = 'bold 32px "Noto Sans TC"';
  agCtx.shadowColor = 'rgba(255,215,94,.6)'; agCtx.shadowBlur = TROUPE_GAME.combo >= 10 ? 10 : 0;
  agCtx.fillText(String(TROUPE_GAME.combo), 14, 60);
  agCtx.shadowBlur = 0;
  agCtx.fillStyle = '#b8a08e'; agCtx.font = 'bold 11px "Noto Sans TC"';
  agCtx.fillText('COMBO', 14, 74);

  agCtx.textAlign = 'right';
  agCtx.fillStyle = '#d8b24a'; agCtx.font = 'bold 11px "Noto Sans TC"';
  agCtx.fillText('SCORE', w-14, 26);
  agCtx.fillStyle = '#f0e6d8'; agCtx.font = 'bold 22px "Noto Sans TC"';
  agCtx.fillText(String(TROUPE_GAME.score).replace(/\B(?=(\d{3})+(?!\d))/g, ','), w-14, 50);
  agCtx.restore();
}
function agDrawTroupe(dt){
  const w = agCanvas.width, h = agCanvas.height;
  agCtx.clearRect(0,0,w,h);
  const audio = TROUPE_GAME.audio, def = TROUPE_GAME.song;
  const elapsed = audio ? audio.currentTime : 0;   // 片段檔本身就是從 0 秒開始,不用再減 clipStart

  troupeDrawBg();
  troupeDrawDancers(elapsed);
  troupeUpdateNotes(elapsed);
  troupeDrawTrack(elapsed);
  troupeDrawGauge();
  troupeDrawHUD();
  troupeDrawPopups((dt||16)/1000);

  if(def && elapsed >= def.clipLen){ finishTroupeGame(); }
}
/* 完成度門檻(2026-08-31,我先抓的數字,kc 覺得太嚴/太鬆再調):great/ok/bad
   都算打中,miss 不算,打中率 ≥55% 算過(跟畫面上的「阿伯認可度」不是
   同一把尺——那條是加權過的即時進度條,這裡是最終單純算「判定次數」,
   兩個故意不同,一個是氣氛回饋一個是真的門檻)。DESIGN_NOTES「打不好的
   後果」那節定案:打不好不是純粹空氣牆,呼叫端(talkToYuan())的 onDone
   會接 TROUPE.practiceFail/debutFail 那段安慰劇情。 */
function finishTroupeGame(){
  if(!TROUPE_GAME.active) return;
  TROUPE_GAME.active = false;
  TROUPE_GAME.audio.pause();
  agEl.classList.remove('on', 'troupe');
  busy = false;
  troupeShiftOn = false;
  const total = TROUPE_GAME.notes.length;
  const hitCount = TROUPE_GAME.notes.filter(n => n.hit && n.hit !== 'miss').length;
  const rate = total ? hitCount/total : 0;
  const onDone = TROUPE_GAME.onDone;
  TROUPE_GAME.onDone = null;
  if(onDone) onDone(rate >= .55, rate);
}

}
/* 2026-08-21 kc:「對話...都會扣體力」——體力邊界從「只接三種街上小

   moto(騎車)不算「對話」,不在這個集合裡——前者是單句 toast 不是真的

const DIALOGUE_PROP_TYPES = new Set(['worker','ayi','acheng','motoboss','yuan','fat','mei','jiaoguan','aren','brother','pedestrian','fortune','foreman']);
/* 情緒見底不想回話(2026-08-26,kc:「情緒低落的話會不想回話,提示想先
   散散心之類的」)——照體力=0 攔對話那套一模一樣的做法加一道情緒關卡,

const MOOD_TALK_MIN = 15;
function interactProp(prop){

     街景上,只有選「付錢,跟她走」才真的觸發 enterMassage() 切進室內,
     見 talkToWorker() 那個分支。 */
  if(prop.type === 'worker'){ talkToWorker(prop.ref); return; }

     故事在別處(圓環路人的 statueLine、talkToWorker() 的完整故事分支),
     這裡刻意留白,不重複講。 */
  if(prop.type === 'ayi'){ talkToAyi(); return; }
  if(prop.type === 'acheng'){ talkToAcheng(); return; }
  if(prop.type === 'fortune'){ talkToFortune(); return; }
  if(prop.type === 'motoboss'){ talkToMotoBoss(); return; }
  if(prop.type === 'yuan'){ talkToYuan(); return; }
  if(prop.type === 'fat'){ talkToFat(); return; }

  if(prop.type === 'altar'){

  if(prop.type === 'bench'){

  if(prop.type === 'moto'){
    /* 2026-08-25 kc:「要付錢買應該是要跟機車行老闆對話」——forSale 那台
       車不再直接跳買車選單,改走 talkToMotoBoss()(先對話,對完話才開
       buyMoto() 選單),跟走到旺鴻本人旁邊觸發同一條路徑。 */
    if(prop.ref.forSale && !prop.ref.owned) talkToMotoBoss();

    /* 貓/狗共用摸的動作會摸空——貓矮,狗那份「Petting Animal」動畫伸手的

    const anim = prop.ref.label === '貓' ? 'pet_low' : 'pet';

      if(prop.ref.label === '貓' && AYI.catQuest.active && !AYI.catQuest.taskDone){
        AYI.catQuest.taskDone = true;

       `fade()`+`warpIntoPlace()` 把玩家送回刺青店(跟 `sleep()`/
       `__dbg.warp()` 同一套「淡出→切場景→淡入」轉場,不是真的用走的

       不用玩家自己再走過去、再按一次空白鍵找老闆。`busy` 全程鎖著(先手動
       設 true,交給 `fade()` 自己的計時器在轉場結束時解鎖),擋掉轉場
       途中的移動/其他互動。 */
    if(ST.stamina <= 0){ toast('你累到不行了，先回家睡一下。', 2400); return; }
    busy = true;
    hero.playOnce('pet', () => {
      chg('stamina', -3);
      TATTOO_DOG.found = true;
      returnTo.x = hero.group.position.x; returnTo.z = hero.group.position.z;
      const door = city.doors.find(d => d.id === 'tattoo');
      fade('刺青店', () => {
        warpIntoPlace(door);
        talkToTattooMaster();
      });

  } else if(prop.type === 'play'){
    if(ST.stamina <= 0){ toast('你累到不行了，先回家睡一下。', 2400); return; }
    chg('mood', 3);
    chg('stamina', -5);
    toast(prop.ref.label + '。' + PLAY_LINES[Math.random()*PLAY_LINES.length|0], 2400);
  } else if(prop.type === 'pedestrian'){
    /* statueLine(2026-08-20):圓環雕像旁那隻路人專屬台詞,優先於下面的

    if(prop.ref.statueLine){ toast(prop.ref.statueLine, 3200); return; }
    /* 阿霞(2026-09-01)——同一招,身分比對用 prop.ref === AXIA_NPC(她沒有
       statueLine 那種掛在資料上的固定台詞,對話要開選單,所以另外呼叫
       talkToAxia() 而不是單純 toast)。 */
    if(prop.ref === AXIA_NPC){ talkToAxia(); return; }
    /* 風評 <=-10 才會扯到家人(2026-08-19 kc 從 -40 改成 -10,門檻拉低,
       家人話題更容易觸發),-10~0 之間只是冷淡防備,>=0 維持原本的閒聊。
       聽到最難聽那檔扣一點心情,呼應「這種話真的會傷人」,不是聽聽就算了。 */
    const cruel = ST.star <= -10, cold = !cruel && ST.star < 0;
    const pool = cruel ? PEDESTRIAN_LINES_CRUEL : cold ? PEDESTRIAN_LINES_COLD : PEDESTRIAN_LINES;
    if(cruel) chg('mood', -4);
    toast(pool[Math.random()*pool.length|0], 2200);
  } else {
    if(ST.stamina <= 0){ toast('你累到不行了，先回家睡一下。', 2400); return; }
    const l = prop.ref;
    busy = true;
    hero.playOnce('pickup', () => {
      busy = false;
      chg('mood', -3);
      chg('stamina', -2);
      chg('star', 1);                                   // 好事,見 DESIGN_NOTES「風評」,2026-08-14 雙向化後好事要往正的走
      /* 撿垃圾會弄髒(2026-08-28,kc:「撿垃圾會弄髒會-1」)——帥潮小扣,
         跟風評的 +1 是兩件不衝突的事:做好事(風評)但手上沾髒東西
         (帥潮),見 docs/DESIGN_NOTES.md「必做任務失敗/帥潮/超商制服」節。 */
      chg('cool', -1);
      if(l.kind === 'bottle') chg('money', 2);
      toast('你撿起了' + (LITTER_KIND_NAME[l.kind] || '一個垃圾') + '。'
            + (l.kind === 'bottle' ? '（$2）' : ''), 2200);
      scene.remove(l.mesh);
      if(l.glow) scene.remove(l.glow);
      /* indexOf 可能是 -1(這個 litter 物件已經被移除過一次)——splice(-1,1)
         會誤刪陣列最後一個元素,測動畫版撿垃圾時手動連續呼叫兩次踩過這個
         (2026-08-14)。正常操作(空白鍵,keydown 那邊有 !busy 擋)不會重複
         觸發,但陣列操作本來就該防這一步,不要假設呼叫端一定乾淨。 */
      const li = city.litter.indexOf(l);
      if(li !== -1) city.litter.splice(li, 1);
      nearProp = null;
      hintEl.classList.remove('on');
      /* 阿成的垃圾任務(2026-08-20,第二輪 kc:「回報任務才會拿到獎勵」)——
         撿滿這裡只標記 taskDone,不直接發錢/歸屬感,要回去跟阿成講一聲
         (talkToAcheng() 裡 taskDone && !done 那個分支)才真的給獎勵。
         不限定要在廟口附近撿到的那幾件,簡化成「累計撿滿 3 件」。 */
      if(ACHENG.litterQuest.active && !ACHENG.litterQuest.taskDone){
        ACHENG.litterQuest.picked++;
        if(ACHENG.litterQuest.picked >= ACHENG.litterQuest.need){
          ACHENG.litterQuest.taskDone = true;
          setTimeout(() => toast('湊到三包了。可以回去跟阿成說一聲了。', 2600), 2400);
        }
        syncLitterQuestPanel();
      }
    });
  }
}

let lastW=0, lastH=0;
function fit(){
  if(innerWidth===lastW && innerHeight===lastH) return;
  lastW=innerWidth; lastH=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}

const fpsEl = document.getElementById('fps');
let last = performance.now(), acc = 0, frames = 0;
renderer.setAnimationLoop(now => {
  if(gameOver) return;   // 失敗結局蓋上之後整個模擬凍結,見 triggerGameOver()
  const dt = Math.min(50, now-last); last = now;
  fit(); tickDialog(dt);
  if(MODE === 'city'){ updateCity(dt); updateWorldLabels(); updatePatrolMarker(dt); updateAxiaMarker(dt); composer.render(); }
  else { updateIndoor(dt); renderIndoor3D(dt); renderIndoorForeground(); }
  acc += dt; frames++;
  if(acc > 500){ fpsEl.textContent = Math.round(frames*1000/acc)+' fps'; acc=0; frames=0; }
});

syncHUD();

/* 除錯用:主控台可以直接把角色傳到某個門口，省得走一分鐘 */
window.__dbg = {
  /* scene/city(2026-08-18):之前 __dbg 沒有直接暴露 3D 場景本身,要查某顆
     mesh 的材質/貼圖有沒有真的套上去,只能用 near() 那組間接資訊(位置/
     尺寸),沒法驗證材質——巷子冷氣機箱體那次(kc 說「根本沒有方塊啊」)
     就是靠暴露 scene 才能直接把材質暫時換成高強度發光色現場驗證,查出
     幾何/材質/貼圖其實都是對的,是巷子環境光真的太暗才讀不出來,不是
     哪裡漏接。留著這兩個當永久除錯工具,以後同類問題不用再繞。 */
  scene, city, PEDESTRIANS,
  goto(id){
    const d = city.doors.find(x => x.id === id);
    if(!d) return '沒有這個門：' + city.doors.map(x=>x.id).join(', ');
    hero.group.position.set(d.x, .3, d.z);
    return `已移到 ${d.name} (${d.x.toFixed(1)}, ${d.z.toFixed(1)})`;
  },
  enter(id){ const d = city.doors.find(x => x.id === id); if(d) enterIndoor(d); return MODE; },
  /* 直接傳送進室內(2026-08-28,kc:「你不要用走的.. 你用debug模式直接
     傳送啊」)——`enter()` 還是會經過 walkIn(用真的走路動畫走到門口)+
     fade()(淡出淡入),兩者都要靠 rAF 一幀一幀推進才會完成,某些環境
     rAF 會卡住(見 DESIGN_NOTES 那則筆記)整個卡死在半路。這個直接呼叫
     `warpIntoPlace()`,略過走路/busy 鎖/淡出動畫,同一幀就切完。 */
  warp(id){
    const d = city.doors.find(x => x.id === id);
    if(!d) return '沒有這個門：' + city.doors.map(x=>x.id).join(', ');
    returnTo.x = hero.group.position.x; returnTo.z = hero.group.position.z;
    warpIntoPlace(d);
    return MODE;
  },
  at(x, z){ hero.group.position.set(x, .3, z); return `已移到 (${x}, ${z})`; },
  pos(){ return { x: hero.group.position.x, y: hero.group.position.y, z: hero.group.position.z, mode: MODE }; },
  near(x, z, r){ return scene.children.filter(o => o.isMesh && Math.hypot(o.position.x-x, o.position.z-z) < (r||3))
    .map(o => ({ pos:[+o.position.x.toFixed(2),+o.position.y.toFixed(2),+o.position.z.toFixed(2)],
                 rot:[+o.rotation.x.toFixed(3),+o.rotation.y.toFixed(3),+o.rotation.z.toFixed(3)],
                 scale:[+o.scale.x.toFixed(2),+o.scale.y.toFixed(2),+o.scale.z.toFixed(2)],
                 size: o.geometry?.parameters,
                 mat: (Array.isArray(o.material) ? o.material : [o.material]).map(m => ({
                   color: m.color?.getHexString(), map: !!m.map, mapSrc: m.map?.image?.src,
                   metalness: m.metalness, roughness: m.roughness
                 })) })); },
  leave(){ leaveIndoor(); },
  setIndoor(px, py, face){ IN.px=px; IN.py=py; if(face) IN.face=face; },

     測完整條真實流程(騎車過去→自動問→載她一程→下車結算)要先有一台
     機車可以騎。優先抓已經 owned 的那台(不打亂 city.motos 裡其他台的
     狀態),沒有的話挑一台不是 forSale 的直接標成 owned(跳過機車行

     3D 顯示讀的是後者,兩個沒同步的話會出現「按空白鍵有反應但車還在
     原地」的落差。 */
  callMoto(){
    const m = city.motos.find(mm => mm.owned) || city.motos.find(mm => !mm.forSale) || city.motos[0];
    if(!m) return '場上找不到任何機車。';
    m.owned = true; m.ridden = false;
    const pos = hero.group.position;
    const fx = Math.sin(hero.group.rotation.y), fz = Math.cos(hero.group.rotation.y);
    m.x = pos.x + fx*2.5; m.z = pos.z + fz*2.5;
    if(m.group) m.group.position.set(m.x, m.group.position.y, m.z);
    return `機車開到你面前了(${m.x.toFixed(1)}, ${m.z.toFixed(1)}),走過去按空白鍵上車。`;

  axiaReset(){
