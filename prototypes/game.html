<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>no-way-up ／ 街上 ⇄ 室內</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0c10; }
  body { font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }

  #city, #indoor { position:fixed; inset:0; }
  #city canvas { display:block; }
  #indoor { display:none; align-items:center; justify-content:center; background:#0a0c10; }
  #indoor.on { display:flex; }
  #indoorStage { position:relative; width:100%; max-width:1280px; aspect-ratio:1280/720; }
  #c2dbg, #c3d, #c2df { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---- HUD(兩層共用) ---- */
  .hud { position:fixed; left:16px; top:14px; z-index:6; display:flex; gap:7px; font-size:12px; }
  .pod { background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28);
         border-radius:4px; padding:5px 10px 6px; min-width:74px; backdrop-filter:blur(4px); }
  .pod .lb { color:#7c8593; font-size:10px; letter-spacing:.14em; }
  .pod .nm { color:#eef1f5; font-size:15px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .pod.money .nm { color:#f2d888; }
  .pod .track { height:4px; margin-top:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
  .pod .track i { display:block; height:100%; width:0; transition:width .45s cubic-bezier(.3,.9,.3,1); }
  .pod.full i { background:linear-gradient(90deg,#8a9a4a,#c9bb44); }
  .pod.full.low { border-color:rgba(224,72,58,.8); animation:lowpulse 1.15s infinite; }
  .pod.full.low i { background:linear-gradient(90deg,#e0552f,#e0483a); }
  @keyframes lowpulse { 50% { border-color:rgba(224,72,58,.2); } }
  .pod.calm i { background:linear-gradient(90deg,#3f8f86,#6fc3b4); }
  .pod.cool i { background:linear-gradient(90deg,#8a4fa8,#d05fa0); }
  .pod.mood i { background:linear-gradient(90deg,#c98a3f,#f2b25c); }
  .pod.stamina i { background:linear-gradient(90deg,#4a8a5c,#6fc98a); }
  /* 風評(舊「通緝」)2026-08-14 從 0~5 星改成雙向 -100~+100,見
     docs/DESIGN_NOTES.md「通緝改名風評」——track 中間畫一條分界線,填色從
     中線往左(壞事,紅)或往右(好事,綠)長,不是從左邊固定長到右邊。 */
  .pod.star .track { position:relative; overflow:visible; }
  .pod.star .track::before { content:''; position:absolute; left:50%; top:-2px; bottom:-2px;
    width:1px; background:rgba(255,255,255,.25); }
  .pod.star .track i { position:absolute; top:0; height:100%; width:0;
    transition:width .45s cubic-bezier(.3,.9,.3,1), left .45s cubic-bezier(.3,.9,.3,1); }
  .pod.star .track i.good { background:linear-gradient(90deg,#4a8a5c,#6fc98a); }
  .pod.star .track i.bad  { background:linear-gradient(90deg,#e0552f,#e0483a); }
  .pod.bump { animation:bump .5s; }
  @keyframes bump { 30% { border-color:rgba(216,178,74,.8); transform:translateY(-3px); } }

  /* ---- 標籤列:src/tags.js 的資料,身上帶著的東西 ---- */
  #tags { position:fixed; left:16px; top:74px; z-index:6; display:flex; gap:6px; flex-wrap:wrap; max-width:44vw; }
  .tag { background:#e8e3d6; color:#23262c; font-size:12px; letter-spacing:.04em;
         padding:3px 9px 4px; border-radius:2px; box-shadow:1px 2px 0 rgba(0,0,0,.45);
         animation:slap .35s cubic-bezier(.2,1.5,.5,1) both; }
  @keyframes slap { from { transform:scale(1.5); opacity:0; } to { transform:scale(1); opacity:1; } }

  /* 角色卡按鈕(2026-08-18):簡易背包介面的入口,見 openInventory()。放在
     tags 下面同一條左側縱軸,跟 pods/tags 同一套視覺語言(深底淺字),
     不用另外設計一顆花俏的圖示。 */
  #charCardBtn { position:fixed; left:16px; top:106px; z-index:6; background:rgba(12,16,23,.85);
    color:#dfe4ea; border:1px solid #3d4757; border-radius:4px; padding:5px 11px;
    font:12px/1.4 inherit; letter-spacing:.06em; cursor:pointer; }
  #charCardBtn:hover { background:rgba(32,40,53,.95); border-color:#d8b24a; color:#fff; }
  #invOverlay { position:fixed; inset:0; background:rgba(6,8,12,.72); z-index:60;
    display:none; align-items:center; justify-content:center; }
  #invOverlay.on { display:flex; }
  #invPanel { background:#141922; border:1px solid #3d4757; border-radius:8px;
    width:min(1120px,96vw); max-height:88vh; overflow:auto; padding:22px 26px;
    color:#dfe4ea; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #invPanel h3 { font-size:12px; letter-spacing:.22em; color:#8b94a3; margin:16px 0 8px; }
  #invPanel h3:first-child { margin-top:0; }
  #invPanel .invEmpty { color:#5c6675; font-size:13px; }
  #invClose { margin-top:20px; width:100%; background:rgba(12,16,23,.95); color:#97a0ad;
    border:1px solid #3d4757; border-radius:4px; padding:8px; font:14px inherit; cursor:pointer; }
  #invClose:hover { color:#fff; border-color:#d8b24a; }

  /* 角色面板三欄(2026-08-19):左物品/穿搭分頁、中人物、右狀態,
     見 docs/DESIGN_NOTES.md「角色面板改三欄」。同一天第二輪照 kc 丟的
     參考截圖把物品/穿搭改成圖示格子(itemGrid/itemCard 共用元件,取代
     原本各自一套的 invTag/questRow/wearItem),圖示先用 emoji 佔位——
     這遊戲沒做過物品圖示素材,理由跟決定記在 DESIGN_NOTES 同一節底下
     的補記,不要看到這行就以為要再重新設計一次。 */
  .invHead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .invHead h2 { margin:0; font-size:16px; letter-spacing:.16em; color:#e6eaf0; }
  .invHead .invMoney { color:#f2d888; font-size:16px; font-variant-numeric:tabular-nums; }
  .invGrid { display:grid; grid-template-columns:1fr 400px 220px; gap:24px; }
  .invTabs { display:flex; gap:6px; margin-bottom:12px; }
  .invTabBtn { background:rgba(12,16,23,.85); color:#8b94a3; border:1px solid #3d4757;
    border-radius:999px; padding:5px 14px; font:12px inherit; letter-spacing:.05em; cursor:pointer; }
  .invTabBtn.on { color:#141922; background:#d8b24a; border-color:#d8b24a; font-weight:bold; }
  .invTabPane { display:none; }
  .invTabPane.on { display:block; }

  /* 圖示格子共用元件:標籤/文件(物品分頁)、穿搭都套這個,不要再各自
     寫一份——三個地方視覺上本來就該長一樣,參考截圖也是同一種格子。 */
  .itemGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .itemCard { position:relative; background:rgba(255,255,255,.04); border:1px solid #3d4757;
    border-radius:8px; padding:16px 6px 12px; display:flex; flex-direction:column; align-items:center;
    gap:5px; cursor:pointer; aspect-ratio:1; justify-content:center; }
  .itemCard:hover { border-color:#8b94a3; }
  .itemCard.on { border-color:#d8b24a; background:rgba(216,178,74,.12); }
  .itemCard .ic { font-size:36px; line-height:1; }
  .itemCard .lb { font-size:12px; color:#97a0ad; text-align:center; line-height:1.3; }
  .itemCard.on .lb { color:#fff; }
  .itemCard .badge { position:absolute; top:5px; right:6px; font-size:10px; color:#d8b24a;
    background:rgba(0,0,0,.5); padding:2px 5px; border-radius:3px; }
  #itemDetail { margin-top:10px; min-height:1.6em; font-size:12.5px; line-height:1.6; color:#c7cdd6; }
  #itemDetail .amt { color:#d8b24a; font-weight:bold; }

  .invMid { display:flex; align-items:center; justify-content:center; gap:14px; }
  .equipBadges { display:flex; flex-direction:column; gap:10px; }
  .equipBadge { width:64px; height:64px; border:1px solid #3d4757; border-radius:7px;
    display:flex; align-items:center; justify-content:center; font-size:30px;
    background:rgba(255,255,255,.03); opacity:.35; }
  .equipBadge.filled { opacity:1; border-color:#d8b24a; background:rgba(216,178,74,.1); }
  /* 全身像(2026-08-19 第四輪):pc-fullbody.png 到位後量過,實際畫布是
     1024×1536(寬高比 .667),角色本人在畫布裡已經站得很滿(量過 alpha,
     上下幾乎頂到邊)——第三輪的容器比例(170×380=.447)比圖片本身瘦太多,
     object-fit:contain 用寬度卡死,上下留一大截空白,人物看起來超小,
     kc 一眼就抓到「三小」。改成 220×330,寬高比對齊圖片原始比例
     (220/330=.667,跟圖片一致),contain 才不會留空,人物才會撐滿框。
     還沒有全身圖時(`onerror` 退回頭像)會顯示在這個框的上緣,是過渡
     樣子,不是壞掉。 */
  #invPortrait { width:220px; height:330px; border-radius:6px; object-fit:contain; object-position:top;
    border:1px solid #3d4757; background:#1b202b; }
  .statList .pod { margin-bottom:8px; }

  /* 收銀小遊戲(2026-08-19,kc 要求「早班不是死門,是翹課換錢」,見
     docs/DESIGN_NOTES.md「早班不是死門」節)。第三輪(同一天):kc 說
     「不要黑畫面計算機」,拿掉整個置中彈窗+九宮格鍵盤,改走遊戲既有的
     對話框(`#dialog`/`say()`)——客人排隊/對話那套邏輯見下面 JS 區塊,
     這裡只留一條給倒數計時用的細長進度條,貼在對話框正上方。 */
  #coTimerTrack { position:fixed; left:5%; right:5%; bottom:calc(5% + 196px); z-index:8;
    height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden;
    display:none; max-width:1180px; margin:0 auto; }
  #coTimerTrack.on { display:block; }
  #coTimerTrack i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#6fc98a,#d8b24a);
    transition:width .15s linear, background-color .3s; }
  #coTimerTrack.low i { background:linear-gradient(90deg,#e0552f,#e0483a); }

  #where { position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:6;
           background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28); border-radius:4px;
           padding:6px 18px; font-size:14px; color:#e6eaf0; letter-spacing:.18em; backdrop-filter:blur(4px); }
  #clock { position:fixed; right:14px; top:14px; z-index:6; text-align:right;
           background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28);
           border-radius:4px; padding:6px 13px; backdrop-filter:blur(4px); }
  #clock .d { font-size:10px; letter-spacing:.16em; color:#7c8593; }
  #clock .t { font-size:17px; color:#e6eaf0; letter-spacing:.1em; font-variant-numeric:tabular-nums; }

  #hint { position:fixed; left:50%; bottom:16%; transform:translateX(-50%); z-index:6;
          background:rgba(8,10,14,.88); border:1px solid #3b4452; padding:7px 17px;
          font-size:15px; color:#e8ecf1; border-radius:3px; letter-spacing:.05em;
          opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  #hint.on { opacity:1; }
  #hint b { color:#f2d888; }

  #dialog { position:fixed; left:5%; right:5%; bottom:5%; display:none; padding-top:44px; z-index:8; }
  #dialog.on { display:block; }
  #portrait { position:absolute; left:20px; top:0; width:100px; height:100px; z-index:3;
              background:#1b202b; border:2px solid #55617a; border-radius:4px;
              box-shadow:0 6px 18px rgba(0,0,0,.55); image-rendering:pixelated; }
  #dialog .frame { padding:15px 22px 17px 144px; min-height:108px; max-width:1180px; margin:0 auto;
    background:linear-gradient(180deg,rgba(14,18,26,.96),rgba(9,12,18,.98));
    border:2px solid #55617a; border-radius:5px;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07); }
  .dname { font-size:14px; letter-spacing:.12em; color:#d8b24a; margin-bottom:7px; }
  .dbody { font-size:18px; line-height:1.8; color:#eef1f5; letter-spacing:.05em; white-space:pre-line; }
  .caret { display:inline-block; margin-left:6px; color:#d8b24a; opacity:0; animation:bob 1s infinite; }
  .caret.on { opacity:1; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(3px);} }

  /* 收銀小遊戲的選項(2026-08-19 第八輪,kc 說「對話框高度要大一點,上面
     題目下面選項」)——原本借用既有的 openMenu()/#menu,結果是題目跟選項
     兩個各自浮動的獨立元件,疊在畫面下方看起來是分開的兩塊。改成選項
     直接長在 `#dialog .frame` 裡面(`#coOpts`,緊接在 `.dbody` 題目下面),
     同一個灰底金框的盒子,自然會因為多了選項內容被撐高,不用另外設一個
     固定的「大一點」高度。空的時候(平常劇情對話,沒有選項)`#coOpts`
     沒有子元素,margin-top 也不會生效(:empty 選到就不留白),看起來
     跟原本的對話框一樣,不會影響劇情那邊的既有樣子。 */
  #coOpts { display:flex; flex-direction:column; gap:7px; margin-top:16px; }
  #coOpts:empty { margin-top:0; }
  #coOpts button { text-align:left; background:rgba(12,16,23,.95); color:#dfe4ea;
    border:1px solid #3d4757; border-left:3px solid #55617a; padding:9px 15px;
    font-size:15.5px; font-family:inherit; letter-spacing:.04em; cursor:pointer; border-radius:3px;
    transition:all .13s; }
  #coOpts button:hover { background:rgba(32,40,53,.98); border-left-color:#d8b24a; color:#fff; transform:translateX(3px); }

  #menu { position:fixed; left:50%; transform:translateX(-50%); bottom:6%;
          display:none; flex-direction:column; gap:5px; width:min(560px,82%); z-index:8; }
  #menu.on { display:flex; }
  #menu .cap { font-size:11.5px; letter-spacing:.28em; color:#8b94a3; padding-left:4px; margin-bottom:3px; }
  #menu button { text-align:left; background:rgba(12,16,23,.95); color:#dfe4ea;
    border:1px solid #3d4757; border-left:3px solid #55617a; padding:9px 15px;
    font-size:15.5px; font-family:inherit; letter-spacing:.04em; cursor:pointer; border-radius:3px;
    transition:all .13s; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  #menu button:hover { background:rgba(32,40,53,.98); border-left-color:#d8b24a; color:#fff; transform:translateX(3px); }
  #menu button .cost { font-size:12.5px; color:#8d96a4; white-space:nowrap; }
  #menu button.bad { color:#8c7a72; } #menu button.bad .cost { color:#a2564c; }
  #menu button.risk { border-left-color:#a2564c; }
  #menu button.back { border-left-color:#39424f; color:#97a0ad; font-size:14px; }

  /* 遊藝場機台的「大框框」(2026-08-26,kc:「互動是應該要彈出一個大框框,
     要寫實的感覺」)——原本三台機台跟其他一般互動點共用 #menu 那個小小
     一條清單,kc 覺得不夠份量,改成獨立的全螢幕暗底+置中大面板,中間是
     機台特寫畫布(agCanvas,真的照片生出來前先用 SceneArcade.renderCloseup()
     的放大版色塊頂著),下面才是下注/結果的文字跟按鈕——跟 #dialog 的
     深色卡片同一套視覺語言(邊框/陰影/字距都抄同一份數值),不是另外發明
     一套風格。 */
  #arcadeGame { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
                background:rgba(4,5,8,.86); z-index:9; }
  #arcadeGame.on { display:flex; }
  #arcadeGame .agPanel { width:min(720px,90%); background:linear-gradient(180deg,rgba(14,18,26,.97),rgba(9,12,18,.98));
    border:2px solid #55617a; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.6); padding:20px 26px 24px; }
  #arcadeGame .agCap { font-size:13px; letter-spacing:.24em; color:#d8b24a; margin-bottom:12px; text-align:center; }
  #arcadeGame canvas { display:block; width:100%; height:auto; border-radius:4px; box-shadow:0 4px 20px rgba(0,0,0,.5); }
  /* 推幣機的時機條(2026-08-26)——只有 pusher 那台會顯示(game.html
     openArcadeGame() 依 kind 切換 display),track 本身是一條窄長橫條,
     sweet 那塊是視覺上標出「準」的範圍,跟 resolvePusherLockIn() 的
     dist 判定對齊(算式見那個函式旁邊的註解)。
     **2026-08-26 第二輪,kc 兩個回饋**:「硬幣要真的硬幣而且要對準,
     然後難度太簡單」——
     1. `agBarPin` 原本是一條 5px 窄條,用純色塊表示指針,跟「代幣」
        兩個字對不上,改成真的畫成一枚硬幣(圓形+內圈的金色漸層+外緣
        描邊)。原本用 `left:X%` 定位,硬幣的左邊緣會卡在目標位置上
        (不是硬幣中心對準),改成 `transform:translate(-50%,-50%)` 讓
        硬幣的圓心真的對準指示條當下的位置,不再偏移半個硬幣寬度。
        `overflow:hidden` 也拿掉(硬幣圓形比原本的窄條高,原本的
        overflow:hidden 會把硬幣上下切掉一截)。
     2. sweet spot 寬度從 24%(對應 resolvePusherLockIn() 的 dist<=.12,
        即左右各 12%)縮到 10%(對應 dist<=.05),連帶指示條速度也調快
        (見 updateIndoor() 那段 `ARCADE_ANIM.barPos` 位移量),兩件事
        一起讓「卡準」變成真的要盯著看、抓時機,不是隨便按都差不多。
     **第三輪,kc 直接傳了一張真的十元硬幣照片(2026-08-26)**——原本
     `agBarPin` 是 CSS 漸層畫的假硬幣,換成真照片(`arcade-coin.png`)
     當背景圖,`background-size:cover`+`border-radius:50%` 裁成圓形;
     漸層那層留著疊在圖片下面當退路(圖真的載不出來時還看得到一個
     金色圓,不會變空白),兩層 background 疊圖片在上、漸層在下即可。 */
  #arcadeGame .agBar { position:relative; height:14px; background:#1a1420; border-radius:7px;
    margin:22px 6px 12px; display:none; }
  #arcadeGame .agBarSweet { position:absolute; left:45%; width:10%; top:0; bottom:0; background:#3a7a4a; }
  #arcadeGame .agBarPin { position:absolute; top:50%; left:0%; width:22px; height:22px;
    transform:translate(-50%,-50%);
    background-image:url('../assets/tex/arcade-coin.png'), radial-gradient(circle at 35% 30%, #fff3c4, #e8c85a 45%, #a8791f 100%);
    background-size:cover, cover;
    border:1.5px solid #6b4f18; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.6); }
  #arcadeGame .agBody { text-align:center; font-size:15px; color:#e8ecf1; min-height:22px;
    margin:14px 4px; white-space:pre-line; letter-spacing:.03em; }
  #arcadeGame .agActions { display:flex; flex-direction:column; gap:7px; }
  #arcadeGame .agActions button { text-align:left; background:rgba(12,16,23,.95); color:#dfe4ea;
    border:1px solid #3d4757; border-left:3px solid #55617a; padding:9px 15px;
    font-size:15.5px; font-family:inherit; letter-spacing:.04em; cursor:pointer; border-radius:3px;
    transition:all .13s; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  #arcadeGame .agActions button:hover { background:rgba(32,40,53,.98); border-left-color:#d8b24a; color:#fff; transform:translateX(3px); }
  #arcadeGame .agActions button .cost { font-size:12.5px; color:#8d96a4; white-space:nowrap; }
  #arcadeGame .agActions button.bad { color:#8c7a72; } #arcadeGame .agActions button.bad .cost { color:#a2564c; }
  #arcadeGame .agActions button.back { border-left-color:#39424f; color:#97a0ad; font-size:14px; }

  /* 算命攤抽籤動畫(2026-08-27,kc:「算命會跳出一段動畫,可以參考xx專案

<script type="module">

/* ===================================================================
   共用狀態 —— 兩層都吃同一份。走進超商買東西，出來街上錢就少了。
   =================================================================== */
/* mood(情緒):2026-08-13 kc 決定開的第六條,見 DESIGN_NOTES「五條指標各自
   管什麼」節尾的補記——原本「五條是上限」的規則被 kc 自己推翻,不是我看漏。
   只由路上的小互動改變(摸貓狗、撿垃圾這種環境小事),不要拿去承接家庭劇情
   的情緒衝擊——那些依然是「感受用文字承接,不要用數值」,只用 toast 講,
   這條規則沒被推翻,只是多開了一條專門給「街上的小確幸/小噁心」用。 */
/* stamina(體力):2026-08-13 kc 要的第七條——DESIGN_NOTES 原本明講「體力」
   這個名字踩過雷,決定不要另開、掛歸屬感/飽足就好,這次 kc 自己又推翻一次,
   跟 mood 那次一樣不是後面的 Claude 看漏。範圍先只接街上的小互動(摸貓狗、
   撿垃圾、玩遊樂器材)跟回家睡覺回滿,沒有去動整個遊戲其他系統(上課、
   打工、劇情選項那些)——「每做一件事都會消耗」這句要真的做到全遊戲每個
   動作都扣,是動到很多既有系統的大重構,今天先只接這三種新街上互動 +
   睡覺回滿,其餘之後再擴。 */
const ST = { money:2000, full:42, calm:55, cool:8, mood:60, stamina:100, star:-30 };
/* 指標上限(2026-08-27,kc:「算命攤道具甚至體力上限增加這種」)——原本
   chg() 對 full/calm/cool/mood/stamina 一律寫死封頂在 100,這是遊戲第一次
   出現「上限本身可以被墊高」的道具,所以拆出一張獨立的上限表,chg() 改
   查這張表而不是寫死的 100。money/star 不在這張表裡(money 本來就沒有
   上限,star 是雙向 -100~100,邏輯不一樣,維持原本寫死那行不動)。 */
const ST_MAX = { full:100, calm:100, cool:100, mood:100, stamina:100 };
let minute = 20*60 + 14, day = 3;
const DAYS = ['日','一','二','三','四','五','六'];
/* 日期敘事化(2026-08-21,kc:「第一天是開學第一天是9/1」)——`day` 這個
 * 計數器本身不動(現在從 3 開始,不是 1,見上面 `let minute = ..., day = 3`
 * 那行——已經有 story-bet.js/story-drink.js 好幾個節點寫死用絕對 day 值
 * 觸發,day=3 那個值一開局就會馬上命中母親線第一個節點,改成從 1 開始
 * 會把所有既有節點往後延 2 天,等於重新調過一次已經調好的步調,沒必要)。
 * 只是加一層「day 數字 → 真的日期字串」的換算,錨點訂在「game.html 一開局
 * 那個 day 值(3)= 9/1」,不是「day=1 = 9/1」——兩者最後看到的字串一樣
 * (玩家一開局就是看到 9/1),差別只在程式內部怎麼對應,不影響任何既有
 * 節點的觸發時機。這樣「註冊單」才能顯示真的繳交期限,不是抽象的
 * 「還剩幾天」。閏年/精確到哪一年這輪不用管——這遊戲沒有釘死是哪一年,
 * 月份天數表夠用就好。 */
const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
const GAME_START_DAY = 3, START_MONTH = 9, START_DATE = 1;
function dayToDate(d){
  let n = START_DATE + (d - GAME_START_DAY), m = START_MONTH;
  while(n > MONTH_DAYS[m-1]){ n -= MONTH_DAYS[m-1]; m = m % 12 + 1; }
  while(n < 1){ m = (m + 10) % 12 + 1; n += MONTH_DAYS[m-1]; }
  return m + '/' + n;
}

/* 標籤:直接用 src/tags.js 的核心，不自己發明一套 */
/* 開局不再帶「單親」(2026-08-19 拿掉):這個標籤的 detail 寫死「只有
   媽媽」(src/tags.js),跟現在接進遊戲的爸爸(story-drink.js、客廳疊圖)
   直接矛盾——爸爸明明在,角色卡卻掛著「單親/只有媽媽」說不通。標籤
   定義留在 src/tags.js(還是通用標籤目錄,SCENES 裡掛的反應行也留著,
   給以後真的單親設定用),只是這個角色開局不再帶。 */
const CH = createCharacter([], 10);
function addTag(id){
  if(CH.tags.includes(id)) return;
  CH.tags.push(id);
  drawTags();
  const t = getTag(id);
  toast('你身上多了一格：' + (t ? t.name : id) + '。拿不掉。', 4200);
}
function drawTags(){
  const host = document.getElementById('tags');
  host.innerHTML = '';
  CH.tags.forEach(id => {
    const t = getTag(id); if(!t) return;
    const el = document.createElement('div');
    el.className = 'tag'; el.textContent = t.name;
    el.title = t.detail + (t.cover ? `（可以${t.cover.cover?.label || t.cover.label}）` : '（遮不了）');
    host.appendChild(el);
  });
}
/* 讀書累積知識(2026-08-19,kc):書桌「讀書」每次給一個「少少的知識」,
   湊滿 10 個自動升級成 1 個「略懂書本內容」(small 歸零扣 10,不是清空,
   萬一哪天一次拿到超過 10 個小知識,多的部分不會憑空消失)。「略懂」湊到
   5 個之後,玩家可以自己選要不要換成「精通知識」(kc 原話「可以換成」,
   是選項不是自動)——精通知識之後考期中考要用,**期中考本身這輪不做**,
   只做蒐集/升級/兌換這條鏈,先把資料結構立起來。跟 CH.tags 那套「永久
   標籤」不同,這裡是可累加、可消耗的數字,不适合塞進 tags 系統,獨立開
   一個物件。 */
let KNOWLEDGE = { small: 0, rough: 0, mastery: 0 };
function studyGainKnowledge(){
  KNOWLEDGE.small++;
  if(KNOWLEDGE.small >= 10){
    KNOWLEDGE.small -= 10;
    KNOWLEDGE.rough++;
    toast(`你把零散的知識拼湊起來，好像有點懂這本書在講什麼了。\n（略懂書本內容 ×${KNOWLEDGE.rough}）`, 3800);
  } else {
    toast(`你看了一個小時的書，不確定記住了多少。\n（少少的知識 ${KNOWLEDGE.small}/10）`, 3200);
  }
}
/* 偷玩手遊(2026-08-21,kc 給的「上課就好 或是偷玩手遊」兩個方向的第二個)
 * ——沒有真的一個「教官在不在看你」的狀態可以讀(跟 steal() 靠店員朝向
 * 判定不同層級,教室這輪只是灰模,還沒有那種細節),先用機率(30% 被抓)
 * 頂著,量級比刺青那種大事輕很多(星 −4、歸屬感 −6),抓到人用既有的
 * JIAOGUAN 角色,呼應他本來就是校內巡邏抓人的定位。沒被抓只有情緒
 * +6,**沒有知識**——這是重點,偷懶就是換不到「認真上課」那份累積。 */
function playPhoneInClass(){
  if(ST.stamina <= 0){ toast('你累到不行了，先回家睡一下。', 2400); return; }
  chg('stamina', -5); advanceTime(60);
  if(Math.random() < 0.3){
    chg('star', -4); chg('calm', -6);
    say('jiaoguan', '「你在幹嘛。」\n\n教官不知道什麼時候站到你後面了，手機直接被沒收。');
  } else {
    chg('mood', 6);
    toast('這節課你打了三場排位，一句都沒聽進去。', 2600);
  }
}

/* 角色面板(2026-08-18 起做,2026-08-19 這輪照參考截圖改成三欄殼:
 * 左「物品/穿搭/雜物」分頁、中人物、右狀態。真正接資料的只有狀態
 * (現成 ST)跟穿搭(下面這段新系統),其餘(雜物、特質、社交)先是
 * 視覺殼,理由見 docs/DESIGN_NOTES.md「角色面板改三欄」。 */
const invOverlay = document.getElementById('invOverlay');

/* 穿搭(2026-08-19 新增)——帥潮(cool)原本設計成「只由外顯的行頭決定」
 * (DESIGN_NOTES「五條指標各自管什麼」),但一直沒有東西餵它,這裡把這個
 * 空位填上。沒有做賣衣服的商店(還沒被要求),先把幾件示範衣物直接放進
 * `owned`,開局都沒穿,穿脫時即時改 ST.cool。 */
const WEAR_SLOTS = ['hat','top','bottom','shoes','neck'];
const WEAR_SLOT_NAME = { hat:'帽子', top:'上衣', bottom:'褲子', shoes:'鞋子', neck:'項鍊' };
/* icon 是 emoji 佔位(2026-08-19 第二輪,照 kc 丟的參考截圖改成圖示格子)——
 * 這遊戲沒做過物品圖示素材,先用 emoji 頂著看版面,之後真的要換圖再整批
 * 換掉,見 DESIGN_NOTES「角色面板改三欄」底下的補記。 */
const WEAR_ITEMS = [
  { id:'cap',    slot:'hat',    name:'鴨舌帽',   cool:4, icon:'🧢' },
  { id:'jacket', slot:'top',    name:'皮外套',   cool:7, icon:'🧥' },
  { id:'hoodie', slot:'top',    name:'素面帽 T', cool:2, icon:'👕' },
  { id:'baggy',  slot:'bottom', name:'垮褲',     cool:5, icon:'👖' },
  { id:'kicks',  slot:'shoes',  name:'白球鞋',   cool:6, icon:'👟' },
  { id:'chain',  slot:'neck',   name:'金項鍊',   cool:8, icon:'📿' }
];
const owned = WEAR_ITEMS.map(w => w.id);   // 全部示範用,先給,不用先買
const equipped = { hat:null, top:null, bottom:null, shoes:null, neck:null };
const COOL_BASE = ST.cool;   // 起始值就是 ST.cool 的初始值,不重複寫死 8
/* 角色欄兩側的裝備小圖示(2026-08-19 第二輪)怎麼分左右純粹是排版好看,
 * 沒有特別意義,3/2 只是配平衡,不喜歡可以直接改這兩個陣列。 */
const EQUIP_BADGE_LEFT = ['hat','top','bottom'], EQUIP_BADGE_RIGHT = ['shoes','neck'];

function recomputeCool(){
  let v = COOL_BASE;
  WEAR_SLOTS.forEach(s => { const it = WEAR_ITEMS.find(w => w.id === equipped[s]); if(it) v += it.cool; });
  const d = v - ST.cool;
  if(d) chg('cool', d);
}
function toggleWear(itemId){
  const it = WEAR_ITEMS.find(w => w.id === itemId); if(!it) return;
  equipped[it.slot] = (equipped[it.slot] === itemId) ? null : itemId;
  recomputeCool();
  renderWearTab();
  syncPanelStats();
}
function renderEquipBadges(){
  const draw = (hostId, slots) => {
    document.getElementById(hostId).innerHTML = slots.map(s => {
      const it = WEAR_ITEMS.find(w => w.id === equipped[s]);
      return `<div class="equipBadge${it ? ' filled' : ''}" title="${WEAR_SLOT_NAME[s]}：${it ? it.name : '沒穿'}">${it ? it.icon : ''}</div>`;
    }).join('');
  };
  draw('equipLeft', EQUIP_BADGE_LEFT);
  draw('equipRight', EQUIP_BADGE_RIGHT);
}
function renderWearTab(){
  const host = document.getElementById('invWearGrid');
  host.innerHTML = '';
  owned.forEach(id => {
    const it = WEAR_ITEMS.find(w => w.id === id); if(!it) return;
    const el = document.createElement('div');
    el.className = 'itemCard' + (equipped[it.slot] === id ? ' on' : '');
    el.innerHTML = `<div class="badge">+${it.cool}</div><div class="ic">${it.icon}</div><div class="lb">${it.name}</div>`;
    el.onclick = () => toggleWear(id);
    host.appendChild(el);
  });
  renderEquipBadges();
}

/* 狀態欄(右欄)直接讀現成 ST,跟左上角 HUD 的 syncHUD() 是同一份資料
 * 兩套顯示,不共用 DOM id 所以分開寫,邏輯故意抄一份保持獨立、互不影響。 */
function syncPanelStats(){
  const set = (id, txt, pct) => {
    const pod = document.getElementById(id);
    pod.querySelector('.nm').textContent = txt;
    if(pct != null) pod.querySelector('.track i').style.width = Math.max(0,Math.min(100,pct)) + '%';
  };
  set('pFullP', ST.full, ST.full);
  set('pCalmP', ST.calm, ST.calm);
  set('pCoolP', ST.cool, ST.cool);
  set('pMoodP', ST.mood, ST.mood);
  set('pStaminaP', ST.stamina, ST.stamina);
  document.getElementById('pFullP').classList.toggle('low', ST.full <= 25);
  document.getElementById('pMoneyP').textContent = '$' + ST.money;
  set('pStarP', (ST.star > 0 ? '+' : '') + ST.star, null);
  const starI = document.querySelector('#pStarP .track i');
  const starHalf = Math.abs(ST.star) / 2;
  starI.className = ST.star >= 0 ? 'good' : 'bad';
  starI.style.width = starHalf + '%';
  starI.style.left = (ST.star >= 0 ? 50 : 50 - starHalf) + '%';
}

const fmtTime = m => String((m/60|0)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
function syncHUD(){
  set('pMoney', '$' + ST.money, null);
  /* 上限被墊高之後(見上面 ST_MAX 那則筆記)血條寬度要除以「當前上限」
     算百分比,不能再直接拿數值當百分比——不然體力上限被算命道具加高後,
     沒滿的時候血條會看起來比實際還空(110/120 直接當 110% 會被下面的
     set() 夾回 100%,看起來一直是滿的,量不出還差多少)。 */
  set('pFull', ST.full, ST.full/ST_MAX.full*100);
  set('pStamina', ST.stamina, ST.stamina/ST_MAX.stamina*100);
  set('pCalm', ST.calm, ST.calm/ST_MAX.calm*100);
  set('pCool', ST.cool, ST.cool/ST_MAX.cool*100);
  set('pMood', ST.mood, ST.mood/ST_MAX.mood*100);
  document.getElementById('pFull').classList.toggle('low', ST.full <= 25);
  set('pStar', (ST.star > 0 ? '+' : '') + ST.star, null);
  const starI = document.querySelector('#pStar .track i');
  const starHalf = Math.abs(ST.star) / 2;                // -100~100 對應 track 半邊 0~50%
  starI.className = ST.star >= 0 ? 'good' : 'bad';
  starI.style.width = starHalf + '%';
  starI.style.left = (ST.star >= 0 ? 50 : 50 - starHalf) + '%';
  document.querySelector('#clock .t').textContent = fmtTime(minute);
  /* 2026-08-21:這格原本是寫死的「週三」。同一天 kc 自己也在改這一行
     (把它接成 `'週'+DAYS[day%7]` 那個算式),跟我這輪加的 `dayToDate()`
     撞在同一個 `.d` 元素上——兩個都對,不是二選一,合併成一行(日期＋
     星期),不要留兩條互相蓋掉的寫入。 */
  document.querySelector('#clock .d').textContent = dayToDate(day) + ' 週' + DAYS[day%7];
  function set(id, txt, pct){
    const pod = document.getElementById(id);
    pod.querySelector('.nm').textContent = txt;
    if(pct != null) pod.querySelector('.track i').style.width = Math.max(0,Math.min(100,pct)) + '%';
  }
}
const COLOR = { money:'#f2d888', full:'#c9bb44', calm:'#6fc3b4', cool:'#d05fa0', mood:'#f2b25c', stamina:'#6fc98a' };
const NAMES = { money:'', full:'飽足', calm:'歸屬感', cool:'帥潮', mood:'情緒', stamina:'體力', star:'風評' };
function chg(k, d){
  if(!d) return;
  ST[k] += d;
  /* 風評(star)2026-08-14 從 0~5(通緝星星)改成雙向 -100~+100,見
     docs/DESIGN_NOTES.md「通緝改名風評」——中間 0,左邊壞事、右邊好事,
     不再只往一個方向長。其餘指標維持原本 0~100。 */
  if(k === 'star') ST[k] = Math.max(-100, Math.min(100, ST[k]));
  else if(k !== 'money') ST[k] = Math.max(0, Math.min(ST_MAX[k] ?? 100, ST[k]));
  /* 體力低於 50 又還沒去學校的提醒,見上面 schoolRemindedDay 那則筆記。
     跳在數值飄字之後沒有先後順序上的講究,只是程式碼寫在這裡比較順——
     兩個都是這次 chg() 呼叫的副作用,誰先跳不影響觀感。 */
  if(k === 'stamina' && ST.stamina < 50 && lastSchoolDay !== day && schoolRemindedDay !== day){
    schoolRemindedDay = day;
    toast('你想到，你今天還沒去學校。', 3000);
  }
  syncHUD();
  const el = document.getElementById({money:'pMoney',full:'pFull',calm:'pCalm',cool:'pCool',mood:'pMood',stamina:'pStamina',star:'pStar'}[k]);
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  const f = document.createElement('div');
  f.className = 'fl';
  /* 風評雙向,飄字顏色跟著這次變動的方向走(綠=好事、紅=壞事),不是固定
     一個顏色——固定紅色會讓「+風評」看起來也像壞事。其餘指標維持單一顏色。 */
  f.style.color = k === 'star' ? (d > 0 ? '#6fc98a' : '#e0483a') : COLOR[k];
  f.style.left = (el.offsetLeft+8)+'px'; f.style.top = (el.offsetTop+el.offsetHeight+4)+'px';
  f.textContent = (NAMES[k] + ' ' + (d>0?'+':'') + (k==='money'?'$'+d:d)).trim();
  document.getElementById('float').appendChild(f);
  setTimeout(() => f.remove(), 1500);
}
const toastEl = document.getElementById('toast');
function toast(txt, ms){
  toastEl.textContent = txt; toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('on'), ms || 2800);
}
function advanceTime(min){
  minute += min;
  while(minute >= 24*60){ minute -= 24*60; day++; }
  syncHUD();
}

/* 街頭藝人的歌聲(見上面 BUSKER_POS 那段註解)。AudioContext 一定要在使用者
   互動(keydown)裡才准建立/resume,不能頁面一載入就開——瀏覽器的 autoplay
   政策會直接擋掉,靜音也不報錯,踩了會覺得「明明寫了怎麼沒聲音」,先在這裡
   說清楚。startBuskerAudio() 只會真的跑一次(靠 buskerGain 判斷有沒有建過),
   之後每次 keydown 呼叫都是白工但無害。 */
let audioCtx = null, buskerGain = null;
function startBuskerAudio(){
  if(buskerGain) { if(audioCtx.state === 'suspended') audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  buskerGain = audioCtx.createGain();
  buskerGain.gain.value = 0;
  buskerGain.connect(audioCtx.destination);
  /* 五聲音階(C D E G A)迴圈當佔位唱腔,不是真的歌——單音 sine 波,ADSR
     只做簡單的淡入淡出,避免每個音之間喀一聲(click)。600ms 一個音,
     8 個音一輪,跟 mood/stamina 那些數值改動無關,純氣氛。 */
  const notes = [261.6, 293.7, 329.6, 392.0, 440.0, 392.0, 329.6, 293.7];
  let i = 0;
  (function playNote(){
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = notes[i % notes.length];
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.5, t + .06);
    g.gain.linearRampToValueAtTime(0, t + .55);
    osc.connect(g); g.connect(buskerGain);
    osc.start(t); osc.stop(t + .6);
    i++;
    setTimeout(playNote, 600);
  })();
}
/* 靠近淡入、走遠淡出——20 單位外完全聽不到,站在他面前(距離 0)音量封頂
   在 .55,不是開到最大聲,街頭藝人不該蓋過其他環境音。updateCity() 每幀
   呼叫,數字沒特別校過,kc 覺得聽起來範圍不對再調。 */
function updateBuskerAudio(px, pz){
  if(!buskerGain) return;
  const d = Math.hypot(px-BUSKER_POS.x, pz-BUSKER_POS.z);
  const vol = Math.max(0, 1 - d/20) * .55;
  buskerGain.gain.setTargetAtTime(vol, audioCtx.currentTime, .3);
}

  portC.clearRect(0,0,S,S); portC.fillStyle = '#1b202b'; portC.fillRect(0,0,S,S);
  if(img && img.complete && img.naturalWidth){
    portC.imageSmoothingEnabled = true;
    portC.drawImage(img, 0,0,img.naturalWidth,img.naturalHeight, 0,0,S,S);
  } else {
    portC.save(); portC.imageSmoothingEnabled = false;
    const k = S/33; portC.scale(k,k);

function tickDialog(dt){
  if(!dlg.on || dlg.done) return;
  dlg.timer += dt;
  while(dlg.timer > 36 && dlg.shown < dlg.full.length){
    dlg.timer -= 36; dlg.shown++;
    dTx.textContent = dlg.full.slice(0, dlg.shown);
  }
  if(dlg.shown >= dlg.full.length){ dlg.done = true; dCaret.classList.add('on'); }
}
function advanceDialog(){
  if(!dlg.on) return false;
  if(!dlg.done){ dlg.shown = dlg.full.length; dlg.done = true;
                 dTx.textContent = dlg.full; dCaret.classList.add('on'); return true; }
  dlgEl.classList.remove('on'); dlg.on = false;

 * 讓骨架落到站姿再量位置是同一個坑——這裡沒有精確掛在手骨上(這個

 * 決定「地方長什麼樣」,這裡只決定「人跟吉他」。 */
const buskerNPC = buildNPC(THREE, scene, {
  x:BUSKER_POS.x, z:BUSKER_POS.z, rotationY:Math.PI*.75, rig:'m2',
  skin:'#b98a63', hair:'#3a3128',
  hood:'#2e4a3a', pants:'#26241f', shoe:'#4a4038'
});
(function attachGuitar(){
  const model = buskerNPC.group.children[0];
  if(!model){ requestAnimationFrame(attachGuitar); return; }
  const wood = new THREE.MeshStandardMaterial({ color:0x8a5a32, roughness:.7 });
  const dark = new THREE.MeshStandardMaterial({ color:0x2a1c12, roughness:.6 });
  const guitar = new THREE.Group();
  /* 吉他身:兩個疊起來的扁圓柱湊出「腰身」輪廓(上半窄、下半寬,不是一顆
     正圓餅乾),琴頸是一根細長方柱斜插出去。**第一版尺寸抓太大**——套上去
     整顆像抱了個南瓜/盾牌貼在背後,截圖核對才發現(見 DESIGN_NOTES),
     這版尺寸砍半重抓,肉眼比對跟角色肩寬同一個量級才收。 */
  const bodyLower = new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.05,16), wood);
  bodyLower.rotation.x = Math.PI/2; bodyLower.position.set(0,-.12,0);
  const bodyUpper = new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.05,16), wood);
  bodyUpper.rotation.x = Math.PI/2; bodyUpper.position.set(0,.08,0);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(.03,.42,.015), dark);
  neck.position.set(0,.38,.01); neck.rotation.z = .08;
  guitar.add(bodyLower, bodyUpper, neck);
  /* 斜背在胸前(2026-08-20 kc:「手上要拿吉他」的簡化版——見上面長註解,
     這個 rig 沒有手部骨骼可以真的握,斜揹的角度從正面看很像雙手扶著
     琴身彈唱,是折衷,不是偷懶漏做)。offset 貼緊軀幹(z 只推 .12,不是
     舊版的 .28,不然縮小後反而看起來浮在半空中跟身體脫節)。之後 kc
     玩起來覺得位置不對再回頭調這幾個數字就好,不用整組重寫。 */
  guitar.position.set(.02, .55, .12);
  guitar.rotation.set(-.15, .5, -.35);
  model.add(guitar);
})();

   blocked() 每 0.3 單位取樣核對過,乾淨無阻擋。犧牲的是「真的從他
   後火車站的崗位走來」這個細節,換來路線可靠+畫面好看,這裡我先這樣
   選,不喜歡跟我說一聲就改。 */
const WATCHJOB_PATH = [[60, 10], [0, 10], [0, 15]];
const WATCHJOB = { active:false, spotted:false, resolved:false, walker:null, lastDay:-1 };
function startWatchJob(){
  WATCHJOB.active = true; WATCHJOB.spotted = false; WATCHJOB.resolved = false;
  brotherNPC.group.visible = false;
  WATCHJOB.walker = buildNPC(THREE, scene, {
    x:WATCHJOB_PATH[0][0], z:WATCHJOB_PATH[0][1], rotationY:-Math.PI*.5, rig:'m2',
    skin:'#c2a17e', hair:'#1c1c1c', hood:'#2b3a52', pants:'#1c2430', shoe:'#1c1c1c',
    path: WATCHJOB_PATH
  });
  NPCS.push(WATCHJOB.walker);
  toast('你走到遊藝場附近，盯著巷口。', 2800);
}
/* success=true(玩家有看到、回去跟阿源講到)/false(小美哥先走到門口)
   兩邊都收尾同一套:分身 NPC 移除、小美哥固定站位那具恢復顯示、
   WATCHJOB 狀態歸零(lastDay 卡住同一天不會再被邀約第二次)。 */
function resolveWatchJob(success){
  if(WATCHJOB.resolved) return;
  WATCHJOB.resolved = true; WATCHJOB.active = false; WATCHJOB.lastDay = day;
  scene.remove(WATCHJOB.walker.group);
  const idx = NPCS.indexOf(WATCHJOB.walker);
  if(idx >= 0) NPCS.splice(idx, 1);
  WATCHJOB.walker = null;
  brotherNPC.group.visible = true;
  const D = success ? NpcTemple.WATCH_JOB.success : NpcTemple.WATCH_JOB.fail;
  playBeats(D.beats, 0, () => {
    if(success){ chg('money', 1000); chg('calm', 6); chg('mood', 8); }
    else { chg('money', -300); chg('calm', -6); chg('mood', -8); }
    toast(D.quiet, 3200);
  });
}

function tweakStatuePedsPanel(){
  const old = document.getElementById('statuePedTweakPanel');
  if(old){ old.remove(); return; }
  const panel = document.createElement('div');
  panel.id = 'statuePedTweakPanel';
  panel.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;background:#1b202bee;color:#eee;padding:12px 14px;border-radius:8px;font:12px/1.6 sans-serif;width:220px;box-shadow:0 4px 20px #000a';
  const rows = [['aDeg','路人 A(說她生平那位)', STATUE_PED_A], ['bDeg','路人 B(說她媽媽那位)', STATUE_PED_B]];
  panel.innerHTML = '<div style="font-weight:bold;margin:0 0 6px">圓環路人朝向(度)</div>' +
    rows.map(([key,label]) =>
      `<div style="margin-bottom:8px">${label}: <span id="tweak_sp_${key}_v">${STATUE_PED_TWEAK[key]}</span><br>
       <input type="range" id="tweak_sp_${key}" min="0" max="360" step="1" value="${STATUE_PED_TWEAK[key]}" style="width:100%">
       </div>`
    ).join('') + '<div style="margin-top:4px;opacity:.7">關掉:再打一次 __dbg.tweakStatuePeds()</div>';
  document.body.appendChild(panel);
  rows.forEach(([key,,npc]) => {
    const input = document.getElementById(`tweak_sp_${key}`);
    const out = document.getElementById(`tweak_sp_${key}_v`);
    input.addEventListener('input', () => {
      STATUE_PED_TWEAK[key] = +input.value;
      out.textContent = input.value;
      npc.setFacing(STATUE_PED_TWEAK[key]*Math.PI/180);
    });
  });
}

   paintHomeBackdrop() 重畫,不用碰程式碼。`.w` 是畫面寬度(px),
   `.x`/`.bottom` 是左上角 x 跟底部貼齊的 y。 */
const DAD_TWEAK = { x:766, bottom:720, w:152 };
/* 媽媽坐沙發疊圖拿掉了(2026-08-19):第四版 home-living.png 換照片時
   kc 直接把媽媽(叼菸+骰子+骰盅那個姿勢)烤進背景裡了,不用再疊

   寫實照片→叼菸道具版)見 git 歷史,MOM_TWEAK 那組滑桿數字跟著拿掉,
   `__dbg.tweakDad()` 面板只剩爸爸+共用陰影兩組。 */
/* 接地陰影(2026-08-18,kc 反應「媽媽腳下沒有踩到地板的陰影」,當時媽媽
   還是疊圖):疊圖角色是平面貼紙貼上去的,沒有真的 3D 光影,腳下懸空感
   很重。畫一個貼在地板上的橢圓形放射狀漸層陰影(中心深、邊緣淡出到
   透明),不用另外生素材。畫在人物「之前」(疊圖順序上陰影會被腳蓋住
   一點,才不會浮在鞋子前面)。三個旋鈕(寬度比例/扁平度/深淺)拉進
   SHADOW_TWEAK,滑桿面板可以調——媽媽疊圖拿掉後現在只有爸爸在用。 */
const SHADOW_TWEAK = { wScale:70, hScale:30, opacity:38 };
function drawFloorShadow(ctx, x, bottom, w){
  const ew = w*(SHADOW_TWEAK.wScale/100), eh = ew*(SHADOW_TWEAK.hScale/100);
  const cx = x + w/2;
  ctx.save();
  ctx.translate(cx, bottom);
  ctx.scale(1, eh/ew);
  const grad = ctx.createRadialGradient(0,0,0, 0,0,ew/2);
  grad.addColorStop(0, `rgba(0,0,0,${SHADOW_TWEAK.opacity/100})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, ew/2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
/* 教室疊圖的亮度/色版滑桿(2026-08-25,見上面 MEI_DESK_TWEAK 那則筆記)——
   canvas `filter` 屬性可以疊多個濾鏡函式,`brightness()` 是內建的,逐色版
   增益(單獨調 R/G/B)內建濾鏡沒有對應函式,借一個 inline SVG
   feColorMatrix(對角矩陣,只縮放 R/G/B,不動 A)用 data URI 當
   `url(...)` 濾鏡接上去——不用真的建立 DOM 裡的 <svg>,字串現串現丟給
   `ctx.filter` 瀏覽器就會解析。tweak 物件的 r/g/b/brightness 都是
   百分比,100 = 原圖不變。
   兩個坑,都是本機用假 canvas 現場測出來的,不是查文件查到的:
   1) data URI 不能寫 `image/svg+xml;utf8,`——`utf8` 不是合法的 MIME
      參數格式(應該是 `;charset=utf-8` 或乾脆不寫),寫了 Chrome 會直接
      判定濾鏡載入失敗,套用結果是整張圖變全透明黑([0,0,0,0]),不是
      忽略那段濾鏡繼續套用其他部分。
   2) `url(...)` 濾鏡跟內建 `brightness()` 疊在同一個 filter 字串時,
      **順序會影響能不能用**——`url(...) brightness()` 正常,反過來
      `brightness() url(...)` 一樣整張變全透明黑。原因不明(可能是
      Chrome 內部把 url() 濾鏡跟後面的內建濾鏡函式編譯成一條 pipeline
      時,url() 濾鏡要在最前面才解析得動),照這個順序寫就好,不用深究
      為什麼。 */
function schoolPropFilter(tweak){
  const { r, g, b, brightness } = tweak;
  if(r === 100 && g === 100 && b === 100 && brightness === 100) return 'none';
  const m = [r/100,0,0,0,0, 0,g/100,0,0,0, 0,0,b/100,0,0, 0,0,0,1,0].join(' ');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg'><filter id='f'><feColorMatrix type='matrix' values='${m}'/></filter></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}#f") brightness(${brightness}%)`;
}
function paintHomeBackdrop(){
  gbg.clearRect(0,0,1280,720);
  if(homeLivingImg.complete && homeLivingImg.naturalWidth){

  } else {
    gbg.save(); gbg.scale(SC,SC);
    SceneHome.renderBackground(gbg, { tvOn:true, godLamp:true, vignette:true, sofaFront:true });
    gbg.restore();
  }
  /* 爸爸+椅子不在這裡畫(2026-08-19 移到 renderIndoorForeground()):
     `gbg` 是背景層,比玩家的 3D 頭像低一層,畫在這裡的話玩家永遠蓋在他
     上面——kc 反應「走過去會擋住爸爸的圖」,要的是反過來,爸爸的圖層
     要在最上面,不用管玩家站在哪。改成畫在 c2df(前景層,見
     renderIndoorForeground()),每幀重畫,天然蓋過玩家。 */
}

   home-bedroom.png,同一次生圖,鏡頭比例假設相同),用新量出來的門框比例
   校正——168cm 換算 296px(算式:門框量出來約 200cm 高、460 原生 px,
   乘 720/941 換成畫布 px 除以 200 得每公分畫布 px,再乘 168)。
   **教室是例外(2026-08-25)**——kc 玩起來要求「往下走要慢慢變大」,固定
   常數這條「畫面固定不管站多遠」的規則在這個場景明確被推翻了。教室的
   構圖跟其他室內不一樣:鏡頭沒有校平,照片本身有真的透視,玩家往南
   (靠近鏡頭、IN.py 變大)會視覺上變大才對。改成 school 不查這張表,
   直接在 renderIndoor3D() 用 `schoolHeroPx(IN.py)` 按深度插值,見那邊
   跟下面 SCHOOL_HERO_TWEAK 的說明。 */
const HERO_TARGET_PX = {
  store: 106 * 1.3 * SC,   // 275.6,定案不再調
  home: 296,
  bedroom: 320,   // 2026-08-19:kc 說房間裡人「稍微調大一點」,296→320(+8%)
  arcade: 296   // 2026-08-26:灰模場景沒有真的透視好校正,先借 home 那個量級,跟其他固定鏡頭室內同一批
};
const INDOOR_HERO_TARGET_PX = HERO_TARGET_PX.store;   // 給 spawnClerk/spawnDad/spawnMom 那些除錯用的定格截圖工具用,跟超商比例校正
const INDOOR_HERO_SCALE = INDOOR_HERO_TARGET_PX / PLAYER.height;
/* 教室深度縮放(2026-08-25,kc:「可以處理透視嗎,往下走會慢慢變大」)——
   IN.py 在 SCHOOL.walkN(遠、靠黑板/講台)時吃 farPx,在 SCHOOL.walkS
   (近、靠鏡頭/門口)時吃 nearPx,中間線性插值。nearPx 沿用 kc 已經覺得
   「站在門口大小差不多對」的 420(前一輪滑桿調過的起始值);farPx 借
   scene-school.js 那組還沒用上的 `depthScale()` 比例(0.76~1.0)反推
   ——420*0.76≈319,湊整數 320(剛好是這個場景一開始借房間那組舊值,
   純巧合)。都還沒真的核對過,__dbg.tweakSchool() 滑桿兩個數字都能拉。
   **farPx(2026-08-26)**:kc 說「遠景人稍微調大一點點,給我滑感」——太小
   走到最遠處會整個人縮太扁,近/遠對比不夠明顯反而看不出走位有變化,
   320→350(+9%,跟房間那次「稍微調大」的調法同一個量級)。 */
const SCHOOL_HERO_TWEAK = { nearPx: 420, farPx: 350 };
function schoolHeroPx(py){
  const t = Math.max(0, Math.min(1, (py - SCHOOL.walkN) / (SCHOOL.walkS - SCHOOL.walkN)));
  return SCHOOL_HERO_TWEAK.farPx + t * (SCHOOL_HERO_TWEAK.nearPx - SCHOOL_HERO_TWEAK.farPx);
}

const heroIndoor = buildPlayer(THREE, indoorScene);

/* 店員 3D 骨架模型拿掉了(2026-08-13,見上面「整體改回 2D 背景」)——跟

/* IN.px/IN.py(2D 640×360 邏輯座標)*SC 直接就是正交鏡頭的世界座標——
   world X 跟畫面 px 同向,world Y 要反過來(世界 Y 越大對到畫面越上面,
   見上面鏡頭設定的註解),Z 沒有意義,固定 0 就好。跟 STORE.hot 那些既有
   的 px 判斷式(碰撞、Y-sort 遮擋)天生共用同一套數字,不會再脫鉤。 */
function renderIndoor3D(dt){
  heroIndoor.group.position.set(IN.px*SC, 720 - IN.py*SC, 0);
  heroIndoor.group.scale.setScalar((PLACE === 'school' ? schoolHeroPx(IN.py) : (HERO_TARGET_PX[PLACE] ?? HERO_TARGET_PX.store)) / PLAYER.height);
  heroIndoor.group.rotation.y =
    IN.face === 'F' ? 0 : IN.face === 'B' ? Math.PI :
    IN.face === 'L' ? -Math.PI/2 : Math.PI/2;
  heroIndoor.animate(dt, IN.moving, 1);
  /* 越式按摩室內的第二個角色(2026-08-20,見 workerIndoor 宣告那段註解)
     ——站在固定的 MASSAGE_WORKER_PX,跟玩家同一條 py(同一條「地板線」),
     面朝玩家(跟 heroIndoor 的朝向鏡射,玩家面右她就面左)。只有
     PLACE==='massage' 才顯示/更新,其餘場景維持 visible=false、不佔渲染。 */
  workerIndoor.group.visible = (PLACE === 'massage');
  if(PLACE === 'massage'){
    workerIndoor.group.position.set(MASSAGE_WORKER_PX*SC, 720 - IN.py*SC, 0);
    workerIndoor.group.scale.setScalar((HERO_TARGET_PX[PLACE] ?? HERO_TARGET_PX.store) / PLAYER.height);
    workerIndoor.group.rotation.y = -heroIndoor.group.rotation.y;
    workerIndoor.animate(dt);
  }
  renderer3d.render(indoorScene, indoorCamera);
}

const grain = (() => {
  const c = document.createElement('canvas'); c.width = LW; c.height = LH;
  const x = c.getContext('2d'), img = x.createImageData(LW, LH);
  let s = 20260804;
  const rnd = () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
  for(let i=0;i<img.data.length;i+=4){
    const v = rnd() < .5 ? 0 : 255;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3] = rnd() < .05 ? 10 : 0;
  }
  x.putImageData(img,0,0); return c;
})();

const IN = { px:150, py:320, face:'F', walkT:0, moving:false, near:null,

}
/* mood(第 3 參數):2026-08-17 kc 說「買好吃的東西會開心」,情緒的來源正式

function buy(price, feed, mood, line){

/* 遊藝場賭博(2026-08-26)——見 openIndoorSpot() PLACE==='arcade' 那段筆記。
   `roll` 先扣注金,呼叫端的 `resolveFn()` 回傳這一把的結果(`payout`/
   `mood`/`line`),中獎才把 payout 加回去——三台機台共用同一套流程,差別
   只在 resolveFn 內部的機率/賠率。情緒固定加,不看 payout 是不是 0,是
   kc 明確要求的「情緒一定＋」。 */
/* 「想起媽媽」的鉤子(2026-08-26,kc 確認要加)——只認**累計淨輸掉多少**,
   贏的局不會拿去抵銷之前輸的(這是「你已經賠了多少」的量尺,不是「現在
   身上盈虧多少」,一把大獎不該把這個記憶洗掉)。門檻 $500 是抓的小的
   可逆數字,一整局遊戲只跳這一次(`momEchoShown`),不是每次超過門檻都
   跳——這是一個瞬間的自我察覺,跳太多次會變成說教式的重複提醒,違反
   基準線(不要居高臨下)。台詞照 kc 原話,不加碼延伸,不寫「你決定不要
   再賭了」這種說教式收尾——這遊戲的規矩是講到這裡就停,讓玩家自己接。
   接在正常結果 toast 之後跳第二則(比照書架線索那套「先講結果、再跳
   獨立提示句」的節奏),不跟第一則擠在同一個 toast 裡。 */
const ARCADE_GAMBLE = { netLoss: 0, momEchoShown: false, momConfronted: false };
function gambleResolve(cost, resolveFn){
  if(ST.money < cost){ toast('你身上不夠。', 2000); return null; }
  chg('money', -cost);
  const r = resolveFn();
  if(r.payout) chg('money', r.payout);
  chg('mood', r.mood);
  const net = cost - r.payout;
  if(net > 0) ARCADE_GAMBLE.netLoss += net;
  /* 情緒變化這輪起要在對話匡裡看得到,不只是 HUD 上一閃而過的飄字
     (2026-08-26,kc:「玩遊戲情緒值會上升,虧錢會略略下降,對話匡要
     顯示」)——toast()跟agShowResult()(見下面)都補上這行。 */
  toast(r.line + (r.payout ? `\n（拿回 $${r.payout}）` : '') + `\n（情緒 +${r.mood}）`, 3000);
  if(!ARCADE_GAMBLE.momEchoShown && ARCADE_GAMBLE.netLoss >= 500){
    ARCADE_GAMBLE.momEchoShown = true;
    setTimeout(() => toast('你想起媽媽也是這樣。', 3200), 3200);
  }
  return r;   // 給 #arcadeGame 大面板用來把結果文字寫進 agBody,不是只靠 toast 飄過去
}
/* 機台真的有演出/操作了(2026-08-26,kc:「遊戲內容照你說的做」,見討論
   當下提的分層方案)——slot/roulette 是純視覺演出,轉輪/輪盤跑完固定時間
   才呼叫 gambleResolve(),機率完全不受這段演出影響(跟功德箱那類選單式
   互動同一個「決定權在遊戲端」的精神,沒有因為加了動畫就變成玩家能
   影響機率);pusher 是三台裡唯一真的看手感的——指示條左右來回跑,玩家
   按空白鍵卡時機,卡得準不准直接改這把的中獎機率。三台共用同一個狀態機
   `ARCADE_ANIM`,`busy=true` 鎖住室內移動,跑完/操作完才解鎖。
   `kind==='pusher'` 這支的空白鍵不是「按下去看結果」的觸發鍵那麼簡單——
   它要在 `updateIndoor()` 早退之前先被 keydown 攔截(見下面 keydown 那段
   新增的判斷),不然會落進 openIndoorSpot(IN.near) 那條路徑,被
   `if(busy||dlg.on) return;` 擋掉,空白鍵等於失靈。 */
const ARCADE_ANIM = { active:false, kind:null, t:0, dur:0, cb:null, barPos:0, barDir:1, outcome:null };
/* slot/roulette 的 outcome 在開始演出**之前**就先擲骰決定好(見下面
   openIndoorSpot() 的 'slot'/'roulette' 分支),存在 ARCADE_ANIM.outcome——
   agDrawSpin() 收尾那幾百毫秒要顯示「對上的顏色」,跟最後真正
   gambleResolve() 用的是同一份結果,不是動畫演一套、結算另外骰一次。 */
function startArcadeSpin(kind, dur, outcome, onDone){
  ARCADE_ANIM.active = true; ARCADE_ANIM.kind = kind; ARCADE_ANIM.t = 0; ARCADE_ANIM.dur = dur;
  ARCADE_ANIM.outcome = outcome; ARCADE_ANIM.cb = onDone; busy = true;
}
/* 投錢動畫(2026-08-26,kc:「推幣機很沒有帶入感...我想要有投錢下去推的
   感覺」)——按下「投 $20」不是直接跳出時機條,先跑一小段代幣掉落的
   演出(ARCADE_ANIM.kind==='pusher-drop',純視覺,固定 450ms),跑完才
   真的開始 startPusherGame() 的時機條。畫面在 agDrawSpin() 畫,見那邊。 */
function startPusherDrop(onDone){
  ARCADE_ANIM.active = true; ARCADE_ANIM.kind = 'pusher-drop'; ARCADE_ANIM.t = 0; ARCADE_ANIM.dur = 450;
  ARCADE_ANIM.cb = onDone; busy = true;
}
function startPusherGame(){
  ARCADE_ANIM.active = true; ARCADE_ANIM.kind = 'pusher'; ARCADE_ANIM.barPos = 0; ARCADE_ANIM.barDir = 1;
  busy = true;
}
/* 中獎後的代幣滑落演出(2026-08-26,同一輪)——贏了才播,輸了就直接跳
   結果文字(沒有代幣可以演)。跟 pusher-drop 一樣是純視覺的固定時長
   演出,跑完才呼叫 agShowResult()。 */
function startPusherPayout(win, onDone){
  if(!win){ onDone(); return; }
  ARCADE_ANIM.active = true; ARCADE_ANIM.kind = 'pusher-payout'; ARCADE_ANIM.t = 0; ARCADE_ANIM.dur = 650;
  ARCADE_ANIM.cb = onDone; busy = true;
}
/* 推幣機命中判定(2026-08-26)——sweet spot 卡在正中央(0.5)附近,離中心
   越近中獎機率越高。三段門檻(準/普通/差)是這輪先抓的小的可逆數字,
   賠率(payout)也跟著分三級,獎勵真的卡準的那一下。 */
function resolvePusherLockIn(){
  if(!ARCADE_ANIM.active || ARCADE_ANIM.kind !== 'pusher') return;
  const pos = ARCADE_ANIM.barPos;
  ARCADE_ANIM.active = false; busy = false;
  agBarEl.style.display = 'none';
  let win = false;
  /* 難度調高(2026-08-26 第二輪,kc:「難度太簡單」)——sweet spot 從
     dist<=.12(對應 CSS 24% 寬)縮到 dist<=.05(對應 10% 寬),ok 這個
     「還可以」的緩衝帶也從 .3 收到 .2,三檔機率都調低一截(.8→.7,
     .45→.3,.15→.08),配合 updateIndoor() 那邊調快的指示條速度,真的
     要盯著看才卡得到,不是隨便按都有四五成機會。
     **期望值檢查(2026-08-26 第三輪,kc:「檢查一下整體的期望值要是負的,
     不能鼓勵他們賭博」)**——slot(−20%)、roulette(−2.7%,真實歐式輪盤
     莊家優勢)本來就是負的,但這裡原本 great 那檔用 .7 機率、45 賠率
     算出來是 **正**期望值(.7*(45-20)+.3*(-20)=+11.5,練到穩定卡進
     great 反而長期會賺)——這正是要避免的漏洞,不能讓「練熟手感」變成
     穩賺。把 great 賠率從 45 調到 25,期望值變成
     .7*(25-20)+.3*(-20)=-2.5,三檔(great/ok/bad)全部負值,skill 只能
     「輸得比較少」,不能翻正。 */
  const r = gambleResolve(20, () => {
    const dist = Math.abs(pos - .5);
    const tier = dist <= .05 ? 'great' : dist <= .2 ? 'ok' : 'bad';
    const chance = tier === 'great' ? .7 : tier === 'ok' ? .3 : .08;
    win = Math.random() < chance;
    /* 情緒:虧錢那次打折(2026-08-26,kc:「玩遊戲情緒值會上升,虧錢會略略
       下降」)——4→3,見 spinRouletteTo() 旁邊那則同一輪的筆記。 */
    if(!win) return { payout:0, mood:3, line:'那疊代幣晃了一下，還是沒掉下來。' };
    const payout = tier === 'great' ? 25 : 30;
    return { payout, mood:4,
      line: tier === 'great' ? '卡得正準——一整排代幣被推下來了。' : '一小疊代幣被推下來，落進出幣口。' };
  });
  busy = true;   // startPusherPayout()/agShowResult() 之間有一小段沒有 ARCADE_ANIM.active 的空檔,手動頂住
  startPusherPayout(win, () => { busy = false; agShowResult(r, showPusherBets); });
}
/* #arcadeGame 大面板的下注畫面(2026-08-26)——每台機台一個 showXxxBets()
   函式,負責畫出「下注選項」那一頁;結果出來後 agShowResult() 提供
   「再玩一次」(呼叫同一個 showXxxBets)/「走開」兩個按鈕,不用另外
   重新走一次 openIndoorSpot()。 */
function agShowResult(r, replay){
  agActions.innerHTML = '';
  agBody.textContent = r ? (r.line + (r.payout ? `\n（拿回 $${r.payout}）` : '') + `\n（情緒 +${r.mood}）`) : '';
  if(r) agButton('再玩一次', '', '', replay);
  agButton('走開', '', 'back', closeArcadeGame);
}
function showSlotBets(){
  agSlotTier = 'lose'; agSlotLoseIdx = Math.random()*ARCADE_SLOT_IMG.lose.length|0;   // 面板剛開/走開重進都退回中立的預設畫面,不留著上一把的結果
  agBody.textContent = ''; agActions.innerHTML = '';
  agButton('拉一次', '$50', ST.money<50?'bad':'', () => {
    if(ST.money < 50){ toast('你身上不夠。', 2000); return; }
    agActions.innerHTML = ''; agBody.textContent = '';
    const rr = Math.random();
    /* 情緒:虧錢那次打折(2026-08-26,kc:「玩遊戲情緒值會上升,虧錢會略略
       下降」)——6→4,見 spinRouletteTo() 旁邊那則同一輪的筆記。 */
    const outcome = rr < .05 ? { payout:500, mood:6, line:'三顆金磚排成一線——中大獎了！', tier:'jackpot' }
                   : rr < .20 ? { payout:100, mood:6, line:'兩顆對上，小賺一筆。', tier:'small' }
                   : { payout:0, mood:4, line:'轉輪停下，什麼都沒對上。', tier:'lose' };
    startArcadeSpin('slot', 1100, outcome, () => agShowResult(gambleResolve(50, () => outcome), showSlotBets));
  });
  agButton('走開', '', 'back', closeArcadeGame);
}
/* 真的算出球停在哪個號碼上(2026-08-26,kc:「你的球沒有真的停在不同
   地方,而且沒有真的判定」)——之前 agDrawSpin() 的球角度是寫死的
   `3.2*2π*ease`,不管押什麼、輸贏,每次動畫最後都轉到同一個角度停下,
   跟結果完全沒關係。這輪改成真的照歐式輪盤的號碼順序算出球實際落在
   哪一格,球的終點角度直接對應那個號碼在照片上的實際位置——順序/紅黑
   都是真的輪盤規則(不是隨便編的),`arcade-roulette.png` 裡看得到的
   號碼排列(3,26,0,32,15...)跟這個順序對得上。 */
/* 號碼順序(2026-08-26,kc 親自對著 arcade-roulette.png 逐格核對後給的
   最終版本)——這張照片是 AI 生的,號碼本身跟真實歐式輪盤不完全一樣
   (有幾格重複,例如 13/28 各出現兩次),kc 明確要求「照圖片本身的版本」
   不要照真實輪盤規則腦補修正,所以這裡故意不是 0~36 unique 的標準
   序列。角度校正是對的、不用再調(kc:「你的角度是對的不用調整,是
   數字要調整」)——`ROULETTE_ZERO_ANGLE_DEG` 那組像素分析量出來的
   -93.4° 維持不變,見下面的說明。因為有重複數字,角度查詢改成用
   **index**(陣列位置)而不是用數字反查(`indexOf` 遇到重複數字只會
   抓到第一個位置,球會一直轉去同一格,即使玩家骰到的是後面那格重複的
   同一個數字)。陣列長度也不是寫死的 37(這張圖數出來是 36 格),角度
   換算一律除以 `ROULETTE_WHEEL_ORDER.length`,不要哪天陣列又調整了
   角度卻沒跟著變。 */
const ROULETTE_WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,13,30,10,24,5,33,16,20,1,31,14,23,9,29,18,28,7,28,12,35,3,26];
/* 顏色改成「按格子(index)量」,不是按數字查表(2026-08-26,kc:「這邊
   23 是黑欸」)——`23` 在真實輪盤規則裡是紅的,但這張 AI 生圖的顏色
   跟真實規則本來就對不上(已經確認號碼順序也對不上,見上面那則筆記),
   繼續假設「紅黑照真實輪盤規則」只會一直踩到類似的坑。這輪直接寫腳本
   在 `arcade-roulette.png` 上,對著每一格算出來的座標實際取樣像素顏色
   (每格在 6 個半徑上取樣、多數決),36 格逐一量出真正的紅/黑,不是
   查表猜的。只有 idx3(數字 19)取樣結果是 3:3 平手,肉眼在圖上確認過
   偏紅,人工定為紅——其餘 35 格都有 4:2 以上的明確多數。 */
const ROULETTE_COLOR_BY_INDEX = ['green','red','black','red','black','red','black','red','black','black','red','black','red','black','red','black','black','black','red','black','black','red','black','red','black','black','black','black','red','black','red','black','red','black','red','black'];
const ROULETTE_ZERO_ANGLE_DEG = -93.4;
function rouletteIndexAngle(i){
  return ROULETTE_ZERO_ANGLE_DEG*Math.PI/180 + i * (2*Math.PI/ROULETTE_WHEEL_ORDER.length);
}
function rouletteColorNameAt(idx){
  const c = ROULETTE_COLOR_BY_INDEX[idx];
  return c === 'green' ? '綠' : c === 'red' ? '紅' : '黑';
}
/* 押注選項改成五個(2026-08-26,kc:「選項改成壓紅 壓黑 壓奇數 壓偶數
   壓0」)——原本「押紅／黑」含糊指同一個按鈕,拆成真的紅/黑/奇/偶四個
   各自獨立的「賠率相同注」(真實輪盤的 even-money 外圍注,18/37 中,
   賠 2 倍),0 維持原本「押單一號碼」那個特例(1/37 中,賠 36 倍)。
   `qualifies(idx, n)` 判斷某一格算不算中——紅/黑吃 `ROULETTE_COLOR_BY_INDEX`
   (按格子,見上面那則筆記),奇/偶吃數字本身(這個沒有顏色那種問題,
   單雙就是數字的數學性質,不受這張圖畫錯顏色影響)。 */
const ROULETTE_EVEN_MONEY_BETS = [
  { label:'押紅', qualifies:(idx,n) => ROULETTE_COLOR_BY_INDEX[idx] === 'red' },
  { label:'押黑', qualifies:(idx,n) => ROULETTE_COLOR_BY_INDEX[idx] === 'black' },
  { label:'押奇數', qualifies:(idx,n) => n !== 0 && n % 2 === 1 },
  { label:'押偶數', qualifies:(idx,n) => n !== 0 && n % 2 === 0 }
];
/* 下注→骰出真的落點的「格子」(index,不是數字)→算出對應角度→跑演出
   →演出跑完才真的結算(gambleResolve 拿到的 line 這輪也帶上實際號碼/
   顏色,不是只講「中/沒中」的空話)。挑 index 而不是挑數字再反查——
   陣列裡有重複數字(13/28 各兩格),同一個數字對應兩個不同角度,一定要
   先選中格子、再讀那一格的數字跟角度,不能反過來。spins 是額外轉的
   整圈數,帶一點隨機讓每次視覺上轉的圈數不完全一樣。 */
function spinRouletteTo(betLabel, win, winLine, loseLine, payout){
  const pool = ROULETTE_WHEEL_ORDER
    .map((n,i) => i)
    .filter(i => win ? qualifiesFor(betLabel, i) : !qualifiesFor(betLabel, i));
  const idx = pool[Math.random()*pool.length|0];
  const number = ROULETTE_WHEEL_ORDER[idx];
  const spins = 3 + Math.floor(Math.random()*2);
  /* 情緒:輸贏都加,但虧錢那次打折(2026-08-26,kc:「玩遊戲情緒值會上升,
     虧錢會略略下降」)——8→5,不是歸零或倒扣,呼應「賭癮爽在玩的當下」
     這個原本的設計精神,只是虧錢時那份爽感打個折,不是完全不加。 */
  const outcome = { payout: win ? payout : 0, mood: win ? 8 : 5, number,
    line: (win ? winLine : loseLine) + `（${number} ${rouletteColorNameAt(idx)}）`,
    finalAngle: spins*2*Math.PI + rouletteIndexAngle(idx) };
  startArcadeSpin('roulette', 1400, outcome, () => agShowResult(gambleResolve(100, () => outcome), showRouletteBets));
}
function qualifiesFor(betLabel, idx){
  const n = ROULETTE_WHEEL_ORDER[idx];
  if(betLabel === '押0') return n === 0;
  return ROULETTE_EVEN_MONEY_BETS.find(b => b.label === betLabel).qualifies(idx, n);
}
function showRouletteBets(){
  agBody.textContent = ''; agActions.innerHTML = '';

    agButton(b.label, '$100', ST.money<100?'bad':'', () => {
      if(ST.money < 100){ toast('你身上不夠。', 2000); return; }
      agActions.innerHTML = ''; agBody.textContent = '';

    });
  });
  agButton('押0', '$100', ST.money<100?'bad':'', () => {
    if(ST.money < 100){ toast('你身上不夠。', 2000); return; }
    agActions.innerHTML = ''; agBody.textContent = '';
    const win = Math.random() < 1/37;
    spinRouletteTo('押0', win, '球穩穩停在 0——你自己都愣住了。', '球停在別的格子，你押的 0 沒中。', 3600);

}

 * 變動延後到櫃台按「結帳」才一次算。沒結帳就想走出門口會被擋(見

 * basket,維持原本當場判定的邏輯不變。 */
function basketTotal(){ return IN.basket.reduce((s,it) => s + it.price, 0); }
function addToBasket(name, price, feed, mood, icon, line, tag){

 * openMenu() 的 cap 文字,字小又跟按鈕擠在一起看不清楚。改成先用 say()
 * 讓店員把清單+總金額念一次(對話框字級/行距都比選單標題舒服),玩家
 * 按過對話才跳出「付款/先不要」這個很單純的二選一選單,不用再重複列
 * 清單。
 * 付款也不再直接套飽足/情緒(kc:「不會馬上加飽足感,要到背包裡面點擊
 * 物品吃掉」)——每樣東西變成 FOOD 陣列裡的一筆,角色面板「食物」區塊
 * 點了才呼叫 eatFood() 真的吃掉。 */
function checkout(){
  const total = basketTotal();
  const receipt = IN.basket.map(it => it.name + '　$' + it.price).join('\n') + '\n\n共 $' + total;
  say('clerk', receipt, () => {
    openMenu('結帳', [
      { label:'付款', cost:'共 $' + total, cls: ST.money<total?'bad':'', run:() => {
        if(ST.money < total){ say('clerk', '「總共 ' + total + ' 塊。」\n你身上只有 ' + ST.money + '，還差一點。'); return; }
        chg('money', -total);
        let line = '';
        IN.basket.forEach(it => {
          FOOD.push({ id: ++FOOD_SEQ, name: it.name, icon: it.icon, feed: it.feed, mood: it.mood });
          if(it.tag) addTag(it.tag);
          if(it.line) line = it.line;   // 目前一次結帳最多一件會帶特殊台詞(即期便當),直接蓋過去就好
        });
        advanceTime(3);

        toast(line || '結帳完成,東西收進包包裡了。要吃到「角色」欄點開。', 2600);
      } },
      { label:'先不要', cls:'back', run(){} }

}

    if(IN.hired) items.push({ label:'上班',

    items.push({ label:'離開', cls:'back', run(){} });
    openMenu('櫃台', items);
  }

/* 排隊位置(640×360 邏輯座標,跟 IN.px/IN.py 同一套,見 renderIndoor3D()

   (0 度,面向玩家),見下面。 */

const CO_CLERK_PX = 540, CO_CLERK_PY = 210;   // 玩家上班時站的位置(原本走去互動櫃台的那一帶)
/* 玩家站位下半身被櫃檯擋住(2026-08-19 第三輪,kc 要求「主角要在櫃檯內」)

   剛好蓋住玩家腿部的寬度(1045~1115,70px,一樣以玩家中心 1080 對稱),

   实際腿部寬度比這裡估的更寬,要再加寬,但同時把整條排隊線
   (CO_QUEUE_PX)往左移遠一點分攤壓力,不要只靠縮窄矩形這一個手段。 */
/* 第四輪(2026-08-19,kc:「手不會在櫃檯前面,所以不會看到櫃檯下方的手」)
   ——前三輪只顧著量腿的寬度,矩形卡得剛好貼腿,站定不動時看起來是對的;
   idle 動畫手臂會擺動,擺到 70px 這條窄欄外面就會露出來,變成「手穿模」。
   左邊(x:1045)是客人淨空的硬限制不能再往左收,右邊沒有這個限制,直接
   加寬(70→130)吃掉手臂擺動的空間;高度也往上多留 20px(y 254 起),

   整條往左移遠,不要再往左收這個矩形。 */
const CO_CLERK_CLIP = { x:1045, y:CLERK_CLIP_Y-20, w:130, h:220 };
function coDrawClerkClip(){
  const r = CO_CLERK_CLIP;
  g2f.imageSmoothingEnabled = true;
  g2f.drawImage(c2dbg, r.x, r.y, r.w, r.h, r.x, r.y, r.w, r.h);
}
/* 2026-08-20:原本 5 組只有 m/f/m2 三副骨架湊,重複用了兩次 rig 'f' 跟兩次
   rig 'm',kc 玩起來覺得排隊客人臉都差不多。補了 m3(Brian)/f2(Megan)

   不重複了——見 assets/models/README.md 跟 DESIGN_NOTES「排隊客人外觀會
   重複」那節。 */
const CO_CUSTOMER_LOOKS = [   // 純色換裝,跟巷子/廟口那些配角同一套,不用新素材
  { rig:'m',  skin:'#c2a17e', hair:'#2c2622', hood:'#3a4a5c', pants:'#2b2b2b', shoe:'#4a4038' },
  { rig:'f',  skin:'#c9a077', hair:'#241f1c', hood:'#6a3a4a', pants:'#333333', shoe:'#4a4038' },
  { rig:'m2', skin:'#b98a63', hair:'#3a3128', hood:'#4a4a3a', pants:'#26241f', shoe:'#3a3430' },
  { rig:'f2', skin:'#c9976e', hair:'#3a2e26', hood:'#5c4a3a', pants:'#232323', shoe:'#3a3430' },
  { rig:'m3', skin:'#b98a63', hood:'#2e4a3a', pants:'#2b2b2b', shoe:'#4a4038' }
];
function coSpawnQueueMember(px){
  const look = CO_CUSTOMER_LOOKS[Math.floor(Math.random()*CO_CUSTOMER_LOOKS.length)];
  const npc = buildNPC(THREE, indoorScene, {
    rotationY: Math.PI/2, rig: look.rig,   // 側面排隊,見上面 CO_QUEUE_PX 註解
    skin: look.skin, hair: look.hair, hood: look.hood, pants: look.pants, shoe: look.shoe
  });
  npc.group.position.set(px*SC, 720 - CO_QUEUE_PY*SC, 0);
  npc.group.scale.setScalar(INDOOR_HERO_SCALE);
  return { npc, px, targetPx: px };
}
function coUpdateQueue(dt){
  CO.queue.forEach((m,i) => {
    m.px += (m.targetPx - m.px) * Math.min(1, dt*.006);
    m.npc.group.position.x = m.px*SC;
    m.npc.animate(dt);
    /* 正在服務的那位轉向玩家(2026-08-19 第六輪)——`0`、`Math.PI/2`(排隊
       預設值)、`-Math.PI/2` 都被 kc 實測抓到方向不對,四個角度只剩
       `Math.PI` 沒試過,這輪換這個。細節見 DESIGN_NOTES「客人轉錯邊」
       那節除錯過程——如果這個還是不對,四個直角都試完了,要往
       `coSpawnQueueMember()` 的排隊預設朝向本身或模型正面定義去查,不是
       這裡的數字問題。 */
    if(i === 0 && CO.customer) m.npc.setFacing(Math.PI);
  });
}
/* 前面那位結完帳:移除他的模型、剩下的人補位往前一格、如果班表裡還有
   沒出場過的客人就補進最後一格(kc 說「一開始就有很多人在排隊」,不是
   從門口走進來,所以補位是「露臉」不是「入場動畫」)。 */
function coAdvanceQueue(){
  const front = CO.queue.shift();
  if(front) indoorScene.remove(front.npc.group);
  CO.queue.forEach((m,i) => { m.targetPx = CO_QUEUE_PX[i]; });
  if(CO.spawned < CO_CUSTOMERS_PER_SHIFT && CO.queue.length < CO_QUEUE_PX.length){
    CO.queue.push(coSpawnQueueMember(CO_QUEUE_PX[CO.queue.length]));
    CO.spawned++;
  }
}
function coDespawnQueue(){
  CO.queue.forEach(m => indoorScene.remove(m.npc.group));
  CO.queue = [];
}
/* 自己包一個黑畫面轉場,不共用既有的 `fade()`——`fade()` 是幫呼叫端管
   `busy`(480ms 淡出後跑 mid()、1150ms 整段結束才放開 busy),但上班這段
   要「淡出完開始上班,一路鎖住輸入到下班才放開」,中間會被 `fade()` 自己
   在 1150ms 那個固定時間點強制解鎖 busy 卡到,跟收銀小遊戲整段都要鎖住
   輸入互相打架。這裡自己控制 busy,不去動 `fade()` 本體,其他呼叫端
   (進門、睡覺)不受影響。 */
function coFade(label, mid){
  fPlace.textContent = label;
  fadeEl.classList.add('on');
  setTimeout(() => { mid(); setTimeout(() => fadeEl.classList.remove('on'), 480); }, 480);
}

let CO = null;   // 一整個班的執行狀態,null 表示沒在上班

/* 「第二件五折」的算法只寫這一處——coBasketLine() 組台詞、算總計都要用
   同一份公式,不然會出現「台詞裡的單價乘一乘,跟遊戲內部算的總計對不上」
   的錯覺(2026-08-19 第一版就在這裡踩過一次,見 DESIGN_NOTES)。 */
function coLineTotal(b){
  if(b.promo && b.qty >= 2) return b.price + Math.round(b.price/2)*(b.qty-1);
  return b.price*b.qty;
}
function coGenCustomer(){
  const n = 1 + Math.floor(Math.random()*3);
  const basket = [];
  for(let i=0;i<n;i++){
    const it = CHECKOUT_ITEMS[Math.floor(Math.random()*CHECKOUT_ITEMS.length)];
    const promo = CO.promoSet.includes(it.name);
    const qty = (promo && Math.random()<.6) ? 2 : 1;
    basket.push({ name:it.name, price:it.price, qty, promo });
  }
  const total = basket.reduce((s,b) => s + coLineTotal(b), 0);
  const payQR = Math.random() < .4;
  /* given 不管 payQR 都要算(2026-08-19 第九輪)——手機支付這單用不到真的
     找零,但選項要跟現金客人共用同一組「$金額」干擾項,這個假想的找零錨點
     兩種客人都要有。 */
  const bills=[100,500,1000];
  const given = bills.find(v => v >= total) || 1000;
  return { basket, total, payQR, given };
}
/* 客人講的話——故意不直接講總金額,只講每樣東西的單價(跟「第二件五折」
   標註),總金額/找零還是要玩家自己心算,不然這個小遊戲的算術挑戰就
   被講話直接洩題了。 */
function coBasketLine(c){
  const parts = c.basket.map(b => {
    const promoTxt = (b.promo && b.qty >= 2) ? '，第二件五折' : '';
    return b.qty > 1 ? `${b.name} ${b.qty}份（$${b.price}／份${promoTxt}）` : `${b.name}（$${b.price}）`;
  });
  const itemsText = parts.join('、');
  return c.payQR ? `「${itemsText}。我用手機付。」` : `「${itemsText}。這是 $${c.given}。」`;
}

/* 找零改成選項(2026-08-19 第七輪,kc 說「我要可以直接有選項」)——上上輪
   打字輸入(鍵盤直接在對話框裡打數字)整套拿掉。金額選項一個是正確
   答案,其餘是 `CO_WRONG_DELTAS` 裡隨機抽的偏移量湊出來的錯誤選項
   (可能同分重複,`Set` 去重到湊滿為止)。 */
const CO_WRONG_DELTAS = [10,-10,20,-20,5,-5,50,-50,15,-15];
function coShuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* count/mustIncludeCorrect(2026-08-19 第九輪)——手機支付客人也要跟現金
   客人共用這組金額選項當干擾項,但那個「找多少」的錨點對手機客人來說
   本來就不會是正確答案,不用特別把它塞進 Set(mustIncludeCorrect=false),
   單純拿來湊 3 個看起來合理的金額誘餌。 */
function coChangeOptions(correct, count=4, mustIncludeCorrect=true){
  const pool = coShuffle(CO_WRONG_DELTAS);
  const opts = new Set(mustIncludeCorrect ? [correct] : []);
  for(const d of pool){
    if(opts.size >= count) break;
    const v = correct + d;
    if(v >= 0 && v !== correct) opts.add(v);
  }
  return coShuffle([...opts]).slice(0, count);
}
/* 手機支付跟找零合併成同一組選項(2026-08-19 第九輪,kc 抓到「每個客人
   都要問問題,只是如果他有提到手機支付你就選掃 QR CODE,誤選也算錯」)
   ——上一版手機支付客人只丟一顆「掃 QR CODE」按鈕,點下去保送正確,等於
   沒有真的在考;現在不管客人付現還付手機,都是同一組 4 個選項(QR CODE
   +3 個金額干擾項),玩家要真的聽客人講的是「我用手機付」還是報金額現金,
   選錯——不管是現金客人選了 QR、還是手機客人選了金額——都算
   coResolve(false)。金額干擾項的錨點是 given-total(假裝這單是現金會
   找多少),手機客人這個錨點只拿來生像樣的干擾選項,不會被判定正確。 */
function coBeginAnswer(){
  const c = CO.customer;
  const change = c.given - c.total;
  dName.textContent = '客人';
  /* 2026-08-21 kc 玩過反映「怎麼收這筆？」誤導,以為只是選付款方式——
     原本故意寫中性是要考「有沒有聽客人講手機支付」(見上面第九輪那則
     筆記),kc 現場決定推翻,改回直接問「要找多少錢？」,接受 QR 客人
     這句話會比較容易被猜到,清楚優先。 */
  dTx.textContent = `${coBasketLine(c)}\n要找多少錢？`;
  dCaret.classList.remove('on');
  const moneyOpts = coChangeOptions(change, 3, !c.payQR).map(v => ({
    label: '$' + v, correct: !c.payQR && v === change
  }));
  const qrOpt = { label:'掃 QR CODE', correct: c.payQR };
  coShowOptions(coShuffle([qrOpt, ...moneyOpts]).map(o => ({
    label: o.label,
    run: () => coResolve(o.correct)
  })));
}
/* WRONG_LINES(2026-08-19)——kc 定案「算錯會被罵」,語氣照這個專案一貫

function coTick(dt){
  if(!CO) return;
  coUpdateQueue(dt);   // 排隊補位的滑動,不管有沒有正在服務的客人都要跑
  if(!CO.customer) return;

  track.querySelector('i').style.width = (pct*100) + '%';

/* 下班結算分級(2026-08-19 第十輪,kc 要求「不是說算對幾個是失誤幾次」
   +「信評太低會被罵得很慘,比如『我就知道這種底層』那種」+「信評好會
   有鼓勵跟額外獎金」+「小叮嚀」)——用失誤次數(不是答對次數)分三級:
   全對/普通/失誤多。**最差那級的台詞刻意寫成老闆的偏見**(「你這種背景
   的」),不是遊戲在說「你活該」——這一段的立場照 CLAUDE.md 基準線,
   講的是「社會怎麼看待這群人」,把難聽話放進一個會這樣講話的老闆嘴裡,
   不是旁白/系統對玩家下的判斷,跟 lib/quiz.js 那條「答錯不能嘲笑角色,
   責任歸處境」不衝突——那條管的是遊戲敘事本身的立場,這裡是角色(老闆)
   自己講出一句真實世界會出現的偏見。 */
const CO_BONUS = 40;   // 表現好的額外獎金,不是按時薪算,先抓一個感覺對的數字
function coShiftReview(n, correct){
  const wrong = n - correct;
  if(wrong === 0) return {
    lines: [ `「今天 ${n} 個客人，一次都沒錯。」`, '「算你會做事，多給你一點。」' ],
    tip: '客人越急你反而要慢下來算——這個訣竅你自己抓到了。',
    bonus: CO_BONUS
  };
  if(wrong <= 2) return {
    lines: [ `「${n} 個裡面錯 ${wrong} 個，還可以。」` ],
    tip: '找錢先算總金額，再算差額，不要一步到位用猜的。',
    bonus: 0
  };
  return {
    lines: [ `「${n} 個裡面錯了 ${wrong} 個，這樣我要自己貼多少你知道嗎？」`,
              '「你這種背景的，我大概猜得到會這樣。」' ],
    tip: '算不出來就慢下來重算一次，比錯了道歉快。',
    bonus: 0
  };
}

  coDespawnQueue();

     toast 帶過,改成真的幾句店員台詞(main lines + 小叮嚀),用
     coSayChain() 接力播,錢在最後一句 main line 出現前給
     (chg('money',wage),飄字會跟對話同時跳出來,視覺上像「這是你的

/* say() 一次只能播一句,接力播多句要靠 after 回呼一路串下去——跟
   game.html 別處(問有沒有缺人那段)手寫巢狀 say() 是同一招,只是這裡
   句數會變(2~3 句看分級結果),包成一個小函式比每個分級各寫一次巢狀
   呼叫省事。 */
function coSayChain(who, lines, i, after){
  i = i || 0;
  if(i >= lines.length){ after && after(); return; }
  say(who, lines[i], () => coSayChain(who, lines, i+1, after));
}

function updateIndoor(dt){
  /* 越式按摩室內(2026-08-20)沒有 spots/collider,整段是 say()/openMenu()
     鎖住輸入的對話場景,kc 明確要求「不用走動」——直接在這裡擋掉,不要
     依賴 busy/dlg.on 剛好全程都是 true 這個隱含假設(付錢那個分支 toast
     跟下一段對話中間有一小段 busy/dlg.on 都是 false 的空檔,那段空檔方向鍵
     還是會動,所以要在這裡明講擋掉,不是繞個彎湊巧擋住)。 */
  if(PLACE === 'massage') return;
  /* 機台演出/推幣機小遊戲進行中(2026-08-26,第二輪改成畫在 #arcadeGame
     大面板,見上面 agDrawSpin() 那則筆記)——整段搶走輸入,跟 walkTarget
     那段同一個精神。pusher 的指示條每幀來回跑(ping-pong,0~1 之間),
     直接改 #agBarPin 的 style.left(DOM 元素,不是畫在 canvas 上);
     slot/roulette 是倒數計時,每幀呼叫 agDrawSpin() 重畫一次,時間到才
     呼叫 cb()(真正的 gambleResolve())。pusher 的「按空白鍵鎖定」攔在
     keydown 那邊(resolvePusherLockIn()),不是這裡。 */
  if(ARCADE_ANIM.active){
    if(ARCADE_ANIM.kind === 'pusher'){
      /* 難度調高(2026-08-26 第二輪)——速度從 .0016 提到 .0026(+62%),
         配合 resolvePusherLockIn() 縮小的 sweet spot,兩件事一起做才
         真的變難,只調其中一個(縮小範圍但速度不變,或加快但範圍不變)
         效果都不夠明顯。 */
      ARCADE_ANIM.barPos += ARCADE_ANIM.barDir * dt * .0026;
      if(ARCADE_ANIM.barPos >= 1){ ARCADE_ANIM.barPos = 1; ARCADE_ANIM.barDir = -1; }
      else if(ARCADE_ANIM.barPos <= 0){ ARCADE_ANIM.barPos = 0; ARCADE_ANIM.barDir = 1; }
      agBarPin.style.left = (ARCADE_ANIM.barPos*100) + '%';
    } else {
      ARCADE_ANIM.t += dt;
      agDrawSpin();
      if(ARCADE_ANIM.t >= ARCADE_ANIM.dur){
        const cb = ARCADE_ANIM.cb; ARCADE_ANIM.active = false; ARCADE_ANIM.cb = null; busy = false;
        cb && cb();
      }
    }
    IN.near = null;
    return;
  }
  /* 自動走位(2026-08-18,媽媽借錢那段「先說欸→你自動走到她面前→才開口
     借錢」用):`IN.walkTarget` 有值就整段搶走玩家輸入,自己把 IN.px 往
     target.px 推,跟按鍵移動共用同一個每幀步進量(1.35,沒有乘 dt——
     這個檔案裡按鍵移動本來就是這樣算的,固定幀距步進不是真的 delta-time
     移動,這裡跟著同一個假設走,不要自己另外做一套更精確但手感不一致的
     版本)。到達(差距 < 步進量)才 snap 到 target.px、把臉轉成
     `target.face`、清掉 walkTarget、呼叫 `target.cb()`——呼叫時機故意
     放在清空 walkTarget 之後,cb 裡如果又設了新的 walkTarget(這輪沒用到,
     但這樣寫比較不會被未來的呼叫方踩到「呼叫時前一個 walkTarget 還沒清」
     的坑)。 */
  if(IN.walkTarget){
    const t = IN.walkTarget;
    const dpx = t.px - IN.px;
    if(Math.abs(dpx) <= 1.35){
      IN.px = t.px; IN.face = t.face; IN.moving = false;
      IN.walkTarget = null;
      t.cb && t.cb();
    } else {
      IN.px += Math.sign(dpx)*1.35;
      IN.face = dpx < 0 ? 'L' : 'R';
      IN.moving = true; IN.walkT += dt;
    }
    IN.near = null; hintEl.classList.remove('on');
    return;
  }
  /* 店員轉身/事後抓包只在超商發生,家裡/房間沒有店員,整段跳過。 */
  if(PLACE === 'store'){
    /* 2026-08-14 kc:「店員背面跟隨機轉身」——不用固定週期(舊的 2D 像素人
       時代是 `clerkT % 6600 < 2400` 那種固定循環,現在改成每次轉身後隨機
       抽下一次轉身要等多久,3~8 秒之間,比固定節奏更像真人站著不耐煩偶爾
       轉一下,不是機械化的來回擺頭。轉身當下才呼叫 paintStoreBackdrop()
       重繪背景貼對應那張圖,不是每幀都重畫。 */
    IN.clerkT += dt;
    if(IN.clerkT >= IN.clerkNextTurn){
      IN.clerkFace = IN.clerkFace === 'F' ? 'B' : 'F';
      IN.clerkNextTurn = IN.clerkT + 3000 + Math.random()*5000;
      paintStoreBackdrop();
      /* 2026-08-14 kc:轉回正面那一刻,如果玩家手上還有沒安全脫身的贓款
         (pendingTheft>0)——人還在店裡,算事後被抓一次總帳:扣風評、東西
         退回去(chg('full',-pendingTheft) 把之前偷到的飽足感扣回來)、
         今天不能再偷(stealCaughtDay=day,steal() 開頭會擋)。玩家已經走出
         超商的話 MODE 不會是 'indoor',updateIndoor() 根本不會被呼叫到,
         等於「走出去之前都算在店內」,跟 steal() 那句 toast 的說法一致。 */
      if(IN.clerkFace === 'F' && pendingTheft > 0){
        const amt = pendingTheft; pendingTheft = 0; stealCaughtDay = day;
        chg('full', -amt); chg('star', -2); chg('calm', -20);
        say('clerk', '「等一下。」\n\n他轉過身,先看你的外套,再看架上少的那格。\n沒有人說話。你把東西放回去。',
            () => toast('這家店你今天別再想了。', 3200));
      }
    }
  }

  const bounds = PLACE === 'store' ? STORE : PLACE === 'home' ? HOME
               : PLACE === 'school' ? SCHOOL : PLACE === 'arcade' ? ARCADE : BEDROOM;

  let dx=0, dy=0;
  if(keys['a']||keys['arrowleft'])  dx -= 1;
  if(keys['d']||keys['arrowright']) dx += 1;
  if(keys['w']||keys['arrowup'])    dy -= 1;
  if(keys['s']||keys['arrowdown'])  dy += 1;
  /* 教室禁止斜走(2026-08-25,kc:「主角橫著走之後只有正面往老師的方向
     才能前後走,不然會撞到其他角色的圖」)——小美/主角空位那兩張疊圖是
     平面去背貼紙,只有側面(L/R)姿態的碰撞框沒有另外量過,斜著走
     (同時按住左右+上下)會用正面的深度移動疊到側面站姿的位置,視覺上
     整個人陷進疊圖裡。最簡單的擋法是不讓斜走發生:有 dx 就把 dy 歸零,
     逼玩家鬆開左右鍵、單獨按上下鍵(這樣按下去 IN.face 才會轉回
     'F'/'B',跟「正面才能走」那句話是同一件事的兩種講法)。其他場景
     (store/home/bedroom)不受影響,那些沒有這批側面疊圖的問題。 */
  if(PLACE === 'school' && dx) dy = 0;
  /* 客廳/房間只能轉面、不能走深度(2026-08-19),見 DESIGN_NOTES「客廳
     第三版:只能轉面、不能走深度」。房間是這輪新加的——kc 截圖抓到走到
     深處人會浮在地板上方(固定鏡頭高度的正交鏡頭,沒有真的跟著照片的
     透視走,只有 walkS 附近那條線眼睛校過看起來是對的,再往後退誤差就
     露出來),鎖住深度直接讓玩家永遠站在那條校過的線上,不用再另外解
     透視校正。 */
  const lockDepth = PLACE === 'home' || PLACE === 'bedroom';

  if(!busy && !dlg.on && (dx||dy)){
    /* 2D 室內也能跑(2026-08-19,kc 要求):跟 updateCity() 的 Shift=2 倍
       同一顆 keys['shift']、同一個倍率,手感才一致——街上用 Shift 跑習慣了
       走進室內卻沒反應會覺得壞掉。 */
    const run = keys['shift'] ? 2 : 1;
    const sp = 1.35 * run * (dx&&dy ? .71 : 1);
    /* 房間水平範圍吃 BEDROOM_WALK_TWEAK 滑桿(2026-08-19),不是通用的
       20~LW-20——衣櫃層架伸到走道上,maxPx 比一般房間邊界窄。 */
    const pxMin = PLACE === 'bedroom' ? BEDROOM_WALK_TWEAK.minPx : 20;
    const pxMax = PLACE === 'bedroom' ? BEDROOM_WALK_TWEAK.maxPx : LW-20;
    const nx = Math.max(pxMin, Math.min(pxMax, IN.px + dx*sp));
    if(!inBlocked(nx, IN.py)) IN.px = nx;
    if(!lockDepth){
      const ny = Math.max(bounds.walkN, Math.min(bounds.walkS, IN.py + dy*sp*.62));
      if(!inBlocked(IN.px, ny)) IN.py = ny;
    }
    IN.moving = true; IN.walkT += dt;
    if(dx<0) IN.face='L'; else if(dx>0) IN.face='R';
    else if(dy<0) IN.face='B'; else if(dy>0) IN.face='F';
  } else IN.moving = false;

  IN.near = null;
  for(const sp of bounds.spots)
    if(IN.px > sp.x-12 && IN.px < sp.x+sp.w+12 && IN.py >= sp.y0 && IN.py <= sp.y1){ IN.near = sp.id; break; }
  const show = IN.near && !busy && !dlg.on;
  if(show){
    hintEl.innerHTML = bounds.spots.find(s=>s.id===IN.near).name + '　按 <b>空白鍵</b>';
    hintEl.classList.add('on');
  } else hintEl.classList.remove('on');
}

/* c2df 疊最上層:玩家站到鮮食櫃「後面」(IN.py < STORE.hot.y,離鏡頭比較
   遠)**而且**左右也在鮮食櫃範圍內時,把 `hotCutBuf`(上緣漸層淡出過的
   鮮食櫃裁切圖,見上面 `buildHotCutMask()`)蓋在玩家身上,做出前後遮擋
   ——玩家畫在 c3d,比 c2df 低一層,蓋上去就會被擋住。顆粒雜訊疊在最上面。
   2026-08-14 kc 抓到「鮮食櫃分身」:原本只判斷 IN.py,沒判斷 IN.px,玩家
   站在飲料櫃、貨架這些跟鮮食櫃完全無關的地方也會觸發疊繪,跟背景裡已經
   畫好的鮮食櫃疊成雙重影像——這裡沿用同一個 x/y 判斷,換成獨立圖之後
   這個坑不會重踩(畫的是同一張圖、同一個矩形,跟 paintStoreBackdrop()
   貼的位置不會脫鉤)。 */
/* 鮮食櫃遮擋判斷(2026-08-19 收銀小遊戲那輪擴充):原本只看玩家的
   IN.px/IN.py,排隊的客人(coSpawnQueueMember)是另一批獨立的 3D NPC,
   座標不會反映在 IN.px/py 上——kc 玩起來抓到排在鮮食櫃那一排的客人會
   穿模疊在鮮食櫃前面。判斷式抽成函式,玩家、每個排隊中的客人都各自
   算一次,只要有任何一個人站在鮮食櫃的範圍內就要疊繪遮擋圖,不是只看
   玩家。遮擋圖本身(`hotCutBuf`)只是背景照片的翻拍,跟誰站在裡面無關,
   一次疊繪就同時擋住站在那個位置的所有人,不用分開處理。 */
function inHotZone(px, py){
  return py < STORE.hot.y && px > STORE.hot.x && px < STORE.hot.x + STORE.hot.w;
}
/* 教室橫排課桌椅遮擋(2026-08-25,kc:「當穿過橫向的課桌椅,前景會擋掉
   本人才對」)——照 coDrawClerkClip() 那招最簡單的版本,直接從 c2dbg
   (已經合成好的教室背景)裁一塊貼回 c2df,不用像鮮食櫃那樣另外做
   上緣漸層的 hotCutBuf(這裡沒有「一半露出來一半被擋住」的中間態,
   碰撞框已經把兩張桌子擋成不能走進去,只有走近講台那段玩家真的走得到
   「視覺上比桌椅更深」的位置,矩形整塊裁最簡單)。
   `SCHOOL_DESKROW_CLIP`(canvas px)蓋住兩個學生+講台老師整排,從頭頂到
   椅腳。觸發門檻只看 IN.py——碰撞已經把兩張桌子的深度鎖在 237 以南,
   IN.py 真的小於 245 只可能發生在桌子兩側/中間的開放地板(走去講台或
   繞去門那邊),此時排/老師的圖層本來就該蓋過玩家。
   **v2(2026-08-25 同一天,kc 換圖後重量)**:新圖沒有女生那組跟原本的
   空桌椅,x 範圍照兩張桌子+講台的新座標重抓(native x400~1260 抓一點
   margin,換算成 canvas px)。 */
const SCHOOL_DESKROW_CLIP = { x:306, y:138, w:658, h:444 };
const SCHOOL_DESKROW_OCCLUDE_PY = 245;
function inSchoolDeskZone(px, py){
  return py < SCHOOL_DESKROW_OCCLUDE_PY && px > 150 && px < 482;
}
/* 遊藝場機台演出(2026-08-26 第二輪,改成畫在 #arcadeGame 大面板的
   agCanvas 上,不是房間裡的小色塊——kc 要求互動要彈成大框框、有真的
   演出感)。座標吃 scene-arcade.js 匯出的 CLOSEUP_* 那組,跟
   renderCloseup() 畫靜態機台用的是同一份數字,轉輪閃爍/球轉動才會疊在
   正確的位置上。pusher 的時機條是 DOM 元素(#agBarPin),不在這裡畫,見
   updateIndoor() 那段直接改 style.left。 */
function agDrawSpin(){
  const A = ARCADE_ANIM;
  /* slot 這輪換成真的照片切換(2026-08-26,kc 選的方案 B)——不再是「畫
     底圖+疊色塊」,是三張真的轉輪結果照片(ARCADE_SLOT_IMG)之間快速
     切換,`agSlotTier` 決定 agDrawIdle('slot') 當下畫哪一張。最後 250ms
     鎖定成跟真正 outcome.tier 一致的那張,鎖定之後保持顯示(不再繼續閃),
     跟結算文字對得上——沒有這三張照片(還沒生/檔名打錯)會自動退回
     SceneArcade.renderCloseup() 的色塊版,不會壞。 */
  if(A.kind === 'slot'){
    const settling = (A.dur - A.t) < 250;
    const tier = A.outcome && A.outcome.tier;
    agSlotTier = settling ? tier : ['lose','small','jackpot'][Math.random()*3|0];
    if(agSlotTier === 'lose') agSlotLoseIdx = Math.random()*ARCADE_SLOT_IMG.lose.length|0;
    agDrawIdle('slot');
    return;
  }
  /* 'pusher-drop'/'pusher-payout' 不是真的機台種類,是推幣機那台的兩段
     演出狀態(見 startPusherDrop()/startPusherPayout()),底圖一樣要畫
     推幣機那張特寫,不能直接拿這兩個字串去查 ARCADE_MACHINE_IMG。 */
  agDrawIdle(A.kind.startsWith('pusher') ? 'pusher' : A.kind);
  if(A.kind === 'roulette'){
    /* 球從外圈滑軌慢慢滑進內側號碼格(2026-08-26,kc:「軌跡會是從外圍
       慢慢往內滑落才是正邏輯」)——半徑從 rOuter 線性滑向 rInner,跟角度
       的 easeOut 分開算,角度負責「轉速變慢」,半徑負責「往內滑落」,
       兩個真實世界裡本來就是同時但各自獨立發生的效果。
       **同一天下一輪,kc:「球沒有真的停在不同地方,而且沒有真的判定」**
       ——角度終點原本是寫死的 `3.2*2π`,不管結果一律轉到同一個地方停。
       改成讀 `A.outcome.finalAngle`(spinRouletteTo() 算好、真的對應到
       骰出來那個號碼在照片上的角度),球每次都停在跟結算文字一致的
       真實位置上。 */
    const W = SceneArcade.CLOSEUP_ROULETTE_WHEEL;
    const t = Math.min(1, A.t/A.dur);
    const ease = 1 - Math.pow(1 - t, 3);
    const angle = (A.outcome ? A.outcome.finalAngle : 3.2*2*Math.PI) * ease;
    const r = W.rOuter + (W.rInner - W.rOuter) * t;
    const bx = W.cx + Math.cos(angle)*r, by = W.cy + Math.sin(angle)*r*.82;
    agCtx.fillStyle = '#f2e9d0';
    agCtx.beginPath(); agCtx.arc(bx, by, 8, 0, Math.PI*2); agCtx.fill();
  } else if(A.kind === 'pusher-drop'){
    /* 一枚代幣掉進投幣口(2026-08-26,kc:「我想要有投錢下去推的感覺」,
       同一天第二輪 kc 又糾正「對準是指對準代幣入口」+ 附了投幣口特寫
       截圖)——這輪照那張截圖 + 第一人稱正圖重新精量:投幣口(「代幣
       入口」金屬面板上那條深色縫)在原圖大約 x:1090,y:955(圖
       1448×1086),換算成畫布座標(scale≈.387、offsetX≈40)
       ≈(462,369)。代幣從畫面右上方一路滑進投幣口,終點對齊這個
       校正過的位置(比上一版量得更準,原本量到 432,378 偏了一點)。
       **同一天第三輪,kc:「硬幣本身太小顆」**——半徑 9→16,payout 那
       五枚也從 6→11(順便把間距從 25→30px 撐開一點,不然變大顆後
       疊太緊)。 */
    const ease = Math.min(1, A.t/A.dur);
    const x = 540 + (462-540)*ease, y = 220 + (369-220)*ease;
    drawPusherCoin(x, y, 16);
  } else if(A.kind === 'pusher-payout'){
    /* 中獎的代幣滑落(2026-08-26,kc 兩輪回饋修正):
       1.「硬幣要真的硬幣」——色塊圓改成真的硬幣畫法(drawPusherCoin(),
         金色放射漸層+外緣描邊),跟時機條上那顆硬幣指針同一套畫法。
       2.「推下來是從上面平台推掉下面,不是推到機器外」——原本演出是
         代幣往下滑、越滑越大(模擬滑出機器朝向鏡頭），跟真實機構不符:
         推幣機是上層代幣被推板推過一個階梯狀護欄,掉落到下層那堆代幣
         上,全程都還在機器裡面,不會滑出畫面。這裡改成短距離掉落——
         起點是中間那條護欄階梯(原圖量出來大約 x:730,y:350,換算
         畫布座標 ≈(322,135)),終點是下層代幣堆表面(同一個 x,
         y≈250,只往下掉 115px,不是滑到畫面底部)。 */
    for(let i=0;i<5;i++){
      const t2 = Math.max(0, Math.min(1, (A.t/A.dur)*1.4 - i*0.12));
      if(t2 <= 0) continue;
      const x = 322 - 60 + i*30;
      const y = 135 + (250-135)*t2;
      drawPusherCoin(x, y, 11);
    }
  }
}
/* 硬幣畫法共用(2026-08-26,kc:「硬幣要真的硬幣」,同一天第二輪 kc 直接
   傳了一張真的十元硬幣照片)——優先貼真照片(圓形裁切),没載出來時退回
   原本放射狀金色漸層+深色外緣描邊。 */
function drawPusherCoin(x, y, r){
  agCtx.save();
  agCtx.beginPath(); agCtx.arc(x, y, r, 0, Math.PI*2); agCtx.clip();
  if(ARCADE_COIN_IMG.naturalWidth){
    agCtx.drawImage(ARCADE_COIN_IMG, x-r, y-r, r*2, r*2);
  } else {
    const g = agCtx.createRadialGradient(x-r*.3,y-r*.35,r*.15, x,y,r);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(.55, '#e8c85a'); g.addColorStop(1, '#a8791f');
    agCtx.fillStyle = g;
    agCtx.fillRect(x-r, y-r, r*2, r*2);
  }
  agCtx.restore();
  agCtx.strokeStyle = '#6b4f18'; agCtx.lineWidth = 1.2;
  agCtx.beginPath(); agCtx.arc(x, y, r, 0, Math.PI*2); agCtx.stroke();
}
function renderIndoorForeground(){
  g2f.clearRect(0,0,c2df.width,c2df.height);
  const hotHit = PLACE === 'store' && (
    inHotZone(IN.px, IN.py) ||
    (CO && CO.queue.some(m => inHotZone(m.px, CO_QUEUE_PY)))
  );
  if(hotHit){
    buildHotCutMask();
    g2f.imageSmoothingEnabled = true;
    g2f.drawImage(hotCutBuf, STORE.hot.x*SC, (STORE.hot.y-STORE.hot.h)*SC);
  }
  /* 上班時玩家下半身被櫃檯擋住,見上面 coDrawClerkClip() 的說明。 */
  if(PLACE === 'store' && CO) coDrawClerkClip();
  if(PLACE === 'school' && inSchoolDeskZone(IN.px, IN.py)){
    const r = SCHOOL_DESKROW_CLIP;
    g2f.imageSmoothingEnabled = true;
    g2f.drawImage(c2dbg, r.x, r.y, r.w, r.h, r.x, r.y, r.w, r.h);
  }

    let loanMsg = '';

const FOOD = [];

 * 不碰 DOM),真的建立這個物件、算到期日、跳 toast 提醒都在這裡做——跟
 * item.money/calm 那些欄位由 `applyStoryChoice()` 消費是同一個分工方式。
 * **逾期沒繳的後果目前沒有定義**,到期日到了不會扣任何東西,只是資料上

/* beats 是 [{who,text}] 或 [{toast,ms}] 的混合陣列,照順序一句一句播完再

 * (最多到 6 句)用遞迴展開,不用每加一句就多縮排一層。 */
/* IN_TARGETS(2026-08-18):家庭 NPC 在客廳的固定站位,给 beats 裡的
   `{ walkTo: 'mom' }` 這種寫法用。2026-08-19 第四版背景媽媽烤進照片裡、
   不再是可調的疊圖(見 paintHomeBackdrop() 那段拿掉 momSitImg 的說明),
   px 改成直接在新照片上拉格線量她的位置(native x≈785,乘 0.383 換算)——
   跟門口/房間門用同一套量法,不是精算。face:'B' 是「背對鏡頭、面向沙發」,
   媽媽坐沙發面對鏡頭,玩家要面對她本來就該背對鏡頭。 */
const IN_TARGETS = { mom: { px: 300, face:'B' } };
/* menu 型 beat(2026-08-19,爸爸「打工→要錢→給/不給」那段用):playBeats
   跑到 `{ menu:[...] }` 這種 beat,開一個子選單,選完照 applyStoryChoice()
   吃 calm/mood/money 那些欄位、播完該選項自己的 beats,再接回原本那串
   beats 的下一句——跟 maybeTriggerStoryNode() 開頂層選單完全同一招,只是
   巢狀一層,不用另外寫一套。 */
function playBeats(beats, i, done){
  if(!beats || i >= beats.length){ done && done(); return; }
  const b = beats[i];
  if('toast' in b){ toast(b.toast, b.ms); playBeats(beats, i+1, done); }
  else if('walkTo' in b){
    const t = IN_TARGETS[b.walkTo];
    if(!t){ playBeats(beats, i+1, done); return; }   // 沒設站位就直接跳過,不會卡住
    IN.walkTarget = { px:t.px, face:t.face, cb: () => playBeats(beats, i+1, done) };
  }
  else if('menu' in b){
    openMenu(b.cap || '', b.menu.map(item => ({
      label: item.label, cost: item.cost,
      run: () => { applyStoryChoice(item); playBeats(item.beats, 0, () => playBeats(beats, i+1, done)); }
    })));
  }
  else say(b.who, b.text, () => playBeats(beats, i+1, done));
}
/* debt(欠更多錢)這次沒有另開一條指標——kc 原話「債務就是扣金錢啊」,
 * 直接當 money 的負向變動處理。money 沒有下限(見 chg() 的 clamp 規則),
 * 負數就是「在欠錢」的意思,不用另外畫一條進度條。 */
/* mood 欄位(2026-08-19,爸爸「不給錢就打你」那段用):DESIGN_NOTES「第六條:
   情緒」原本的規則是家裡拉扯的情緒衝擊只用 toast 文字講,不進數值——這裡
   是 kc 這輪明確要求的例外(「你會扣情緒跟歸屬感」),被打是唯一一個真的
   進數值的家庭衝突,其餘家裡劇情的情緒衝擊依然只用文字,不要照這裡的
   先例把其他節點也改成扣 mood。 */
function applyStoryChoice(item){
  if(item.calm) chg('calm', item.calm);
  if(item.mood) chg('mood', item.mood);
  if(item.money) chg('money', item.money);
  if(item.moneyAll) chg('money', -ST.money);
  if(item.debt) chg('money', -item.debt);
  if(item.theft){ MOM_THEFT += item.theft; MOM_THEFT_DAY = day; }
  if(item.gave) MOM_GIVEN++;
  if(item.trashItem) TRASH.push(item.trashItem);
  if(item.truth) knownTruths.add(item.truth);
}
/* 規則 1(DESIGN_NOTES「家裡的拉扯」):「他主動來找你,你躲不掉」——不是
 * 走到沙發按空白鍵那種互動點,是一進客廳當天撞到節點就直接播,擋住(say/
 * openMenu 本身就會靠 dlg.on/busy 擋住移動,不用額外加鎖)。兩條線目前
 * 觸發天數沒有重疊(bet: 3/6/10/14/18/22,drink: 4/9/15/20/26),一天最多
 * 只會撞到一個,所以先不處理「同一天兩條都要播」的排隊邏輯。 */
function maybeTriggerStoryNode(){
  const sources = [['bet', StoryBet], ['drink', StoryDrink]];
  for(const [key, src] of sources){
    const node = src.NODES.find(n => n.day === day);
    if(node && !seenStoryDays.has(key+'-'+node.day)){
      seenStoryDays.add(key+'-'+node.day);
      playBeats(node.beats, 0, () => {
        if(node.tuitionQuest && !TUITION_QUEST){
          TUITION_QUEST = { amount: node.tuitionQuest.amount, dueDay: day + node.tuitionQuest.days, paid: false };
          toast(`註冊單:三個月內要湊出 $${node.tuitionQuest.amount}`, 3600);
        }
        openMenu(node.title, node.menu.map(item => ({
          label: item.label, cost: item.cost,
          run: () => { applyStoryChoice(item); playBeats(item.beats, 0, () => {}); }
        })));
      });
      return;
    }
  }
}
