<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>no-way-up ／ 3D 街區</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0c10; }
  body { font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }

  .hud { position:fixed; left:16px; top:14px; z-index:5; display:flex; gap:7px; font-size:12px; }
  .pod { background:rgba(9,12,17,.7); border:1px solid rgba(120,134,158,.28);
         border-radius:4px; padding:5px 10px 6px; min-width:74px; backdrop-filter:blur(4px); }
  .pod .lb { color:#7c8593; font-size:10px; letter-spacing:.14em; }
  .pod .nm { color:#eef1f5; font-size:15px; margin-top:2px; }
  .pod.money .nm { color:#f2d888; }

  #where { position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:5;
           background:rgba(9,12,17,.7); border:1px solid rgba(120,134,158,.28); border-radius:4px;
           padding:6px 18px; font-size:14px; color:#e6eaf0; letter-spacing:.18em;
           backdrop-filter:blur(4px); transition:opacity .3s; }

  #hint { position:fixed; left:50%; bottom:15%; transform:translateX(-50%); z-index:5;
          background:rgba(8,10,14,.86); border:1px solid #3b4452; padding:7px 17px;
          font-size:15px; color:#e8ecf1; border-radius:3px; letter-spacing:.05em;
          opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  #hint.on { opacity:1; }
  #hint b { color:#f2d888; }

  #minimap { position:fixed; right:14px; top:14px; z-index:5;
             background:rgba(9,12,17,.72); border:1px solid rgba(120,134,158,.28);
             border-radius:4px; padding:8px; backdrop-filter:blur(4px); }
  #minimap canvas { display:block; }

  #bar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:6;
         display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  button.tool { background:rgba(20,24,32,.9); color:#c8cfda; border:1px solid #313846;
                padding:6px 13px; font-size:12px; font-family:inherit; letter-spacing:.06em;
                cursor:pointer; border-radius:3px; }
  button.tool:hover { background:#242b36; color:#fff; }
  button.tool.on { background:#2d3646; border-color:#55617a; color:#fff; }
  #fps { position:fixed; right:14px; bottom:12px; z-index:6; font-size:11px;
         color:#5c6470; letter-spacing:.1em; font-variant-numeric:tabular-nums; }
  #keys { position:fixed; left:16px; bottom:12px; z-index:6; font-size:11.5px; color:#6a727f;
          letter-spacing:.08em; line-height:1.8; }
  #keys b { color:#9aa3b0; }
</style>
</head>
<body>

<div id="app"></div>

<div class="hud">
  <div class="pod money"><div class="lb">金錢</div><div class="nm">$63</div></div>
  <div class="pod"><div class="lb">飽足</div><div class="nm">42</div></div>
  <div class="pod"><div class="lb">歸屬感</div><div class="nm">55</div></div>
  <div class="pod"><div class="lb">帥潮</div><div class="nm">8</div></div>
</div>

<div id="where">中華路</div>
<div id="minimap"><canvas id="mm" width="190" height="190"></canvas></div>
<div id="hint"></div>

<div id="keys"><b>WASD</b> 走　<b>Q E</b> 轉相機　<b>Shift</b> 跑</div>

<div id="bar">
  <button class="tool on" id="tBloom">光暈：開</button>
  <button class="tool on" id="tShadow">陰影：開</button>
  <button class="tool" id="tTop">切成俯視</button>
  <button class="tool" onclick="location.reload()">重來</button>
</div>
<div id="fps">—</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
/* 街區單獨預覽。場景本身在 lib/scene-city3d.js,跟 game.html 共用同一份;
   這一頁只多了小地圖跟三個看畫面用的開關(光暈／陰影／俯視)。 */
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { CITY, buildCity, buildPlayer } from './lib/scene-city3d.js';

const app = document.getElementById('app'), hintEl = document.getElementById('hint');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d141e);
scene.fog = new THREE.FogExp2(0x0d141e, 0.0058);

const camera = new THREE.PerspectiveCamera(56, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 18, 15);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.32;
app.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.48, 0.55, 0.82));
composer.addPass(new OutputPass());
let useBloom = true;

/* ================= 光 ================= */
scene.add(new THREE.HemisphereLight(0x6b7fa4, 0x3a3f4a, 1.85));
const keyLight = new THREE.DirectionalLight(0xd2dfff, 1.0);
keyLight.position.set(-24, 34, 20); keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 130;
keyLight.shadow.camera.left = -44; keyLight.shadow.camera.right = 44;
keyLight.shadow.camera.top = 40;   keyLight.shadow.camera.bottom = -40;
keyLight.shadow.bias = -0.0013;
scene.add(keyLight, keyLight.target);

/* ================= 場景 ================= */
const city = buildCity(THREE, scene);
const hero = buildPlayer(THREE, scene);
hero.group.position.set(CITY.spawn.x, .3, CITY.spawn.z);

/* ================= 控制 ================= */
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let camYaw = 0, topDown = false;
const whereEl = document.getElementById('where');
const tmp = new THREE.Vector3();

function update(dt){
  if(keys['q']) camYaw -= dt*.0018;
  if(keys['e']) camYaw += dt*.0018;

  let ix=0, iz=0;
  if(keys['a']||keys['arrowleft'])  ix -= 1;
  if(keys['d']||keys['arrowright']) ix += 1;
  if(keys['w']||keys['arrowup'])    iz -= 1;
  if(keys['s']||keys['arrowdown'])  iz += 1;

  const run = keys['shift'] ? 1.9 : 1;
  const speed = 0.005 * dt * run;
  const pos = hero.group.position;
  let moving = false;

  if(ix||iz){
    const len = Math.hypot(ix,iz);
    const dx = (ix*Math.cos(camYaw) - iz*Math.sin(camYaw))/len;
    const dz = (ix*Math.sin(camYaw) + iz*Math.cos(camYaw))/len;
    const nx = pos.x + dx*speed, nz = pos.z + dz*speed;
    if(!city.blocked(nx, pos.z)) pos.x = Math.max(CITY.bounds.x[0], Math.min(CITY.bounds.x[1], nx));
    if(!city.blocked(pos.x, nz)) pos.z = Math.max(CITY.bounds.z[0], Math.min(CITY.bounds.z[1], nz));
    hero.group.rotation.y = Math.atan2(dx, dz);
    moving = true;
  }
  hero.animate(dt, moving, run);

  /* 站在馬路上比人行道低一階 */
  let onRoad = false;
  for(const r of CITY.H_ROADS) if(Math.abs(pos.z-r.z) < CITY.ROAD_HW) onRoad = true;
  for(const r of CITY.V_ROADS) if(Math.abs(pos.x-r.x) < CITY.ROAD_HW) onRoad = true;
  pos.y += ((onRoad ? .1 : .3) - pos.y)*.3;

  const dist = topDown ? 4 : 23, high = topDown ? 46 : 29;
  tmp.set(Math.sin(camYaw)*dist, high, Math.cos(camYaw)*dist);
  camera.position.lerp(tmp.add(pos), 1 - Math.pow(.0015, dt/1000));
  camera.lookAt(pos.x, pos.y+1.4, pos.z);

  keyLight.position.set(pos.x-24, 34, pos.z+20);
  keyLight.target.position.copy(pos);
  city.updateLights(pos.x, pos.z);

  whereEl.textContent = city.whereAmI(pos.x, pos.z);

  let near = null;
  for(const d of city.doors)
    if(Math.hypot(pos.x-d.x, pos.z-d.z) < 3.6){ near = d; break; }
  if(near){ hintEl.innerHTML = near.name + '　按 <b>空白鍵</b> 進去'; hintEl.classList.add('on'); }
  else hintEl.classList.remove('on');
}

/* ================= 小地圖 ================= */
const mm = document.getElementById('mm').getContext('2d');
const MM_S = 190, MM_SCALE = MM_S / 250;
function drawMap(){
  mm.clearRect(0,0,MM_S,MM_S);
  mm.fillStyle = 'rgba(20,26,34,.8)'; mm.fillRect(0,0,MM_S,MM_S);
  const px = v => MM_S/2 + v*MM_SCALE;
  mm.strokeStyle = '#4c5665'; mm.lineWidth = CITY.ROAD_HW*2*MM_SCALE;
  CITY.H_ROADS.forEach(r => { mm.beginPath(); mm.moveTo(px(-105), px(r.z)); mm.lineTo(px(105), px(r.z)); mm.stroke(); });
  CITY.V_ROADS.forEach(r => { mm.beginPath(); mm.moveTo(px(r.x), px(-90)); mm.lineTo(px(r.x), px(80)); mm.stroke(); });
  mm.strokeStyle = '#6b7788'; mm.lineWidth = 6*MM_SCALE;
  city.alleys.forEach(a => { mm.beginPath(); mm.moveTo(px(a.x), px(a.z0)); mm.lineTo(px(a.x), px(a.z1)); mm.stroke(); });
  mm.fillStyle = '#a8321f'; mm.fillRect(px(-17), px(-113), 34*MM_SCALE, 10*MM_SCALE);   // 廟身
  city.doors.forEach(d => { mm.fillStyle = '#d8b24a'; mm.fillRect(px(d.x)-2, px(d.z)-2, 4, 4); });
  mm.fillStyle = '#6fe0b0';
  mm.beginPath(); mm.arc(px(hero.group.position.x), px(hero.group.position.z), 3.2, 0, 7); mm.fill();
}

/* ================= loop ================= */
let lastW=0, lastH=0;
function fit(){
  if(innerWidth===lastW && innerHeight===lastH) return;
  lastW=innerWidth; lastH=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
const fpsEl = document.getElementById('fps');
let last = performance.now(), acc = 0, frames = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(50, now-last); last = now;
  fit(); update(dt); drawMap();
  useBloom ? composer.render() : renderer.render(scene, camera);
  acc += dt; frames++;
  if(acc > 500){ fpsEl.textContent = Math.round(frames*1000/acc)+' fps'; acc = 0; frames = 0; }
});

/* 除錯:主控台打 __go('tattoo') 或 __go(-84, -20) 直接過去,省得走一分鐘 */
window.__go = (a, b) => {
  if(typeof a === 'string'){
    const d = city.doors.find(x => x.id === a);
    if(!d) return '沒有這個門：' + city.doors.map(x=>x.id).join(', ');
    a = d.x; b = d.z;
  }
  hero.group.position.set(a, .3, b);
  return `(${a.toFixed(1)}, ${b.toFixed(1)}) ／ ${city.whereAmI(a, b)}`;
};

document.getElementById('tBloom').onclick = e => {
  useBloom = !useBloom; e.target.classList.toggle('on', useBloom);
  e.target.textContent = '光暈：' + (useBloom?'開':'關'); };
document.getElementById('tShadow').onclick = e => {
  renderer.shadowMap.enabled = !renderer.shadowMap.enabled;
  scene.traverse(o => { if(o.isMesh) o.material.needsUpdate = true; });
  e.target.classList.toggle('on', renderer.shadowMap.enabled);
  e.target.textContent = '陰影：' + (renderer.shadowMap.enabled?'開':'關'); };
document.getElementById('tTop').onclick = e => {
  topDown = !topDown; e.target.classList.toggle('on', topDown);
  e.target.textContent = topDown ? '切回斜視' : '切成俯視'; };
</script>
</body>
</html>
