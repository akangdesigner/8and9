<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>標籤系統・實驗台 — no-way-up</title>
<style>
  :root{
    --bg:#16181d; --panel:#1e2128; --line:#2c3038;
    --ink:#e6e8ec; --dim:#8b929e; --faint:#5a616d;
    --bad:#e0685f; --good:#5fb87a; --flat:#6b7280; --warn:#e0a95f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:19px;margin:0 0 3px;letter-spacing:.02em}
  .sub{color:var(--faint);font-size:13px;margin-bottom:24px}
  .sub code{color:var(--dim)}

  .scenes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .scene-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:9px 15px;border-radius:7px;cursor:pointer;font:inherit;font-size:14px;
    transition:.15s;
  }
  .scene-btn:hover{border-color:#3d434e;color:var(--ink)}
  .scene-btn.on{background:#2a2f38;border-color:#4a5260;color:var(--ink)}

  .cols{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:22px;align-items:start}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .panel h2{font-size:12px;color:var(--faint);margin:0 0 14px;letter-spacing:.14em;font-weight:600}

  .tag{
    display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid #24272e;
  }
  .tag:last-child{border-bottom:0}
  .tag-main{flex:1;min-width:0}
  .tag-name{font-size:15px}
  .tag-name.covered{color:var(--faint);text-decoration:line-through;text-decoration-color:#4a5260}
  .tag-detail{font-size:12px;color:var(--faint);margin-top:1px}
  .w{
    font-variant-numeric:tabular-nums;font-size:13px;min-width:26px;text-align:right;
    font-weight:600;
  }
  .w.bad{color:var(--bad)} .w.good{color:var(--good)} .w.flat{color:var(--flat)}
  .cov-btn{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12px;padding:4px 10px;border-radius:5px;cursor:pointer;
    white-space:nowrap;transition:.15s;
  }
  .cov-btn:hover:not(:disabled){border-color:#4a5260;color:var(--ink)}
  .cov-btn.on{background:#33302a;border-color:#5c5340;color:var(--warn)}
  .cov-btn:disabled{opacity:.28;cursor:default}

  .stam{margin-top:16px;padding-top:14px;border-top:1px solid #24272e}
  .stam-row{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:6px}
  .bar{height:5px;background:#14161a;border-radius:3px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--good);transition:width .25s,background .25s}

  .go{
    width:100%;margin-top:16px;background:#3a4150;border:0;color:var(--ink);
    font:inherit;font-size:15px;padding:12px;border-radius:8px;cursor:pointer;transition:.15s;
  }
  .go:hover{background:#464e5f}

  .scene-title{font-size:17px;margin:0 0 2px}
  .scene-sub{color:var(--faint);font-size:13px;margin-bottom:18px}

  .out{min-height:200px}
  .empty{color:var(--faint);font-size:14px;padding:30px 0;text-align:center}
  .line{
    padding:12px 0 12px 14px;border-left:2px solid var(--line);margin-bottom:4px;
    opacity:0;animation:in .4s forwards;
  }
  .line.bad{border-left-color:var(--bad)}
  .line.good{border-left-color:var(--good)}
  .line.busted{border-left-color:var(--warn);background:#221f18}
  .line-tag{font-size:11px;color:var(--faint);letter-spacing:.1em;margin-bottom:3px}
  .line-txt{font-size:14.5px;line-height:1.75}
  .hidden-note{color:var(--faint);font-style:normal;font-size:13px}
  @keyframes in{to{opacity:1}}

  .tally{
    margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;color:var(--faint);
  }
  .tally b{font-size:24px;font-variant-numeric:tabular-nums}
  .risk{font-size:11px;color:var(--faint);margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <h1>標籤系統・實驗台</h1>
  <div class="sub">
    同一個標籤,換個場合就換一個意思。規則在 <code>src/tags.js</code>,設計理由在
    <code>docs/DESIGN_NOTES.md</code>。
  </div>

  <div class="scenes" id="scenes"></div>

  <div class="cols">
    <div class="panel">
      <h2>你身上帶著</h2>
      <div id="tags"></div>
      <div class="stam">
        <div class="stam-row"><span>耐力</span><span id="stam-n"></span></div>
        <div class="bar"><i id="stam-bar"></i></div>
      </div>
      <button class="go" id="go">走進去</button>
    </div>

    <div class="panel">
      <div class="scene-title" id="s-name"></div>
      <div class="scene-sub" id="s-sub"></div>
      <div class="out" id="out">
        <div class="empty">選好要遮什麼,然後走進去。</div>
      </div>
    </div>
  </div>
</div>

<script src="tags.js"></script>
<script>
const ALL = TAGS.map(t => t.id);
let sceneId = SCENES[0].id;
let me = createCharacter(ALL, 10);

const $ = id => document.getElementById(id);

function renderScenes(){
  $('scenes').innerHTML = SCENES.map(s =>
    `<button class="scene-btn ${s.id===sceneId?'on':''}" data-s="${s.id}">${s.name}</button>`
  ).join('');
  $('scenes').querySelectorAll('button').forEach(b => b.onclick = () => {
    sceneId = b.dataset.s;
    me = createCharacter(ALL, 10);   // 換場合 = 重新決定要遮什麼
    render();
    $('out').innerHTML = '<div class="empty">選好要遮什麼,然後走進去。</div>';
  });
}

function render(){
  const scene = getScene(sceneId);
  $('s-name').textContent = scene.name;
  $('s-sub').textContent  = scene.sub;

  $('tags').innerHTML = me.tags.map(id => {
    const tag = getTag(id);
    const w   = scene.tags[id] ? scene.tags[id].w : 0;
    const on  = me.covered.includes(id);
    const cost = coverCost(id);
    const cls = w < 0 ? 'bad' : w > 0 ? 'good' : 'flat';
    const risk = cost !== null ? Math.round(exposeChance(id, sceneId)*100) : null;

    return `<div class="tag">
      <div class="tag-main">
        <div class="tag-name ${on?'covered':''}">${tag.name}</div>
        <div class="tag-detail">${tag.detail}</div>
      </div>
      <div class="w ${cls}">${w>0?'+':''}${w||'·'}</div>
      ${cost === null
        ? `<button class="cov-btn" disabled>遮不了</button>`
        : `<button class="cov-btn ${on?'on':''}" data-t="${id}">
             ${tag.cover.label}<br><span style="font-size:10px;opacity:.7">
             −${cost} 耐力・${risk}% 拆穿</span>
           </button>`}
    </div>`;
  }).join('');

  $('tags').querySelectorAll('button[data-t]').forEach(b => b.onclick = () => {
    const id = b.dataset.t;
    if (me.covered.includes(id)) uncover(me, id); else cover(me, id);
    render();
  });

  const pct = me.stamina / me.maxStamina * 100;
  $('stam-n').textContent = me.stamina + ' / ' + me.maxStamina;
  $('stam-bar').style.width = pct + '%';
  $('stam-bar').style.background = pct > 50 ? 'var(--good)' : pct > 20 ? 'var(--warn)' : 'var(--bad)';
}

$('go').onclick = () => {
  const r = evaluate(me, sceneId);
  const shown = r.results.filter(x => x.line || x.covered);

  $('out').innerHTML = shown.map((x, i) => {
    const cls = x.exposed ? 'busted' : x.weight < 0 ? 'bad' : x.weight > 0 ? 'good' : '';
    const txt = x.line
      ? x.line
      : `<span class="hidden-note">沒有人發現。這一次。</span>`;
    return `<div class="line ${cls}" style="animation-delay:${i*0.12}s">
      <div class="line-tag">${x.name}${x.covered ? ' ・ 遮著' : ''}</div>
      <div class="line-txt">${txt}</div>
    </div>`;
  }).join('') + `
    <div class="tally">
      <div>
        對方眼裡的你
        <div class="risk">分數只是給我們看的量尺,遊戲裡不會出現這個數字。</div>
      </div>
      <b style="color:${r.total<0?'var(--bad)':r.total>0?'var(--good)':'var(--flat)'}">
        ${r.total>0?'+':''}${r.total}
      </b>
    </div>`;
};

renderScenes();
render();
</script>
</body>
</html>
